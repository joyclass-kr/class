<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173f45">
    <title>교사 전용 메인 포털 · Teacher Dashboard</title>
    <link rel="stylesheet" href="../assets/device-game.css">
    <style>
        :root {
            color-scheme: light;
            --ink: #172033;
            --muted: #5b6770;
            --paper: #fffdf7;
            --canvas: #f3eee3;
            --line: #dcd5c7;
            --brand: #173f45;
            --brand-light: #2ec4b6;
            --brand-dark: #0e292d;
            --accent: #e79437;
            --coral: #ef476f;
            --shadow: 0 20px 60px rgba(23, 32, 51, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            color: var(--ink);
            background: var(--canvas);
            font-family: Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
            isolation: isolate;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(180deg, rgba(255, 253, 247, 0.12), rgba(255, 253, 247, 0.30)),
                url("../assets/images/teacher-main-bg.webp") center center / cover no-repeat;
            pointer-events: none;
        }

        main {
            width: min(100% - 32px, 1040px);
            margin: 0 auto;
            padding: 48px 0 80px;
        }

        .account-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 32px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .account-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }

        .account-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-link {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 7px 14px;
            color: var(--brand-dark);
            background: var(--paper);
            font-size: 0.85rem;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-link:hover {
            background: #ede6d8;
            transform: translateY(-1px);
        }

        .btn-signout {
            border: 1px solid #e2b4b4;
            color: #b43c36;
            background: #fff5f5;
        }

        .btn-signout:hover {
            background: #ffe3e3;
        }

        /* Profile Banner */
        .profile-card {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(23, 32, 51, 0.14);
            border-radius: 26px;
            padding: clamp(28px, 5vw, 42px);
            background: linear-gradient(135deg, #173f45 0%, #0d272b 100%);
            color: white;
            box-shadow: var(--shadow);
        }

        .profile-card::before {
            content: "";
            position: absolute;
            right: -60px;
            top: -60px;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(46, 196, 182, 0.22), transparent 70%);
            pointer-events: none;
        }

        .teacher-title {
            margin: 0 0 20px;
            font-size: clamp(1.8rem, 4.5vw, 2.8rem);
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: -0.04em;
        }

        .teacher-title span {
            color: #ffd166;
        }

        .meta-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.1);
            color: #f1f7f6;
            font-size: 0.92rem;
            font-weight: 800;
            backdrop-filter: blur(8px);
        }

        .chip-highlight {
            border-color: rgba(255, 209, 102, 0.4);
            background: rgba(255, 209, 102, 0.15);
            color: #ffe8b3;
        }

        /* Tools Grid */
        .section-title {
            margin: 48px 0 20px;
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
            gap: 20px;
        }

        .teaching-tools-grid {
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
        }

        .tool-card {
            display: flex;
            align-items: center;
            min-height: 96px;
            padding: 24px 28px;
            border: 1px solid rgba(23, 32, 51, 0.14);
            border-radius: 22px;
            background: var(--paper);
            box-shadow: 0 12px 35px rgba(23, 32, 51, 0.08);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            border-color: var(--brand-light);
            box-shadow: 0 22px 50px rgba(23, 32, 51, 0.14);
        }

        .tool-name {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            color: var(--ink);
        }

        .status-bar {
            margin-top: 36px;
            padding: 16px 20px;
            border-radius: 14px;
            background: rgba(23, 32, 51, 0.04);
            border: 1px dashed var(--line);
            color: var(--muted);
            font-size: 0.88rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        @media (max-width: 600px) {
            main {
                padding: 24px 0 50px;
            }
            .account-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .tools-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="account-bar">
            <div class="account-info">
                <span>🏫 교사 관리 포털</span>
                <span id="user-email-badge" style="color: var(--muted); font-weight: 500;">(확인 중…)</span>
            </div>
            <div class="account-actions">
                <a class="btn-link" href="../">🏠 메인 화면으로</a>
                <button class="btn-link btn-signout" id="sign-out-btn" type="button">로그아웃</button>
            </div>
        </div>

        <!-- 교사 정보 대시보드 배너 -->
        <section class="profile-card">
            <h1 class="teacher-title" id="teacher-greeting">
                <span id="school-disp">학교명</span> <span id="class-disp">학급 정보</span> · <span id="teacher-disp">교사명</span>
            </h1>
            <div class="meta-chips">
                <div class="chip chip-highlight">🏫 <span id="chip-school">학교명 불러오는 중...</span></div>
                <div class="chip">📅 <span id="chip-year">2026학년도</span></div>
            </div>
        </section>

        <!-- 내 학급 · 동아리 · 전담 그룹 관리 섹션 (개별 대시보드 바로가기) -->
        <h2 class="section-title">🏫 내 학급 · 그룹 (개별 대시보드 바로가기)</h2>
        <div class="groups-grid" id="main-groups-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-bottom: 36px;">
            <!-- Dynamically rendered group cards -->
        </div>

        <!-- 교사 핵심 기능 버튼 영역 -->
        <h2 class="section-title">행정 및 기타 관리</h2>
        <div class="tools-grid">
            <!-- 1. 학급 대시보드 (Dashboard) -->
            <a class="tool-card dashboard" href="dashboard" style="border-color: var(--brand-light);">
                <h3 class="tool-name">학급 대시보드</h3>
            </a>

            <!-- 2. 연간 학사일정 & 교육과정 (School Admin) -->
            <a class="tool-card" href="/schooladmin/" style="border-color: #8b5cf6; background: linear-gradient(135deg, rgba(88, 28, 135, 0.5), rgba(46, 16, 101, 0.7));">
                <h3 class="tool-name" style="color: #c4b5fd;">📅 연간 학사일정 · 교육과정</h3>
            </a>

            <!-- 3. 전교생 명단 관리 (School Roster) -->
            <a class="tool-card" href="school-roster" style="border-color: #75d69f; background: linear-gradient(135deg, rgba(27, 77, 50, 0.4), rgba(17, 38, 27, 0.6));">
                <h3 class="tool-name" style="color: #75d69f;">🏫 전교생 명단 관리</h3>
            </a>

            <!-- 4. 가정통신문 & 출결 결재함 -->
            <a class="tool-card" href="/teacher/" style="border-color: #75d69f; background: linear-gradient(135deg, rgba(27, 77, 50, 0.6), rgba(17, 38, 27, 0.8));">
                <h3 class="tool-name" style="color: #75d69f;">📬 가정통신문 & 출결 결재함</h3>
            </a>

            <!-- 5. AI 생기부 조수 (개선 대상) -->
            <a class="tool-card" href="record-ai" style="border-color: #fca5a5; background: linear-gradient(135deg, rgba(127, 29, 29, 0.4), rgba(69, 10, 10, 0.6));">
                <h3 class="tool-name" style="color: #fca5a5;">📝 AI 생기부 조수</h3>
            </a>

            <!-- 6. 개인정보 요청 관리 -->
            <a class="tool-card" href="privacy.html">
                <h3 class="tool-name">개인정보 요청 관리</h3>
            </a>
        </div>

        <h2 class="section-title">수업 도구</h2>
        <div class="tools-grid teaching-tools-grid">
            <a class="tool-card" href="/learning/basics/graph-studio/">
                <h3 class="tool-name">그래프 그리기</h3>
            </a>
        </div>

        <div class="status-bar">
            <span id="status-info"></span>
            <span id="student-count-info"></span>
        </div>
    </main>

    <script>
        (() => {
            'use strict';

            const schoolDisp = document.getElementById('school-disp');
            const classDisp = document.getElementById('class-disp');
            const teacherDisp = document.getElementById('teacher-disp');
            const chipSchool = document.getElementById('chip-school');
            const chipYear = document.getElementById('chip-year');
            const chipClass = document.getElementById('chip-class');
            const chipTeacher = document.getElementById('chip-teacher');
            const userEmailBadge = document.getElementById('user-email-badge');
            const statusInfo = document.getElementById('status-info');
            const studentCountInfo = document.getElementById('student-count-info');
            const signOutBtn = document.getElementById('sign-out-btn');

            async function api(path, options = {}) {
                const response = await fetch(path, {
                    ...options,
                    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
                });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(payload.message || '요청을 처리할 수 없습니다.');
                return payload;
            }

            function applyProfileData(data) {
                const school = data.schoolName || '학교 미설정';
                const year = data.academicYear || 2026;
                const grade = data.grade || '';
                const classNum = data.classNumber || '';
                const teacher = data.name || data.teacherName || '선생님';

                const classStr = grade && classNum ? `${grade}학년 ${classNum}반` : '학급 미설정';

                schoolDisp.textContent = school;
                classDisp.textContent = classStr;
                teacherDisp.textContent = teacher;

                chipSchool.textContent = school;
                chipYear.textContent = `${year}학년도`;
                chipClass.textContent = classStr;
                chipTeacher.textContent = `${teacher} 선생님`;
            }

            const activeGroupSelect = document.getElementById('active-group-select');
            const btnCreateGroup = document.getElementById('btn-create-group');

            async function loadTeacherGroups() {
                const mainGrid = document.getElementById('main-groups-grid');
                try {
                    const res = await api('/api/teacher/groups').catch(() => ({ groups: [] }));
                    const groups = res.groups || [];
                    
                    const groupTypeIcons = {
                        homeroom: '🏫',
                        club: '🤖',
                        afterschool: '⚽',
                        subject: '🧪',
                        activity: '🎨',
                        other: '📌'
                    };

                    const typeLabels = {
                        homeroom: '담임반',
                        subject: '전담 과목반',
                        club: '동아리',
                        afterschool: '방과후',
                        activity: '활동그룹',
                        other: '기타'
                    };

                    if (activeGroupSelect) {
                        activeGroupSelect.innerHTML = `<option value="homeroom" style="color:#000;">🏫 담임 학급</option>`;
                        groups.forEach(g => {
                            const icon = groupTypeIcons[g.group_type] || '📌';
                            const opt = document.createElement('option');
                            opt.value = g.id;
                            opt.style.color = '#000';
                            opt.textContent = `${icon} ${g.group_name} (${g.student_count || 0}명)`;
                            activeGroupSelect.appendChild(opt);
                        });

                        const savedActiveId = sessionStorage.getItem('active_group_id');
                        if (savedActiveId && Array.from(activeGroupSelect.options).some(o => o.value === savedActiveId)) {
                            activeGroupSelect.value = savedActiveId;
                        }
                    }

                    if (mainGrid) {
                        mainGrid.innerHTML = groups.map(g => {
                            const icon = groupTypeIcons[g.group_type] || '📌';
                            const label = typeLabels[g.group_type] || g.group_type;
                            return `
                                <div class="tool-card" onclick="openGroupDashboard(${g.id})" style="cursor:pointer; border:1px solid rgba(117,214,159,0.3); background:linear-gradient(135deg, rgba(21,28,24,0.9), rgba(11,15,12,0.95)); padding:20px; border-radius:18px; display:flex; flex-direction:column; justify-content:space-between; min-height:120px; transition:transform 0.15s ease;">
                                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                                        <span class="chip" style="font-size:0.75rem; padding:2px 8px; background:rgba(117,214,159,0.15); color:#75d69f;">${icon} ${label}</span>
                                    </div>
                                    <h3 class="tool-name" style="margin:0 0 6px; font-size:1.15rem; color:var(--text-main);">${g.group_name}</h3>
                                    <div style="font-size:0.85rem; color:var(--text-muted); font-weight:700;">
                                        ${g.grade ? `${g.grade}학년 ${g.class_number}반 · ` : ''}학생 ${g.student_count || 0}명
                                    </div>
                                </div>
                            `;
                        }).join('') + `
                            <div class="tool-card" onclick="handleCreateGroupClick()" style="cursor:pointer; border:2px dashed rgba(117,214,159,0.4); background:rgba(117,214,159,0.05); padding:20px; border-radius:18px; display:flex; align-items:center; justify-content:center; gap:8px; color:#75d69f; font-weight:800; font-size:1.05rem; min-height:120px;">
                                <span style="font-size:24px;">+</span> 새 학급·그룹 개설하기
                            </div>
                        `;
                    }
                } catch (_) {}
            }

            window.openGroupDashboard = function(groupId) {
                sessionStorage.setItem('active_group_id', groupId);
                location.href = `/classtools/dashboard.html?groupId=${groupId}`;
            };

            window.handleCreateGroupClick = async function() {
                const name = prompt('새로 개설할 동아리/방과후/전담 그룹 이름을 입력하세요:\n(예: 오케스트라, 로봇코딩부, 축구부, 5학년 과학전담)');
                if (!name || !name.trim()) return;

                const typeStr = prompt('그룹 유형을 선택하세요:\n1: 🤖 동아리 (club)\n2: ⚽ 방과후 (afterschool)\n3: 🧪 전담교과 (subject)\n\n번호 입력 (1, 2, 3):', '1');
                let groupType = 'club';
                if (typeStr === '2') groupType = 'afterschool';
                else if (typeStr === '3') groupType = 'subject';

                try {
                    const res = await api('/api/teacher/groups', {
                        method: 'POST',
                        body: JSON.stringify({
                            groupName: name.trim(),
                            groupType
                        })
                    });
                    alert(`'${name.trim()}' 그룹이 새로 개설되었습니다!\n전교생 명단 속성에서 '${name.trim()}' 그룹으로 지정된 학생이 자동 연결됩니다.`);
                    sessionStorage.setItem('active_group_id', res.groupId);
                    location.href = `/classtools/dashboard.html?groupId=${res.groupId}`;
                } catch (err) {
                    alert(err.message || '그룹 개설에 실패했습니다.');
                }
            };

            if (activeGroupSelect) {
                activeGroupSelect.addEventListener('change', (e) => {
                    sessionStorage.setItem('active_group_id', e.target.value);
                });
            }

            if (btnCreateGroup) {
                btnCreateGroup.addEventListener('click', handleCreateGroupClick);
            }

            async function init() {
                try {
                    const session = await api('/api/auth/me').catch(() => ({ signedIn: false }));
                    if (!session.signedIn || session.user?.role !== 'teacher') {
                        location.replace('/');
                        return;
                    }
                    userEmailBadge.textContent = `(${session.user.email})`;

                    // 관리자 설정 교사 프로필 조회
                    const teacherProfile = await api('/api/teacher/profile').catch(() => null);

                    if (teacherProfile && teacherProfile.profile) {
                        applyProfileData(teacherProfile.profile);
                    } else {
                        // 학급 정보 API 조회 시도
                        const classData = await api('/api/teacher/class').catch(() => null);
                        if (classData && classData.classroom) {
                            applyProfileData(classData.classroom);
                            studentCountInfo.textContent = `학생 수: ${classData.classroom.students?.length || 0}명`;
                        } else {
                            // 로컬/예시 기본값
                            applyProfileData({
                                schoolName: '송화초등학교',
                                academicYear: 2026,
                                grade: 5,
                                classNumber: 2,
                                name: '김선생님'
                            });
                        }
                    }

                    // 동아리/방과후/전담 그룹 불러오기
                    await loadTeacherGroups();

                    // 학급 학생 수 추가 업데이트
                    const classRes = await api('/api/teacher/class').catch(() => null);
                    if (classRes && classRes.classroom) {
                        studentCountInfo.textContent = `등록된 학생 수: ${classRes.classroom.students?.length || 0}명`;
                    }
                } catch (error) {
                    statusInfo.textContent = `⚠️ 정보 로드 중 오류: ${error.message}`;
                }
            }

            signOutBtn.addEventListener('click', async () => {
                await api('/api/auth/logout', { method: 'POST', body: '{}' }).catch(() => {});
                location.replace('../index.html');
            });


            init();
        })();
    </script>
</body>
</html>
