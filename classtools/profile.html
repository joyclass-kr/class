<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#10261d">
    <title>내 정보 설정</title>
    <style>
        :root { color-scheme: dark; --bg:#0d1813; --panel:#14271e; --line:#315442; --ink:#f7f4ea; --muted:#aec0b6; --green:#70d99d; --soft:#1b3a2a; --amber:#ffd27a; }
        * { box-sizing: border-box; }
        body { margin:0; min-width:320px; min-height:100vh; padding:28px 20px; color:var(--ink); background:radial-gradient(circle at 20% 0,rgba(112,217,157,.11),transparent 30rem),var(--bg); font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif; }
        main { width:min(720px,100%); margin:auto; }
        .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:24px; }
        .back { min-height:44px; display:inline-flex; align-items:center; padding:8px 12px; border-radius:10px; color:var(--green); font-weight:900; text-decoration:none; }
        h1 { margin:0; font-size:clamp(2rem,7vw,3.3rem); letter-spacing:-.05em; }
        .intro { margin:12px 0 24px; color:var(--muted); line-height:1.65; }
        .card { margin-bottom:14px; padding:22px; border:1px solid var(--line); border-radius:18px; background:rgba(20,39,30,.95); }
        .identity { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
        .identity div { padding:14px; border-radius:12px; background:#0f1d17; }
        .identity span,.identity strong { display:block; }
        .identity span { color:var(--muted); font-size:.8rem; }
        label { display:block; margin:0 0 8px; font-weight:900; }
        input { width:100%; min-height:52px; padding:12px 14px; border:1px solid var(--line); border-radius:11px; color:var(--ink); background:#0f1d17; font:inherit; font-size:1.1rem; }
        .hint { color:var(--muted); font-size:.9rem; line-height:1.6; }
        .choice { display:flex; align-items:flex-start; gap:12px; min-height:58px; padding:12px; border:1px solid var(--line); border-radius:12px; cursor:pointer; }
        .choice input { width:24px; min-height:24px; margin:2px 0 0; accent-color:var(--green); }
        .choice strong,.choice small { display:block; }
        .choice small { margin-top:4px; color:var(--muted); line-height:1.45; }
        .preview { padding:14px; border-radius:12px; background:var(--soft); color:var(--green); font-weight:900; }
        .warning { color:var(--amber); }
        .actions { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:18px; }
        button { min-height:48px; padding:10px 18px; border:1px solid var(--green); border-radius:11px; color:#082216; background:var(--green); font:inherit; font-weight:900; cursor:pointer; }
        button:disabled { opacity:.55; cursor:wait; }
        #status { min-height:26px; color:var(--muted); font-weight:800; }
        
        .privacy-link { min-height:44px; display:inline-flex; align-items:center; color:var(--green); }
        .avatar-current { display:flex; align-items:center; gap:18px; padding:16px; border-radius:14px; background:#0f1d17; }
        .avatar-current img { width:112px; height:112px; object-fit:contain; flex:none; }
        .avatar-current strong,.avatar-current span { display:block; }
        .avatar-current span { margin-top:6px; color:var(--muted); line-height:1.5; }
        .avatar-picker { margin-top:16px; }
        .avatar-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:10px; margin-top:12px; }
        .avatar-option { min-height:88px; padding:6px; border:2px solid transparent; border-radius:13px; background:#0f1d17; }
        .avatar-option img { width:68px; height:68px; max-width:100%; object-fit:contain; pointer-events:none; }
        .avatar-option[aria-pressed="true"] { border-color:var(--amber); background:#254733; }
        .secondary-button { color:var(--green); background:transparent; }
        .picker-actions { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; }
        #avatarStatus { min-height:26px; color:var(--muted); font-weight:800; }
        @media(max-width:600px){.avatar-current{align-items:flex-start}.avatar-current img{width:92px;height:92px}.picker-actions{align-items:stretch;flex-direction:column}}
        @media(max-width:600px){body{padding:18px 14px}.identity{grid-template-columns:1fr}.actions{align-items:stretch;flex-direction:column}button{width:100%}}
    </style>
</head>
<body><main>
    <div class="top"><a class="back" href="/">← 첫 화면</a><a class="privacy-link" href="/student-privacy">개인정보 안내</a></div>
    <h1>내 정보 설정</h1>
    <section class="card" aria-labelledby="identityTitle"><h2 id="identityTitle">내 학급</h2><div class="identity"><div><span>학생</span><strong id="studentName">확인 중…</strong></div><div><span>학급</span><strong id="className">확인 중…</strong></div></div></section>
    <section id="avatarCard" class="card" hidden aria-labelledby="avatarTitle">
        <h2 id="avatarTitle">&#45236; &#50500;&#48148;&#53440;</h2>
        <div class="avatar-current">
            <img id="currentAvatarImage" alt="&#54788;&#51116; &#50500;&#48148;&#53440;">
            <div><strong id="currentAvatarName">&#50500;&#48148;&#53440; &#54869;&#51064; &#51473;&#8230;</strong><span id="avatarPolicy"></span></div>
        </div>
        <div class="actions"><span></span><button id="openAvatarPicker" class="secondary-button" type="button">&#50500;&#48148;&#53440; &#48148;&#44984;&#44592;</button></div>
        <div id="avatarPicker" class="avatar-picker" hidden>
            <p class="hint warning">&#49352; &#50500;&#48148;&#53440;&#47484; &#54869;&#51221;&#54616;&#47732; &#51060;&#48264; &#44592;&#44036;&#51032; &#48320;&#44221; &#44592;&#54924; 1&#54924;&#47484; &#49324;&#50857;&#54633;&#45768;&#45796;.</p>
            <h3>&#52628;&#52380; &#50500;&#48148;&#53440;</h3>
            <div id="recommendedAvatars" class="avatar-grid"></div>
            <button id="toggleAllAvatars" class="secondary-button" type="button">&#51204;&#52404; &#50500;&#48148;&#53440; &#48372;&#44592;</button>
            <div id="allAvatars" class="avatar-grid" hidden></div>
            <div class="picker-actions"><span id="avatarStatus" role="status" aria-live="polite"></span><button id="saveAvatar" type="button" disabled>&#51060; &#50500;&#48148;&#53440;&#47196; &#54869;&#51221;</button></div>
        </div>
    </section>
    <form id="profileForm" class="card" hidden>
        <h2>생일과 공개 여부</h2>
        <label for="birthdayMmdd">생일 월일 4자리</label>
        <input id="birthdayMmdd" type="text" inputmode="numeric" autocomplete="bday" maxlength="4" placeholder="예: 0808" aria-describedby="birthdayHint">
        <p id="birthdayHint" class="hint">태어난 해는 받지 않아요. 월과 일만 MMDD 형식으로 저장합니다.</p>
        <label class="choice" for="birthdayVisible"><input id="birthdayVisible" type="checkbox"><span><strong>학급 주요일정에 내 생일 공개</strong><small>켜면 학급 구성원에게 ‘○○ 생일’ 일정이 보여요. 언제든 다시 끌 수 있어요.</small></span></label>
        <p id="preview" class="preview">현재 생일은 공개되지 않습니다.</p>
        <p class="hint warning">친구의 생일이나 다른 개인정보는 입력하지 마세요.</p>
        <div class="actions"><span id="status" role="status" aria-live="polite"></span><button id="saveButton" type="submit">설정 저장</button></div>
    </form>
    
</main>
<script>
const form=document.querySelector('#profileForm'),birthday=document.querySelector('#birthdayMmdd'),visible=document.querySelector('#birthdayVisible'),preview=document.querySelector('#preview'),statusEl=document.querySelector('#status'),saveButton=document.querySelector('#saveButton');
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'요청을 처리하지 못했습니다.');return data}
const avatarCard=document.querySelector('#avatarCard'),currentAvatarImage=document.querySelector('#currentAvatarImage'),currentAvatarName=document.querySelector('#currentAvatarName'),avatarPolicy=document.querySelector('#avatarPolicy'),openAvatarPicker=document.querySelector('#openAvatarPicker'),avatarPicker=document.querySelector('#avatarPicker'),recommendedAvatars=document.querySelector('#recommendedAvatars'),toggleAllAvatars=document.querySelector('#toggleAllAvatars'),allAvatars=document.querySelector('#allAvatars'),avatarStatus=document.querySelector('#avatarStatus'),saveAvatar=document.querySelector('#saveAvatar');
let currentAvatarProfile=null,selectedAvatarKey='';
function avatarDisplayName(key){return String(key||'').replace(/\.(?:png|webp)$/i,'').replace(/^(animal|food|fruit|vegetable|object|vehicle|theme|sport|award|drink|game)-/,'').replace(/-/g,' ')}
function shuffled(items){const result=[...items];for(let index=result.length-1;index>0;index-=1){const swap=Math.floor(Math.random()*(index+1));[result[index],result[swap]]=[result[swap],result[index]]}return result}
function updateAvatarSelection(){
    document.querySelectorAll('[data-avatar-key]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.avatarKey===selectedAvatarKey)));
    saveAvatar.disabled=!selectedAvatarKey||selectedAvatarKey===currentAvatarProfile?.key;
}
function createAvatarButton(option){
    const button=document.createElement('button');button.type='button';button.className='avatar-option';button.dataset.avatarKey=option.key;button.setAttribute('aria-label',`${avatarDisplayName(option.key)} \uc544\ubc14\ud0c0 \uc120\ud0dd`);button.setAttribute('aria-pressed','false');
    const image=document.createElement('img');image.src=option.url;image.alt='';image.loading='lazy';button.append(image);
    button.addEventListener('click',()=>{selectedAvatarKey=option.key;avatarStatus.textContent='\uc120\ud0dd\ud55c \uc544\ubc14\ud0c0\ub97c \ud655\uc778\ud55c \ub4a4 \ud655\uc815\ud574 \uc8fc\uc138\uc694.';updateAvatarSelection()});
    return button;
}
function renderAvatarGrid(container,options){container.replaceChildren(...options.map(createAvatarButton));updateAvatarSelection()}
function renderAvatar(avatar){
    currentAvatarProfile=avatar||{key:'',url:'',options:[],canChange:false};selectedAvatarKey='';avatarPicker.hidden=true;allAvatars.hidden=true;toggleAllAvatars.textContent='\uc804\uccb4 \uc544\ubc14\ud0c0 \ubcf4\uae30';avatarStatus.textContent='';
    if(currentAvatarProfile.url){currentAvatarImage.src=currentAvatarProfile.url;currentAvatarImage.hidden=false;currentAvatarName.textContent=avatarDisplayName(currentAvatarProfile.key)}else{currentAvatarImage.removeAttribute('src');currentAvatarImage.hidden=true;currentAvatarName.textContent='\uc544\uc9c1 \ubc30\uc815\ub418\uc9c0 \uc54a\uc74c'}
    if(!currentAvatarProfile.key)avatarPolicy.textContent='\ub2f4\uc784 \uc120\uc0dd\ub2d8\uc774 \uba85\ub2e8\uc744 \uc800\uc7a5\ud558\uba74 \uc544\ubc14\ud0c0\uac00 \uc790\ub3d9\uc73c\ub85c \ubc30\uc815\ub429\ub2c8\ub2e4.';
    else if(currentAvatarProfile.canChange)avatarPolicy.textContent=`${currentAvatarProfile.changePeriodLabel} \ubcc0\uacbd \uae30\ud68c\uac00 1\ud68c \ub0a8\uc544 \uc788\uc2b5\ub2c8\ub2e4.`;
    else if(currentAvatarProfile.changeUsed)avatarPolicy.textContent=`${currentAvatarProfile.changePeriodLabel} \ubcc0\uacbd \uae30\ud68c\ub97c \uc774\ubbf8 \uc0ac\uc6a9\ud588\uc2b5\ub2c8\ub2e4.`;
    else avatarPolicy.textContent='1~2\uc6d4\uc5d0\ub294 \uc544\ubc14\ud0c0\ub97c \ubcc0\uacbd\ud560 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.';
    openAvatarPicker.disabled=!currentAvatarProfile.canChange;
    const available=(currentAvatarProfile.options||[]).filter(option=>option.available&&option.key!==currentAvatarProfile.key);
    renderAvatarGrid(recommendedAvatars,shuffled(available).slice(0,12));renderAvatarGrid(allAvatars,available);
}
openAvatarPicker.addEventListener('click',()=>{avatarPicker.hidden=!avatarPicker.hidden;if(!avatarPicker.hidden)recommendedAvatars.querySelector('button')?.focus()});
toggleAllAvatars.addEventListener('click',()=>{allAvatars.hidden=!allAvatars.hidden;toggleAllAvatars.textContent=allAvatars.hidden?'\uc804\uccb4 \uc544\ubc14\ud0c0 \ubcf4\uae30':'\uc804\uccb4 \uc544\ubc14\ud0c0 \uc811\uae30'});
saveAvatar.addEventListener('click',async()=>{
    if(!selectedAvatarKey||selectedAvatarKey===currentAvatarProfile?.key)return;
    if(!confirm('\uc774 \uc544\ubc14\ud0c0\ub85c \ud655\uc815\ud560\uae4c\uc694? \ud655\uc815\ud558\uba74 \uc774\ubc88 \uae30\uac04\uc758 \ubcc0\uacbd \uae30\ud68c 1\ud68c\ub97c \uc0ac\uc6a9\ud569\ub2c8\ub2e4.'))return;
    saveAvatar.disabled=true;avatarStatus.textContent='\uc544\ubc14\ud0c0 \ubcc0\uacbd \uc911\u2026';
    try{await api('/api/student/avatar',{method:'PATCH',body:JSON.stringify({avatarKey:selectedAvatarKey})});const refreshed=await api('/api/student/profile');renderAvatar(refreshed.profile.avatar);avatarStatus.textContent='\uc544\ubc14\ud0c0\ub97c \ubcc0\uacbd\ud588\uc2b5\ub2c8\ub2e4.'}
    catch(error){avatarStatus.textContent=error.message;saveAvatar.disabled=false}
});
function validMmdd(value){if(!/^\d{4}$/.test(value))return false;const month=Number(value.slice(0,2)),day=Number(value.slice(2));return month>=1&&month<=12&&day>=1&&day<=new Date(2000,month,0).getDate()}
function renderPreview(){const value=birthday.value;if(visible.checked&&validMmdd(value)){preview.textContent=`${Number(value.slice(0,2))}월 ${Number(value.slice(2))}일에 ‘내 생일’ 일정이 학급에 공개됩니다.`;preview.classList.remove('warning')}else{preview.textContent='현재 생일은 공개되지 않습니다.';preview.classList.toggle('warning',visible.checked)}}
birthday.addEventListener('input',()=>{birthday.value=birthday.value.replace(/\D/g,'').slice(0,4);renderPreview()});visible.addEventListener('change',renderPreview);
form.addEventListener('submit',async event=>{event.preventDefault();if(birthday.value&&!validMmdd(birthday.value)){statusEl.textContent='올바른 월일 4자리를 입력해 주세요.';birthday.focus();return}if(visible.checked&&!birthday.value){statusEl.textContent='생일을 먼저 입력해 주세요.';birthday.focus();return}saveButton.disabled=true;statusEl.textContent='저장 중…';try{const data=await api('/api/student/profile',{method:'PATCH',body:JSON.stringify({birthdayMmdd:birthday.value,birthdayVisible:visible.checked})});birthday.value=data.profile.birthdayMmdd;visible.checked=data.profile.birthdayVisible;renderPreview();statusEl.textContent='내 선택을 저장했습니다.'}catch(error){statusEl.textContent=error.message}finally{saveButton.disabled=false}});
async function start(){const me=await api('/api/auth/me');if(!me.signedIn||me.user?.role!=='student'){location.replace('/');return}const data=await api('/api/student/profile');const profile=data.profile;document.querySelector('#studentName').textContent=`${profile.studentNumber}번 ${profile.name}`;document.querySelector('#className').textContent=`${profile.schoolName} ${profile.grade}학년 ${profile.classNumber}반`;birthday.value=profile.birthdayMmdd;visible.checked=profile.birthdayVisible;renderPreview();form.hidden=false}start().catch(error=>{document.querySelector('#studentName').textContent='불러오지 못했습니다';document.querySelector('#className').textContent=error.message});
async function startAvatar(){const data=await api('/api/student/profile');renderAvatar(data.profile.avatar);avatarCard.hidden=false}
startAvatar().catch(error=>{avatarCard.hidden=false;currentAvatarName.textContent='\uc544\ubc14\ud0c0\ub97c \ubd88\ub7ec\uc624\uc9c0 \ubabb\ud588\uc2b5\ub2c8\ub2e4';avatarPolicy.textContent=error.message;openAvatarPicker.disabled=true});
</script></body></html>
