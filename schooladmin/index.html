<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>학교 관리자 현황판</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <a href="/" class="back-button"><span class="material-symbols-outlined">arrow_back</span></a>
        <h1 id="schoolNameTitle">학교 관리자</h1>
        <div class="header-actions">
            <button id="signOutButton" class="text-button">로그아웃</button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-button active" data-tab="dashboard">출결 현황판</button>
        <button class="tab-button" data-tab="annual">연간 학사일정 관리</button>
        <button class="tab-button" data-tab="roster">전교생 명단</button>
    </div>

    <main class="app-main">
        <!-- Dashboard Tab -->
        <section id="dashboardTab" class="tab-content active">
            <div class="controls-row">
                <div class="date-picker-wrap">
                    <button id="prevDateBtn" class="icon-button"><span class="material-symbols-outlined">chevron_left</span></button>
                    <input type="date" id="dashboardDate" class="date-input">
                    <button id="nextDateBtn" class="icon-button"><span class="material-symbols-outlined">chevron_right</span></button>
                </div>
                <button id="refreshDashboardBtn" class="primary-button">
                    <span class="material-symbols-outlined">refresh</span> 새로고침
                </button>
            </div>

            <div id="dashboardLoading" class="loading-state">데이터를 불러오는 중입니다...</div>
            <div id="dashboardError" class="error-state" hidden></div>

            <div id="dashboardContent" hidden>
                <div class="summary-cards">
                    <div class="summary-card">
                        <div class="card-title">총 현원</div>
                        <div class="card-value" id="totalStudentsCount">0</div>
                    </div>
                    <div class="summary-card warning">
                        <div class="card-title">결석</div>
                        <div class="card-value" id="totalAbsenceCount">0</div>
                    </div>
                    <div class="summary-card info">
                        <div class="card-title">지각</div>
                        <div class="card-value" id="totalTardyCount">0</div>
                    </div>
                    <div class="summary-card info">
                        <div class="card-title">조퇴</div>
                        <div class="card-value" id="totalEarlyCount">0</div>
                    </div>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>학년-반</th>
                                <th>재적</th>
                                <th>출석</th>
                                <th>결석</th>
                                <th>지각</th>
                                <th>조퇴</th>
                            </tr>
                        </thead>
                        <tbody id="dashboardTableBody">
                            <!-- Rows will be injected here -->
                        </tbody>
                        <tfoot id="dashboardTableFoot">
                            <!-- Totals will be injected here -->
                        </tfoot>
                    </table>
                </div>
            </div>
        </section>

        <!-- Annual Schedules Tab -->
        <section id="annualTab" class="tab-content" hidden>
            <div class="schedule-editor-panel">
                <h3>📅 연간 학사일정 / 행사 등록</h3>
                <form id="addAnnualScheduleForm" class="schedule-form">
                    <div class="form-row">
                        <label>
                            <span>일정 날짜</span>
                            <input type="date" id="annualDateInput" required class="form-input">
                        </label>
                        <label class="flex-grow">
                            <span>일정명</span>
                            <input type="text" id="annualTitleInput" placeholder="예: 현장체험학습, 체육대회, 개학식" required maxlength="60" class="form-input">
                        </label>
                    </div>
                    <div class="form-row">
                        <label>
                            <span>구분</span>
                            <select id="annualCategorySelect" class="form-select">
                                <option value="EVENT">🏫 일반 행사</option>
                                <option value="HOLIDAY">🔴 휴업일 / 공휴일</option>
                                <option value="TRIP">🚌 현장체험 / 수련</option>
                                <option value="EXAM">📝 평가 / 시험</option>
                            </select>
                        </label>
                        <label>
                            <span>적용 대상</span>
                            <select id="annualTargetScopeSelect" class="form-select">
                                <option value="ALL">🏢 전교 공통</option>
                                <option value="GRADE">🏫 특정 학년 지정</option>
                            </select>
                        </label>
                    </div>
                    <div class="form-row" id="gradeSelectionRow" hidden>
                        <span class="form-label-text">대상 학년:</span>
                        <div class="grade-checkboxes">
                            <label><input type="checkbox" name="targetGrade" value="1"> 1학년</label>
                            <label><input type="checkbox" name="targetGrade" value="2"> 2학년</label>
                            <label><input type="checkbox" name="targetGrade" value="3"> 3학년</label>
                            <label><input type="checkbox" name="targetGrade" value="4"> 4학년</label>
                            <label><input type="checkbox" name="targetGrade" value="5"> 5학년</label>
                            <label><input type="checkbox" name="targetGrade" value="6"> 6학년</label>
                        </div>
                    </div>
                    <div class="form-row align-end">
                        <label class="flex-grow">
                            <span>상세 설명 (선택)</span>
                            <input type="text" id="annualDetailsInput" placeholder="비고 및 안내 사항" maxlength="160" class="form-input">
                        </label>
                        <button type="submit" class="primary-button add-schedule-btn">
                            <span class="material-symbols-outlined">add</span> 일정 추가
                        </button>
                    </div>
                </form>
            </div>

            <div class="controls-row schedule-filter-row">
                <input type="text" id="annualSearchInput" class="search-input" placeholder="일정 검색...">
                <div class="year-selector">
                    <select id="annualYearSelect" class="form-select">
                        <option value="2026">2026학년도</option>
                        <option value="2025">2025학년도</option>
                    </select>
                </div>
            </div>

            <div id="annualLoading" class="loading-state" hidden>일정을 불러오는 중입니다...</div>
            <div id="annualError" class="error-state" hidden></div>

            <div id="annualContent" class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>구분</th>
                            <th>적용 대상</th>
                            <th>일정명</th>
                            <th>상세 내용</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="annualTableBody">
                        <!-- Rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Roster Tab -->
        <section id="rosterTab" class="tab-content" hidden>
            <div class="controls-row">
                <input type="text" id="rosterSearch" class="search-input" placeholder="이름으로 검색...">
            </div>
            
            <div id="rosterLoading" class="loading-state">명단을 불러오는 중입니다...</div>
            <div id="rosterError" class="error-state" hidden></div>

            <div id="rosterContent" class="table-container" hidden>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>학년</th>
                            <th>반</th>
                            <th>번호</th>
                            <th>이름</th>
                        </tr>
                    </thead>
                    <tbody id="rosterTableBody">
                        <!-- Rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/shared/auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
