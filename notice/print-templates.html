<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울계상초등학교 서식 인쇄</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 15mm 15mm 15mm 15mm;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: "Malgun Gothic", "맑은 고딕", Batang, serif;
            background: #f5f5f5;
            color: #000;
        }

        .no-print-bar {
            max-width: 210mm;
            margin: 0 auto 20px;
            padding: 12px 20px;
            background: #171f1a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 8px;
        }

        .no-print-bar button {
            padding: 8px 16px;
            background: #75d69f;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .a4-page {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm 18mm;
            margin: 0 auto 30px;
            background: #fff;
            border: 1px solid #ccc;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Table styles matching official school format */
        .title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 12px;
            margin-bottom: 15px;
        }

        .sub-note {
            font-size: 13px;
            text-align: left;
            margin-bottom: 10px;
        }

        .approval-box {
            border-collapse: collapse;
            float: right;
            margin-bottom: 10px;
        }

        .approval-box td, .approval-box th {
            border: 1px solid #000;
            text-align: center;
            padding: 4px 8px;
            font-size: 12px;
        }

        .approval-box .stamp-cell {
            height: 45px;
            width: 55px;
            vertical-align: middle;
        }

        .clear {
            clear: both;
        }

        table.form-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        table.form-table td, table.form-table th {
            border: 1px solid #000;
            padding: 8px 10px;
            font-size: 14px;
            vertical-align: middle;
        }

        table.form-table th {
            background-color: #f8f8f8;
            font-weight: normal;
            text-align: center;
        }

        .center { text-align: center; }

        .checkbox-group {
            line-height: 1.8;
            font-size: 13px;
        }

        .signature-section {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 2;
        }

        .school-principal {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 15px;
        }

        .bottom-notice {
            border: 1px solid #000;
            padding: 10px;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 20px;
        }

        .teacher-record-box {
            border: 1px solid #000;
            margin-top: 15px;
            padding: 10px;
        }

        .teacher-record-box p {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: bold;
        }

        .sig-img {
            max-height: 35px;
            vertical-align: middle;
        }

        .photo-container {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-top: 10px;
        }

        @media print {
            body { background: transparent; padding: 0; }
            .no-print-bar { display: none !important; }
            .a4-page {
                border: none;
                box-shadow: none;
                margin: 0;
                width: 100%;
                height: 100%;
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <div class="no-print-bar">
        <span>📄 서울계상초등학교 공식 결재 서식 출력</span>
        <button onclick="window.print()">🖨️ A4 인쇄하기</button>
    </div>

    <!-- Container for dynamic form rendering -->
    <div id="printContainer"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const formType = urlParams.get('type') || 'absence';
        const docId = urlParams.get('id');

        async function loadDocumentData() {
            let data = {};
            if (docId) {
                try {
                    const res = await fetch(`/api/notice/docs/${formType}/${docId}`);
                    if (res.ok) data = await res.json();
                } catch(e) { console.error(e); }
            }
            renderForm(formType, data);
        }

        function renderForm(type, data) {
            const container = document.getElementById('printContainer');
            if (type === 'absence') {
                container.innerHTML = getAbsenceHTML(data);
            } else if (type === 'exp_app') {
                container.innerHTML = getExpAppHTML(data);
            } else if (type === 'exp_report') {
                container.innerHTML = getExpReportHTML(data);
            }
        }

        function getAbsenceHTML(d) {
            const year = d.year || new Date().getFullYear();
            const month = d.month || (new Date().getMonth() + 1);
            const day = d.day || new Date().getDate();

            return `
            <div class="a4-page">
                <table class="approval-box">
                    <tr>
                        <th rowspan="2" width="20">결<br>재</th>
                        <th width="60">담임</th>
                        <th width="70">교무부장</th>
                        <th width="60">교감</th>
                    </tr>
                    <tr>
                        <td class="stamp-cell"></td>
                        <td class="stamp-cell"></td>
                        <td class="stamp-cell">전결</td>
                    </tr>
                </table>
                <div class="clear"></div>

                <div class="title">결 석 계</div>
                <div class="sub-note">※ 결석한 날부터 5일 이내에 제출</div>

                <table class="form-table">
                    <tr>
                        <th width="20%">학교</th>
                        <th width="30%">학년 반</th>
                        <th width="20%">번호</th>
                        <th width="30%">성명</th>
                    </tr>
                    <tr>
                        <td class="center">서울계상초등학교</td>
                        <td class="center">${d.grade || ''}학년 ${d.classNumber || ''}반</td>
                        <td class="center">${d.studentNumber || ''}</td>
                        <td class="center"><strong>${d.studentName || ''}</strong></td>
                    </tr>
                    <tr>
                        <th>결석기간</th>
                        <td colspan="3" class="center">
                            ${d.startDate || '202 년  월  일'} ~ ${d.endDate || '202 년  월  일'} (${d.totalDays || ' '}일간)
                        </td>
                    </tr>
                    <tr>
                        <th>결석사유<br>(학부모 의견)</th>
                        <td colspan="3" style="height: 70px; vertical-align: top;">
                            ${d.reasonDetail || ''}
                        </td>
                    </tr>
                    <tr>
                        <th>증빙서류</th>
                        <td colspan="3" class="checkbox-group">
                            <strong>*질병으로 인한 결석</strong><br>
                            - 미세먼지 민감군 학생 결석: ${d.reasonType === 'dust' ? '☑' : '☐'} 의사 진단서 또는 소견서 (등교시간 '나쁨' 이상 일 때 사전연락)<br>
                            - 2일 이내: ${d.reasonType === 'sick_2d' ? '☑' : '☐'} 위의 학부모의견서(결석계)로 갈음함<br>
                            - 3일 이상: ${d.reasonType === 'sick_3d' ? '☑' : '☐'} 의사 소견서  ${d.reasonType === 'sick_3d' ? '☑' : '☐'} 진료 확인서<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;☐ 기타 병명, 진료기간 등이 기록된 증빙서류<br><br>
                            <strong>*기타 결석</strong> : ${d.reasonType === 'other' ? '☑ 기타' : '☐ 기타'}<br><br>
                            <strong>*출석인정결석</strong> : ☐ 뒷면 참조, ${d.reasonType === 'approved' ? '☑' : '☐'} 코로나19 관련 / 경조사 등
                            ${d.evidenceUrl ? `<br><br><img src="${d.evidenceUrl}" class="photo-container" alt="증빙서류">` : ''}
                        </td>
                    </tr>
                </table>

                <div class="signature-section">
                    ${year} 년 &nbsp;&nbsp; ${month} 월 &nbsp;&nbsp; ${day} 일<br><br>
                    보호자 : &nbsp;&nbsp; ${d.parentName || '학부모'} &nbsp;&nbsp; 
                    ${d.parentSignature ? `<img src="${d.parentSignature}" class="sig-img" alt="서명">` : '(인)'}
                </div>

                <div class="school-principal">서울계상초등학교장 귀하</div>

                <div class="bottom-notice">
                    ※ 본 결석계는 학부모 의견서를 겸합니다.<br>
                    ※ 첨부할 내용: 증빙서류(위의 항목 참고)를 함께 제출해 주시기 바랍니다.
                </div>

                <div class="teacher-record-box">
                    <p>▶ 아래 부분은 담임선생님이 확인 기록하는 것이니 가정에서는 기록하지 마시기 바랍니다.</p>
                    <table class="form-table" style="margin: 0;">
                        <tr>
                            <th>질병결석</th>
                            <th>미인정결석</th>
                            <th>기타결석</th>
                            <th>출석인정결석<br><small>(천재지변, 감염병, 경조사 등)</small></th>
                        </tr>
                        <tr style="height: 45px;">
                            <td class="center">${d.teacherCheck === '질병결석' ? 'v' : ''}</td>
                            <td class="center">${d.teacherCheck === '미인정결석' ? 'v' : ''}</td>
                            <td class="center">${d.teacherCheck === '기타결석' ? 'v' : ''}</td>
                            <td class="center">${d.teacherCheck === '출석인정결석' ? 'v' : ''}</td>
                        </tr>
                    </table>
                </div>
            </div>
            `;
        }

        function getExpAppHTML(d) {
            const year = d.year || new Date().getFullYear();
            const month = d.month || (new Date().getMonth() + 1);
            const day = d.day || new Date().getDate();

            return `
            <div class="a4-page">
                <table class="approval-box">
                    <tr>
                        <th rowspan="2" width="20">결<br>재</th>
                        <th width="60">담임</th>
                        <th width="60">교무<br>전결</th>
                    </tr>
                    <tr>
                        <td class="stamp-cell"></td>
                        <td class="stamp-cell"></td>
                    </tr>
                </table>
                <div class="clear"></div>

                <div class="title" style="letter-spacing: 6px;">교외체험학습 신청서</div>

                <table class="form-table">
                    <tr>
                        <th width="12%" rowspan="2">인 적<br>사 항</th>
                        <th width="15%">성 명</th>
                        <td width="35%"><strong>${d.studentName || ''}</strong> (${d.gender || '남/여'})</td>
                        <th width="18%">학년반번호</th>
                        <td width="20%">${d.grade || ''}학년 ${d.classNumber || ''}반 ${d.studentNumber || ''}번</td>
                    </tr>
                    <tr>
                        <th>전화번호</th>
                        <td colspan="3">${d.parentPhone || '010-'}</td>
                    </tr>
                    <tr>
                        <th rowspan="2">기 간</th>
                        <td colspan="4">
                            (일반 체험학습) ${d.startDate || '202 년  월  일'} ~ ${d.endDate || '202 년  월  일'} ( ${d.totalDays || ' '}일간 )
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4" style="color: blue; font-size: 12px;">
                            (감염병위기경보 - 심각 단계인 경우에 한해, ‘가정학습’으로 신청 가능)
                        </td>
                    </tr>
                    <tr>
                        <th>장 소</th>
                        <td colspan="4">${d.location || ''}</td>
                    </tr>
                    <tr>
                        <th>활동계획</th>
                        <td colspan="4" style="height: 240px; vertical-align: top;">
                            ${d.planDetail || ''}
                        </td>
                    </tr>
                </table>

                <div class="signature-section">
                    위와 같이 교외체험학습을 신청하오니 허락하여 주시기 바랍니다.<br><br>
                    ${year} 년 &nbsp;&nbsp; ${month} 월 &nbsp;&nbsp; ${day} 일<br><br>
                    학 생 : &nbsp;&nbsp; ${d.studentName || ''} &nbsp;&nbsp; (인)<br>
                    학부모 : &nbsp;&nbsp; ${d.parentName || '보호자'} &nbsp;&nbsp; 
                    ${d.parentSignature ? `<img src="${d.parentSignature}" class="sig-img" alt="서명">` : '(인)'}
                </div>

                <div class="school-principal">서울계상초등학교장 귀하</div>
            </div>
            `;
        }

        function getExpReportHTML(d) {
            const year = d.year || new Date().getFullYear();
            const month = d.month || (new Date().getMonth() + 1);
            const day = d.day || new Date().getDate();

            return `
            <div class="a4-page">
                <table class="approval-box">
                    <tr>
                        <th rowspan="2" width="20">결<br>재</th>
                        <th width="60">담임</th>
                        <th width="60">교무<br>전결</th>
                    </tr>
                    <tr>
                        <td class="stamp-cell"></td>
                        <td class="stamp-cell"></td>
                    </tr>
                </table>
                <div class="clear"></div>

                <div class="title" style="letter-spacing: 4px; font-size: 24px;">교외체험학습 결과 보고서</div>
                <div class="sub-note" style="text-align: right;">※ 교외체험학습 실시 후 7일 이내 제출함</div>

                <table class="form-table">
                    <tr>
                        <th width="12%">인 적<br>사 항</th>
                        <th width="15%">성 명</th>
                        <td width="35%"><strong>${d.studentName || ''}</strong> (${d.gender || '남/여'})</td>
                        <th width="18%">학년반번호</th>
                        <td width="20%">${d.grade || ''}학년 ${d.classNumber || ''}반 ${d.studentNumber || ''}번</td>
                    </tr>
                    <tr>
                        <th>기 간</th>
                        <td colspan="4">
                            (일반 체험학습) ${d.startDate || '202 년  월  일'} ~ ${d.endDate || '202 년  월  일'} ( ${d.totalDays || ' '}일간 )
                        </td>
                    </tr>
                    <tr>
                        <th>장 소</th>
                        <td colspan="4">${d.location || ''}</td>
                    </tr>
                    <tr>
                        <th>현장학습<br>실천내용<br>및 효과</th>
                        <td colspan="4" style="height: 240px; vertical-align: top;">
                            ${d.reportDetail || ''}
                            ${d.photoUrl ? `<br><br><img src="${d.photoUrl}" class="photo-container" alt="현장사진">` : ''}
                        </td>
                    </tr>
                </table>

                <div class="signature-section">
                    위와 같이 현장 학습 결과를 보고합니다.<br><br>
                    ${year} 년 &nbsp;&nbsp; ${month} 월 &nbsp;&nbsp; ${day} 일<br><br>
                    학 생 : &nbsp;&nbsp; ${d.studentName || ''} &nbsp;&nbsp; (인)<br>
                    학부모 : &nbsp;&nbsp; ${d.parentName || '보호자'} &nbsp;&nbsp; 
                    ${d.parentSignature ? `<img src="${d.parentSignature}" class="sig-img" alt="서명">` : '(인)'}
                </div>

                <div class="school-principal">서울계상초등학교장 귀하</div>
            </div>
            `;
        }

        loadDocumentData();
    </script>
</body>
</html>
