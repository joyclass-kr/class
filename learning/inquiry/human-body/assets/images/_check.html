<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>도식 검사 — 인체 시뮬레이터</title>
<style>
    body { margin: 0; padding: 22px 26px; background: #0b1020; color: #e2e8f0;
           font: 14px/1.6 Pretendard, system-ui, sans-serif; }
    h1 { font-size: 19px; margin: 0 0 6px; }
    p.lead { color: #94a3b8; margin: 0 0 22px; }
    h2 { font-size: 16px; margin: 26px 0 8px; color: #7dd3fc; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 10px; }
    th, td { border: 1px solid #24304a; padding: 5px 9px; text-align: left; font-size: 13.5px; }
    th { background: #131c33; color: #cbd5e1; font-weight: 700; }
    .ok { color: #4ade80; font-weight: 700; }
    .no { color: #f87171; font-weight: 700; }
    .dim { color: #64748b; }
    code { color: #fbbf24; }
</style>
</head>
<body>

<h1>도식 검사</h1>
<p class="lead">
    옆방이 「여기가 끊겨 있다」고 하면 눈으로 다투지 말고 이 쪽을 열어 숫자로 가린다.
    <b>틈 0</b>은 두 조각이 닿아 있다는 뜻이다. 규격은 글자 없음·발광 없음·눈금 안.
</p>

<div id="out"></div>

<script>
/* 도식마다 「무엇이 무엇에 닿아야 하는가」를 적어 둔다.
   새 도식을 받으면 여기에 줄만 더하면 된다. */
var SPECS = [
    {
        file: 'heart-diagram.svg',
        title: '심장과 순환 경로',
        touch: [
            ['vesselAorta', 'leftVentricle', '대동맥은 좌심실에서 나온다'],
            ['vesselPulmonaryArtery', 'rightVentricle', '폐동맥은 우심실에서 나온다'],
            ['vesselPulmonaryVein', 'leftAtrium', '폐정맥은 좌심방으로 들어온다'],
            ['vesselVenaCava', 'rightAtrium', '대정맥은 우심방으로 들어온다'],
            ['vesselAorta', 'bodyCapillaries', '대동맥은 온몸 모세혈관으로 이어진다'],
            ['vesselVenaCava', 'bodyCapillaries', '대정맥은 온몸 모세혈관에서 온다'],
            ['vesselPulmonaryArtery', 'lungCapillaryNetwork', '폐동맥은 폐 모세혈관으로'],
            ['vesselPulmonaryVein', 'lungCapillaryNetwork', '폐정맥은 폐 모세혈관에서']
        ],
        between: [
            ['valveAortic', 'leftVentricle', 'vesselAorta', '대동맥판은 좌심실과 대동맥 사이'],
            ['valvePulmonary', 'rightVentricle', 'vesselPulmonaryArtery', '폐동맥판은 우심실과 폐동맥 사이'],
            ['valveMitral', 'leftAtrium', 'leftVentricle', '이첨판은 좌심방과 좌심실 사이'],
            ['valveTricuspid', 'rightAtrium', 'rightVentricle', '삼첨판은 우심방과 우심실 사이']
        ]
    },
    {
        file: 'arm-skeleton.svg',
        title: '팔 뼈와 근육',
        touch: [
            ['ulna', 'humerus', '자뼈는 위팔뼈에 닿는다 (팔꿈치)'],
            ['radius', 'humerus', '노뼈는 위팔뼈에 닿는다 (팔꿈치)'],
            ['hand', 'radius', '손은 노뼈에 닿는다'],
            ['humerus', 'scapula', '위팔뼈는 어깨뼈에 걸린다']
        ],
        axis: [
            ['bicepsRelaxed', 'attachBicepsOrigin', 'attachBicepsInsertion', '이두근(이완)'],
            ['bicepsContracted', 'attachBicepsOrigin', 'attachBicepsInsertion', '이두근(수축)'],
            ['tricepsRelaxed', 'attachTricepsOrigin', 'attachTricepsInsertion', '삼두근(이완)'],
            ['tricepsContracted', 'attachTricepsOrigin', 'attachTricepsInsertion', '삼두근(수축)']
        ],
        thickness: [
            ['bicepsRelaxed', 'bicepsContracted', 1.6, '이두근 수축이 이완의 몇 배'],
            ['tricepsRelaxed', 'tricepsContracted', 1.6, '삼두근 수축이 이완의 몇 배']
        ]
    },
    { file: 'nephron-diagram.svg', title: '네프론' },
    { file: 'villus-diagram.svg', title: '소장 융털' },
    { file: 'stomach-diagram.svg', title: '위' },
    { file: 'alveoli-diagram.svg', title: '폐포' },
    { file: 'gas-two-places.svg', title: '기체 교환 두 곳' },
    { file: 'immunity-diagram.svg', title: '몸의 방어 작용' },
    { file: 'blood-diagram.svg', title: '혈액의 구성' },
    { file: 'glucose-diagram.svg', title: '혈당 조절' },
    { file: 'reflex-arc.svg', title: '반사궁' },
    { file: 'reflex-centers.svg', title: '반사 중추' },
    { file: 'ear-diagram.svg', title: '귀' },
    { file: 'eye-diagram.svg', title: '눈' }
];

var stage = document.createElement('div');
stage.style.cssText = 'position:absolute;left:-9999px;top:0;width:1200px;height:800px';
document.body.appendChild(stage);

function box(svg, id) {
    var e = svg.querySelector('#' + CSS.escape(id));
    if (!e) return null;
    try { var b = e.getBBox(); } catch (err) { return null; }
    return { x: b.x, y: b.y, r: b.x + b.width, b: b.y + b.height,
             cx: b.x + b.width / 2, cy: b.y + b.height / 2, w: b.width, h: b.height };
}

/** 두 조각 사이 틈. 겹치거나 닿으면 0. */
function gap(svg, a, b) {
    var A = box(svg, a), B = box(svg, b);
    if (!A || !B) return null;
    var dx = Math.max(0, Math.max(A.x, B.x) - Math.min(A.r, B.r));
    var dy = Math.max(0, Math.max(A.y, B.y) - Math.min(A.b, B.b));
    return Math.round(Math.hypot(dx, dy) * 10) / 10;
}

/** 축 기울기와 끝점 거리 */
function axisCheck(svg, pathId, oId, iId) {
    var p = svg.querySelector('#' + CSS.escape(pathId));
    var A = box(svg, oId), B = box(svg, iId);
    if (!p || !p.getTotalLength || !A || !B) return null;
    var L = p.getTotalLength(), pts = [];
    for (var i = 0; i <= 60; i++) pts.push(p.getPointAtLength(L * i / 60));
    var best = [null, null, -1];
    for (var i = 0; i < pts.length; i++) for (var j = i + 1; j < pts.length; j++) {
        var d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
        if (d > best[2]) best = [pts[i], pts[j], d];
    }
    var ang = function (ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax) * 180 / Math.PI; };
    var a1 = ang(best[0].x, best[0].y, best[1].x, best[1].y);
    var a2 = ang(A.cx, A.cy, B.cx, B.cy);
    var diff = Math.abs(((a1 - a2 + 540) % 360) - 180); diff = Math.min(diff, 180 - diff);
    var dA = Math.min(Math.hypot(best[0].x - A.cx, best[0].y - A.cy), Math.hypot(best[1].x - A.cx, best[1].y - A.cy));
    var dB = Math.min(Math.hypot(best[0].x - B.cx, best[0].y - B.cy), Math.hypot(best[1].x - B.cx, best[1].y - B.cy));
    // 가장 두꺼운 곳
    var ux = (best[1].x - best[0].x) / best[2], uy = (best[1].y - best[0].y) / best[2];
    var mx = 0, mn = 0;
    pts.forEach(function (q) { var perp = (q.x - best[0].x) * (-uy) + (q.y - best[0].y) * ux;
        if (perp > mx) mx = perp; if (perp < mn) mn = perp; });
    return { 기울기: +diff.toFixed(1), 시작: +dA.toFixed(1), 끝: +dB.toFixed(1),
             길이: Math.round(best[2]), 두께: +(mx - mn).toFixed(1) };
}

var NAMES = {
    leftVentricle: '좌심실', rightVentricle: '우심실',
    leftAtrium: '좌심방', rightAtrium: '우심방',
    vesselAorta: '대동맥', vesselPulmonaryArtery: '폐동맥'
};
function A_name(id) { return NAMES[id] || id; }

function row(name, value, pass, note) {
    return '<tr><td>' + name + '</td><td>' + value +
        '</td><td class="' + (pass ? 'ok' : 'no') + '">' + (pass ? '통과' : '흠') +
        '</td><td class="dim">' + (note || '') + '</td></tr>';
}

async function run() {
    var out = document.getElementById('out');
    for (var spec of SPECS) {
        var html = '<h2>' + spec.title + ' <span class="dim">(' + spec.file + ')</span></h2>';
        var xml;
        try { xml = await fetch(spec.file + '?t=' + Date.now()).then(function (r) {
            if (!r.ok) throw new Error(r.status); return r.text(); }); }
        catch (e) { out.innerHTML += html + '<p class="no">파일을 못 읽음 (' + e.message + ')</p>'; continue; }

        stage.innerHTML = xml;
        var svg = stage.querySelector('svg');
        if (!svg) { out.innerHTML += html + '<p class="no">svg 가 아님</p>'; continue; }

        html += '<table><tr><th>본 것</th><th>값</th><th></th><th>뜻</th></tr>';

        // 공통 규격
        var vb = svg.viewBox.baseVal;
        html += row('viewBox', vb.width + ' × ' + vb.height, vb.width > 0, '');
        var nText = svg.querySelectorAll('text').length;
        html += row('그림 안 글씨 &lt;text&gt;', nText, nText === 0, '0이어야 한다 (이름표는 HTML)');
        var nRad = svg.querySelectorAll('radialGradient').length;
        var nFil = svg.querySelectorAll('filter').length;
        html += row('radialGradient · filter', nRad + ' · ' + nFil, nRad === 0 && nFil === 0, '발광 금지');
        // 그라데이션 밝기 차
        var worst = 0;
        svg.querySelectorAll('linearGradient').forEach(function (g) {
            var stops = [].map.call(g.querySelectorAll('stop'), function (s) {
                return (s.getAttribute('stop-color') || '').trim(); }).filter(function (c) { return c[0] === '#'; });
            var ls = stops.map(function (h) {
                h = h.slice(1); if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
                var r = parseInt(h.slice(0, 2), 16) / 255, g2 = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
                return (Math.max(r, g2, b) + Math.min(r, g2, b)) / 2 * 100; });
            if (ls.length > 1) worst = Math.max(worst, Math.max.apply(null, ls) - Math.min.apply(null, ls));
        });
        html += row('그라데이션 밝기 차', worst.toFixed(1) + '%', worst <= 15, '15% 안 (전에 73%로 형광등처럼 보였다)');
        // 눈금 밖
        var over = [];
        svg.querySelectorAll('[id]').forEach(function (e) {
            try { var b = e.getBBox(); } catch (err) { return; }
            if (!b.width && !b.height) return;
            if (b.x < -1 || b.y < -1 || b.x + b.width > vb.width + 1 || b.y + b.height > vb.height + 1) over.push(e.id);
        });
        html += row('눈금 밖으로 나간 조각', over.length ? over.join(', ') : '없음', over.length === 0, '');

        (spec.touch || []).forEach(function (t) {
            var g = gap(svg, t[0], t[1]);
            html += row(t[0] + ' ↔ ' + t[1], g === null ? '조각 없음' : '틈 ' + g, g === 0, t[2]);
        });

        (spec.between || []).forEach(function (t) {
            var v = box(svg, t[0]), A = box(svg, t[1]), B = box(svg, t[2]);
            if (!v || !A || !B) { html += row(t[0], '조각 없음', false, t[3]); return; }
            // 판막은 두 조각 사이에 있어야 한다 = 두 칸에 모두 닿는다.
            // 가운데끼리 거리로 재면 안 된다. 반달판막은 심방과도 가깝고,
            // 방실판막 묶음에는 아래로 늘어진 힘줄끈이 들어 있어 가운데가 밀린다.
            var dA = gap(svg, t[0], t[1]), dB = gap(svg, t[0], t[2]);
            var pass = dA === 0 && dB === 0;
            html += row(t[0], A_name(t[1]) + '과 틈 ' + dA + ' · ' + A_name(t[2]) + '과 틈 ' + dB,
                pass, t[3] + ' (둘 다 닿아야 한다)');
        });

        (spec.axis || []).forEach(function (t) {
            var a = axisCheck(svg, t[0], t[1], t[2]);
            if (!a) { html += row(t[0], '조각 없음', false, t[3]); return; }
            html += row(t[3] + ' 축 기울기', a.기울기 + '°', a.기울기 <= 5, '5° 안');
            html += row(t[3] + ' 끝점 거리', a.시작 + ' / ' + a.끝, a.시작 <= 8 && a.끝 <= 8, '8 안');
        });

        (spec.thickness || []).forEach(function (t) {
            var a = axisCheck(svg, t[0], spec.axis[0][1], spec.axis[0][2]);
            var b = axisCheck(svg, t[1], spec.axis[0][1], spec.axis[0][2]);
            if (!a || !b) { html += row(t[3], '조각 없음', false, ''); return; }
            var ratio = b.두께 / a.두께;
            html += row(t[3], ratio.toFixed(2) + '배', ratio >= t[2], t[2] + '배 이상이라야 눈에 보인다');
        });

        html += '</table>';
        out.innerHTML += html;
    }
    stage.innerHTML = '';
}

run();
</script>
</body>
</html>
