<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <!-- Clean, subtle LinearGradients (angle ~ 135deg, brightness diff <= 25%, hue diff <= 20deg) -->
    <linearGradient id="autoSpine" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#dfe6ee"/>
      <stop offset="100%" stop-color="#b8c4d2"/>
    </linearGradient>
    <linearGradient id="autoEye" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#d9e6f2"/>
      <stop offset="100%" stop-color="#b0c5dc"/>
    </linearGradient>
    <linearGradient id="autoLung" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#e29aa7"/>
      <stop offset="100%" stop-color="#ba6b79"/>
    </linearGradient>
    <linearGradient id="autoHeart" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#d95d73"/>
      <stop offset="100%" stop-color="#ad3349"/>
    </linearGradient>
    <linearGradient id="autoAdrenal" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#d49b65"/>
      <stop offset="100%" stop-color="#a86e39"/>
    </linearGradient>
    <linearGradient id="autoKidney" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ce8070"/>
      <stop offset="100%" stop-color="#a35545"/>
    </linearGradient>
    <linearGradient id="autoGut" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#cca05c"/>
      <stop offset="100%" stop-color="#9e7333"/>
    </linearGradient>
    <linearGradient id="autoBladder" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#dcbe55"/>
      <stop offset="100%" stop-color="#ad912d"/>
    </linearGradient>
  </defs>

  <!-- 1. Body Contour (FAINT & SUBTLE per fix order: stroke-opacity 0.32) -->
  <path id="bodyOutline" d="
    M 500 35
    C 545 35, 575 65, 575 110
    C 575 145, 555 170, 535 185
    C 590 195, 715 250, 745 340
    C 775 430, 715 540, 685 640
    C 665 700, 605 700, 565 670
    C 545 655, 525 645, 500 645
    C 475 645, 455 655, 435 670
    C 395 700, 335 700, 315 640
    C 285 540, 225 430, 255 340
    C 285 250, 410 195, 465 185
    C 445 170, 425 145, 425 110
    C 425 65, 455 35, 500 35 Z"
    fill="none" stroke="#5b6a80" stroke-width="2.0" stroke-opacity="0.32"/>

  <!-- 2. Central Spine Column (x: 486..514) -->
  <g id="spine">
    <path d="
      M 486 115 L 514 115
      C 516 115, 516 150, 514 150
      L 516 200 L 514 250 L 516 300 L 514 350 L 516 400 L 514 450 L 516 500 L 514 550
      L 508 580 L 500 590 L 492 580
      L 486 550 L 488 500 L 486 450 L 488 400 L 486 350 L 488 300 L 486 250 L 488 200
      L 486 150 Z"
      fill="url(#autoSpine)" stroke="#a8b3c2" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="486" y1="150" x2="514" y2="150" stroke="#a8b3c2" stroke-width="1"/>
    <line x1="486" y1="200" x2="514" y2="200" stroke="#a8b3c2" stroke-width="1"/>
    <line x1="486" y1="250" x2="514" y2="250" stroke="#a8b3c2" stroke-width="1"/>
    <line x1="486" y1="300" x2="514" y2="300" stroke="#a8b3c2" stroke-width="1"/>
    <line x1="486" y1="350" x2="514" y2="350" stroke="#a8b3c2" stroke-width="1"/>
    <line x1="486" y1="400" x2="514" y2="400" stroke="#a8b3c2" stroke-width="1"/>
    <line x1="486" y1="450" x2="514" y2="450" stroke="#a8b3c2" stroke-width="1"/>
    <line x1="486" y1="500" x2="514" y2="500" stroke="#a8b3c2" stroke-width="1"/>
    <line x1="486" y1="550" x2="514" y2="550" stroke="#a8b3c2" stroke-width="1"/>
  </g>

  <!-- 3. Sympathetic Nervous System (Left side, Orange #e8734a, Trunk width 5.5, Branches width 4.0) -->
  <g id="sympathetic" fill="none" stroke="#e8734a" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Sympathetic Trunk (width 5.5, touching spine at connection rami) -->
    <path d="M 486 170 L 436 170 L 436 570 L 486 570" stroke-width="5.5"/>
    <path d="M 486 200 L 436 200" stroke-width="3.5"/>
    <path d="M 486 325 L 436 325" stroke-width="3.5"/>
    <path d="M 486 415 L 436 415" stroke-width="3.5"/>
    <path d="M 486 460 L 436 460" stroke-width="3.5"/>

    <!-- Branches to organs (each stroke-width 4.0, touches organ bounding box) -->
    <path id="symToEye" d="M 436 170 C 420 120, 430 75, 465 70" stroke-width="4.0"/>
    <path id="symToLung" d="M 436 200 L 420 200" stroke-width="4.0"/>
    <path id="symToHeart" d="M 436 325 L 460 325" stroke-width="4.0"/>
    <path id="symToAdrenal" d="M 436 415 L 410 415" stroke-width="4.0"/>
    <path id="symToGut" d="M 436 460 L 448 460" stroke-width="4.0"/>
    <path id="symToBladder" d="M 436 570 C 436 590, 450 595, 470 595" stroke-width="4.0"/>
  </g>

  <!-- 4. Parasympathetic Nervous System (Right side, Teal #4a9d8f, Trunk width 5.5, Branches width 4.0) -->
  <g id="parasympathetic" fill="none" stroke="#4a9d8f" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cranial & Sacral Trunk (width 5.5, touching spine at connection rami) -->
    <path d="M 514 130 L 564 130 L 564 470 L 514 470" stroke-width="5.5"/>
    <path d="M 514 560 L 564 560 L 564 610 L 530 610" stroke-width="5.5"/>
    <path d="M 514 200 L 564 200" stroke-width="3.5"/>
    <path d="M 514 325 L 564 325" stroke-width="3.5"/>

    <!-- Branches to organs (each stroke-width 4.0, touches organ bounding box) -->
    <path id="paraToEye" d="M 564 130 C 580 100, 570 75, 535 70" stroke-width="4.0"/>
    <path id="paraToLung" d="M 564 200 L 580 200" stroke-width="4.0"/>
    <path id="paraToHeart" d="M 564 325 L 555 325" stroke-width="4.0"/>
    <path id="paraToGut" d="M 564 460 L 555 460" stroke-width="4.0"/>
    <path id="paraToBladder" d="M 564 610 L 525 610" stroke-width="4.0"/>
  </g>

  <!-- 5. Organs -->

  <!-- organEye: 76x46 (x: 462..538, y: 47..93) -->
  <g id="organEye">
    <ellipse cx="500" cy="70" rx="38" ry="23" fill="url(#autoEye)" stroke="#9aa5b4" stroke-width="2.2"/>
    <circle cx="500" cy="70" r="14" fill="#4a6fa5" stroke="#365380" stroke-width="1.8"/>
    <circle cx="500" cy="70" r="7" fill="#1e293b"/>
    <path d="M 468 70 C 478 88, 522 88, 532 70" fill="none" stroke="#9aa5b4" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- organLung: 319x125 (x: 340..659, y: 130..255) -->
  <g id="organLung">
    <path d="M 500 125 L 500 150 M 500 150 L 430 175 M 500 150 L 570 175" fill="none" stroke="#bd7a86" stroke-width="3.5" stroke-linecap="round"/>
    <path d="
      M 435 143
      C 390 135, 350 155, 342 190
      C 335 225, 355 250, 395 250
      C 425 250, 442 233, 445 200
      C 448 170, 442 150, 435 143 Z"
      fill="url(#autoLung)" stroke="#bd7a86" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="
      M 565 143
      C 610 135, 650 155, 658 190
      C 665 225, 645 250, 605 250
      C 575 250, 558 233, 555 200
      C 552 170, 558 150, 565 143 Z"
      fill="url(#autoLung)" stroke="#bd7a86" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 410 180 C 385 190, 375 215, 370 235 M 415 200 Q 395 220 395 240" fill="none" stroke="#bd7a86" stroke-width="1.4" opacity="0.6"/>
    <path d="M 590 180 C 615 190, 625 215, 630 235 M 585 200 Q 605 220 605 240" fill="none" stroke="#bd7a86" stroke-width="1.4" opacity="0.6"/>
  </g>

  <!-- organHeart: Anatomical scaled from heart-diagram.svg (106x108, ratio 0.98) -->
  <g id="organHeart">
    <path d="M 457.0 281.9 C 457.0 276.0, 462.5 274.0, 471.1 274.0 L 548.9 274.0 C 557.5 274.0, 563.0 276.0, 563.0 281.9 L 563.0 336.6 C 563.0 364.2, 543.1 380.3, 515.8 382.0 C 485.5 380.3, 457.0 364.2, 457.0 336.6 Z" fill="url(#autoHeart)" stroke="#e88a9a" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- Subtle aorta/pulmonary base contour inside heart base -->
    <path d="M 496 280 C 500 276, 520 276, 524 280" fill="none" stroke="#e88a9a" stroke-width="2.0" stroke-linecap="round"/>
    <!-- Coronary sulcus and ventricle crease -->
    <path d="M 470 315 C 495 342, 528 348, 550 320" fill="none" stroke="#9e2a41" stroke-width="1.6" opacity="0.7"/>
    <path d="M 492 342 C 505 358, 514 368, 516 376" fill="none" stroke="#9e2a41" stroke-width="1.3" opacity="0.6"/>
  </g>

  <!-- organKidney: Supporting kidney under adrenal gland (69x95, x: 350..419, y: 428..523) -->
  <g id="organKidney">
    <path d="
      M 368 430
      C 382 427, 400 426, 412 426
      C 424 445, 418 465, 405 475
      C 418 488, 421 505, 405 520
      C 388 528, 372 522, 365 510
      C 348 485, 348 455, 368 430 Z"
      fill="url(#autoKidney)" stroke="#96513f" stroke-width="2.0" stroke-linejoin="round"/>
    <!-- Kidney surface lobar crease -->
    <path d="M 368 452 C 360 475, 364 498, 380 514" fill="none" stroke="#96513f" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- organAdrenal: Cap-like adrenal sitting directly on top of kidney (x: 366..414, y: 402..431) -->
  <g id="organAdrenal">
    <path d="
      M 368 430
      C 372 408, 395 402, 412 418
      C 413 424, 398 428, 368 430 Z"
      fill="url(#autoAdrenal)" stroke="#b47844" stroke-width="2.0" stroke-linejoin="round"/>
    <path d="M 378 420 Q 392 425 405 418" fill="none" stroke="#b47844" stroke-width="1.2"/>
  </g>

  <!-- organGut: Stomach + Intestine (total size >= 171x138, both filled with url(#autoGut), gap 0) -->
  <g id="organGut">
    <!-- 1. Stomach (upper part: x 448..545, y 398..462) -->
    <path id="stomachPart" d="
      M 485 398
      C 455 395, 442 415, 448 440
      C 455 465, 490 470, 525 455
      C 542 445, 545 422, 528 410
      C 515 402, 502 398, 485 398 Z"
      fill="url(#autoGut)" stroke="#b07c3c" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- 2. Intestine Mass (directly below stomach, filled with url(#autoGut), gap 0, x: 440..612, y: 450..538) -->
    <path id="intestinePart" d="
      M 490 455
      C 515 452, 530 455, 555 460
      C 585 460, 612 472, 612 492
      C 612 515, 580 538, 535 538
      C 490 538, 442 532, 440 505
      C 438 480, 465 462, 490 455 Z"
      fill="url(#autoGut)" stroke="#b07c3c" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Internal intestinal fold lines -->
    <path d="M 460 488 C 485 502, 535 500, 585 485" fill="none" stroke="#b07c3c" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
    <path d="M 475 512 C 505 522, 545 520, 580 508" fill="none" stroke="#b07c3c" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
    <path d="M 470 435 C 488 450, 510 445, 525 430" fill="none" stroke="#b07c3c" stroke-width="1.4" opacity="0.6"/>
  </g>

  <!-- organBladder: 90x85 (x: 455..545, y: 585..670) -->
  <g id="organBladder">
    <path d="
      M 465 600
      C 455 615, 452 645, 475 662
      C 490 672, 510 672, 525 662
      C 548 645, 545 615, 535 600
      C 518 588, 482 588, 465 600 Z"
      fill="url(#autoBladder)" stroke="#bb9c40" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M 475 625 C 495 645, 508 645, 525 625" fill="none" stroke="#bb9c40" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
