<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <!-- 2-stop linearGradients, light from top-left (20% 20% to 80% 80%), brightness diff 12~20%, hue diff <= 2 deg -->
    <linearGradient id="autoSpine" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#e6edf4"/>
      <stop offset="100%" stop-color="#c5d0de"/>
    </linearGradient>
    <linearGradient id="autoEye" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#e2e7ee"/>
      <stop offset="100%" stop-color="#bac5d4"/>
    </linearGradient>
    <linearGradient id="autoLung" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#e8b2bc"/>
      <stop offset="100%" stop-color="#be7b87"/>
    </linearGradient>
    <linearGradient id="autoHeart" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#d7546e"/>
      <stop offset="100%" stop-color="#9e2a41"/>
    </linearGradient>
    <linearGradient id="autoAdrenal" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#e9b080"/>
      <stop offset="100%" stop-color="#bc7e48"/>
    </linearGradient>
    <linearGradient id="autoGut" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#e5b172"/>
      <stop offset="100%" stop-color="#b67f3c"/>
    </linearGradient>
    <linearGradient id="autoBladder" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ecd080"/>
      <stop offset="100%" stop-color="#c29f45"/>
    </linearGradient>
  </defs>

  <!-- 1. Body Outline (Very faint, transparent silhouette so organs stand out) -->
  <path id="bodyOutline" d="
    M 450 18
    C 475 14, 525 14, 550 18
    C 595 28, 605 80, 595 120
    C 588 140, 570 152, 555 162
    C 600 172, 700 190, 735 220
    C 750 240, 735 305, 720 360
    C 705 415, 690 455, 675 490
    C 660 525, 680 560, 695 605
    C 705 645, 690 675, 675 688
    C 655 690, 580 690, 555 688
    C 542 650, 528 610, 514 570
    C 508 555, 492 555, 486 570
    C 472 610, 458 650, 445 688
    C 420 690, 345 690, 325 688
    C 310 675, 295 645, 305 605
    C 320 560, 340 525, 325 490
    C 310 455, 295 415, 280 360
    C 265 305, 250 240, 265 220
    C 300 190, 400 172, 445 162
    C 430 152, 412 140, 405 120
    C 395 80, 405 28, 450 18 Z"
    fill="none" stroke="#5b6a80" stroke-width="1.8" stroke-opacity="0.32" stroke-linejoin="round" stroke-linecap="round" />

  <!-- 2. Spine (Center vertical column) -->
  <g id="spine">
    <path d="
      M 486 115 L 514 115
      C 516 115, 516 150, 514 150
      L 516 200 L 514 250 L 516 300 L 514 350 L 516 400 L 514 450 L 516 500 L 514 550
      L 508 580 L 500 590 L 492 580
      L 486 550 L 488 500 L 486 450 L 488 400 L 486 350 L 488 300 L 486 250 L 488 200
      L 486 150 Z"
      fill="url(#autoSpine)" stroke="#a8b3c2" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="486" y1="150" x2="514" y2="150" stroke="#a8b3c2" stroke-width="1"/>
    <line x1="486" y1="200" x2="514" y2="200" stroke="#a8b3c2" stroke-width="1"/>
    <line x1="486" y1="250" x2="514" y2="250" stroke="#a8b3c2" stroke-width="1"/>
    <line x1="486" y1="300" x2="514" y2="300" stroke="#a8b3c2" stroke-width="1"/>
    <line x1="486" y1="350" x2="514" y2="350" stroke="#a8b3c2" stroke-width="1"/>
    <line x1="486" y1="400" x2="514" y2="400" stroke="#a8b3c2" stroke-width="1"/>
    <line x1="486" y1="450" x2="514" y2="450" stroke="#a8b3c2" stroke-width="1"/>
    <line x1="486" y1="500" x2="514" y2="500" stroke="#a8b3c2" stroke-width="1"/>
    <line x1="486" y1="550" x2="514" y2="550" stroke="#a8b3c2" stroke-width="1"/>
  </g>

  <!-- 3. Sympathetic Nervous System (Left side, Orange #e8734a, Trunk width 5.5, Branches width 4.0) -->
  <g id="sympathetic" fill="none" stroke="#e8734a" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Sympathetic Trunk (width 5.5, touching spine at connection rami) -->
    <path d="M 486 170 L 436 170 L 436 570 L 486 570" stroke-width="5.5"/>
    <path d="M 486 200 L 436 200" stroke-width="3.5"/>
    <path d="M 486 325 L 436 325" stroke-width="3.5"/>
    <path d="M 486 415 L 436 415" stroke-width="3.5"/>
    <path d="M 486 460 L 436 460" stroke-width="3.5"/>

    <!-- Branches to organs (each stroke-width 4.0, touches organ bounding box) -->
    <!-- symToEye: from trunk T1 (436, 170) ascending to eye left edge (465, 70) -->
    <path id="symToEye" d="M 436 170 C 420 120, 430 75, 465 70" stroke-width="4.0"/>

    <!-- symToLung: from trunk (436, 200) to lung left edge (436, 200) -->
    <path id="symToLung" d="M 436 200 L 420 200" stroke-width="4.0"/>

    <!-- symToHeart: from trunk (436, 325) to heart left edge (457, 325) -->
    <path id="symToHeart" d="M 436 325 L 460 325" stroke-width="4.0"/>

    <!-- symToAdrenal: from trunk (436, 415) to adrenal gland right edge (415, 415) -->
    <path id="symToAdrenal" d="M 436 415 L 410 415" stroke-width="4.0"/>

    <!-- symToGut: from trunk (436, 460) to gut left edge (448, 460) -->
    <path id="symToGut" d="M 436 460 L 448 460" stroke-width="4.0"/>

    <!-- symToBladder: from trunk (436, 570) to bladder left-top (470, 595) -->
    <path id="symToBladder" d="M 436 570 C 436 590, 450 595, 470 595" stroke-width="4.0"/>
  </g>

  <!-- 4. Parasympathetic Nervous System (Right side, Teal #4a9d8f, Trunk width 5.5, Branches width 4.0) -->
  <g id="parasympathetic" fill="none" stroke="#4a9d8f" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cranial & Sacral Trunk (width 5.5, touching spine at connection rami) -->
    <path d="M 514 130 L 564 130 L 564 470 L 514 470" stroke-width="5.5"/>
    <path d="M 514 560 L 564 560 L 564 610 L 530 610" stroke-width="5.5"/>
    <path d="M 514 200 L 564 200" stroke-width="3.5"/>
    <path d="M 514 325 L 564 325" stroke-width="3.5"/>

    <!-- Branches to organs (each stroke-width 4.0, touches organ bounding box) -->
    <!-- paraToEye: from cranial outflow (564, 130) to eye right edge (535, 70) -->
    <path id="paraToEye" d="M 564 130 C 580 100, 570 75, 535 70" stroke-width="4.0"/>

    <!-- paraToLung: from vagus nerve (564, 200) to lung right inner edge (580, 200) -->
    <path id="paraToLung" d="M 564 200 L 580 200" stroke-width="4.0"/>

    <!-- paraToHeart: from vagus nerve (564, 325) to heart right edge (560, 325) -->
    <path id="paraToHeart" d="M 564 325 L 555 325" stroke-width="4.0"/>

    <!-- paraToGut: from vagus nerve (564, 460) to gut right inner (560, 460) -->
    <path id="paraToGut" d="M 564 460 L 555 460" stroke-width="4.0"/>

    <!-- paraToBladder: from pelvic splanchnic (530, 610) to bladder right edge (530, 610) -->
    <path id="paraToBladder" d="M 564 610 L 525 610" stroke-width="4.0"/>
  </g>

  <!-- 5. Organs (GENEROUS SIZES per fix-order.md, NOT touching each other) -->

  <!-- organEye: 최소 60x40 -> 80x48 (x: 460..540, y: 46..94) -->
  <g id="organEye">
    <ellipse cx="500" cy="70" rx="38" ry="23" fill="url(#autoEye)" stroke="#9aa5b4" stroke-width="2.2"/>
    <circle cx="500" cy="70" r="14" fill="#4a6fa5" stroke="#365380" stroke-width="1.8"/>
    <circle cx="500" cy="70" r="7" fill="#1e293b"/>
    <path d="M 468 70 C 478 88, 522 88, 532 70" fill="none" stroke="#9aa5b4" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- organLung: 최소 130x110 -> 320x125 (x: 340..660, y: 130..255) -->
  <g id="organLung">
    <!-- Trachea and Bronchial Tree -->
    <path d="M 500 130 L 500 155 M 500 155 L 430 180 M 500 155 L 570 180" fill="none" stroke="#bd7a86" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Left Lung (viewer left, large lobe 105x115: x 340..445, y 140..255) -->
    <path d="
      M 435 148
      C 390 140, 350 160, 342 195
      C 335 230, 355 255, 395 255
      C 425 255, 442 238, 445 205
      C 448 175, 442 155, 435 148 Z"
      fill="url(#autoLung)" stroke="#bd7a86" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Right Lung (viewer right, large lobe 105x115: x 555..660, y 140..255) -->
    <path d="
      M 565 148
      C 610 140, 650 160, 658 195
      C 665 230, 645 255, 605 255
      C 575 255, 558 238, 555 205
      C 552 175, 558 155, 565 148 Z"
      fill="url(#autoLung)" stroke="#bd7a86" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Bronchiole internal textures -->
    <path d="M 410 185 C 385 195, 375 220, 370 240 M 415 205 Q 395 225 395 245" fill="none" stroke="#bd7a86" stroke-width="1.4" opacity="0.6"/>
    <path d="M 590 185 C 615 195, 625 220, 630 240 M 585 205 Q 605 225 605 245" fill="none" stroke="#bd7a86" stroke-width="1.4" opacity="0.6"/>
  </g>

  <!-- organHeart: 최소 90x90 -> 106x110 (x: 457..563, y: 270..380) -->
  <g id="organHeart">
    <path d="
      M 510 290
      C 498 270, 460 275, 460 305
      C 460 338, 495 365, 510 380
      C 525 365, 560 338, 560 305
      C 560 275, 522 270, 510 290 Z"
      fill="url(#autoHeart)" stroke="#e88a9a" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- Aorta Arch Top -->
    <path d="M 502 284 C 496 268, 524 268, 520 282" fill="none" stroke="#e88a9a" stroke-width="2.6"/>
    <!-- Ventricle muscular contour line -->
    <path d="M 478 315 C 495 348, 525 352, 540 322" fill="none" stroke="#9e2a41" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- organAdrenal: 60x45 (x: 355..415, y: 395..440) -->
  <g id="organAdrenal">
    <path d="
      M 360 435
      C 365 408, 400 400, 412 422
      C 410 438, 385 440, 360 435 Z"
      fill="url(#autoAdrenal)" stroke="#b47844" stroke-width="2.0" stroke-linejoin="round"/>
    <path d="M 370 422 Q 388 428 402 420" fill="none" stroke="#b47844" stroke-width="1.2"/>
  </g>

  <!-- organGut: 최소 140x120 -> 190x140 (x: 435..625, y: 395..535) -->
  <g id="organGut">
    <!-- Stomach (upper left/center part of gut: x 445..545, y 395..465) -->
    <path d="
      M 485 398
      C 455 395, 442 415, 448 440
      C 455 465, 490 470, 525 455
      C 542 445, 545 422, 528 410
      C 515 402, 502 398, 485 398 Z"
      fill="url(#autoGut)" stroke="#b07c3c" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Small & Large Intestine Loops (x 465..625, y 445..535) -->
    <path d="
      M 515 460
      C 545 455, 600 460, 615 480
      C 625 498, 605 515, 570 515
      C 525 515, 480 500, 475 520
      C 470 535, 510 538, 555 535
      C 605 532, 622 518, 615 500"
      fill="none" stroke="#b07c3c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 470 435 C 488 450, 510 445, 525 430" fill="none" stroke="#b07c3c" stroke-width="1.4" opacity="0.6"/>
  </g>

  <!-- organBladder: 최소 70x70 -> 90x85 (x: 455..545, y: 585..670) -->
  <g id="organBladder">
    <path d="
      M 465 600
      C 455 615, 452 645, 475 662
      C 490 672, 510 672, 525 662
      C 548 645, 545 615, 535 600
      C 518 588, 482 588, 465 600 Z"
      fill="url(#autoBladder)" stroke="#bb9c40" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M 475 625 C 495 645, 508 645, 525 625" fill="none" stroke="#bb9c40" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
