<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900">
  <defs>
    <!-- Subtle linear gradients (135 deg angle, <=25% brightness diff, <=20deg hue diff) -->
    <linearGradient id="digestMouth" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#f2cfbf"/>
      <stop offset="100%" stop-color="#dc8055"/>
    </linearGradient>
    <linearGradient id="digestStomach" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#db766e"/>
      <stop offset="100%" stop-color="#a13128"/>
    </linearGradient>
    <linearGradient id="digestLiver" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#8a4d42"/>
      <stop offset="100%" stop-color="#341d19"/>
    </linearGradient>
    <linearGradient id="digestGall" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#739e5e"/>
      <stop offset="100%" stop-color="#394e2e"/>
    </linearGradient>
    <linearGradient id="digestPancreas" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ebd16e"/>
      <stop offset="100%" stop-color="#bf9d1a"/>
    </linearGradient>
    <linearGradient id="digestSmall" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#f5c29b"/>
      <stop offset="100%" stop-color="#e97b27"/>
    </linearGradient>
    <linearGradient id="digestLarge" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#c29472"/>
      <stop offset="100%" stop-color="#7e5537"/>
    </linearGradient>
    <linearGradient id="digestRectum" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#b58265"/>
      <stop offset="100%" stop-color="#684632"/>
    </linearGradient>
  </defs>

  <!-- 1. Torso Outline (faint reference line, symmetric, centered at x=350) -->
  <path id="bodyOutline" d="
    M 350 40
    C 380 50, 385 90, 380 120
    C 375 138, 365 145, 355 152
    C 385 160, 480 180, 535 220
    C 545 240, 525 340, 510 410
    C 498 460, 488 500, 492 550
    C 496 600, 510 670, 505 740
    C 500 790, 450 830, 410 855
    C 370 862, 340 840, 320 840
    C 300 840, 270 862, 230 855
    C 190 830, 140 790, 135 740
    C 130 670, 144 600, 148 550
    C 152 500, 142 460, 130 410
    C 115 340,  95 240, 105 220
    C 160 180, 255 160, 285 152
    C 275 145, 265 138, 260 120
    C 255 90, 260 50, 290 40 Z"
    fill="none" stroke="#5b6a80" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.45" />

  <!-- 2. Portal Vein (간문맥: 소장 아래쪽 서너 곳에서 모여 한 줄기(굵기 6)로 간으로 직행) -->
  <g id="portalVein" fill="none" stroke="#8f6d86" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- 주 간문맥 줄기 (굵기 6.0) -->
    <path d="M 315 440 C 300 400, 285 368, 275 338" stroke-width="6.0"/>
    <!-- 소장 장간막 정맥 분기지류 3개 (소장 곳곳에서 모여드는 가지들) -->
    <path d="M 370 490 C 345 470, 325 455, 315 440" stroke-width="3.8"/>
    <path d="M 275 490 C 290 470, 305 455, 315 440" stroke-width="3.8"/>
    <path d="M 335 525 C 330 495, 322 465, 315 440" stroke-width="3.5"/>
  </g>

  <!-- 3. Liver (간: 상단 패임으로 우엽·좌엽 분리, 하단 쐐기형 모서리) -->
  <g id="liver">
    <path d="M 272 238 C 285 232, 315 235, 345 255 C 352 265, 350 285, 340 310 C 325 332, 295 348, 275 348 C 255 348, 235 365, 215 362 C 180 355, 162 325, 168 285 C 172 250, 195 220, 235 222 C 255 223, 265 232, 272 238 Z" fill="url(#digestLiver)" stroke="#6d382f" stroke-width="2" stroke-linejoin="round"/>
    <!-- Lobe fissure / ligament notch line -->
    <path d="M 272 238 C 268 268, 266 308, 275 346" fill="none" stroke="#6d382f" stroke-width="1.3" opacity="0.6"/>
  </g>

  <!-- 4. Gallbladder (쓸개: 간 아래 우측에 매달림) -->
  <g id="gallbladder">
    <path d="
      M 275 335
      C 265 335, 258 348, 262 360
      C 266 372, 282 375, 288 362
      C 292 352, 285 335, 275 335 Z"
      fill="url(#digestGall)" stroke="#517341" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 268 345 Q 275 355 282 345" fill="none" stroke="#517341" stroke-width="0.8"/>
  </g>

  <!-- 5. Mouth & Esophagus -->
  <g id="mouth">
    <ellipse cx="350" cy="70" rx="20" ry="12" fill="url(#digestMouth)" stroke="#c08d79" stroke-width="1.8"/>
    <path d="M 338 70 Q 350 75 362 70" fill="none" stroke="#c08d79" stroke-width="1.2"/>
  </g>

  <g id="esophagus">
    <path d="
      M 342 78 L 358 78
      L 358 245 L 342 245 Z"
      fill="url(#digestMouth)" stroke="#c08d79" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="344" y1="120" x2="356" y2="120" stroke="#c08d79" stroke-width="1" opacity="0.6"/>
    <line x1="344" y1="165" x2="356" y2="165" stroke="#c08d79" stroke-width="1" opacity="0.6"/>
    <line x1="344" y1="210" x2="356" y2="210" stroke="#c08d79" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- 6. Stomach (위) -->
  <g id="stomach">
    <path d="
      M 342 240
      C 342 235, 360 235, 368 240
      C 390 248, 445 265, 455 305
      C 465 345, 430 355, 395 355
      C 365 355, 355 352, 348 350
      L 336 350
      C 334 330, 340 265, 342 240 Z"
      fill="url(#digestStomach)" stroke="#b0524a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 365 260 C 385 278, 415 300, 420 330" fill="none" stroke="#b0524a" stroke-width="1.2" opacity="0.6"/>
    <path d="M 378 275 C 395 295, 410 320, 400 345" fill="none" stroke="#b0524a" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- 7. Pancreas (이자) -->
  <g id="pancreas">
    <path d="
      M 342 365
      C 365 362, 415 362, 442 364
      C 450 368, 450 380, 438 384
      C 405 392, 365 392, 338 384
      C 332 380, 332 368, 342 365 Z"
      fill="url(#digestPancreas)" stroke="#b89a41" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 365 366 L 368 384 M 390 366 L 393 384 M 415 367 L 417 380" fill="none" stroke="#b89a41" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- 8. Duodenum (십이지장) -->
  <g id="duodenum">
    <path d="
      M 348 350
      C 330 350, 314 362, 318 386
      C 322 410, 332 422, 345 422
      L 345 435
      C 318 435, 302 412, 298 380
      C 295 348, 318 334, 348 334 Z"
      fill="url(#digestSmall)" stroke="#c1815a" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- 9. Ducts -->
  <g id="ducts" fill="none" stroke="#7fae8f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path id="bileDuct" d="M 275 360 C 285 370, 300 375, 318 380" />
    <path id="pancreaticDuct" d="M 410 372 L 355 375 L 318 380" />
  </g>

  <!-- 10. Small Intestine (소장: 굵기 24 가는 관, 11번 굽이, 맹장 연결 틈 0) -->
  <g id="smallIntestine">
    <!-- Base border for overlapping tube coils -->
    <path d="M 345 435 C 365 435, 400 440, 420 455 C 440 470, 435 490, 395 490 C 345 490, 285 470, 265 490 C 245 510, 270 530, 320 525 C 380 520, 435 525, 440 550 C 445 575, 400 580, 345 570 C 290 560, 255 575, 255 600 C 255 625, 310 615, 375 615 C 430 615, 435 640, 385 645 C 335 650, 290 630, 255 635 L 226 635" fill="none" stroke="#ba754d" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Main colored intestine tube (width 22) -->
    <path d="M 345 435 C 365 435, 400 440, 420 455 C 440 470, 435 490, 395 490 C 345 490, 285 470, 265 490 C 245 510, 270 530, 320 525 C 380 520, 435 525, 440 550 C 445 575, 400 580, 345 570 C 290 560, 255 575, 255 600 C 255 625, 310 615, 375 615 C 430 615, 435 640, 385 645 C 335 650, 290 630, 255 635 L 226 635" fill="none" stroke="url(#digestSmall)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Intestinal fold crease lines across loops -->
    <path d="
      M 370 448 C 375 458, 385 460, 390 450
      M 418 480 C 410 490, 400 492, 395 480
      M 330 482 C 322 492, 315 492, 310 480
      M 285 520 C 295 530, 305 530, 315 520
      M 370 515 C 380 525, 390 525, 400 515
      M 425 560 C 415 570, 405 572, 398 560
      M 340 562 C 330 572, 320 572, 312 560
      M 275 588 C 282 598, 292 598, 300 588
      M 345 608 C 355 618, 365 618, 375 608
      M 415 628 C 405 638, 395 640, 388 628
      M 320 635 C 310 645, 300 645, 292 635
    " fill="none" stroke="#a6633c" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- 11. Large Intestine (대장: 굵기 40~46의 큰창자, cecum at x=196..240, y=620..665) -->
  <g id="largeIntestine">
    <path d="
      M 196 645
      C 194 625, 194 500, 196 438
      C 198 395, 240 386, 300 386
      L 410 386
      C 470 386, 500 395, 502 438
      C 504 500, 504 620, 492 660
      C 478 700, 430 714, 375 712
      L 344 712
      L 344 672
      L 375 672
      C 420 672, 448 660, 458 640
      C 462 610, 460 505, 458 445
      C 456 428, 440 428, 405 428
      L 295 428
      C 255 428, 242 428, 240 445
      C 238 505, 238 610, 240 635
      C 240 655, 235 665, 226 665
      C 208 665, 196 655, 196 645 Z"
      fill="url(#digestLarge)" stroke="#9a6f4f" stroke-width="2" stroke-linejoin="round"/>
    <line x1="202" y1="480" x2="234" y2="480" stroke="#9a6f4f" stroke-width="1.2"/>
    <line x1="202" y1="530" x2="234" y2="530" stroke="#9a6f4f" stroke-width="1.2"/>
    <line x1="202" y1="580" x2="234" y2="580" stroke="#9a6f4f" stroke-width="1.2"/>
    <line x1="464" y1="480" x2="496" y2="480" stroke="#9a6f4f" stroke-width="1.2"/>
    <line x1="464" y1="530" x2="496" y2="530" stroke="#9a6f4f" stroke-width="1.2"/>
    <line x1="464" y1="580" x2="496" y2="580" stroke="#9a6f4f" stroke-width="1.2"/>
  </g>

  <!-- 12. Rectum (곧창자) -->
  <g id="rectum">
    <path d="
      M 360 690
      L 358 765
      L 342 765
      L 344 690 Z"
      fill="url(#digestRectum)" stroke="#8a5f47" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- 13. Anus (항문) -->
  <g id="anus">
    <path d="
      M 342 765 L 358 765
      L 356 785 L 344 785 Z"
      fill="url(#digestRectum)" stroke="#8a5f47" stroke-width="1.8" stroke-linejoin="round"/>
    <ellipse cx="350" cy="785" rx="7" ry="2.5" fill="none" stroke="#8a5f47" stroke-width="1.2"/>
  </g>
</svg>
