<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="500" height="560">
  <defs>
    <!-- linearGradient stop 2개, 밝기 차 15% 안쪽, 순백(#ffffff) 금지 -->
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dbe3eb"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="lungGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba5d70"/>
      <stop offset="100%" stop-color="#ab5566"/>
    </linearGradient>
    <linearGradient id="lungGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b65a6d"/>
      <stop offset="100%" stop-color="#a75263"/>
    </linearGradient>
    <linearGradient id="tracheaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5d0dc"/>
      <stop offset="100%" stop-color="#d4dde6"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 1. 등뼈 (Spine): 뒤쪽 한가운데 세로로 위치                          -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="spine">
    <!-- C7 마디 -->
    <rect x="238" y="112" width="24" height="14" rx="3" fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- T1 ~ T12 흉추 마디들과 가로돌기 (Transverse processes) -->
    <!-- T1 (130) -->
    <rect x="236" y="126" width="28" height="17" rx="3" fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 236 130 L 227 127 M 264 130 L 273 127" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- T2 (151) -->
    <rect x="236" y="147" width="28" height="18" rx="3" fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 236 151 L 227 148 M 264 151 L 273 148" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- T3 (174) -->
    <rect x="236" y="170" width="28" height="18" rx="3" fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 236 174 L 227 171 M 264 174 L 273 171" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- T4 (197) -->
    <rect x="236" y="193" width="28" height="18" rx="3" fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 236 197 L 227 194 M 264 197 L 273 194" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- T5 (220) -->
    <rect x="235" y="216" width="30" height="18" rx="3" fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 235 220 L 226 217 M 265 220 L 274 217" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- T6 (243) -->
    <rect x="235" y="239" width="30" height="18" rx="3" fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 235 243 L 226 240 M 265 243 L 274 240" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- T7 (265) -->
    <rect x="235" y="262" width="30" height="18" rx="3" fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 235 265 L 226 262 M 265 265 L 274 262" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- T8 ~ T12 하부 흉추 -->
    <rect x="235" y="285" width="30" height="19" rx="3" fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="234" y="307" width="32" height="20" rx="3" fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="234" y="330" width="32" height="20" rx="3" fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="233" y="353" width="34" height="21" rx="3" fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="233" y="377" width="34" height="21" rx="3" fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- 척추 디스크 라인들 -->
    <line x1="237" y1="145" x2="263" y2="145" stroke="#64748b" stroke-width="1.3"/>
    <line x1="237" y1="168" x2="263" y2="168" stroke="#64748b" stroke-width="1.3"/>
    <line x1="237" y1="191" x2="263" y2="191" stroke="#64748b" stroke-width="1.3"/>
    <line x1="236" y1="214" x2="264" y2="214" stroke="#64748b" stroke-width="1.3"/>
    <line x1="236" y1="237" x2="264" y2="237" stroke="#64748b" stroke-width="1.3"/>
    <line x1="236" y1="260" x2="264" y2="260" stroke="#64748b" stroke-width="1.3"/>
    <line x1="235" y1="283" x2="265" y2="283" stroke="#64748b" stroke-width="1.3"/>
    <line x1="235" y1="305" x2="265" y2="305" stroke="#64748b" stroke-width="1.3"/>
    <line x1="234" y1="328" x2="266" y2="328" stroke="#64748b" stroke-width="1.3"/>
    <line x1="234" y1="351" x2="266" y2="351" stroke="#64748b" stroke-width="1.3"/>
    <line x1="233" y1="375" x2="267" y2="375" stroke="#64748b" stroke-width="1.3"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 2. 기관 (Trachea) 및 기관지 (Bronchi)                               -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 오른쪽 기관지 (Right Bronchus): 더 가파르고 짧음 -> (206, 206) -->
  <path id="bronchusR" d="M 244 167 C 236 175, 222 188, 206 206 L 214 212 C 228 196, 242 182, 250 174 Z"
        fill="url(#tracheaGrad)" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 왼쪽 기관지 (Left Bronchus): 더 완만하고 긺 -> (296, 212) -->
  <path id="bronchusL" d="M 256 167 C 266 175, 282 192, 296 212 L 290 217 C 276 198, 260 181, 250 174 Z"
        fill="url(#tracheaGrad)" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 기관 본체: (250, 92) -> (250, 168), 너비 14px (x=243..257) -->
  <g id="trachea">
    <path d="M 243 92 L 257 92 L 257 168 L 243 168 Z" fill="url(#tracheaGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 243 99 Q 250 102 257 99 M 243 107 Q 250 110 257 107 M 243 115 Q 250 118 257 115 M 243 123 Q 250 126 257 123 M 243 131 Q 250 134 257 131 M 243 139 Q 250 142 257 139 M 243 147 Q 250 150 257 147 M 243 155 Q 250 158 257 155 M 243 163 Q 250 166 257 163"
          fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 3. 폐 (Lungs): 오른쪽 3엽(세 갈래), 왼쪽 2엽(두 갈래)                 -->
  <!--    바닥면은 가로막 돔(M 146 372 Q 250 312 354 372)의 곡면과 밀착        -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="lungs">
    <!-- 오른쪽 폐 (Right Lung, 화면 왼쪽 x < 250): 3엽 (위엽, 가운데엽, 아래엽) -->
    <g id="lungRight">
      <!-- 1) 우폐 위엽 (Superior Lobe) -->
      <path d="M 196 136 C 170 136, 140 152, 126 176 C 118 192, 114 208, 112 222 L 174 222 C 202 222, 218 212, 222 194 C 226 176, 220 148, 208 138 C 204 136, 200 136, 196 136 Z"
            fill="url(#lungGradR)" stroke="#f0a8b4" stroke-width="1.5"/>
      <!-- 2) 우폐 가운데엽 (Middle Lobe) -->
      <path d="M 112 224 L 174 224 C 204 224, 218 234, 220 250 L 206 270 C 176 270, 142 266, 114 262 C 112 250, 112 236, 112 224 Z"
            fill="url(#lungGradR)" stroke="#f0a8b4" stroke-width="1.5"/>
      <!-- 3) 우폐 아래엽 (Inferior Lobe): 바닥면이 가로막 경사를 따라 (118, 362) -> (224, 342) 형성 -->
      <path d="M 114 264 C 142 268, 174 272, 206 272 L 222 252 C 226 272, 226 312, 224 342 C 196 344, 154 354, 118 362 C 113 336, 113 296, 114 264 Z"
            fill="url(#lungGradR)" stroke="#f0a8b4" stroke-width="1.5"/>
    </g>

    <!-- 왼쪽 폐 (Left Lung, 화면 오른쪽 x > 250): 2엽 (위엽, 아래엽), 심장패임으로 더 작음 -->
    <g id="lungLeft">
      <!-- 1) 좌폐 위엽 (Superior Lobe): 심장패임(Cardiac notch)으로 안쪽(x=280..286)이 깊게 패임 -->
      <path d="M 304 140 C 308 140, 312 140, 316 142 C 328 152, 356 170, 370 194 C 380 212, 384 236, 382 258 C 380 272, 368 286, 352 294 C 336 294, 318 272, 308 260 C 296 246, 286 230, 280 212 C 276 192, 278 172, 290 152 C 294 144, 299 140, 304 140 Z"
            fill="url(#lungGradL)" stroke="#f0a8b4" stroke-width="1.5"/>
      <!-- 2) 좌폐 아래엽 (Inferior Lobe): 바닥면이 가로막 경사를 따라 (276, 342) -> (382, 362) 형성 -->
      <path d="M 352 296 C 366 288, 378 274, 380 260 C 384 278, 384 316, 382 362 C 346 354, 304 344, 276 342 C 276 322, 278 304, 286 290 C 292 276, 302 264, 308 264 C 316 274, 334 296, 352 296 Z"
            fill="url(#lungGradL)" stroke="#f0a8b4" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 4. 복장뼈 (Sternum): 앞쪽 한가운데 세로로 위치                      -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="sternum">
    <!-- 복장뼈자루 (Manubrium): y=136..168, 쇄골·제1갈비뼈 부착 -->
    <path d="M 242 136 Q 250 138 258 136 L 265 140 C 267 148, 265 158, 262 168 L 238 168 C 235 158, 233 148, 235 140 Z"
          fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="238" y1="168" x2="262" y2="168" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- 복장뼈몸통 (Body of sternum): y=168..278, 갈비뼈 2~7번 결합 -->
    <path d="M 238 168 L 262 168 C 263 190, 263 220, 261 248 C 260 260, 258 270, 256 278 L 244 278 C 242 270, 240 260, 239 248 C 237 220, 237 190, 238 168 Z"
          fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- 복장뼈 마디 음영선 -->
    <line x1="239" y1="195" x2="261" y2="195" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
    <line x1="239" y1="222" x2="261" y2="222" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
    <line x1="240" y1="250" x2="260" y2="250" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
    <!-- 칼돌기 (Xiphoid process): y=278..304 -->
    <path d="M 244 278 L 256 278 L 252 300 L 250 304 L 248 300 Z"
          fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.4"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 5. 갈비뼈 묶음 (Ribs): 갈비뼈 일곱 쌍 (rib1 ... rib7)               -->
  <!--    양쪽 끝이 등뼈와 복장뼈에 완전히 닿아 있음 (틈 0)                -->
  <!--    완벽하게 평행하며 우아한 입체 깊이감 제공                          -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="ribs">
    <g id="rib1">
      <!-- 뒤쪽 갈비뼈 활 (등뼈에서 시작) -->
      <path d="M 244 130 C 212 127, 190 136, 172 138 M 256 130 C 288 127, 310 136, 328 138" fill="none" stroke="#94a3b8" stroke-width="2.8" stroke-linecap="round" opacity="0.55"/>
      <path d="M 244 130 C 212 127, 190 136, 172 138 M 256 130 C 288 127, 310 136, 328 138" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
      <!-- 앞쪽 갈비뼈 활 (복장뼈로 결합) -->
      <path d="M 172 138 C 164 150, 188 146, 239 148 M 328 138 C 336 150, 312 146, 261 148" fill="none" stroke="#94a3b8" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M 172 138 C 164 150, 188 146, 239 148 M 328 138 C 336 150, 312 146, 261 148" fill="none" stroke="#e2e8f0" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <g id="rib2">
      <!-- 뒤쪽 갈비뼈 활 (등뼈에서 시작) -->
      <path d="M 244 151 C 212 148, 164 158, 146 160 M 256 151 C 288 148, 336 158, 354 160" fill="none" stroke="#94a3b8" stroke-width="2.8" stroke-linecap="round" opacity="0.55"/>
      <path d="M 244 151 C 212 148, 164 158, 146 160 M 256 151 C 288 148, 336 158, 354 160" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
      <!-- 앞쪽 갈비뼈 활 (복장뼈로 결합) -->
      <path d="M 146 160 C 138 172, 188 169, 239 171 M 354 160 C 362 172, 312 169, 261 171" fill="none" stroke="#94a3b8" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M 146 160 C 138 172, 188 169, 239 171 M 354 160 C 362 172, 312 169, 261 171" fill="none" stroke="#e2e8f0" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <g id="rib3">
      <!-- 뒤쪽 갈비뼈 활 (등뼈에서 시작) -->
      <path d="M 244 174 C 212 171, 146 181, 128 183 M 256 174 C 288 171, 354 181, 372 183" fill="none" stroke="#94a3b8" stroke-width="2.8" stroke-linecap="round" opacity="0.55"/>
      <path d="M 244 174 C 212 171, 146 181, 128 183 M 256 174 C 288 171, 354 181, 372 183" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
      <!-- 앞쪽 갈비뼈 활 (복장뼈로 결합) -->
      <path d="M 128 183 C 120 195, 188 192, 239 194 M 372 183 C 380 195, 312 192, 261 194" fill="none" stroke="#94a3b8" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M 128 183 C 120 195, 188 192, 239 194 M 372 183 C 380 195, 312 192, 261 194" fill="none" stroke="#e2e8f0" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <g id="rib4">
      <!-- 뒤쪽 갈비뼈 활 (등뼈에서 시작) -->
      <path d="M 244 197 C 212 194, 134 204, 116 206 M 256 197 C 288 194, 366 204, 384 206" fill="none" stroke="#94a3b8" stroke-width="2.8" stroke-linecap="round" opacity="0.55"/>
      <path d="M 244 197 C 212 194, 134 204, 116 206 M 256 197 C 288 194, 366 204, 384 206" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
      <!-- 앞쪽 갈비뼈 활 (복장뼈로 결합) -->
      <path d="M 116 206 C 108 218, 188 215, 239 217 M 384 206 C 392 218, 312 215, 261 217" fill="none" stroke="#94a3b8" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M 116 206 C 108 218, 188 215, 239 217 M 384 206 C 392 218, 312 215, 261 217" fill="none" stroke="#e2e8f0" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <g id="rib5">
      <!-- 뒤쪽 갈비뼈 활 (등뼈에서 시작) -->
      <path d="M 244 220 C 212 217, 126 227, 108 229 M 256 220 C 288 217, 374 227, 392 229" fill="none" stroke="#94a3b8" stroke-width="2.8" stroke-linecap="round" opacity="0.55"/>
      <path d="M 244 220 C 212 217, 126 227, 108 229 M 256 220 C 288 217, 374 227, 392 229" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
      <!-- 앞쪽 갈비뼈 활 (복장뼈로 결합) -->
      <path d="M 108 229 C 100 241, 188 238, 239 240 M 392 229 C 400 241, 312 238, 261 240" fill="none" stroke="#94a3b8" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M 108 229 C 100 241, 188 238, 239 240 M 392 229 C 400 241, 312 238, 261 240" fill="none" stroke="#e2e8f0" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <g id="rib6">
      <!-- 뒤쪽 갈비뼈 활 (등뼈에서 시작) -->
      <path d="M 244 243 C 212 240, 123 250, 105 252 M 256 243 C 288 240, 377 250, 395 252" fill="none" stroke="#94a3b8" stroke-width="2.8" stroke-linecap="round" opacity="0.55"/>
      <path d="M 244 243 C 212 240, 123 250, 105 252 M 256 243 C 288 240, 377 250, 395 252" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
      <!-- 앞쪽 갈비뼈 활 (복장뼈로 결합) -->
      <path d="M 105 252 C 97 264, 188 261, 239 263 M 395 252 C 403 264, 312 261, 261 263" fill="none" stroke="#94a3b8" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M 105 252 C 97 264, 188 261, 239 263 M 395 252 C 403 264, 312 261, 261 263" fill="none" stroke="#e2e8f0" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <g id="rib7">
      <!-- 뒤쪽 갈비뼈 활 (등뼈에서 시작) -->
      <path d="M 244 265 C 212 262, 124 272, 106 274 M 256 265 C 288 262, 376 272, 394 274" fill="none" stroke="#94a3b8" stroke-width="2.8" stroke-linecap="round" opacity="0.55"/>
      <path d="M 244 265 C 212 262, 124 272, 106 274 M 256 265 C 288 262, 376 272, 394 274" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
      <!-- 앞쪽 갈비뼈 활 (복장뼈로 결합) -->
      <path d="M 106 274 C 98 286, 188 283, 239 285 M 394 274 C 402 286, 312 283, 261 285" fill="none" stroke="#94a3b8" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M 106 274 C 98 286, 188 283, 239 285 M 394 274 C 402 286, 312 283, 261 285" fill="none" stroke="#e2e8f0" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 6. 가로막 (Diaphragm): 완전히 내쉰 자세 (위로 볼록한 돔 하나)           -->
  <!--    좌우 끝: (146, 372) · (354, 372)                                 -->
  <!--    규격: stroke="#f59e0b", stroke-width="9", fill="none"           -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <path id="diaphragm" d="M 146 372 Q 250 312 354 372"
        fill="none" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>
</svg>