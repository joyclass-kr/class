<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="gradSclera" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#e8ecf2"/>
      <stop offset="100%" stop-color="#d5dce7"/>
    </linearGradient>
    <linearGradient id="gradChoroid" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#974966"/>
      <stop offset="100%" stop-color="#5d2d3e"/>
    </linearGradient>
    <linearGradient id="gradRetina" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#f5dbb2"/>
      <stop offset="100%" stop-color="#eab661"/>
    </linearGradient>
    <linearGradient id="gradLens" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="100%" stop-color="#ffec9e"/>
    </linearGradient>
    <linearGradient id="gradIris" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#5596be"/>
      <stop offset="100%" stop-color="#346889"/>
    </linearGradient>
    <linearGradient id="gradCornea" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#e1f1f9"/>
      <stop offset="100%" stop-color="#afd8ef"/>
    </linearGradient>
    <linearGradient id="gradOptic" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#f8f1e2"/>
      <stop offset="100%" stop-color="#ebd6a8"/>
    </linearGradient>
  </defs>
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 1. OPTIC NERVE (시각 신경) - Left Inferior Exit                      -->
  <!--    칠: #f1e3c4, 테두리: #c9b48a                                     -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="opticNerve">
    <!-- Optic Disc / Lamina Cribrosa Entry into Retina (시각신경원판 / 사상판) -->
    <path d="M 326,420
             C 338,418 352,416 369,414
             L 369,454
             C 352,458 338,462 328,465 Z"
          fill="#f1e3c4" stroke="#c9b48a" stroke-width="1.4" />
    <!-- Outer Sheath -->
    <path d="M 326,420
             C 275,438 200,470 122,502
             C 105,509 95,524 95,538
             C 95,550 106,560 120,556
             C 192,532 265,498 328,465 Z"
          fill="url(#gradOptic)" stroke="#c9b48a" stroke-width="1.8" />
    <!-- Inner Sheath Shading (납작한 두 번째 그늘색) -->
    <path d="M 327,425
             C 272,444 202,475 125,507
             C 112,513 105,525 105,537
             C 105,546 113,552 124,548
             C 192,525 264,493 327,461 Z"
          fill="#e6d6b3" opacity="0.6" stroke="none" />
    <path d="M 326,423 C 338,421 352,419 365,418 L 365,452 C 352,455 338,459 328,462 Z" fill="#e6d6b3" opacity="0.5" stroke="none" />
    <!-- Axon Fascicle Striations (신경 섬유 다발선) -->
    <g fill="none" stroke="#c9b48a" stroke-width="1.1" stroke-dasharray="10,4">
      <path d="M 327,433 C 267,452 201,483 130,516" />
      <path d="M 327,438 C 265,457 199,488 128,522" />
      <path d="M 326,444 C 263,463 197,494 126,529" />
      <path d="M 326,450 C 261,470 195,501 124,536" />
    </g>
    <!-- Central Retinal Artery & Vein (망막 중심 동맥·정맥) -->
    <path d="M 125,528 C 195,498 262,467 325,441" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 127,532 C 197,502 264,471 326,445" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 2. SCLERA (공막) - Outer Fibrous Tunic                               -->
  <!--    칠: #e8ecf2, 테두리: #9aa5b4                                     -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="scleraLayer">
    <!-- Upper Scleral Shell (from Optic Nerve top to Upper Cornea Limbus at 635, 175) -->
    <path d="M 326,420
             C 295,380 270,305 305,225
             C 342,135 435,110 520,118
             C 568,124 608,144 635,175
             L 635,195
             C 605,165 565,148 518,140
             C 445,130 365,152 328,233
             C 298,304 322,368 348,405 Z"
          fill="url(#gradSclera)" stroke="#9aa5b4" stroke-width="1.5" />
    <!-- Lower Scleral Shell (from Optic Nerve bottom to Lower Cornea Limbus at 635, 525) -->
    <path d="M 328,465
             C 346,515 388,565 448,582
             C 515,600 585,585 628,552
             C 631,544 633,535 635,525
             L 635,505
             C 630,518 625,528 616,536
             C 578,568 515,578 454,562
             C 400,548 362,507 346,467 Z"
          fill="url(#gradSclera)" stroke="#9aa5b4" stroke-width="1.5" />
    <!-- Subtle Posterior Contour Arc to define the outer eyeball curvature -->
    <path d="M 326,420 C 285,375 270,310 290,250 M 328,465 C 338,505 365,545 405,572" fill="none" stroke="#9aa5b4" stroke-width="1.5" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 3. CHOROID (맥락막) - Middle Vascular Tunic                          -->
  <!--    칠: #7a3b52, 테두리: #a15570                                     -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="choroidLayer">
    <!-- Upper Choroid -->
    <path d="M 348,405
             C 322,368 298,304 328,233
             C 365,152 445,130 518,140
             C 565,148 605,165 635,195
             L 630,205
             C 600,178 560,160 515,153
             C 450,144 375,165 342,240
             C 314,305 336,364 360,398 Z"
          fill="#7a3b52" stroke="#a15570" stroke-width="1.2" />
    <!-- Lower Choroid -->
    <path d="M 346,467
             C 362,507 400,548 454,562
             C 515,578 578,568 616,536
             C 625,528 630,518 635,505
             L 630,495
             C 622,508 615,516 605,524
             C 570,552 515,560 458,546
             C 408,534 374,498 358,463 Z"
          fill="#7a3b52" stroke="#a15570" stroke-width="1.2" />
    <!-- Choriocapillaris Micro-Vessels (맥락막 모세혈관망) -->
    <g opacity="0.35" stroke="#a15570" stroke-width="0.8" fill="none">
      <path d="M 348,230 Q 390,205 440,195 T 530,180" />
      <path d="M 380,175 Q 440,160 500,158 T 580,175" />
      <path d="M 385,515 Q 445,535 505,538 T 585,510" />
      <path d="M 410,545 Q 470,555 530,545" />
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 4. VITREOUS (유리체) - Transparent Posterior Cavity Gel              -->
  <!--    칠: #dbeafe (많이 비치게, opacity 0.5 쯤), 테두리: 없음             -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="vitreous">
    <path d="M 625,270
             C 622,250 610,230 596,215
             C 538,155 450,145 355,195
             C 318,242 320,308 325,343
             C 328,368 345,396 366,415
             L 366,455
             C 385,505 435,535 500,538
             C 560,540 598,510 605,485
             C 615,475 622,450 625,430
             C 602,390 602,310 625,270 Z"
          fill="#dbeafe" opacity="0.15" stroke="none" />
    <!-- Cloquet's Canal (유리체관 흔적) -->
    <path d="M 348,435 C 420,415 510,385 607,355 L 607,345 C 510,375 420,405 348,425 Z"
          fill="#bfdbfe" opacity="0.12" />
    <path d="M 348,430 C 425,410 515,380 607,350"
          fill="none" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="5,6" opacity="0.4" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 5. RETINA (망막) - Sensory Tunic                                     -->
  <!--    칠: #f0c98a, 테두리: #d9a35c                                     -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="retina">
    <!-- Upper Sensory Retina -->
    <path d="M 596,215
             C 538,155 450,145 355,195
             C 328,235 320,285 323,332
             L 325,343
             L 326,355
             C 330,378 345,400 366,415
             L 372,410
             C 353,396 339,376 335,355
             L 334,343
             L 332,332
             C 329,288 336,241 361,205
             C 452,158 536,168 592,221 Z"
          fill="#f0c98a" stroke="#d9a35c" stroke-width="1.2" />
    <!-- Lower Sensory Retina -->
    <path d="M 366,455
             C 385,505 435,535 500,538
             C 560,540 598,510 605,485
             L 599,479
             C 594,502 556,530 499,528
             C 438,525 391,497 373,451 Z"
          fill="#f0c98a" stroke="#d9a35c" stroke-width="1.2" />
    <!-- Ora Serrata (톱니둘레) -->
    <path d="M 596,215 Q 598,220 592,221 Q 596,225 590,227" fill="none" stroke="#d9a35c" stroke-width="1.2" />
    <path d="M 605,485 Q 603,480 599,479 Q 603,475 597,473" fill="none" stroke="#d9a35c" stroke-width="1.2" />
    <!-- Retinal Blood Vessels (망막 혈관 가지들) -->
    <g fill="none">
      <path d="M 368,416 C 352,380 348,320 365,260 C 380,208 430,180 492,168" stroke="#dc2626" stroke-width="1.6" />
      <path d="M 360,335 C 380,298 422,248 474,228" stroke="#dc2626" stroke-width="1.1" />
      <path d="M 370,418 C 356,382 352,325 370,265 C 385,213 435,185 497,173" stroke="#2563eb" stroke-width="1.3" />
      <path d="M 368,454 C 385,490 425,515 480,520 C 530,524 570,500 595,480" stroke="#dc2626" stroke-width="1.6" />
      <path d="M 370,457 C 388,493 428,518 483,523 C 533,527 573,503 598,483" stroke="#2563eb" stroke-width="1.3" />
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 6. FOVEA (황반) - Focal Spot on Retina (x=325, y=343)                -->
  <!--    칠: #c2853a, 테두리: 없음                                         -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="fovea">
    <!-- Macula Lutea Zone (황반 구역) -->
    <ellipse cx="327" cy="343" rx="16" ry="24" fill="#c2853a" opacity="0.9" stroke="none" />
    <!-- Foveal Depression Pit (중심 오목 슬로프) -->
    <path d="M 323,330 C 320,336 319,341 319,343 C 319,345 320,350 323,356"
          fill="none" stroke="#a0631f" stroke-width="3" stroke-linecap="round" />
    <!-- Central Focal Spot (시세포 밀집 중심점) -->
    <circle cx="325" cy="343" r="3.5" fill="#884d10" stroke="none" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 7. CILIARY BODY (섬모체) - Ciliary Muscle Wedge & Processes          -->
  <!--    칠: #b06a4a, 테두리: #d19170, 단일 조각                           -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="ciliaryBody">
    <!-- Upper Ciliary Body Wedge -->
    <path d="M 635,175
             C 638,155 630,140 605,150
             C 585,170 585,198 596,215
             C 604,226 616,234 628,238
             L 638,228
             L 642,205 Z"
          fill="#b06a4a" stroke="#d19170" stroke-width="1.3" />
    <!-- Upper Ciliary Processes (섬모체 돌기) -->
    <path d="M 618,224 L 626,236 L 622,240 L 630,246 L 626,250 L 633,254 L 638,228"
          fill="#945538" stroke="#d19170" stroke-width="1" />
    <!-- Lower Ciliary Body Wedge -->
    <path d="M 635,525
             C 638,545 630,560 605,550
             C 585,530 585,502 605,485
             C 612,474 622,466 628,462
             L 638,472
             L 642,495 Z"
          fill="#b06a4a" stroke="#d19170" stroke-width="1.3" />
    <!-- Lower Ciliary Processes (섬모체 돌기) -->
    <path d="M 618,476 L 628,464 L 624,460 L 632,454 L 628,450 L 634,446 L 638,472"
          fill="#945538" stroke="#d19170" stroke-width="1" />
    <!-- Ciliary Muscle Fibers (근섬유 결 음영) -->
    <g stroke="#d19170" stroke-width="0.8" opacity="0.6" fill="none">
      <path d="M 605,165 C 618,182 630,198 638,212" />
      <path d="M 612,160 C 622,176 634,192 640,204" />
      <path d="M 605,535 C 618,518 630,502 638,488" />
      <path d="M 612,540 C 622,524 634,508 640,496" />
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 8. ZONULE (진대) - Suspensory Ligaments (걸이인대)                   -->
  <!--    선만 #cbd5e1, 굵기 2, 단일 조각                                  -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="zonule">
    <!-- Upper Zonule Fibrils connecting Ciliary Processes to Lens Equator (y: 270) -->
    <g stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="622" y1="240" x2="622" y2="272" />
      <line x1="626" y1="236" x2="625" y2="270" />
      <line x1="630" y1="246" x2="628" y2="274" />
      <line x1="626" y1="250" x2="631" y2="278" />
      <line x1="633" y1="254" x2="634" y2="282" />
      <line x1="622" y1="240" x2="628" y2="274" stroke-width="1.2" opacity="0.8" />
      <line x1="630" y1="246" x2="622" y2="272" stroke-width="1.2" opacity="0.8" />
    </g>
    <!-- Lower Zonule Fibrils connecting Ciliary Processes to Lens Equator (y: 430) -->
    <g stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="624" y1="460" x2="622" y2="428" />
      <line x1="628" y1="464" x2="625" y2="430" />
      <line x1="632" y1="454" x2="628" y2="426" />
      <line x1="628" y1="450" x2="631" y2="422" />
      <line x1="634" y1="446" x2="634" y2="418" />
      <line x1="624" y1="460" x2="628" y2="426" stroke-width="1.2" opacity="0.8" />
      <line x1="632" y1="454" x2="622" y2="428" stroke-width="1.2" opacity="0.8" />
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 9. LENS (수정체) - Crystalline Lens (Centered at 625, 350)           -->
  <!--    칠: #fff4c9 (비치게, opacity 0.75), 테두리: #e0c877, 단일 조각    -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="lens" style="transform-origin: 625px 350px;">
    <!-- Lens Capsule & Body -->
    <path d="M 625,270
             C 648,310 648,390 625,430
             C 602,390 602,310 625,270 Z"
          fill="url(#gradLens)" fill-opacity="0.85" stroke="#e0c877" stroke-width="2.2" />
    <!-- Lens Internal Cortex Rings (피질 층상 구조) -->
    <path d="M 625,295
             C 640,322 640,378 625,405
             C 610,378 610,322 625,295 Z"
          fill="none" stroke="#e0c877" stroke-width="1.2" opacity="0.6" />
    <path d="M 625,320
             C 633,332 633,368 625,380
             C 617,368 617,332 625,320 Z"
          fill="none" stroke="#d5be6e" stroke-width="1.0" opacity="0.7" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 10. IRIS (홍채) - Pupil Diaphragm Leaf                               -->
  <!--     칠: #3f7fa6, 테두리: #8fc0d8                                     -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="iris">
    <!-- Upper Iris Leaf -->
    <path d="M 638,228
             C 648,245 660,265 665,278
             L 655,305
             C 648,285 640,260 632,238 Z"
          fill="url(#gradIris)" stroke="#8fc0d8" stroke-width="1.4" />
    <!-- Upper Iris Pupillary Margin & Sphincter Muscle -->
    <ellipse cx="655" cy="305" rx="3.5" ry="4.5" fill="#2d6080" stroke="#8fc0d8" stroke-width="1.2" />
    <path d="M 642,246 C 652,266 660,282 660,296" fill="none" stroke="#8fc0d8" stroke-width="0.9" opacity="0.8" />
    <path d="M 636,240 C 646,258 654,275 656,290" fill="none" stroke="#5a97bc" stroke-width="0.8" opacity="0.6" />
    <!-- Lower Iris Leaf -->
    <path d="M 638,472
             C 648,455 660,435 665,422
             L 655,395
             C 648,415 640,440 632,462 Z"
          fill="url(#gradIris)" stroke="#8fc0d8" stroke-width="1.4" />
    <!-- Lower Iris Pupillary Margin & Sphincter Muscle -->
    <ellipse cx="655" cy="395" rx="3.5" ry="4.5" fill="#2d6080" stroke="#8fc0d8" stroke-width="1.2" />
    <path d="M 642,454 C 652,434 660,418 660,404" fill="none" stroke="#8fc0d8" stroke-width="0.9" opacity="0.8" />
    <path d="M 636,460 C 646,442 654,425 656,410" fill="none" stroke="#5a97bc" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 11. PUPIL (동공) - Aperture Between Iris Margins                     -->
  <!--     칠: #121820, 테두리: 없음, 단일 조각                             -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="pupil" style="transform-origin: 648px 350px;">
    <ellipse cx="648" cy="350" rx="6" ry="45" fill="#121820" stroke="none" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 12. CORNEA (각막) - Transparent Anterior Dome                        -->
  <!--     칠: #cfe8f5 (비치게, opacity 0.55), 테두리: #9ec9de               -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="cornea">
    <!-- Aqueous Humor in Anterior Chamber (전방 방수 구역) -->
    <path d="M 635,195
             C 705,200 755,270 755,350
             C 755,430 705,500 635,505
             C 638,470 635,430 635,350
             C 635,270 638,230 635,195 Z"
          fill="#cfe8f5" fill-opacity="0.25" stroke="none" />
    <!-- Cornea Shell (각막 투명창) -->
    <path d="M 635,175
             C 715,190 770,265 770,350
             C 770,435 715,510 635,525
             L 635,505
             C 700,490 748,425 748,350
             C 748,275 700,210 635,195 Z"
          fill="url(#gradCornea)" fill-opacity="0.65" stroke="#9ec9de" stroke-width="1.8" />
    <!-- Corneoscleral Limbus Transition Zones (각막-공막 이행부) -->
    <ellipse cx="635" cy="185" rx="5" ry="8" fill="#b9dff2" opacity="0.6" stroke="none" />
    <ellipse cx="635" cy="515" rx="5" ry="8" fill="#b9dff2" opacity="0.6" stroke="none" />
  </g>
</svg>
