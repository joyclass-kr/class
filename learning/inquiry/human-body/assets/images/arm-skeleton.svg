<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <!-- Subtle linear gradients: exactly 2 stops, same hue, brightness difference <= 12%, strictly NO #ffffff -->
    <linearGradient id="boneGradHumerus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="boneGradUlna" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="boneGradRadius" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="boneGradScapula" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8c2cf" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="boneGradHand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8c2cf" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- ==================================================== -->
  <!-- 1. SCAPULA (어깨뼈) - 크지 않게 위팔뼈 걸리는 자리 중심 -->
  <!-- ==================================================== -->
  <g id="scapula">
    <!-- 어깨뼈 외측연 및 관절와 본체 -->
    <path d="M 400 86
             C 420 80, 442 82, 458 90
             C 470 96, 482 106, 488 116
             C 490 124, 484 130, 474 134
             C 460 138, 448 132, 440 126
             C 434 122, 428 126, 424 136
             C 418 152, 416 170, 424 182
             C 428 188, 426 194, 420 192
             C 412 188, 404 176, 400 160
             C 394 140, 392 118, 396 98
             C 398 90, 400 86, 400 86 Z"
          fill="url(#boneGradScapula)" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" />

    <!-- 어깨봉우리 (Acromion) - 위팔뼈 머리 위를 아치형으로 덮음 -->
    <path d="M 436 78
             C 454 70, 476 72, 492 82
             C 500 88, 502 96, 494 102
             C 484 108, 472 102, 458 92
             C 448 85, 440 82, 436 78 Z"
          fill="#cbd5e1" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" />

    <!-- 부리돌기 (Coracoid Process) - 앞쪽으로 굽은 돌기 -->
    <path d="M 466 98
             C 478 94, 496 98, 508 108
             C 514 114, 514 122, 506 128
             C 496 132, 488 126, 480 118
             C 474 112, 468 106, 466 98 Z"
          fill="#cbd5e1" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" />

    <!-- 관절와 (Glenoid Cavity) 림 음영 및 연골면 - 절구관절 오목 -->
    <path d="M 444 98
             C 448 112, 448 126, 442 140
             C 438 148, 432 156, 428 162"
          fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 442 102
             C 434 114, 434 130, 440 142
             C 434 138, 430 126, 432 116
             C 434 108, 438 104, 442 102 Z"
          fill="#b8c2cf" stroke="none" />
  </g>

  <!-- ==================================================== -->
  <!-- 2. HUMERUS (위팔뼈) - 한 덩어리 path 하나로 구성     -->
  <!-- ==================================================== -->
  <path id="humerus"
        d="M 468 94
           C 448 94, 436 106, 438 124
           C 440 138, 448 148, 456 154
           L 456 195
           C 453 210, 452 230, 454 255
           L 456 312
           C 450 318, 440 328, 436 338
           C 432 346, 434 356, 442 360
           C 450 364, 456 358, 460 350
           C 462 358, 466 368, 472 370
           C 478 372, 486 368, 490 358
           C 494 366, 502 366, 506 358
           C 510 350, 506 340, 498 332
           C 492 324, 486 314, 484 300
           L 484 240
           C 486 215, 488 190, 486 166
           C 488 152, 496 142, 498 128
           C 500 114, 492 102, 482 98
           C 478 95, 473 94, 468 94 Z"
        fill="url(#boneGradHumerus)" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" />

  <!-- 위팔뼈 세부 묘사 (그늘 및 돌기/오목 윤곽선) -->
  <!-- 위팔뼈 뒤쪽(왼쪽) 그늘 -->
  <path d="M 456 154
           L 456 312
           C 450 318, 440 328, 436 338
           C 432 346, 434 356, 442 360
           C 448 363, 452 359, 456 352
           L 462 310
           L 462 160
           C 459 157, 457 155, 456 154 Z"
        fill="#b8c2cf" stroke="none" opacity="0.6" />

  <!-- 결절사이고랑 (Intertubercular sulcus) - 이두근 힘줄 경로 -->
  <path d="M 482 110 C 480 124, 478 140, 477 156"
        fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- 팔꿈치 오목 (Olecranon fossa) - 팔을 펼 때 팔꿈치머리가 들어가는 오목 -->
  <path d="M 462 334
           C 466 328, 476 328, 480 334
           C 482 342, 478 348, 471 350
           C 464 348, 460 342, 462 334 Z"
        fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.8" />

  <!-- 활차(도르래) 중앙 고랑 -->
  <path d="M 470 344 C 470 354, 471 364, 472 370"
        fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- ==================================================== -->
  <!-- 보이지 않는 회전축 및 기시점 표시                      -->
  <!-- ==================================================== -->
  <circle id="pivotElbow" cx="470" cy="370" r="1" fill="none" stroke="none" />
  <circle id="attachBicepsOrigin" cx="504" cy="160" r="1" fill="none" stroke="none" />
  <circle id="attachTricepsOrigin" cx="432" cy="166" r="1" fill="none" stroke="none" />

  <!-- ==================================================== -->
  <!-- 3. FOREARM GROUP (아래팔 묶음 - 엔진이 통째로 회전)   -->
  <!-- ==================================================== -->
  <g id="forearm">
    <!-- 뼈사이막 (Interosseous membrane) - 노뼈와 자뼈를 잇는 질긴 결합조직 막 -->
    <line x1="454" y1="416" x2="488" y2="424" stroke="#94a3b8" stroke-width="1.5" opacity="0.35" stroke-linecap="round" />
    <line x1="453" y1="438" x2="492" y2="446" stroke="#94a3b8" stroke-width="1.5" opacity="0.35" stroke-linecap="round" />
    <line x1="452" y1="460" x2="496" y2="468" stroke="#94a3b8" stroke-width="1.5" opacity="0.35" stroke-linecap="round" />
    <line x1="451" y1="482" x2="500" y2="490" stroke="#94a3b8" stroke-width="1.5" opacity="0.35" stroke-linecap="round" />
    <line x1="450" y1="504" x2="502" y2="512" stroke="#94a3b8" stroke-width="1.5" opacity="0.35" stroke-linecap="round" />
    <line x1="449" y1="526" x2="501" y2="534" stroke="#94a3b8" stroke-width="1.5" opacity="0.35" stroke-linecap="round" />
    <line x1="448" y1="548" x2="498" y2="556" stroke="#94a3b8" stroke-width="1.5" opacity="0.35" stroke-linecap="round" />
    <line x1="447" y1="570" x2="490" y2="578" stroke="#94a3b8" stroke-width="1.5" opacity="0.35" stroke-linecap="round" />

    <!-- ──────────────────────────────────────── -->
    <!-- ULNA (자뼈 - 뒤쪽/왼쪽)                  -->
    <!-- ──────────────────────────────────────── -->
    <!-- 팔꿈치머리가 위/뒤로 돌출, 도르래패임이 도르래를 감싸며 경첩 작동 -->
    <path id="ulna"
          d="M 436 322
             C 424 326, 418 338, 420 352
             C 422 364, 430 374, 442 380
             C 440 400, 442 450, 442 500
             C 442 540, 440 564, 440 576
             C 438 584, 438 596, 444 602
             C 446 605, 448 612, 447 618
             C 446 622, 450 624, 452 622
             C 456 618, 456 606, 458 598
             C 462 590, 462 580, 460 568
             C 458 540, 458 480, 460 424
             C 462 400, 466 392, 470 384
             C 472 380, 470 376, 464 374
             C 454 370, 446 360, 448 346
             C 449 336, 456 330, 460 326
             C 462 322, 458 318, 452 318
             C 446 318, 440 320, 436 322 Z"
          fill="url(#boneGradUlna)" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" />

    <!-- 자뼈 뒤쪽 그늘 및 윤곽 입체화 -->
    <path d="M 436 322
             C 424 326, 418 338, 420 352
             C 422 364, 430 374, 442 380
             C 440 400, 442 450, 442 500
             C 442 540, 440 564, 440 576
             C 438 584, 438 596, 444 602
             L 448 600
             C 446 580, 448 530, 448 480
             C 448 430, 446 385, 444 376
             C 434 370, 428 358, 430 346
             C 432 334, 438 326, 436 322 Z"
          fill="#b8c2cf" stroke="none" opacity="0.6" />

    <!-- 팔꿈치머리(Olecranon) 후방 능선선 -->
    <path d="M 438 324 C 444 336, 446 352, 444 366"
          fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- ──────────────────────────────────────── -->
    <!-- RADIUS (노뼈 - 앞쪽/오른쪽)               -->
    <!-- ──────────────────────────────────────── -->
    <!-- 원판형 노뼈머리 + 목 + 노뼈거친면(이두근 부착) + 원위 붓돌기 -->
    <path id="radius"
          d="M 482 366
             C 480 366, 480 374, 482 376
             L 486 377
             C 485 384, 484 392, 483 400
             C 480 408, 478 418, 480 430
             C 482 442, 488 450, 492 452
             C 495 454, 498 466, 499 486
             C 502 516, 504 544, 502 568
             C 500 580, 492 592, 484 598
             C 480 600, 482 606, 488 606
             L 512 606
             C 518 606, 524 612, 526 620
             C 528 622, 532 620, 530 614
             C 528 602, 526 590, 522 576
             C 516 544, 514 510, 510 476
             C 508 440, 506 408, 504 394
             C 504 386, 506 380, 508 376
             L 510 376
             C 512 374, 512 366, 510 366
             L 482 366 Z"
          fill="url(#boneGradRadius)" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" />

    <!-- 노뼈머리 원판 관절면 테두리 -->
    <path d="M 482 372 L 510 372" fill="none" stroke="#94a3b8" stroke-width="1.8" />

    <!-- 노뼈거친면 (Radial tuberosity) - 이두근 힘줄 부착 돌기 -->
    <path d="M 482 432
             C 486 428, 494 430, 496 438
             C 498 446, 492 452, 486 452
             C 480 450, 478 440, 482 432 Z"
          fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />

    <!-- 노뼈 내측 음영 -->
    <path d="M 486 377
             L 483 400
             C 480 408, 478 418, 480 430
             L 486 452
             C 490 470, 494 510, 496 550
             L 490 594
             L 484 598
             C 488 590, 494 550, 492 510
             C 490 470, 486 450, 484 430
             C 482 410, 484 390, 486 377 Z"
          fill="#b8c2cf" stroke="none" opacity="0.5" />

    <!-- ──────────────────────────────────────── -->
    <!-- HAND (손뼈 - 간략화된 손목/손허리/손가락뼈) -->
    <!-- ──────────────────────────────────────── -->
    <g id="hand" fill="url(#boneGradHand)" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round">
      <!-- 손목뼈 (Carpals) 8개 정돈된 2열 클러스터 -->
      <path d="M 482 608 C 478 610, 478 618, 482 622 C 488 624, 492 618, 490 610 C 488 606, 484 606, 482 608 Z" />
      <path d="M 494 608 C 492 614, 494 622, 498 624 C 504 624, 508 616, 504 610 C 500 606, 496 606, 494 608 Z" />
      <path d="M 508 612 C 506 618, 508 624, 514 624 C 520 622, 520 614, 516 610 C 512 608, 510 610, 508 612 Z" />
      <path d="M 456 612 C 452 616, 454 624, 460 626 C 466 626, 470 618, 466 612 C 462 608, 458 608, 456 612 Z" />
      <path d="M 468 614 C 466 620, 468 626, 474 628 C 480 628, 482 620, 478 614 C 476 610, 472 610, 468 614 Z" />

      <!-- 손허리뼈 (Metacarpals 1~5) -->
      <!-- 엄지 (제1중수골 - 앞쪽으로 벌어짐) -->
      <path d="M 518 624 C 522 622, 532 630, 538 642 C 542 650, 540 656, 534 654 C 528 650, 520 638, 516 628 Z" />
      <!-- 검지 (제2중수골) -->
      <path d="M 506 628 L 512 668 C 512 672, 506 672, 504 668 L 500 628 Z" />
      <!-- 중지 (제3중수골) -->
      <path d="M 492 628 L 494 674 C 494 678, 488 678, 486 674 L 486 628 Z" />
      <!-- 약지 (제4중수골) -->
      <path d="M 478 628 L 476 670 C 476 674, 470 674, 470 670 L 472 628 Z" />
      <!-- 소지 (제5중수골) -->
      <path d="M 464 628 L 458 664 C 458 668, 452 666, 454 662 L 460 628 Z" />

      <!-- 손가락뼈 (Phalanges) -->
      <!-- 엄지 지골 (2마디) -->
      <path d="M 536 654 C 542 662, 548 672, 552 678 C 554 682, 548 684, 544 680 C 540 674, 534 664, 532 658 Z" />
      <!-- 검지 지골 -->
      <path d="M 510 670 L 514 694 C 514 698, 508 698, 506 694 L 504 670 Z" />
      <!-- 중지 지골 -->
      <path d="M 492 676 L 492 702 C 492 706, 486 706, 486 702 L 486 676 Z" />
      <!-- 약지 지골 -->
      <path d="M 474 672 L 472 696 C 472 700, 466 700, 466 696 L 468 672 Z" />
      <!-- 소지 지골 -->
      <path d="M 456 664 L 450 686 C 450 690, 444 688, 446 684 L 452 664 Z" />
    </g>

    <!-- ──────────────────────────────────────── -->
    <!-- 동적 힘줄 부착점 (아래팔 묶음 내부)       -->
    <!-- ──────────────────────────────────────── -->
    <circle id="attachBicepsInsertion" cx="490" cy="444" r="1" fill="none" stroke="none" />
    <circle id="attachTricepsInsertion" cx="436" cy="330" r="1" fill="none" stroke="none" />
  </g>
</svg>