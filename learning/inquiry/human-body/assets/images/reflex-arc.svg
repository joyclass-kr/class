<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <style>
      /* 2D Flat Standard Korean Science Textbook / Exam Paper Schematic Style */
      .arm-outline { fill: #1e293b; fill-opacity: 0.35; stroke: #64748b; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
      .arm-crease { fill: none; stroke: #64748b; stroke-width: 2.0; stroke-linecap: round; }
      
      .stimulus-head { fill: #f59e0b; stroke: #b45309; stroke-width: 2.4; stroke-linejoin: round; }
      .stimulus-pin { fill: #cbd5e1; stroke: #94a3b8; stroke-width: 2.4; stroke-linecap: round; }
      .stimulus-spark { fill: none; stroke: #f59e0b; stroke-width: 2.2; stroke-linecap: round; }
      
      .receptor-skin { fill: #38bdf8; stroke: #0284c7; stroke-width: 2.4; }
      
      .s-neuron { fill: none; stroke: #38bdf8; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .s-soma { fill: #38bdf8; stroke: #0284c7; stroke-width: 2.6; }
      .s-nucleus { fill: #0369a1; }
      
      .white-matter { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 2.8; stroke-linejoin: round; stroke-linecap: round; }
      .gray-matter { fill: #94a3b8; stroke: #64748b; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
      
      .inter-neuron { fill: #a855f7; stroke: #7c3aed; stroke-width: 2.6; stroke-linejoin: round; }
      .inter-line { fill: none; stroke: #a855f7; stroke-width: 3.2; stroke-linecap: round; }
      
      .m-neuron { fill: none; stroke: #f43f5e; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .m-soma { fill: #f43f5e; stroke: #be123c; stroke-width: 2.6; stroke-linejoin: round; }
      .m-nucleus { fill: #9f1239; }
      
      .effector-muscle { fill: #fb7185; stroke: #e11d48; stroke-width: 2.8; stroke-linejoin: round; }
      .muscle-tendon { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: 2.2; }
      .muscle-striation { fill: none; stroke: #fda4af; stroke-width: 1.6; stroke-linecap: round; opacity: 0.7; }
      
      .synapse-ring { fill: none; stroke: #facc15; stroke-width: 2.4; stroke-dasharray: 4,3; }
      .synapse-dot { fill: #facc15; stroke: #ca8a04; stroke-width: 1.5; }
      
      .brain-shape { fill: #c4b5fd; stroke: #7c3aed; stroke-width: 2.8; stroke-linejoin: round; }
      .brain-fissure { fill: none; stroke: #7c3aed; stroke-width: 2.2; stroke-linecap: round; }
      
      .tract-line { fill: none; stroke-width: 2.0; stroke-dasharray: 6,6; stroke-linecap: round; }
    </style>
  </defs>

  <!-- ================================================================= -->
  <!-- 1. CEREBRUM (대뇌) - 위쪽에 작고 명확하게                          -->
  <!-- ================================================================= -->
  <g id="brain">
    <!-- Cerebrum Hemispheric Contour -->
    <path class="brain-shape"
          d="M 455,150
             C 430,132 430,85 465,60
             C 500,38 565,38 595,65
             C 620,88 615,130 585,150
             C 550,156 490,156 455,150 Z" />

    <!-- Cerebral Sulci / Gyri (대뇌 겉질 주름) -->
    <path class="brain-fissure" d="M 475,70 C 495,84 522,80 545,68" />
    <path class="brain-fissure" d="M 452,105 C 480,116 515,102 546,112 C 570,120 592,106 605,92" />
    <path class="brain-fissure" d="M 485,135 C 510,126 538,130 560,144" />

    <!-- Sensory Area (감각령: 두정엽 뒤중심회) Marker -->
    <circle cx="545" cy="85" r="7.5" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
    <!-- Motor Area (운동령: 전두엽 앞중심회) Marker -->
    <circle cx="515" cy="85" r="7.5" fill="#f43f5e" stroke="#be123c" stroke-width="2" />
  </g>

  <!-- Conscious Pathway Visible Tracks (척수 ↔ 대뇌 연결 신경로: 의식적 반응 경로) -->
  <g opacity="0.65">
    <!-- Ascending Track (척수 후각 ➔ 대뇌 감각령) -->
    <path class="tract-line" stroke="#38bdf8"
          d="M 730,345 C 690,260 610,165 545,94" />
    <!-- Descending Track (대뇌 운동령 ➔ 척수 전각) -->
    <path class="tract-line" stroke="#f43f5e"
          d="M 515,94 C 570,180 660,280 735,445" />
    <!-- Arrowhead to Brain -->
    <polygon points="545,94 552,102 540,103" fill="#38bdf8" />
    <!-- Arrowhead from Brain to Spinal Cord -->
    <polygon points="735,445 728,435 740,438" fill="#f43f5e" />
  </g>

  <!-- ================================================================= -->
  <!-- 2. SPINAL CORD CROSS SECTION (척수 단면)                           -->
  <!--    가운데 오른쪽: 바깥 백질, 안쪽 나비 모양 회백질                 -->
  <!-- ================================================================= -->

  <!-- Spinal Cord White Matter (spinalCord: 척수 바깥 백질) -->
  <g id="spinalCord">
    <!-- Smooth Transverse Contour with Anatomical Dorsal (Ganglionic) & Ventral Roots -->
    <path class="white-matter"
          d="M 780,280
             C 845,280 925,320 925,400
             C 925,480 845,520 780,520
             C 745,520 710,500 680,480
             L 590,485
             C 575,487 568,478 568,468
             C 568,458 575,450 590,450
             L 668,442
             C 676,420 676,380 668,358
             L 595,350
             C 585,350 545,352 542,320
             C 540,296 575,296 595,302
             L 680,320
             C 710,300 745,280 780,280 Z" />

    <!-- Anterior (Ventral) Median Fissure (전정중열: 배쪽 깊은 고랑) -->
    <path d="M 776,520 L 776,462 C 776,458 784,458 784,462 L 784,520" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
    <!-- Posterior (Dorsal) Median Sulcus (후정중구: 등쪽 얕은 틈) -->
    <path d="M 780,280 L 780,335" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3" />
  </g>

  <!-- Spinal Cord Gray Matter (grayMatter: 안쪽 나비 모양 회백질) -->
  <g id="grayMatter">
    <!-- Classic Butterfly / H-Shaped Gray Matter -->
    <path class="gray-matter"
          d="M 780,388
             C 768,382 752,370 740,344
             C 732,328 720,330 715,340
             C 710,352 720,368 734,385
             C 744,396 742,406 734,416
             C 718,432 708,448 715,460
             C 722,472 738,468 750,452
             C 762,434 772,416 780,412
             C 788,416 798,434 810,452
             C 822,468 838,472 845,460
             C 852,448 842,432 826,416
             C 818,406 816,396 826,385
             C 840,368 850,352 845,340
             C 840,330 828,328 820,344
             C 808,370 792,382 780,388 Z" />

    <!-- Central Canal (중심관) -->
    <circle cx="780" cy="400" r="5" fill="#475569" stroke="#334155" stroke-width="1.5" />
  </g>

  <!-- ================================================================= -->
  <!-- 3. INTERNEURON (연합 뉴런) - 척수 회백질 안, 짧고 통통함           -->
  <!-- ================================================================= -->
  <g id="interneuron">
    <!-- Interneuron Cell Body (Soma) in Dorsal/Intermediate Gray Matter -->
    <circle cx="738" cy="375" r="11.5" class="inter-neuron" />
    <circle cx="738" cy="375" r="4.8" fill="#581c87" />

    <!-- Interneuron Dendrites (가지돌기) receiving at Synapse A -->
    <path class="inter-line" d="M 730,368 L 722,358 M 734,364 L 728,352 M 742,364 L 742,350" />

    <!-- Short Interneuron Axon descending to Ventral Horn -->
    <path class="inter-line" d="M 738,386 C 738,404 734,420 734,435" />

    <!-- Interneuron Axon Terminals contacting Motor Soma at Synapse B -->
    <circle cx="731" cy="436" r="3.2" class="inter-neuron" />
    <circle cx="737" cy="436" r="3.2" class="inter-neuron" />
  </g>

  <!-- Synapse A (synapseA: 감각 뉴런 ↔ 연합 뉴런 만나는 곳) -->
  <g id="synapseA">
    <ellipse cx="726" cy="352" rx="14" ry="10" class="synapse-ring" />
    <circle cx="726" cy="352" r="3.2" class="synapse-dot" />
  </g>

  <!-- Synapse B (synapseB: 연합 뉴런 ↔ 운동 뉴런 만나는 곳) -->
  <g id="synapseB">
    <ellipse cx="734" cy="438" rx="14" ry="10" class="synapse-ring" />
    <circle cx="734" cy="438" r="3.2" class="synapse-dot" />
  </g>

  <!-- ================================================================= -->
  <!-- 4. MOTOR NEURON (운동 뉴런)                                       -->
  <!--    ★ 시험 포인트: 세포체는 척수 회백질(전각) 안에 있음              -->
  <!-- ================================================================= -->
  <g id="motorNeuron">
    <!-- Motor Neuron Multipolar Cell Body (전각 내부 다극 신경세포체) -->
    <polygon points="738,444 750,448 752,460 742,466 730,460 730,448" class="m-soma" />
    <circle cx="741" cy="454" r="4.5" class="m-nucleus" />

    <!-- Motor Dendrites (회백질 내 가지돌기) -->
    <path class="m-neuron" stroke-width="2.2"
          d="M 734,444 L 732,438 M 744,444 L 746,438 M 751,450 L 758,448" />

    <!-- Long Motor Axon exiting via Ventral Root (전근) to Arm Muscle -->
    <path class="m-neuron"
          d="M 738,464
             C 725,480 685,475 640,468
             C 580,458 500,452 420,460
             C 380,465 355,475 330,488" />

    <!-- Motor Axon Terminal Branches & Motor End-Plates on Effector Muscle -->
    <path class="m-neuron" stroke-width="2.2"
          d="M 330,488 L 308,480 M 330,488 L 312,495 M 330,488 L 318,510" />
    <circle cx="306" cy="480" r="4" fill="#f43f5e" stroke="#be123c" stroke-width="1.5" />
    <circle cx="310" cy="495" r="4" fill="#f43f5e" stroke="#be123c" stroke-width="1.5" />
    <circle cx="316" cy="510" r="4" fill="#f43f5e" stroke="#be123c" stroke-width="1.5" />
  </g>

  <!-- ================================================================= -->
  <!-- 5. ARM SILHOUETTE & EFFECTOR MUSCLE (팔 윤곽 & 반응기 근육)        -->
  <!-- ================================================================= -->

  <!-- Arm Outline (arm: 팔 윤곽 - 손가락, 손, 손목, 전완, 팔꿈치, 상완) -->
  <g id="arm">
    <!-- Natural Bent Arm Posture (굴곡 반사 도식) -->
    <path class="arm-outline"
          d="M 285,410
             C 320,425 355,445 375,475
             C 395,505 405,535 440,560
             C 452,568 456,580 448,590
             C 438,602 410,612 360,615
             C 300,618 250,610 215,600
             C 175,590 145,595 125,602
             L 100,608
             C 92,610 88,604 94,598
             C 106,586 122,572 150,560
             C 180,548 208,542 235,540
             C 275,538 310,518 325,490
             C 340,460 325,435 295,420
             C 285,415 280,412 285,410 Z" />

    <!-- Forearm Crease & Details -->
    <path class="arm-crease" d="M 335,505 C 348,518 360,528 375,532" />
    <path class="arm-crease" d="M 125,602 C 132,608 140,612 150,610" />
  </g>

  <!-- Effector Muscle (effector: 팔 근육 / 상완이두근 - 반응기) -->
  <g id="effector">
    <!-- Upper & Lower Tendons (힘줄: 건) -->
    <path class="muscle-tendon" d="M 315,445 L 300,458 L 308,468 L 324,455 Z" />
    <path class="muscle-tendon" d="M 360,515 L 345,528 L 352,538 L 368,525 Z" />

    <!-- Biceps Muscle Belly (상완이두근 방추형 근육) -->
    <path class="effector-muscle"
          d="M 308,460
             C 335,445 365,465 372,492
             C 378,520 355,535 338,530
             C 310,522 295,498 302,475
             C 305,466 306,462 308,460 Z" />

    <!-- Striated Muscle Fibers (근섬유 가로무늬) -->
    <path class="muscle-striation" d="M 322,468 C 334,484 330,504 316,518" />
    <path class="muscle-striation" d="M 334,474 C 346,490 342,510 328,524" />
    <path class="muscle-striation" d="M 346,482 C 356,498 352,516 340,528" />
  </g>

  <!-- ================================================================= -->
  <!-- 6. STIMULUS & RECEPTOR (압정 & 손끝 감각기)                        -->
  <!-- ================================================================= -->

  <!-- Stimulus (stimulus: 뾰족한 압정) -->
  <g id="stimulus">
    <!-- Thumbtack Head Flange Base -->
    <path class="stimulus-head" d="M 48,648 L 82,626 L 94,644 L 60,666 Z" />
    <ellipse cx="54" cy="657" rx="15" ry="7.5" transform="rotate(-33 54 657)" fill="#d97706" stroke="#b45309" stroke-width="2.2" />
    <!-- Sharp Pin / Needle Point touching fingertip at (98, 608) -->
    <path class="stimulus-pin" d="M 70,634 L 98,608 L 78,629 Z" />
    <!-- Sharp Pain Impact Radiating Sparks -->
    <path class="stimulus-spark" d="M 98,600 L 98,592 M 88,604 L 80,600 M 106,604 L 114,600 M 92,616 L 86,624" />
  </g>

  <!-- Receptor (receptor: 손끝 피부의 감각기 / 통각 수용기) -->
  <g id="receptor">
    <!-- Sensory Receptor Terminal in Dermis -->
    <ellipse cx="106" cy="605" rx="8" ry="6" class="receptor-skin" />
    <!-- Dendritic Sensory Nerve Endings -->
    <path class="s-neuron" stroke-width="2.2"
          d="M 102,605 L 98,608 M 106,601 L 101,599 M 106,608 L 101,611" />
    <circle cx="106" cy="605" r="2.5" fill="#ffffff" />
  </g>

  <!-- ================================================================= -->
  <!-- 7. SENSORY NEURON & GANGLION (감각 뉴런 & 등쪽 신경절)             -->
  <!--    ★ 시험 포인트: 감각 뉴런 세포체는 척수 바깥 등쪽 신경절에 위치   -->
  <!-- ================================================================= -->

  <!-- Sensory Ganglion (sensoryGanglion: 척수 바깥 등쪽 신경절 속 신경세포체) -->
  <g id="sensoryGanglion">
    <!-- Pseudo-unipolar Round Cell Body nestled inside the dorsal root ganglion -->
    <circle cx="568" cy="320" r="13" class="s-soma" />
    <circle cx="568" cy="320" r="5" class="s-nucleus" />
    <circle cx="566" cy="318" r="2" fill="#bae6fd" />
    <!-- T-junction stem connecting soma to main axon -->
    <path class="s-neuron" stroke-width="2.8" d="M 568,333 L 568,338" />
  </g>

  <!-- Sensory Neuron Overall (sensoryNeuron: 감각 뉴런 전체) -->
  <g id="sensoryNeuron">
    <!-- Peripheral Axon from Receptor along Arm to Dorsal Root Ganglion -->
    <path class="s-neuron"
          d="M 106,605
             C 140,580 190,545 250,510
             C 330,460 420,400 495,360
             C 525,345 546,338 568,338" />

    <!-- Central Axon from Ganglion entering Spinal Cord via Dorsal Root (후근) -->
    <path class="s-neuron"
          d="M 568,338
             C 610,338 650,342 685,348
             C 700,350 714,351 726,352" />

    <!-- Sensory Axon Terminals at Synapse A -->
    <path class="s-neuron" stroke-width="2.2"
          d="M 726,352 L 722,345 M 726,352 L 730,346 M 726,352 L 726,358" />
    <circle cx="722" cy="345" r="2.8" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2" />
    <circle cx="730" cy="346" r="2.8" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2" />
    <circle cx="726" cy="358" r="2.8" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2" />
  </g>

  <!-- ================================================================= -->
  <!-- 8. INVISIBLE FLOW GUIDE PATHS (stroke="none" fill="none")         -->
  <!--    신호가 지나갈 길: path 시작점이 출발점!                          -->
  <!-- ================================================================= -->

  <!-- #flowSensory : 감각기 → 감각 뉴런 → 척수 회백질 -->
  <path id="flowSensory" fill="none" stroke="none"
        d="M 106,605
           C 140,580 190,545 250,510
           C 330,460 420,400 495,360
           C 525,345 546,338 568,338
           C 610,338 650,342 685,348
           C 700,350 714,351 726,352" />

  <!-- #flowRelay : 회백질 안에서 연합 뉴런을 지나 운동 뉴런 시작점까지 -->
  <path id="flowRelay" fill="none" stroke="none"
        d="M 726,352
           C 730,360 738,366 738,375
           C 738,395 734,415 734,435
           C 734,442 738,448 741,454" />

  <!-- #flowMotor : 척수 → 운동 뉴런 → 팔 근육 -->
  <path id="flowMotor" fill="none" stroke="none"
        d="M 741,454
           C 725,480 685,475 640,468
           C 580,458 500,452 420,460
           C 380,465 355,475 330,488
           L 310,495" />

  <!-- #flowToBrain : 척수 → 대뇌 -->
  <path id="flowToBrain" fill="none" stroke="none"
        d="M 726,352
           C 725,315 675,235 595,160
           C 572,135 552,112 545,85" />

  <!-- #flowFromBrain : 대뇌 → 척수 -->
  <path id="flowFromBrain" fill="none" stroke="none"
        d="M 515,85
           C 535,130 595,225 665,325
           C 702,380 728,422 741,454" />
</svg>
