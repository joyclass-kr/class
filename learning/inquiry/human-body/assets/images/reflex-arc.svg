<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <!--
    반사궁 도식 (자극 → 감각기 → 감각 뉴런 → 척수 → 운동 뉴런 → 반응기)

    이 그림은 나중에 더 나은 그림으로 통째로 갈아 끼울 수 있게 만들었다.
    갈아 끼울 때 지켜야 할 약속:
      1) viewBox 는 "0 0 1000 700"
      2) 글자(<text>)를 넣지 않는다. 이름표는 코드가 붙인다.
      3) 아래 id 를 그대로 쓴다:
         stimulus arm receptor sensoryNeuron sensoryGanglion
         spinalCord grayMatter interneuron motorNeuron effector brain
         synapseA synapseB
      4) 보이지 않는 안내선 다섯 개를 남긴다 (신호가 지나갈 길):
         flowSensory flowRelay flowMotor flowToBrain flowFromBrain
         path 의 시작점이 신호의 출발점이 되도록 차례대로 그린다.
      5) 채우기는 단색. 코드가 색을 바꾸므로 그라데이션·발광은 쓰지 않는다.

    시험에 나오는 대목:
      감각 뉴런의 세포체는 척수 <바깥> 신경절에 있다.
      운동 뉴런의 세포체는 척수 회백질 <안>에 있다.
      무조건 반사는 대뇌를 거치지 않아 빠르다.
  -->

  <defs>
    <style>
      .outline  { stroke: #64748b; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
      .nerve    { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .soma     { stroke: #0f172a; stroke-width: 2.4; }
      .dendrite { fill: none; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <!-- ── 팔과 자극 ───────────────────────────────────────────── -->
  <g id="arm">
    <!-- 팔뚝: 굵은 선으로 그린다 (style 로 적어야 <style> 규칙에 안 먹힌다) -->
    <path d="M540 640 L320 594 L186 556" fill="none"
          style="stroke:#475569; stroke-width:54; stroke-linecap:round; stroke-linejoin:round"/>
    <path d="M540 640 L320 594 L186 556" fill="none"
          style="stroke:#94a3b8; stroke-width:2.6; fill:none" opacity="0"/>
    <!-- 손 -->
    <path d="M190 560 C160 548 132 546 116 556 C100 566 106 582 126 588
             C148 592 176 586 194 578 Z"
          style="fill:#475569; stroke:#94a3b8; stroke-width:2.6; stroke-linejoin:round"/>
    <!-- 집게손가락 -->
    <path d="M124 560 L98 570" fill="none"
          style="stroke:#475569; stroke-width:17; stroke-linecap:round"/>
  </g>

  <!-- 압정 (자극) -->
  <g id="stimulus">
    <path fill="#f43f5e" stroke="#881337" stroke-width="2.2"
          d="M68 618 L104 618 L86 592 Z"/>
    <ellipse cx="86" cy="624" rx="26" ry="8" fill="#fb7185" stroke="#881337" stroke-width="2.2"/>
  </g>

  <!-- 감각기 (손끝 피부의 수용기) -->
  <circle id="receptor" cx="106" cy="566" r="15" fill="#38bdf8" stroke="#0369a1" stroke-width="2.6"/>

  <!-- ── 반응기 (팔 근육) ────────────────────────────────────── -->
  <g id="effector">
    <path fill="#fb7185" stroke="#9f1239" stroke-width="2.6"
          d="M272 586 C308 564 366 572 408 592 C366 618 306 620 272 608 Z"/>
    <path fill="none" stroke="#9f1239" stroke-width="1.8" opacity="0.7"
          d="M296 586 C328 578 364 582 392 592 M292 600 C324 596 360 600 388 604"/>
  </g>

  <!-- ── 척수 가로 단면 ─────────────────────────────────────── -->
  <ellipse id="spinalCord" cx="790" cy="360" rx="148" ry="126"
           fill="#f1f5f9" stroke="#64748b" stroke-width="3.4"/>

  <!-- 회백질 (나비 모양). 등쪽 뿔이 위, 배쪽 뿔이 아래 -->
  <g id="grayMatter">
    <!-- 등쪽 뿔 둘(가늘다) + 가운데 가로다리 -->
    <path d="M748 292 L766 348 M832 292 L814 348 M764 358 L816 358"
          fill="none" stroke="#64748b" stroke-width="23"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 배쪽 뿔 둘(굵다) -->
    <path d="M742 428 L766 372 M838 428 L814 372"
          fill="none" stroke="#64748b" stroke-width="33"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 척수에서 대뇌로 올라가는 길 (뇌줄기) -->
  <path id="brainStem" fill="#cbd5e1" stroke="#64748b" stroke-width="2.6" stroke-linejoin="round"
        d="M762 246 C766 220 770 200 774 182 L812 182 C812 202 806 224 802 250 Z"/>

  <!-- ── 감각 뉴런 (파랑) ───────────────────────────────────── -->
  <g id="sensoryNeuron">
    <path class="nerve" stroke="#38bdf8" d="M112 560 C244 578 384 606 524 632"/>
    <path class="nerve" stroke="#38bdf8" d="M524 632 C580 578 606 508 618 448"/>
    <path class="nerve" stroke="#38bdf8" d="M652 400 C688 378 726 350 754 326"/>
    <!-- 축삭 말단 -->
    <circle cx="756" cy="325" r="9" fill="#38bdf8" stroke="#0369a1" stroke-width="2"/>
  </g>

  <!-- 감각 뉴런의 세포체 = 척수 바깥 신경절 -->
  <g id="sensoryGanglion">
    <circle class="soma" cx="630" cy="420" r="26" fill="#7dd3fc"/>
    <circle cx="630" cy="420" r="9" fill="#0369a1"/>
    <path class="dendrite" stroke="#38bdf8" d="M608 404 L590 392 M612 442 L596 458 M654 404 L670 392"/>
  </g>

  <!-- ── 연합 뉴런 (보라, 회백질 안) ────────────────────────── -->
  <g id="interneuron">
    <path class="nerve" stroke="#a855f7" d="M786 356 C784 372 776 386 766 394"/>
    <circle class="soma" cx="792" cy="352" r="18" fill="#c084fc"/>
    <circle cx="792" cy="352" r="7" fill="#6b21a8"/>
    <path class="dendrite" stroke="#a855f7" d="M778 338 L766 330 M806 338 L818 330"/>
  </g>

  <!-- ── 운동 뉴런 (빨강, 세포체는 회백질 안) ───────────────── -->
  <g id="motorNeuron">
    <circle class="soma" cx="757" cy="399" r="19" fill="#fb7185"/>
    <circle cx="757" cy="399" r="7" fill="#9f1239"/>
    <path class="dendrite" stroke="#f43f5e" d="M744 386 L734 376 M772 388 L784 380"/>
    <path class="nerve" stroke="#f43f5e" d="M750 418 C726 496 660 588 552 648"/>
    <path class="nerve" stroke="#f43f5e" d="M552 648 C480 638 420 620 352 602"/>
  </g>

  <!-- 시냅스 두 곳 -->
  <circle id="synapseA" cx="770" cy="336" r="13" fill="#fde68a" stroke="#b45309" stroke-width="2.4" opacity="0.85"/>
  <circle id="synapseB" cx="768" cy="386" r="13" fill="#fde68a" stroke="#b45309" stroke-width="2.4" opacity="0.85"/>

  <!-- ── 대뇌 ───────────────────────────────────────────────── -->
  <g id="brain">
    <path fill="#c4b5fd" stroke="#6d28d9" stroke-width="3" stroke-linejoin="round"
          d="M716 120 C716 84 750 62 792 62 C836 62 872 84 872 120
             C872 150 852 172 822 178 L764 178 C732 172 716 150 716 120 Z"/>
    <path fill="none" stroke="#6d28d9" stroke-width="2.2" opacity="0.75"
          d="M732 110 C754 100 778 100 798 110 M728 134 C754 122 786 122 812 134
             M752 86 C774 78 798 78 820 88 M846 106 C858 116 860 132 852 148"/>
  </g>

  <!-- ── 보이지 않는 안내선 (신호가 지나갈 길) ─────────────── -->
  <path id="flowSensory" fill="none" stroke="none"
        d="M106 566 C244 578 384 606 524 632 C580 578 606 508 618 448
           L630 420 C688 378 726 350 754 326"/>
  <path id="flowRelay" fill="none" stroke="none"
        d="M756 325 C770 332 784 342 792 352 C788 372 776 388 758 399"/>
  <path id="flowMotor" fill="none" stroke="none"
        d="M757 399 C726 496 660 588 552 648 C480 638 420 620 344 598"/>
  <path id="flowToBrain" fill="none" stroke="none"
        d="M770 330 C776 296 776 250 780 182"/>
  <path id="flowFromBrain" fill="none" stroke="none"
        d="M804 182 C810 250 802 322 786 360 C780 378 770 392 758 399"/>
</svg>
