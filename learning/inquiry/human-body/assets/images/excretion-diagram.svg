<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900">
  <defs>
    <!-- 네프론 돋보기는 이 원 밖으로 나가지 않는다 -->
    <clipPath id="excZoomClip"><circle cx="540" cy="730" r="125"/></clipPath>
    <!-- 2-stop linearGradients: light from top-left (20% 20% to 80% 80%), brightness diff 12~20%, hue diff <= 2 deg -->
    <linearGradient id="excAorta" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#d7546e"/>
      <stop offset="100%" stop-color="#9e2a41"/>
    </linearGradient>
    <linearGradient id="excVena" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#5e83b8"/>
      <stop offset="100%" stop-color="#395886"/>
    </linearGradient>
    <linearGradient id="excCortex" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#e49b8b"/>
      <stop offset="100%" stop-color="#b66f5f"/>
    </linearGradient>
    <linearGradient id="excMedulla" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#b9645f"/>
      <stop offset="100%" stop-color="#873c38"/>
    </linearGradient>
    <linearGradient id="excPelvis" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#f7e8be"/>
      <stop offset="100%" stop-color="#cfbc8b"/>
    </linearGradient>
    <linearGradient id="excKidneyLeft" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ce8070"/>
      <stop offset="100%" stop-color="#a35545"/>
    </linearGradient>
    <linearGradient id="excUreter" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#f2e4b8"/>
      <stop offset="100%" stop-color="#c8b786"/>
    </linearGradient>
    <linearGradient id="excBladder" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ecd080"/>
      <stop offset="100%" stop-color="#c29f45"/>
    </linearGradient>
    <linearGradient id="excBowman" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#e4edf5"/>
      <stop offset="100%" stop-color="#bfd0de"/>
    </linearGradient>
  </defs>

  <!-- 1. Body Outline (Centered lower abdomen: symmetric margins x min 130, x max 570) -->
  <path id="bodyOutline" d="
    M 210 90
    C 280 85, 420 85, 490 90
    C 525 150, 545 280, 535 380
    C 525 450, 540 540, 565 620
    C 575 660, 555 760, 540 850
    C 515 855, 460 850, 440 820
    C 415 780, 395 740, 375 700
    C 365 680, 335 680, 325 700
    C 305 740, 285 780, 260 820
    C 240 850, 185 855, 160 850
    C 145 760, 125 660, 135 620
    C 160 540, 175 450, 165 380
    C 155 280, 175 150, 210 90 Z"
    fill="none" stroke="#5b6a80" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />

  <!-- 2. Major Vessels (Aorta & Vena Cava) -->
  <!-- Vena Cava (대정맥: 푸른색, 가운데 세로) -->
  <g id="venaCava">
    <path d="
      M 315 90 L 335 90
      L 335 550 L 350 610 L 335 610 L 325 565 L 315 565 L 305 610 L 290 610 L 305 550 L 315 550 Z"
      fill="url(#excVena)" stroke="#365380" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Aorta (대동맥: 붉은색, 가운데 세로) -->
  <g id="aorta">
    <path d="
      M 345 90 L 365 90
      L 365 540 L 395 610 L 380 610 L 358 560 L 352 560 L 330 610 L 315 610 L 345 540 Z"
      fill="url(#excAorta)" stroke="#a13549" stroke-width="2" stroke-linejoin="round"/>
  </g>

    <!-- 3. Renal Vessels (콩팥동맥 & 콩팥정맥: 비스듬히 갈라져 나오는 가지 형태) -->
  <!-- Renal Artery (대동맥에서 콩팥으로 비스듬히 분기, touches aorta) -->
  <g id="renalArtery">
    <!-- Right renal artery (viewer left, slopes obliquely down-left behind vena cava) -->
    <path d="M 345 250 L 245 268 L 245 280 L 345 264 Z" fill="url(#excAorta)" stroke="#a13549" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Left renal artery (viewer right, slopes obliquely down-right) -->
    <path d="M 365 250 L 450 268 L 450 280 L 365 264 Z" fill="url(#excAorta)" stroke="#a13549" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- Renal Vein (콩팥에서 대정맥으로 비스듬히 합류, touches venaCava) -->
  <g id="renalVein">
    <!-- Right renal vein (viewer left, slopes up-right into vena cava) -->
    <path d="M 245 256 L 315 242 L 315 256 L 245 270 Z" fill="url(#excVena)" stroke="#365380" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Left renal vein (viewer right, slopes up-left crossing in front of aorta) -->
    <path d="M 335 242 L 450 256 L 450 270 L 335 256 Z" fill="url(#excVena)" stroke="#365380" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- 4. Right Kidney (오른쪽 콩팥 / 화면 왼쪽) — 반으로 잘라 속을 보인다 -->
  <g id="kidneyRight">
    <!-- cortex (겉질 — 바깥 테두리) -->
    <path id="cortex" d="
      M 235 185
      C 200 185, 160 215, 160 265
      C 160 315, 200 345, 235 345
      C 260 345, 265 315, 252 285
      C 245 265, 245 255, 252 245
      C 265 215, 260 185, 235 185 Z"
      fill="url(#excCortex)" stroke="#b06a59" stroke-width="2" stroke-linejoin="round"/>

    <!-- medulla (속질 — 안쪽 삼각형/피라미드 여럿) -->
    <g id="medulla">
      <!-- Pyramid 1 (top) -->
      <path d="M 225 200 C 205 205, 195 215, 195 225 L 225 235 Z" fill="url(#excMedulla)" stroke="#84403c" stroke-width="1.5"/>
      <!-- Pyramid 2 (upper mid) -->
      <path d="M 190 230 C 180 240, 180 255, 185 265 L 220 255 Z" fill="url(#excMedulla)" stroke="#84403c" stroke-width="1.5"/>
      <!-- Pyramid 3 (lower mid) -->
      <path d="M 185 270 C 182 285, 190 295, 200 305 L 222 275 Z" fill="url(#excMedulla)" stroke="#84403c" stroke-width="1.5"/>
      <!-- Pyramid 4 (bottom) -->
      <path d="M 205 310 C 215 320, 228 325, 235 325 L 228 290 Z" fill="url(#excMedulla)" stroke="#84403c" stroke-width="1.5"/>
    </g>

    <!-- renalPelvis (콩팥깔때기 — 가운데 빈 곳 깔때기 모양) -->
    <path id="renalPelvis" d="
      M 225 240
      L 220 255 L 222 275 L 228 290
      C 238 288, 252 280, 255 270
      C 255 258, 240 242, 225 240 Z"
      fill="url(#excPelvis)" stroke="#c9b47c" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- 5. Left Kidney (왼쪽 콩팥 / 화면 오른쪽) — 겉모습 그대로 -->
  <g id="kidneyLeft">
    <path d="
      M 465 185
      C 500 185, 540 215, 540 265
      C 540 315, 500 345, 465 345
      C 440 345, 435 315, 448 285
      C 455 265, 455 255, 448 245
      C 435 215, 440 185, 465 185 Z"
      fill="url(#excKidneyLeft)" stroke="#96513f" stroke-width="2" stroke-linejoin="round"/>
    <!-- Kidney surface convex shading crease -->
    <path d="M 480 205 C 515 235, 515 295, 480 325" fill="none" stroke="#96513f" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- 6. Ureters (오줌관 둘: continuous from kidneys to bladder) -->
  <g id="ureterR">
    <path d="
      M 245 280
      C 250 350, 290 470, 325 585
      L 337 585
      C 305 470, 265 350, 255 280 Z"
      fill="url(#excUreter)" stroke="#bfae7c" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <g id="ureterL">
    <path d="
      M 455 280
      C 450 350, 410 470, 375 585
      L 363 585
      C 395 470, 435 350, 445 280 Z"
      fill="url(#excUreter)" stroke="#bfae7c" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- 7. Bladder (방광: 아래쪽 주머니) -->
  <g id="bladder">
    <path d="
      M 320 590
      C 320 575, 380 575, 380 590
      C 395 615, 395 645, 375 665
      C 362 675, 338 675, 325 665
      C 305 645, 305 615, 320 590 Z"
      fill="url(#excBladder)" stroke="#bb9c40" stroke-width="2" stroke-linejoin="round"/>
    <!-- Bladder wall expansion fold -->
    <path d="M 330 615 C 350 635, 370 615, 370 615" fill="none" stroke="#bb9c40" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- 8. Urethra (요도: 방광에서 아래로) -->
  <g id="urethra">
    <path d="
      M 344 670 L 356 670
      L 356 730 L 344 730 Z"
      fill="url(#excUreter)" stroke="#bfae7c" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

    <!-- 9. Nephron Zoom (네프론 돋보기: 오른쪽 아래 큰 원, diameter > 220px, 내부 2/3 이상 채움) -->
  <g id="nephronZoom" clip-path="url(#excZoomClip)">
    <!-- 원형 돋보기 테두리: center (540, 730), radius 125 -> 지름 250px -->
    <circle id="zoomCircle" cx="540" cy="730" r="125" fill="#f7f9fc" stroke="#8fa0b5" stroke-width="3"/>

    <!-- bowman (보먼주머니: 사구체를 감싸는 컵, x: 445..520, y: 642..725) -->
    <path id="bowman" d="
      M 470 645
      C 440 665, 438 705, 468 725
      C 490 738, 518 732, 524 712
      L 512 706
      C 506 720, 488 722, 474 712
      C 455 698, 455 672, 474 658
      C 488 648, 506 652, 512 666
      L 524 660
      C 518 640, 490 635, 470 645 Z"
      fill="url(#excBowman)" stroke="#93a7ba" stroke-width="2.0" stroke-linejoin="round"/>

    <!-- glomerulus (사구체: 실뭉치처럼 여러 번 굽이쳐 감긴 모세혈관 다발) -->
    <g id="glomerulus">
      <!-- 중앙 본체 -->
      <circle cx="484" cy="685" r="20" fill="url(#excAorta)" stroke="#a13549" stroke-width="1.8"/>
      <!-- 감겨 있는 모세혈관 고리들 (실뭉치 입체 묘사) -->
      <path d="
        M 470 675 C 475 665, 495 668, 498 678
        C 502 688, 485 695, 478 688
        C 472 682, 475 672, 485 670
        C 498 672, 500 685, 492 696
        C 485 702, 472 698, 475 685
        C 478 675, 490 680, 495 688"
        fill="none" stroke="#a13549" stroke-width="2.2" stroke-linecap="round"/>
      <!-- 수입/수출 소동맥 유입/유출구 흔적 -->
      <path d="M 462 678 L 472 682 M 462 692 L 472 688" stroke="#a13549" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- tubule (세뇨관: 보먼주머니에서 나와 헨레고리를 크게 돌고 원위세뇨관으로 이어지는 긴 관) -->
    <path id="tubule" d="
      M 520 708
      C 540 725, 525 750, 505 755
      C 480 760, 472 780, 485 800
      C 495 815, 520 830, 540 830
      C 555 830, 565 815, 565 780
      C 565 745, 550 720, 565 690
      C 575 668, 595 670, 608 680"
      fill="none" stroke="#c8b786" stroke-width="9.0" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- collecting (집합관: 돋보기 우측을 위아래로 가로지르는 굵은 관과 지류들) -->
    <g id="collecting">
      <path d="M 610 625 L 610 835" fill="none" stroke="#bfae7c" stroke-width="14.0" stroke-linecap="round"/>
      <!-- 인접 네프론 연결 지류들 -->
      <path d="M 590 645 L 610 650 M 590 755 L 610 760 M 625 670 L 610 675" stroke="#bfae7c" stroke-width="7.0" stroke-linecap="round"/>
    </g>

    <!-- peritubular (모세혈관망: 세뇨관을 촘촘히 감싸는 푸른 모세혈관) -->
    <g id="peritubular" fill="none" stroke="#4a6fa5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 505 725 C 520 740, 535 735, 515 760"/>
      <path d="M 488 775 C 505 790, 520 770, 530 805"/>
      <path d="M 525 815 C 540 825, 555 810, 550 780"/>
      <path d="M 555 760 C 570 745, 560 720, 575 700"/>
      <path d="M 565 680 C 580 675, 595 685, 590 705"/>
      <path d="M 495 750 Q 510 765 525 755"/>
      <path d="M 540 770 Q 555 755 560 740"/>
    </g>
  </g>
</svg>
