<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <style>
      /* 2D Flat Textbook Schematic Styles (Crisp 2.4 ~ 3.0px strokes, solid flat colors) */
      .bone-contour { fill: #1e293b; fill-opacity: 0.22; stroke: #475569; stroke-width: 2.0; stroke-dasharray: 6,4; }
      
      /* Outer Ear */
      .pinna-body { fill: #fda4af; stroke: #fb7185; stroke-width: 2.8; stroke-linejoin: round; }
      .pinna-fold { fill: none; stroke: #f43f5e; stroke-width: 2.4; stroke-linecap: round; }
      .ear-canal-lumen { fill: #fda4af; fill-opacity: 0.22; stroke: none; }
      .ear-canal-wall { fill: none; stroke: #fb7185; stroke-width: 2.8; stroke-linecap: round; }
      .canal-cilia { stroke: #e11d48; stroke-width: 1.6; stroke-linecap: round; opacity: 0.65; }
      
      .eardrum-sheet { fill: #fde68a; stroke: #d97706; stroke-width: 2.6; stroke-linejoin: round; }
      .eardrum-detail { fill: none; stroke: #d97706; stroke-width: 1.4; stroke-linecap: round; }
      
      /* Middle Ear */
      .middle-ear-cavity { fill: #0f172a; fill-opacity: 0.35; stroke: #334155; stroke-width: 2.2; stroke-dasharray: 5,4; }
      .ossicle-bone { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 2.6; stroke-linejoin: round; }
      .eustachian-wall { fill: #fca5a5; stroke: #fb7185; stroke-width: 2.8; stroke-linejoin: round; }
      
      /* Inner Ear */
      .canal-arch-outer { fill: none; stroke: #0284c7; stroke-width: 14.0; stroke-linecap: round; stroke-linejoin: round; }
      .canal-arch-inner { fill: none; stroke: #38bdf8; stroke-width: 8.8; stroke-linecap: round; stroke-linejoin: round; }
      .ampulla-bulb { fill: #38bdf8; stroke: #0284c7; stroke-width: 2.6; }
      
      .vestibule-body { fill: #34d399; stroke: #059669; stroke-width: 2.8; stroke-linejoin: round; }
      .macula-chamber { fill: #a7f3d0; fill-opacity: 0.45; stroke: #059669; stroke-width: 1.8; stroke-dasharray: 3,3; }
      .otolith-bead { fill: #fef08a; stroke: #ca8a04; stroke-width: 1.2; }
      
      .cochlea-solid { fill: #a78bfa; stroke: #7c3aed; stroke-width: 2.8; stroke-linejoin: round; }
      .cochlea-seam { fill: none; stroke: #6d28d9; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .cochlea-core { fill: #7c3aed; stroke: #5b21b6; stroke-width: 2.4; }
      .corti-track { fill: none; stroke: #ede9fe; stroke-width: 2.0; stroke-dasharray: 4,3; }
      
      .nerve-trunk { fill: #fbbf24; stroke: #d97706; stroke-width: 2.8; stroke-linejoin: round; }
      .nerve-fiber { fill: none; stroke: #b45309; stroke-width: 1.6; stroke-linecap: round; opacity: 0.8; }
      .nerve-pulse { fill: #b45309; }
      
      .sound-arc { fill: none; stroke: #38bdf8; stroke-width: 2.4; stroke-linecap: round; opacity: 0.85; }
    </style>
  </defs>

  <!-- ================================================================= -->
  <!-- TEMPORAL BONE MATRIX OUTLINE (두개골 측두골 암양부 바위뼈 단면)    -->
  <!-- ================================================================= -->
  <path class="bone-contour"
        d="M 230,170
           C 360,150 620,130 960,130
           L 960,630
           C 720,630 520,630 440,630
           C 400,540 370,470 330,440
           C 290,440 250,445 230,445
           Z" />


  <!-- ================================================================= -->
  <!-- 1. OUTER EAR: 바깥귀 (x 40 ~ 320)                                 -->
  <!-- ================================================================= -->

  <!-- Pinna / Auricle (귓바퀴, id="pinna") -->
  <!-- Anatomical coronal section: Leftward facing funnel collecting sound -->
  <g id="pinna">
    <!-- Main Auricular Cartilage Body (#fda4af, border #fb7185) -->
    <path class="pinna-body"
          d="M 180,240
             C 175,160 150,95 115,75
             C 75,55 45,85 40,135
             C 35,185 45,260 50,335
             C 55,410 45,490 55,550
             C 65,595 102,620 132,595
             C 158,570 160,525 152,470
             C 146,430 138,410 134,380
             C 130,350 145,340 162,335
             C 176,330 182,300 180,240
             Z" />

    <!-- Antihelix (대이륜) internal curved fold -->
    <path class="pinna-fold"
          d="M 105,108
             C 75,140 68,210 72,280
             C 75,350 78,420 75,480
             C 73,520 90,550 115,555" />

    <!-- Concha bowl (이갑개) leading inward to ear canal meatus -->
    <path class="pinna-fold"
          d="M 130,220
             C 110,240 102,275 105,315
             C 108,345 116,365 126,375" />

    <!-- Tragus flap (이주 - 외이도 입구 보호 연골) -->
    <path class="pinna-body"
          d="M 135,365
             C 118,368 114,388 124,398
             C 132,406 142,402 145,392
             Z" />
  </g>

  <!-- External Auditory Canal (외이도, id="earCanal") -->
  <!-- S-curved air canal conveying sound vibrations to eardrum -->
  <g id="earCanal">
    <!-- Canal Interior Lumen Fluid/Air Channel -->
    <path class="ear-canal-lumen"
          d="M 144,358
             C 185,348 230,358 265,354
             C 285,350 300,345 308,345
             L 316,425
             C 300,425 285,418 265,422
             C 230,428 185,416 144,408
             Z" />

    <!-- Superior Canal Wall (외이도 상벽) -->
    <path class="ear-canal-wall"
          d="M 144,358
             C 185,348 230,358 265,354
             C 285,350 300,345 308,345" />

    <!-- Inferior Canal Wall (외이도 하벽) -->
    <path class="ear-canal-wall"
          d="M 144,408
             C 185,416 230,428 265,422
             C 285,418 300,425 316,425" />

    <!-- Protective Cilia (외이도 섬모/털) -->
    <line class="canal-cilia" x1="170" y1="353" x2="173" y2="362" />
    <line class="canal-cilia" x1="195" y1="355" x2="197" y2="364" />
    <line class="canal-cilia" x1="220" y1="358" x2="222" y2="367" />
    <line class="canal-cilia" x1="170" y1="412" x2="173" y2="403" />
    <line class="canal-cilia" x1="195" y1="418" x2="197" y2="409" />
    <line class="canal-cilia" x1="220" y1="423" x2="222" y2="414" />

    <!-- Sound Wave Concentric Arcs (음파 유입 시각화) -->
    <path class="sound-arc" d="M 85,348 C 98,368 98,396 85,416" />
    <path class="sound-arc" d="M 112,352 C 122,368 122,392 112,408" />
    <path class="sound-arc" d="M 185,366 C 195,376 195,396 185,406" />
    <path class="sound-arc" d="M 245,370 C 253,378 253,392 245,400" />
  </g>

  <!-- Eardrum / Tympanic Membrane (고막, id="eardrum") -->
  <!-- Vibrating drumhead membrane (#fde68a, border #d97706) -->
  <g id="eardrum">
    <path class="eardrum-sheet"
          d="M 308,343
             C 301,368 299,392 316,426
             C 322,426 325,418 322,410
             C 311,382 311,356 315,343
             Z" />

    <!-- Umbo (배꼽) central depression -->
    <path class="eardrum-detail" d="M 308,355 C 312,372 314,386 318,406" />
    <path class="eardrum-detail" d="M 310,365 C 314,378 314,388 320,416" />
    <circle cx="313" cy="384" r="3.2" fill="#d97706" />
  </g>


  <!-- ================================================================= -->
  <!-- 2. MIDDLE EAR: 가운데귀 (x 310 ~ 465)                              -->
  <!-- ================================================================= -->

  <!-- Tympanic Cavity (고실 공기방) -->
  <path class="middle-ear-cavity"
        d="M 322,285
           L 448,285
           L 448,415
           L 395,445
           L 322,445
           Z" />

  <!-- 1) Malleus / Hammer (망치뼈, id="malleus") -->
  <g id="malleus">
    <path class="ossicle-bone"
          d="M 326,295
             C 322,284 332,274 344,274
             C 356,274 364,284 360,298
             C 357,308 350,315 344,322
             L 340,340
             C 336,358 327,376 314,385
             C 311,382 311,376 316,369
             C 324,356 332,341 334,326
             C 336,316 330,305 326,295
             Z" />
    <!-- Lateral Process -->
    <path class="ossicle-bone" d="M 336,335 L 326,338 L 334,345 Z" />
  </g>

  <!-- 2) Incus / Anvil (모루뼈, id="incus") -->
  <g id="incus">
    <path class="ossicle-bone"
          d="M 360,290
             C 370,285 384,285 392,295
             C 398,302 407,308 414,310
             C 417,314 412,320 404,320
             C 396,320 388,316 382,322
             L 382,350
             C 382,360 387,366 394,368
             C 396,372 392,376 386,375
             C 377,372 372,362 372,348
             L 372,318
             C 367,312 362,302 360,290
             Z" />
    <!-- Lenticular Process -->
    <circle cx="392" cy="370" r="3.5" fill="#94a3b8" />
  </g>

  <!-- 3) Stapes / Stirrup (등자뼈, id="stapes") -->
  <g id="stapes">
    <!-- Capitulum Head -->
    <rect class="ossicle-bone" x="394" y="365" width="8" height="10" rx="3" />

    <!-- Anterior & Posterior Crura (등자 다리 아치) -->
    <path class="ossicle-bone"
          d="M 402,367
             L 428,354
             L 432,358
             L 406,371
             Z" />
    <path class="ossicle-bone"
          d="M 402,373
             L 428,386
             L 432,382
             L 406,369
             Z" />

    <!-- Stapedial Foramen (등자뼈 가운데 구멍) -->
    <ellipse cx="418" cy="370" rx="9" ry="5.5" fill="#0f172a" opacity="0.6" />

    <!-- Footplate (등자뼈 족판 - 난원창에 밀착하여 진동 전달) -->
    <path class="ossicle-bone"
          d="M 430,348
             C 436,348 442,358 442,370
             C 442,382 436,392 430,392
             L 426,392
             L 426,348
             Z" />
  </g>

  <!-- Eustachian Tube (귀인두관, id="eustachian") -->
  <!-- Equalizes atmospheric pressure between tympanic cavity and pharynx -->
  <g id="eustachian">
    <path class="eustachian-wall"
          d="M 375,440
             C 385,480 395,540 405,590
             C 412,625 422,655 432,670
             L 408,670
             C 398,655 388,625 380,590
             C 370,540 360,480 350,440
             Z" />

    <!-- Mucosal interior folds -->
    <path d="M 365,470 C 375,530 385,590 395,640" stroke="#f43f5e" stroke-width="1.6" fill="none" opacity="0.65" />
    <path d="M 375,480 C 385,540 395,600 405,650" stroke="#f43f5e" stroke-width="1.6" fill="none" opacity="0.65" />

    <!-- Pressure Balance Airflow Direction Arrows -->
    <path d="M 388,620 L 388,580 M 382,590 L 388,578 L 394,590" stroke="#f43f5e" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>


  <!-- ================================================================= -->
  <!-- 3. INNER EAR: 속귀 (x 440 ~ 965)                                  -->
  <!-- ================================================================= -->

  <!-- Semicircular Canals (반고리관: 세 고리, id="semicircular") -->
  <!-- Senses ROTATIONAL acceleration across 3 orthogonal axes -->
  <g id="semicircular">
    <!-- Canal 1: Posterior Canal (뒷반고리관) -->
    <path class="canal-arch-outer"
          d="M 535,270
             C 555,265 625,265 635,215
             C 645,160 595,145 565,185
             C 550,205 545,230 540,260" />
    <path class="canal-arch-inner"
          d="M 535,270
             C 555,265 625,265 635,215
             C 645,160 595,145 565,185
             C 550,205 545,230 540,260" />

    <!-- Canal 2: Anterior Canal (앞반고리관) -->
    <path class="canal-arch-outer"
          d="M 505,255
             C 490,205 495,135 545,110
             C 595,85 625,140 605,190
             C 595,215 575,245 545,255" />
    <path class="canal-arch-inner"
          d="M 505,255
             C 490,205 495,135 545,110
             C 595,85 625,140 605,190
             C 595,215 575,245 545,255" />

    <!-- Canal 3: Lateral Canal (옆반고리관) -->
    <path class="canal-arch-outer"
          d="M 530,285
             C 570,275 630,285 635,315
             C 640,345 580,355 545,335
             C 530,325 525,305 528,290" />
    <path class="canal-arch-inner"
          d="M 530,285
             C 570,275 630,285 635,315
             C 640,345 580,355 545,335
             C 530,325 525,305 528,290" />

    <!-- Ampullae Bulbs (팽대부: 기저 팽대부 셋) -->
    <circle class="ampulla-bulb" cx="498" cy="265" r="9.5" />
    <circle class="ampulla-bulb" cx="545" cy="275" r="9.5" />
    <circle class="ampulla-bulb" cx="530" cy="330" r="9.5" />

    <!-- Crista ampullaris hair cell crests -->
    <line x1="495" y1="262" x2="501" y2="268" stroke="#ffffff" stroke-width="1.8" />
    <line x1="542" y1="272" x2="548" y2="278" stroke="#ffffff" stroke-width="1.8" />
    <line x1="527" y1="327" x2="533" y2="333" stroke="#ffffff" stroke-width="1.8" />
  </g>

  <!-- Vestibule (전정기관: 주머니 둘, id="vestibule") -->
  <!-- Senses TILT, GRAVITY, and LINEAR ACCELERATION via otoliths -->
  <g id="vestibule">
    <!-- Main Central Bony Vestibule (#34d399, border #059669) -->
    <path class="vestibule-body"
          d="M 478,315
             C 455,330 450,370 465,395
             C 475,415 495,435 525,435
             C 555,435 570,410 570,380
             C 570,350 555,325 530,315
             C 515,310 495,305 478,315
             Z" />

    <!-- Upper Sac: Utricle (난형낭) -->
    <ellipse class="macula-chamber" cx="510" cy="345" rx="20" ry="14" />
    <!-- Lower Sac: Saccule (구형낭) -->
    <ellipse class="macula-chamber" cx="505" cy="395" rx="18" ry="15" />

    <!-- Otolith Crystals (이석 - 탄산칼슘 돌가루) -->
    <!-- Utricular Otoliths -->
    <circle class="otolith-bead" cx="502" cy="342" r="2.8" />
    <circle class="otolith-bead" cx="510" cy="340" r="3.0" />
    <circle class="otolith-bead" cx="518" cy="344" r="2.6" />
    <circle class="otolith-bead" cx="506" cy="348" r="2.6" />
    <circle class="otolith-bead" cx="514" cy="348" r="2.8" />

    <!-- Saccular Otoliths -->
    <circle class="otolith-bead" cx="498" cy="392" r="2.8" />
    <circle class="otolith-bead" cx="506" cy="390" r="3.0" />
    <circle class="otolith-bead" cx="512" cy="395" r="2.6" />
    <circle class="otolith-bead" cx="504" cy="400" r="2.8" />

    <!-- Oval Window (난원창: 등자뼈 족판 결합부) -->
    <ellipse cx="446" cy="370" rx="5" ry="14" fill="#059669" stroke="#047857" stroke-width="2.2" />
    <!-- Round Window (정원창: 림프액 압력 완충창) -->
    <ellipse cx="475" cy="425" rx="5" ry="10" fill="#059669" stroke="#047857" stroke-width="2.2" />
  </g>

  <!-- Auditory Nerve (청각 신경, id="auditoryNerve") -->
  <!-- Vestibulocochlear nerve (제8뇌신경) transmitting signals directly to brain -->
  <!-- Layered behind cochlea so it cleanly emerges to the right -->
  <g id="auditoryNerve">
    <!-- Vestibular Nerve Branch from vestibule / semicircular canals -->
    <path class="nerve-trunk"
          d="M 565,340
             C 610,320 670,312 730,315
             L 745,342
             C 690,340 635,348 572,365
             Z" />

    <!-- Main Cochlear & Vestibulocochlear Common Nerve Trunk leading to brain -->
    <path class="nerve-trunk"
          d="M 700,348
             C 760,348 840,345 965,342
             L 965,422
             C 840,425 760,425 700,420
             Z" />

    <!-- Longitudinal Nerve Fiber Tracts (신경 섬유 결) -->
    <path class="nerve-fiber" d="M 585,345 C 640,335 695,332 740,335" />
    <path class="nerve-fiber" d="M 720,368 C 800,368 880,368 960,368" />
    <path class="nerve-fiber" d="M 720,398 C 800,398 880,398 960,398" />

    <!-- Action Potential Pulse Markers (신경 흥분 전도 화살촉: 대뇌 방향) -->
    <polygon class="nerve-pulse" points="840,363 855,368 840,373" />
    <polygon class="nerve-pulse" points="910,363 925,368 910,373" />
    <polygon class="nerve-pulse" points="840,393 855,398 840,403" />
    <polygon class="nerve-pulse" points="910,393 925,398 910,403" />
  </g>

  <!-- Cochlea (달팽이관: 2.75회전 나선관, id="cochlea") -->
  <!-- Senses SOUND vibrations via Organ of Corti acoustic hair cells -->
  <!-- Solid anatomical snail shell structure with clear spiral whorls -->
  <g id="cochlea">
    <!-- Solid Snail Shell Silhouette Body (#a78bfa, border #7c3aed) -->
    <path class="cochlea-solid"
          d="M 525,420
             C 545,465 605,498 675,498
             C 745,498 788,445 788,380
             C 788,315 745,268 670,268
             C 595,268 550,315 545,365
             C 540,385 530,402 525,420
             Z" />

    <!-- Continuous Spiral Groove (나선 홈 경계선) -->
    <path class="cochlea-seam"
          d="M 525,420
             C 550,460 610,490 675,490
             C 740,490 780,440 780,380
             C 780,320 740,275 670,275
             C 600,275 558,315 558,375
             C 558,425 600,458 655,458
             C 710,458 745,425 745,380
             C 745,342 715,315 672,315
             C 630,315 605,345 605,380
             C 605,410 630,432 662,432
             C 690,432 708,412 708,385
             C 708,365 692,352 672,352
             C 658,352 648,362 648,378
             C 648,388 655,394 665,394" />

    <!-- Modiolus Core (달팽이관 중심 나선축) -->
    <circle class="cochlea-core" cx="665" cy="382" r="9" />

    <!-- Organ of Corti Acoustic Hair Cell Receptor Track (코르티 기관 감각선) -->
    <path class="corti-track"
          d="M 535,430
             C 565,475 625,482 675,482
             C 735,482 770,440 770,380
             C 770,328 735,285 670,285
             C 612,285 572,325 572,375
             C 572,415 608,445 655,445
             C 698,445 728,415 728,380
             C 728,352 702,330 672,330
             C 642,330 622,355 622,380
             C 622,400 640,418 662,418
             C 680,418 692,402 692,385
             C 692,372 682,364 670,364" />
  </g>


  <!-- ================================================================= -->
  <!-- 4. INVISIBLE GUIDE PATHS (안내선 4종: fill="none" stroke="none")   -->
  <!-- ================================================================= -->

  <!-- 1. flowSound: 귓바퀴 바깥 → 외이도 → 고막 → 귀뼈 셋 → 달팽이관 속까지 -->
  <!-- (공기 진동 ➔ 외이도 전달 ➔ 고막 진동 ➔ 귓속뼈 증폭 ➔ 난원창 ➔ 달팽이관 림프액 파동) -->
  <path id="flowSound" fill="none" stroke="none"
        d="M 20,380
           C 60,380 100,380 145,380
           C 190,380 240,385 305,380
           L 320,380
           C 335,360 350,320 365,320
           C 380,320 390,345 405,370
           L 442,370
           C 480,370 515,405 540,430
           C 570,465 625,482 675,482
           C 735,482 770,440 770,380
           C 770,328 735,285 670,285
           C 612,285 572,325 572,375
           C 572,415 608,445 655,445
           C 698,445 728,415 728,380
           C 728,352 702,330 672,330
           C 642,330 622,355 665,382" />

  <!-- 2. flowNerve: 달팽이관 → 청각 신경을 타고 오른쪽 끝까지 -->
  <!-- (달팽이관 유모세포 전기신호 ➔ 청각신경 섬유 ➔ 대뇌 청각중추 전도) -->
  <path id="flowNerve" fill="none" stroke="none"
        d="M 665,382
           C 720,380 780,385 840,385
           C 885,385 925,385 965,385" />

  <!-- 3. flowRotate: 반고리관 고리 안을 한 바퀴 도는 길 -->
  <!-- (몸의 회전 운동 시 반고리관 내 림프액의 관성 흐름 궤적) -->
  <path id="flowRotate" fill="none" stroke="none"
        d="M 545,260
           C 525,230 515,165 545,125
           C 575,95 615,120 615,175
           C 615,215 585,255 545,260" />

  <!-- 4. flowTilt: 전정기관 주머니 속을 위에서 아래로 기우는 짧은 길 -->
  <!-- (몸의 기울임 및 중력 변화 시 난형낭·구형낭 이석의 쏠림 경로) -->
  <path id="flowTilt" fill="none" stroke="none"
        d="M 515,335
           C 518,360 510,385 505,415" />

</svg>