<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <style>
      /* Flat Textbook Schematic Stylesheet (2.4 ~ 3.0px crisp strokes) */
      .bronchiole-tube { fill: #94a3b8; stroke: #64748b; stroke-width: 2.8; stroke-linejoin: round; }
      .airway-lumen { fill: #fed7aa; stroke: none; }
      .bronchiole-ring { fill: none; stroke: #64748b; stroke-width: 2.0; stroke-linecap: round; }
      
      .cluster-sac { fill: #fed7aa; stroke: #fdba74; stroke-width: 2.6; stroke-linejoin: round; }
      .cluster-sac-front { fill: #ffedd5; stroke: #fb923c; stroke-width: 2.6; stroke-linejoin: round; }
      
      .cap-net-art { fill: none; stroke: #2563eb; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .cap-net-ven { fill: none; stroke: #dc2626; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .cap-net-mesh { fill: none; stroke: #818cf8; stroke-width: 2.2; stroke-linecap: round; opacity: 0.85; }
      
      .zoom-callout { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5,5; stroke-linecap: round; opacity: 0.7; }
      .zoom-ring { fill: none; stroke: #38bdf8; stroke-width: 2.0; stroke-dasharray: 4,4; }
      
      .alveolus-interior { fill: #fed7aa; stroke: #fdba74; stroke-width: 2.8; stroke-linejoin: round; }
      .alveolus-wall-layer { fill: #fdba74; stroke: #ea580c; stroke-width: 2.2; stroke-linejoin: round; }
      .alveolar-nucleus { fill: #c2410c; }
      
      .capillary-wall-layer { fill: #cbd5e1; stroke: #64748b; stroke-width: 2.2; stroke-linejoin: round; }
      .endo-nucleus { fill: #475569; }
      
      .blood-in { fill: #2563eb; }
      .blood-out { fill: #dc2626; }
      
      .rbc-deox-body { fill: #60a5fa; stroke: #1e3a8a; stroke-width: 2.2; }
      .rbc-deox-dimple { fill: #93c5fd; }
      .rbc-trans-body { fill: #a855f7; stroke: #581c87; stroke-width: 2.2; }
      .rbc-trans-dimple { fill: #d8b4fe; }
      .rbc-ox-body { fill: #f87171; stroke: #7f1d1d; stroke-width: 2.2; }
      .rbc-ox-dimple { fill: #fecaca; }
    </style>
  </defs>

  <!-- ================================================================= -->
  <!-- 1. TOP-LEFT OVERVIEW: BRONCHIOLE & ALVEOLAR CLUSTER (~1/4 AREA)   -->
  <!-- ================================================================= -->

  <!-- Bronchiole Trunk & Branches (세기관지, id="bronchiole") -->
  <g id="bronchiole">
    <!-- Outer Cartilage & Muscle Wall of Bronchiole Tree -->
    <path class="bronchiole-tube"
          d="M 180,45
             L 218,45
             C 218,78 226,98 240,114
             C 280,140 330,152 375,152
             L 366,186
             C 325,182 280,168 236,146
             C 212,135 196,140 186,155
             L 165,188
             L 136,174
             L 158,134
             C 172,112 180,82 180,45
             Z" />
    
    <!-- Bronchiole Airway Lumen (공기가 지나는 통로 안쪽) -->
    <path class="airway-lumen"
          d="M 186,45
             L 212,45
             C 212,74 220,92 234,108
             C 276,134 324,146 370,146
             L 364,178
             C 322,174 278,160 238,138
             C 216,126 200,132 190,148
             L 170,180
             L 144,168
             L 164,132
             C 176,110 186,76 186,45
             Z" />

    <!-- Bronchiole Cartilaginous Bands (세기관지 가로 마디선) -->
    <line class="bronchiole-ring" x1="180" y1="68" x2="218" y2="68" />
    <line class="bronchiole-ring" x1="183" y1="92" x2="222" y2="92" />
    <line class="bronchiole-ring" x1="190" y1="115" x2="228" y2="112" />
    <line class="bronchiole-ring" x1="262" y1="126" x2="270" y2="154" />
    <line class="bronchiole-ring" x1="310" y1="138" x2="316" y2="166" />
    <line class="bronchiole-ring" x1="148" y1="152" x2="174" y2="164" />
  </g>

  <!-- Grape-like Alveolar Cluster (폐포 송이, id="alveolusCluster") -->
  <!-- Demonstrates large surface area created by millions of alveolar sacs -->
  <g id="alveolusCluster">
    <!-- Background Alveoli -->
    <circle class="cluster-sac" cx="118" cy="190" r="22" />
    <circle class="cluster-sac" cx="158" cy="180" r="20" />
    <circle class="cluster-sac" cx="92" cy="225" r="24" />
    <circle class="cluster-sac" cx="184" cy="220" r="23" />
    <circle class="cluster-sac" cx="214" cy="250" r="21" />
    <circle class="cluster-sac" cx="88" cy="275" r="23" />
    <circle class="cluster-sac" cx="180" cy="285" r="24" />
    <circle class="cluster-sac" cx="112" cy="320" r="22" />
    <circle class="cluster-sac" cx="152" cy="325" r="21" />

    <!-- Foreground Alveoli -->
    <circle class="cluster-sac-front" cx="138" cy="215" r="26" />
    <circle class="cluster-sac-front" cx="128" cy="265" r="28" />
    <circle class="cluster-sac-front" cx="168" cy="255" r="24" />

    <!-- Subtle Septal Contour Lines -->
    <path class="bronchiole-ring" d="M 124,210 Q 138,225 152,215" opacity="0.6" />
    <path class="bronchiole-ring" d="M 114,260 Q 128,278 146,265" opacity="0.6" />
  </g>

  <!-- Capillary Network Wrapping Cluster (폐포 송이를 감싼 모세혈관 그물, id="capillaryNet") -->
  <g id="capillaryNet">
    <!-- Pulmonary Micro-Arteriole (산소 적은 피, 파랑) -->
    <path class="cap-net-art" d="M 52,200 C 68,210 80,230 92,245 L 112,265" />
    <path class="cap-net-art" d="M 56,240 C 72,248 85,260 95,280" />

    <!-- Anastomosing Meshwork Over Alveoli (모세혈관 그물망) -->
    <path class="cap-net-mesh" d="M 92,245 C 108,230 132,235 138,250 C 144,265 124,280 108,285" />
    <path class="cap-net-mesh" d="M 112,265 C 128,255 148,260 152,275 C 156,290 136,305 122,305" />
    <path class="cap-net-mesh" d="M 138,215 C 158,210 172,225 168,245 C 164,260 148,265 138,250" />
    <path class="cap-net-mesh" d="M 128,265 C 144,250 168,252 170,270 C 172,288 150,298 132,295" />
    <path class="cap-net-mesh" d="M 108,285 C 122,295 142,292 152,275" />
    <path class="cap-net-mesh" d="M 95,280 C 102,300 118,312 132,315" />
    <path class="cap-net-mesh" d="M 152,275 C 168,280 182,270 188,255 L 202,245" />

    <!-- Pulmonary Micro-Venule (산소 많은 피, 빨강) -->
    <path class="cap-net-ven" d="M 152,305 C 168,310 185,305 198,290 L 215,270" />
    <path class="cap-net-ven" d="M 170,270 C 182,275 200,268 212,250 L 228,235" />
  </g>

  <!-- Zoom Callout Cone / Magnifier Guides -->
  <g opacity="0.65">
    <circle class="zoom-ring" cx="168" cy="255" r="26" />
    <line class="zoom-callout" x1="194" y1="245" x2="368" y2="162" />
    <line class="zoom-callout" x1="190" y1="272" x2="352" y2="405" />
  </g>


  <!-- ================================================================= -->
  <!-- 2. MAIN SECTION: MAGNIFIED ALVEOLUS & CAPILLARY CONTACT           -->
  <!-- ================================================================= -->

  <!-- Magnified Alveolus Air Sac (확대한 폐포 하나, id="alveolus") -->
  <!-- Large hollow air sac on the upper-left, soft peach #fed7aa -->
  <g id="alveolus">
    <!-- Air Cavity Body (속이 빈 공기 주머니) -->
    <path class="alveolus-interior"
          d="M 370,148
             C 430,132 510,105 605,105
             C 725,105 825,150 850,230
             C 870,295 845,355 805,385
             C 730,420 635,435 540,432
             C 455,428 395,405 352,370
             C 335,315 338,215 364,180
             Z" />

    <!-- Subtle Internal Depth Highlight & Wall Textures -->
    <path d="M 395,180 C 510,135 690,135 800,205" fill="none" stroke="#fbcfe8" stroke-width="2.0" opacity="0.4" stroke-linecap="round" />
    <path d="M 830,235 C 845,290 820,345 780,375" fill="none" stroke="#fbcfe8" stroke-width="2.0" opacity="0.4" stroke-linecap="round" />
  </g>

  <!-- Alveolar Wall (폐포 벽, 한 겹, id="alveolusWall") -->
  <!-- Single Layer of Simple Squamous Epithelium (10px thin barrier, #fdba74) -->
  <g id="alveolusWall">
    <!-- Thin Alveolar Epithelial Strip (상단 벽, 두께 약 10px) -->
    <path class="alveolus-wall-layer"
          d="M 352,370
             C 395,405 455,428 540,432
             C 635,435 730,420 805,385
             C 818,379 828,372 836,365
             L 842,374
             C 824,388 804,398 782,406
             C 712,430 622,444 535,442
             C 450,440 390,418 344,380
             Z" />
    
    <!-- Flat Alveolar Epithelial Cell Nuclei (단층 편평 상피세포 핵) -->
    <ellipse class="alveolar-nucleus" cx="410" cy="406" rx="14" ry="4.5" />
    <ellipse class="alveolar-nucleus" cx="505" cy="430" rx="15" ry="4.5" />
    <ellipse class="alveolar-nucleus" cx="615" cy="432" rx="15" ry="4.5" />
    <ellipse class="alveolar-nucleus" cx="725" cy="418" rx="14" ry="4.5" />
    <ellipse class="alveolar-nucleus" cx="802" cy="388" rx="12" ry="4.2" />
    
    <!-- Epithelial Cell Junctions (상피세포 경계선) -->
    <line x1="456" y1="418" x2="453" y2="429" stroke="#ea580c" stroke-width="1.8" />
    <line x1="560" y1="431" x2="558" y2="442" stroke="#ea580c" stroke-width="1.8" />
    <line x1="670" y1="426" x2="668" y2="437" stroke="#ea580c" stroke-width="1.8" />
    <line x1="765" y1="405" x2="762" y2="416" stroke="#ea580c" stroke-width="1.8" />
  </g>


  <!-- Magnified Capillary (확대한 모세혈관, id="capillary") -->
  <!-- Tubular vessel running below alveolus from left to right -->
  <g id="capillary">
    <!-- Capillary Blood Fluid In (들어오는 쪽: 파랑, 산소 적음, id="bloodIn") -->
    <!-- Deoxygenated Blood from Pulmonary Artery -->
    <path id="bloodIn" class="blood-in"
          d="M 235,530
             C 275,475 320,410 338,390
             C 385,428 445,450 530,452
             L 590,453
             L 600,565
             C 520,565 440,555 375,540
             C 300,522 245,555 200,605
             Z" />

    <!-- Capillary Blood Fluid Out (나가는 쪽: 빨강, 산소 많음, id="bloodOut") -->
    <!-- Oxygenated Blood to Pulmonary Vein -->
    <path id="bloodOut" class="blood-out"
          d="M 590,453
             C 660,452 730,440 795,418
             C 835,404 880,388 950,370
             L 970,470
             C 900,488 845,508 785,528
             C 715,550 655,562 600,565
             Z" />

    <!-- Moving Red Blood Cells squeezed in Single File (모세혈관 속 적혈구) -->
    <!-- 1. Incoming Deoxygenated RBC 1 (산소 적은 적혈구) -->
    <g transform="translate(295, 490) rotate(-42)">
      <ellipse class="rbc-deox-body" cx="0" cy="0" rx="30" ry="17" />
      <ellipse class="rbc-deox-dimple" cx="0" cy="0" rx="14" ry="7" />
    </g>
    
    <!-- 2. Incoming Deoxygenated RBC 2 -->
    <g transform="translate(435, 485) rotate(-15)">
      <ellipse class="rbc-deox-body" cx="0" cy="0" rx="30" ry="17" />
      <ellipse class="rbc-deox-dimple" cx="0" cy="0" rx="14" ry="7" />
    </g>

    <!-- 3. Transitioning RBC (기체 교환 중인 적혈구: 산소 결합 시작) -->
    <g transform="translate(585, 502) rotate(2)">
      <ellipse class="rbc-trans-body" cx="0" cy="0" rx="30" ry="17" />
      <ellipse class="rbc-trans-dimple" cx="0" cy="0" rx="14" ry="7" />
    </g>

    <!-- 4. Outgoing Oxygenated RBC 1 (선홍색 동맥혈 적혈구) -->
    <g transform="translate(725, 480) rotate(-12)">
      <ellipse class="rbc-ox-body" cx="0" cy="0" rx="30" ry="17" />
      <ellipse class="rbc-ox-dimple" cx="0" cy="0" rx="14" ry="7" />
    </g>
    
    <!-- 5. Outgoing Oxygenated RBC 2 -->
    <g transform="translate(865, 442) rotate(-18)">
      <ellipse class="rbc-ox-body" cx="0" cy="0" rx="30" ry="17" />
      <ellipse class="rbc-ox-dimple" cx="0" cy="0" rx="14" ry="7" />
    </g>

    <!-- Bottom Outer Capillary Wall (모세혈관 바닥 외벽, 두께 약 10px) -->
    <path class="capillary-wall-layer"
          d="M 200,605
             C 245,555 300,522 375,540
             C 440,555 520,565 600,565
             C 655,562 715,550 785,528
             C 845,508 900,488 970,470
             L 974,480
             C 904,498 848,518 788,538
             C 718,560 656,572 600,575
             C 518,575 438,565 372,550
             C 295,532 238,568 192,615
             Z" />
    
    <!-- Endothelial Nuclei on Bottom Wall -->
    <ellipse class="endo-nucleus" cx="340" cy="538" rx="14" ry="4.5" />
    <ellipse class="endo-nucleus" cx="490" cy="564" rx="14" ry="4.5" />
    <ellipse class="endo-nucleus" cx="690" cy="552" rx="14" ry="4.5" />
    <ellipse class="endo-nucleus" cx="870" cy="505" rx="14" ry="4.5" />
  </g>

  <!-- Capillary Wall along Interface (모세혈관 벽, 한 겹, id="capillaryWall") -->
  <!-- Single Layer of Endothelial Cells (10px thin barrier, #cbd5e1) -->
  <g id="capillaryWall">
    <!-- Thin Endothelial Layer Strip sharing Basement Membrane with Alveolus Wall -->
    <path class="capillary-wall-layer"
          d="M 344,380
             C 390,418 450,440 535,442
             C 622,444 712,430 782,406
             C 804,398 824,388 842,374
             L 848,384
             C 830,398 808,408 786,416
             C 714,440 622,454 532,452
             C 445,450 385,428 338,390
             Z" />
    
    <!-- Flat Endothelial Cell Nuclei (단층 편평 내피세포 핵) -->
    <ellipse class="endo-nucleus" cx="400" cy="420" rx="14" ry="4.5" />
    <ellipse class="endo-nucleus" cx="495" cy="444" rx="15" ry="4.5" />
    <ellipse class="endo-nucleus" cx="605" cy="446" rx="15" ry="4.5" />
    <ellipse class="endo-nucleus" cx="715" cy="432" rx="14" ry="4.5" />
    <ellipse class="endo-nucleus" cx="792" cy="402" rx="12" ry="4.2" />
    
    <!-- Endothelial Cell Junctions (내피세포 경계선) -->
    <line x1="446" y1="432" x2="443" y2="443" stroke="#64748b" stroke-width="1.8" />
    <line x1="550" y1="445" x2="548" y2="456" stroke="#64748b" stroke-width="1.8" />
    <line x1="660" y1="440" x2="658" y2="451" stroke="#64748b" stroke-width="1.8" />
    <line x1="755" y1="418" x2="752" y2="429" stroke="#64748b" stroke-width="1.8" />
  </g>


  <!-- ================================================================= -->
  <!-- 3. INVISIBLE GUIDE PATHS (안내선)                                 -->
  <!-- ================================================================= -->

  <!-- 1. flowAir: 세기관지 입구 → 폐포 속까지 -->
  <path id="flowAir" fill="none" stroke="none"
        d="M 198,48
           C 200,80 216,98 238,114
           L 364,154
           C 435,178 500,215 575,255" />

  <!-- 2. flowBlood: 모세혈관 왼쪽 입구 → 맞닿는 구간 → 오른쪽 출구 -->
  <path id="flowBlood" fill="none" stroke="none"
        d="M 220,565
           C 280,505 350,470 450,488
           C 550,505 660,505 770,475
           C 840,455 905,432 960,420" />

  <!-- 3. flowO2: 폐포 속 → 벽을 건너 → 모세혈관 속 (산소가 가는 길) -->
  <path id="flowO2" fill="none" stroke="none"
        d="M 520,335
           C 528,370 538,405 545,438
           C 550,460 558,480 565,510" />

  <!-- 4. flowCO2: 모세혈관 속 → 벽을 건너 → 폐포 속 (이산화탄소가 가는 길, flowO2와 반대 방향!) -->
  <path id="flowCO2" fill="none" stroke="none"
        d="M 685,510
           C 678,480 672,458 668,438
           C 658,405 648,370 640,335" />

</svg>