<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <!--
    심장과 순환 경로 2D 교과서 표준 도식 (2022 개정 과학과 교육과정)
    - 폐순환: 우심실 ➔ 폐동맥 ➔ 폐(모세혈관) ➔ 폐정맥 ➔ 좌심방
    - 온몸순환: 좌심실 ➔ 대동맥 ➔ 온몸(모세혈관) ➔ 대정맥 ➔ 우심방
    - 단색 평면, 그라데이션/필터 없음, 배경 투명, 텍스트 없음
  -->
  <style>
    .organ-bg { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 2.4; stroke-linejoin: round; }
    .trachea-tree { stroke: #475569; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .bronchi-tree { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; }
    .alveoli-bead { fill: #cbd5e1; stroke: #94a3b8; stroke-width: 1.2; }
    
    .vessel-contour { stroke: #0f172a; stroke-width: 2.4; stroke-linejoin: round; }
    .chamber-rect { stroke: #0f172a; stroke-width: 2.4; stroke-linejoin: round; }
    .septum-fill { fill: #475569; stroke: #0f172a; stroke-width: 2.4; stroke-linejoin: round; }
    
    .valve-leaflet { fill: #f8fafc; stroke: #ffffff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .chordae-line { stroke: #f1f5f9; stroke-width: 1.5; stroke-dasharray: 2,3; stroke-linecap: round; }
    .papillary-musc { fill: #1e293b; stroke: #475569; stroke-width: 1.4; }
    
    .cap-venous { stroke: #0284c7; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .cap-arterial { stroke: #e11d48; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .cap-trans { stroke: #8b5cf6; stroke-width: 2.2; fill: none; stroke-linecap: round; }
    
    .somatic-cell { fill: #334155; stroke: #64748b; stroke-width: 1.5; }
    .nucleus-cell { fill: #60a5fa; }
  </style>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 1. 온몸 모세혈관 (Body Capillaries, 하단)                         -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g id="bodyCapillaries">
    <!-- 온몸 조직 상자: x=175..825, y=586..670 (대정맥 x=185..245 및 대동맥 x=730..780과 100% 밀착) -->
    <rect class="vessel-contour" fill="#1e293b" x="175" y="586" width="650" height="84" rx="22"/>

    <!-- 조직 세포들 (Somatic Cells) -->
    <g class="somatic-cell">
      <circle cx="260" cy="628" r="13"/><circle cx="310" cy="614" r="12"/>
      <circle cx="360" cy="642" r="13"/><circle cx="410" cy="616" r="12"/>
      <circle cx="460" cy="642" r="13"/><circle cx="510" cy="616" r="12"/>
      <circle cx="560" cy="642" r="13"/><circle cx="610" cy="616" r="12"/>
      <circle cx="660" cy="642" r="13"/><circle cx="710" cy="616" r="12"/>
      <circle cx="750" cy="630" r="12"/>
    </g>
    <g class="nucleus-cell">
      <circle cx="260" cy="628" r="4"/><circle cx="310" cy="614" r="3.5"/>
      <circle cx="360" cy="642" r="4"/><circle cx="410" cy="616" r="3.5"/>
      <circle cx="460" cy="642" r="4"/><circle cx="510" cy="616" r="3.5"/>
      <circle cx="560" cy="642" r="4"/><circle cx="610" cy="616" r="3.5"/>
      <circle cx="660" cy="642" r="4"/><circle cx="710" cy="616" r="3.5"/>
      <circle cx="750" cy="630" r="3.5"/>
    </g>

    <!-- 모세혈관망: 우측(빨강, 동맥혈) ➔ 중앙(보라) ➔ 좌측(파랑, 정맥혈) -->
    <path class="cap-arterial" d="M755 586 L755 606 Q720 608 650 608 T550 608"/>
    <path class="cap-trans" d="M550 608 L450 608"/>
    <path class="cap-venous" d="M450 608 Q350 608 260 606 T210 606 L210 586"/>

    <path class="cap-arterial" d="M755 615 Q710 628 650 628 T540 628"/>
    <path class="cap-trans" d="M540 628 L460 628"/>
    <path class="cap-venous" d="M460 628 Q360 628 270 628 T210 615"/>

    <path class="cap-arterial" d="M755 635 Q720 650 660 650 T550 650"/>
    <path class="cap-trans" d="M550 650 L450 650"/>
    <path class="cap-venous" d="M450 650 Q350 650 260 650 T210 635"/>

    <line x1="290" y1="608" x2="290" y2="650" stroke="#0284c7" stroke-width="1.8"/>
    <line x1="390" y1="608" x2="390" y2="650" stroke="#0284c7" stroke-width="1.8"/>
    <line x1="500" y1="608" x2="500" y2="650" stroke="#8b5cf6" stroke-width="2.2"/>
    <line x1="600" y1="608" x2="600" y2="650" stroke="#e11d48" stroke-width="1.8"/>
    <line x1="690" y1="608" x2="690" y2="650" stroke="#e11d48" stroke-width="1.8"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 2. 폐 (Lungs, 상단) - 좌우 동일한 색, 중앙 모세혈관 기체교환       -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g id="lungs">
    <!-- 좌우 폐 및 중앙 연결 폐실질 (동일한 단색 #e2e8f0) -->
    <path class="organ-bg"
          d="M290 28 C225 30 170 65 165 115 C160 145 180 172 225 178 C265 182 320 174 360 155
             C410 175 460 180 500 180 C540 180 590 175 640 155
             C680 174 735 182 775 178 C820 172 840 145 835 115 C830 65 775 30 710 28
             C665 28 625 42 600 68 C570 45 535 36 500 36 C465 36 430 45 400 68 C375 42 335 28 290 28 Z"/>

    <!-- 폐엽 분엽선 -->
    <path class="bronchi-tree" d="M172 120 C220 125 275 118 340 102 M198 152 C245 148 285 138 330 125"/>
    <path class="bronchi-tree" d="M660 102 C725 118 780 125 828 120 M670 125 C715 138 755 148 802 152"/>

    <!-- 기관(Trachea) 및 주기관지 수형도 -->
    <path class="trachea-tree" d="M500 14 L500 44 L450 72 L380 92 M500 44 L550 72 L620 92"/>
    <path class="bronchi-tree" d="M280 50 L280 145 M280 80 L235 100 M280 110 L240 130 M280 125 L255 140 M315 85 L330 110"/>
    <path class="bronchi-tree" d="M720 50 L720 145 M720 80 L765 100 M720 110 L760 130 M720 125 L745 140 M685 85 L670 110"/>

    <!-- 폐포 소낭군 비드 -->
    <g class="alveoli-bead">
      <circle cx="220" cy="85" r="7.5"/><circle cx="208" cy="115" r="8"/>
      <circle cx="225" cy="142" r="7.5"/><circle cx="335" cy="138" r="7.5"/>
      <circle cx="780" cy="85" r="7.5"/><circle cx="792" cy="115" r="8"/>
      <circle cx="775" cy="142" r="7.5"/><circle cx="665" cy="138" r="7.5"/>
      <circle cx="440" cy="70" r="6.5"/><circle cx="560" cy="70" r="6.5"/>
      <circle cx="480" cy="145" r="6.5"/><circle cx="520" cy="145" r="6.5"/>
    </g>

    <!-- 폐 모세혈관 기체교환망 (폐동맥 파랑 ➔ 중앙 보라 ➔ 폐정맥 빨강) -->
    <g id="lungCapillaryNetwork">
      <path class="cap-venous" d="M375 165 C380 112 410 82 450 82"/>
      <path class="cap-trans" d="M450 82 L550 82"/>
      <path class="cap-arterial" d="M550 82 C590 82 620 112 625 165"/>

      <path class="cap-venous" d="M385 165 C392 128 420 105 460 105"/>
      <path class="cap-trans" d="M460 105 L540 105"/>
      <path class="cap-arterial" d="M540 105 C580 105 608 128 615 165"/>

      <path class="cap-venous" d="M395 165 C400 142 425 125 470 125"/>
      <path class="cap-trans" d="M470 125 L530 125"/>
      <path class="cap-arterial" d="M530 125 C575 125 600 142 605 165"/>

      <line x1="430" y1="88" x2="430" y2="125" stroke="#0284c7" stroke-width="1.8"/>
      <line x1="470" y1="82" x2="470" y2="125" stroke="#0284c7" stroke-width="1.8"/>
      <line x1="500" y1="82" x2="500" y2="125" stroke="#8b5cf6" stroke-width="2.2"/>
      <line x1="530" y1="82" x2="530" y2="125" stroke="#e11d48" stroke-width="1.8"/>
      <line x1="570" y1="88" x2="570" y2="125" stroke="#e11d48" stroke-width="1.8"/>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 3. 심장 외벽 근육 틀 (Myocardium outline)                         -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <path id="heartOutline" class="vessel-contour" fill="#334155"
        d="M316 232 C316 212 335 205 365 205 L635 205 C665 205 684 212 684 232
           L684 420 C684 515 615 570 520 576 C415 570 316 515 316 420 Z"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 4. 주요 혈관 넷 (The 4 Great Vessels)                            -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- 1) 대정맥 (Vena Cava): 온몸(y=586, x=185..245) ➔ 우심방(x=320, y=238..296) -->
  <path id="vesselVenaCava" class="vessel-contour" fill="#0284c7"
        d="M185 586 L185 295 C185 245 235 238 320 238 L320 296 C265 296 245 315 245 345 L245 586 Z"/>

  <!-- 2) 대동맥 (Aorta): 좌심실 상단(x=520..568, y=348) ➔ 대동맥궁 ➔ 온몸(y=586, x=730..780) -->
  <path id="vesselAorta" class="vessel-contour" fill="#e11d48"
        d="M520 348 L520 220 C520 155 580 135 650 135 C740 135 780 175 780 265 L780 586 L730 586 L730 270 C730 215 705 185 650 185 C595 185 568 215 568 265 L568 348 Z"/>

  <!-- 3) 폐동맥 (Pulmonary Artery): 우심실 상단(x=432..480, y=348) ➔ 폐(y=165, x=355..405) -->
  <path id="vesselPulmonaryArtery" class="vessel-contour" fill="#0284c7"
        d="M432 348 L432 235 C432 195 405 175 355 165 L405 165 C450 175 480 200 480 240 L480 348 Z"/>

  <!-- 4) 폐정맥 (Pulmonary Vein): 폐(y=165, x=595..645) ➔ 좌심방 상단(y=238, x=595..645) -->
  <path id="vesselPulmonaryVein" class="vessel-contour" fill="#e11d48"
        d="M595 238 L595 165 L645 165 L645 238 Z"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 5. 4개 방실 (Chambers) & 사이막 (Septum)                          -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- 우심방 (Right Atrium): 외측에 위치 (x=320..420, y=238..335) -->
  <path id="rightAtrium" class="chamber-rect" fill="#0284c7"
        d="M320 238 L420 238 L420 335 L320 335 Z"/>

  <!-- 좌심방 (Left Atrium): 외측에 위치 (x=580..680, y=238..335) -->
  <path id="leftAtrium" class="chamber-rect" fill="#e11d48"
        d="M580 238 L680 238 L680 335 L580 335 Z"/>

  <!-- 우심실 (Right Ventricle): 우심방 아래, 폐동맥과 직결 (x=320..480, y=348..525) -->
  <path id="rightVentricle" class="chamber-rect" fill="#0284c7"
        d="M320 348 L480 348 L480 525 C415 520 365 490 335 445 C322 420 320 380 320 348 Z"/>

  <!-- 좌심실 (Left Ventricle): 좌심방 아래, 대동맥과 직결 (x=520..680, y=348..535) -->
  <path id="leftVentricle" class="chamber-rect" fill="#e11d48"
        d="M520 348 L680 348 C680 380 678 420 660 455 C635 500 585 530 520 535 Z"/>

  <!-- ── 심실벽 두께 대비 (좌심실벽 24px vs 우심실벽 8px, 정확히 3배!) ── -->
  <path id="leftVentricleWall" fill="none" stroke="#fda4af" stroke-width="24" stroke-linecap="round" opacity="0.75"
        d="M670 355 C675 400 670 445 650 478 C622 520 575 546 515 555"/>
  <path id="rightVentricleWall" fill="none" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round" opacity="0.65"
        d="M328 355 C322 400 328 440 345 470 C375 512 425 542 485 555"/>

  <!-- ── 심실 사이막 (Septum): 좌우 완벽 분리 (x=485..515, y=238..558) ── -->
  <path id="septum" class="septum-fill"
        d="M485 238 L515 238 L515 558 C505 565 495 565 485 558 Z"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 6. 판막 넷 (Valves - 위치 엄수)                                   -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- 삼첨판 (우심방 ➔ 우심실 입구, y=335..348, x=335..415) -->
  <g id="valveTricuspid">
    <path class="valve-leaflet" d="M335 338 C355 352 370 352 385 342 C395 352 405 352 415 338"/>
    <line x1="360" y1="348" x2="362" y2="378" class="chordae-line"/>
    <line x1="385" y1="344" x2="386" y2="378" class="chordae-line"/>
    <line x1="405" y1="348" x2="403" y2="378" class="chordae-line"/>
    <circle cx="362" cy="380" r="3" class="papillary-musc"/>
    <circle cx="386" cy="380" r="3" class="papillary-musc"/>
    <circle cx="403" cy="380" r="3" class="papillary-musc"/>
  </g>

  <!-- 이첨판 (좌심방 ➔ 좌심실 입구, y=335..348, x=585..665) -->
  <g id="valveMitral">
    <path class="valve-leaflet" d="M585 338 C600 352 620 352 635 342 C645 352 655 352 665 338"/>
    <line x1="605" y1="348" x2="607" y2="378" class="chordae-line"/>
    <line x1="635" y1="344" x2="636" y2="378" class="chordae-line"/>
    <line x1="655" y1="348" x2="653" y2="378" class="chordae-line"/>
    <circle cx="607" cy="380" r="3" class="papillary-musc"/>
    <circle cx="636" cy="380" r="3" class="papillary-musc"/>
    <circle cx="653" cy="380" r="3" class="papillary-musc"/>
  </g>

  <!-- ★ 폐동맥판 (우심실 ➔ 폐동맥 입구, y=336..348, x=432..480) -->
  <g id="valvePulmonary">
    <path class="valve-leaflet" d="M432 348 C432 334 480 334 480 348 C465 342 450 342 432 348 Z"/>
  </g>

  <!-- ★ 대동맥판 (좌심실 ➔ 대동맥 입구, y=336..348, x=520..568) -->
  <g id="valveAortic">
    <path class="valve-leaflet" d="M520 348 C520 334 568 334 568 348 C552 342 536 342 520 348 Z"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 7. 혈류 안내선 (보이지 않는 패스, 50% 분기점 정밀 일치)           -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <path id="flowPulmonary" fill="none" stroke="none" d="M360 470 C350 410 410 380 456 348 L456 235 C456 195 405 175 385 165 C370 128 402 82 450 82 L500 82 L550 82 C590 82 615 115 620 165 L620 238 L620 290 C620 320 625 348 625 390 C625 430 520 440 450 440 C400 440 360 470 360 470 Z"/>
  <path id="flowSystemic" fill="none" stroke="none" d="M620 440 C620 395 565 375 544 348 L544 220 C544 155 580 135 650 135 C740 135 755 175 755 265 L755 586 C755 612 720 628 650 628 L500 628 L350 628 C280 628 193.35 612 193.35 586 L193.35 345 C193.35 285 265 238 320 238 L370 238 C390 238 375 310 375 348 C375 430 460 440 530 440 C580 440 620 440 620 440 Z"/>
</svg>