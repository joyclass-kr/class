<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <!-- Clip path conforming liquid layers to the inner U-shaped test tube profile -->
    <clipPath id="tubeLiquidClip">
      <path d="M 135,175 L 135,520 A 60,60 0 0,0 255,520 L 255,175 Z" />
    </clipPath>

    <style>
      /* Flat Textbook Schematic Stylesheet (2.4 ~ 3.0px crisp strokes) */
      .glass-wall { fill: none; stroke: #94a3b8; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
      .glass-rim { fill: none; stroke: #94a3b8; stroke-width: 2.8; }
      .glass-tick-major { stroke: #94a3b8; stroke-width: 2.2; stroke-linecap: round; }
      .glass-tick-minor { stroke: #94a3b8; stroke-width: 1.5; stroke-linecap: round; opacity: 0.7; }
      .glass-shine { fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; opacity: 0.35; }
      
      .rack-base { fill: #1e293b; stroke: #475569; stroke-width: 2.6; stroke-linejoin: round; }
      .rack-support { fill: none; stroke: #475569; stroke-width: 2.8; stroke-linecap: round; }
      
      .vessel-wall-outer { fill: #1e293b; stroke: #64748b; stroke-width: 2.8; stroke-linejoin: round; }
      .vessel-endothelium { fill: none; stroke: #64748b; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .endo-nucleus { fill: #334155; stroke: #64748b; stroke-width: 1.8; }
      
      .cell-wbc { fill: #ddd6fe; stroke: #a78bfa; stroke-width: 2.8; stroke-linejoin: round; }
      .wbc-granule { fill: #c4b5fd; }
      .cell-wbc-nucleus { fill: #7c3aed; stroke: #5b21b6; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
      
      .cell-rbc { fill: #dc2626; stroke: #991b1b; stroke-width: 2.8; stroke-linejoin: round; }
      .rbc-slope { fill: #ef4444; stroke: #b91c1c; stroke-width: 1.8; }
      .rbc-depression { fill: #f87171; stroke: #ef4444; stroke-width: 2.0; }
      
      .cell-platelet { fill: #fbbf24; stroke: #d97706; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <!-- ================================================================= -->
  <!-- LEFT SECTION (x 60 ~ 330): CENTRIFUGED TEST TUBE                  -->
  <!-- ================================================================= -->

  <!-- Minimal Laboratory Tube Stand (시험관 받침대) -->
  <g id="stand" opacity="0.9">
    <!-- Stand Heavy Footing Base -->
    <rect class="rack-base" x="110" y="605" width="170" height="24" rx="6" />
    <line x1="120" y1="629" x2="148" y2="629" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="242" y1="629" x2="270" y2="629" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    
    <!-- Curved Cradle Rest holding Test Tube Base -->
    <path class="rack-support" d="M 120,565 C 130,592 160,605 195,605 C 230,605 260,592 270,565" />
    <!-- Vertical Ground Pegs -->
    <line class="rack-support" x1="140" y1="595" x2="140" y2="605" />
    <line class="rack-support" x1="250" y1="595" x2="250" y2="605" />
  </g>

  <!-- Centrifuged Blood Layers (위에서부터 3개 층, 반드시 <rect>) -->
  <g clip-path="url(#tubeLiquidClip)">
    <!-- 1. Plasma Layer (혈장: 55% of 400 = 220px, #fde68a) -->
    <rect id="plasmaLayer" x="135" y="180" width="120" height="220" fill="#fde68a" />
    
    <!-- 2. Buffy Coat Layer (백혈구·혈소판 층: 3% of 400 = 12px, #e2e8f0) -->
    <rect id="buffyLayer" x="135" y="400" width="120" height="12" fill="#e2e8f0" />
    
    <!-- 3. Red Blood Cell Layer (적혈구 층: 42% of 400 = 168px, #dc2626) -->
    <rect id="rbcLayer" x="135" y="412" width="120" height="168" fill="#dc2626" />
  </g>

  <!-- Test Tube Glass (시험관 유리, id="tube") -->
  <g id="tube">
    <!-- Outer Glass Wall & Hemispherical U-Bottom -->
    <path class="glass-wall"
          d="M 125,95
             C 125,102 131,108 131,118
             L 131,520
             A 64,64 0 0,0 259,520
             L 259,118
             C 259,108 265,102 265,95" />

    <!-- Top Rim Opening Flange -->
    <ellipse class="glass-rim" cx="195" cy="95" rx="70" ry="13" />
    <ellipse cx="195" cy="95" rx="60" ry="9" fill="none" stroke="#94a3b8" stroke-width="1.8" opacity="0.6" />

    <!-- Liquid Top Meniscus Line -->
    <path d="M 135,180 Q 195,188 255,180" fill="none" stroke="#fef08a" stroke-width="2.4" stroke-linecap="round" />

    <!-- Graduated Measurement Tick Marks (눈금선, NO TEXT) -->
    <g opacity="0.85">
      <line class="glass-tick-major" x1="131" y1="200" x2="147" y2="200" />
      <line class="glass-tick-minor" x1="131" y1="220" x2="140" y2="220" />
      <line class="glass-tick-minor" x1="131" y1="240" x2="140" y2="240" />
      <line class="glass-tick-minor" x1="131" y1="260" x2="140" y2="260" />
      <line class="glass-tick-major" x1="131" y1="280" x2="147" y2="280" />
      <line class="glass-tick-minor" x1="131" y1="300" x2="140" y2="300" />
      <line class="glass-tick-minor" x1="131" y1="320" x2="140" y2="320" />
      <line class="glass-tick-minor" x1="131" y1="340" x2="140" y2="340" />
      <line class="glass-tick-major" x1="131" y1="360" x2="147" y2="360" />
      <line class="glass-tick-minor" x1="131" y1="380" x2="140" y2="380" />
      <line class="glass-tick-major" x1="131" y1="400" x2="149" y2="400" stroke="#f8fafc" />
      <line class="glass-tick-minor" x1="131" y1="420" x2="140" y2="420" />
      <line class="glass-tick-minor" x1="131" y1="440" x2="140" y2="440" />
      <line class="glass-tick-minor" x1="131" y1="460" x2="140" y2="460" />
      <line class="glass-tick-major" x1="131" y1="480" x2="147" y2="480" />
      <line class="glass-tick-minor" x1="131" y1="500" x2="140" y2="500" />
      <line class="glass-tick-major" x1="131" y1="520" x2="147" y2="520" />
    </g>

    <!-- Glass Specular Reflection Highlights -->
    <path class="glass-shine" d="M 138,120 L 138,515 A 57,57 0 0,0 168,567" />
    <line class="glass-shine" x1="252" y1="120" x2="252" y2="490" stroke-width="1.6" opacity="0.25" />
  </g>


  <!-- ================================================================= -->
  <!-- RIGHT SECTION (x 420 ~ 940): BLOOD VESSEL & MAGNIFIED CELLS       -->
  <!-- ================================================================= -->

  <!-- Blood Vessel (혈관, id="vessel") -->
  <g id="vessel">
    <!-- Upper Vessel Wall (Tunica Media / Smooth Muscle) -->
    <path class="vessel-wall-outer"
          d="M 410,145
             L 950,145
             L 950,188
             L 410,188
             Z" />
    <!-- Endothelial lining cells (내피세포층) upper wave -->
    <path class="vessel-endothelium"
          d="M 410,188
             Q 437,196 464,188 Q 491,196 518,188 Q 545,196 572,188
             Q 599,196 626,188 Q 653,196 680,188 Q 707,196 734,188
             Q 761,196 788,188 Q 815,196 842,188 Q 869,196 896,188
             Q 923,196 950,188" />
    <!-- Endothelial cell nuclei (상단 내피세포 핵) -->
    <ellipse class="endo-nucleus" cx="464" cy="166" rx="15" ry="6" />
    <ellipse class="endo-nucleus" cx="572" cy="166" rx="15" ry="6" />
    <ellipse class="endo-nucleus" cx="680" cy="166" rx="15" ry="6" />
    <ellipse class="endo-nucleus" cx="788" cy="166" rx="15" ry="6" />
    <ellipse class="endo-nucleus" cx="896" cy="166" rx="15" ry="6" />

    <!-- Lower Vessel Wall (Tunica Media / Smooth Muscle) -->
    <path class="vessel-wall-outer"
          d="M 410,512
             L 950,512
             L 950,555
             L 410,555
             Z" />
    <!-- Endothelial lining cells lower wave -->
    <path class="vessel-endothelium"
          d="M 410,512
             Q 437,504 464,512 Q 491,504 518,512 Q 545,504 572,512
             Q 599,504 626,512 Q 653,504 680,512 Q 707,504 734,512
             Q 761,504 788,512 Q 815,504 842,512 Q 869,504 896,512
             Q 923,504 950,512" />
    <!-- Endothelial cell nuclei (하단 내피세포 핵) -->
    <ellipse class="endo-nucleus" cx="464" cy="534" rx="15" ry="6" />
    <ellipse class="endo-nucleus" cx="572" cy="534" rx="15" ry="6" />
    <ellipse class="endo-nucleus" cx="680" cy="534" rx="15" ry="6" />
    <ellipse class="endo-nucleus" cx="788" cy="534" rx="15" ry="6" />
    <ellipse class="endo-nucleus" cx="896" cy="534" rx="15" ry="6" />

    <!-- Vessel Opening Slice Rings at Ends -->
    <ellipse cx="410" cy="350" rx="12" ry="162" fill="none" stroke="#475569" stroke-width="2.2" stroke-dasharray="6,4" />
    <ellipse cx="950" cy="350" rx="12" ry="162" fill="none" stroke="#64748b" stroke-width="2.6" />
  </g>


  <!-- Flow Guide Path (보이지 않는 path, 관 한가운데를 지남) -->
  <path id="flowBlood" fill="none" stroke="none" d="M 400,350 L 960,350" />


  <!-- ================================================================= -->
  <!-- 3 MAGNIFIED BLOOD CELLS (WBC > RBC > Platelet)                   -->
  <!-- ================================================================= -->

  <!-- 1. White Blood Cell (백혈구 확대, id="wbc") -->
  <!-- Largest: ~152px, Pale Lavender #ddd6fe, Has prominent Nucleus #7c3aed -->
  <g id="wbc">
    <!-- Cytoplasm Body (둥글고 큰 세포질) -->
    <circle class="cell-wbc" cx="525" cy="350" r="76" />
    
    <!-- Cytoplasmic Granules (세포질 속 미세 과립) -->
    <g class="wbc-granule">
      <circle cx="472" cy="330" r="3.2" />
      <circle cx="485" cy="365" r="2.8" />
      <circle cx="480" cy="392" r="3.0" />
      <circle cx="504" cy="408" r="2.5" />
      <circle cx="532" cy="414" r="3.2" />
      <circle cx="562" cy="406" r="2.8" />
      <circle cx="582" cy="382" r="3.0" />
      <circle cx="588" cy="346" r="2.6" />
      <circle cx="574" cy="314" r="3.2" />
      <circle cx="550" cy="292" r="2.8" />
      <circle cx="520" cy="286" r="3.0" />
      <circle cx="490" cy="300" r="2.5" />
      <circle cx="465" cy="352" r="2.8" />
    </g>

    <!-- Nucleus (백혈구의 핵, id="wbcNucleus") -->
    <!-- Characteristic 3-Lobed Polymorphonuclear Neutrophil Nucleus -->
    <g id="wbcNucleus">
      <!-- 3 Lobes connected by thin chromatin isthmuses -->
      <path class="cell-wbc-nucleus"
            d="M 508,300
               C 488,295 476,310 478,328
               C 480,344 496,354 512,348
               C 520,345 525,352 524,360
               C 518,375 498,378 496,396
               C 494,414 514,424 532,418
               C 550,412 556,394 544,380
               C 538,374 542,364 550,360
               C 566,354 582,360 584,340
               C 586,320 568,306 550,312
               C 536,316 528,308 524,298
               C 520,288 514,292 508,300 Z" />
      <!-- Chromatin Dense Centers inside Lobes -->
      <circle cx="496" cy="326" r="5.0" fill="#5b21b6" />
      <circle cx="524" cy="402" r="5.5" fill="#5b21b6" />
      <circle cx="566" cy="334" r="5.0" fill="#5b21b6" />
    </g>
  </g>

  <!-- 2. Red Blood Cell (적혈구 확대, id="rbc") -->
  <!-- Medium: ~108px, Deep Red #dc2626, Biconcave Disc (STRICTLY NO NUCLEUS) -->
  <g id="rbc">
    <!-- Outer Biconcave Disc Rim (외곽 두꺼운 도넛 림) -->
    <circle class="cell-rbc" cx="710" cy="350" r="54" />
    
    <!-- Inward Slope Transition (오목해지는 경사면) -->
    <circle class="rbc-slope" cx="710" cy="350" r="39" />
    
    <!-- Central Concave Depression (가운데 가장 오목한 얇은 부위, 밝은 적색, 핵 없음!) -->
    <circle class="rbc-depression" cx="710" cy="350" r="24" />
    
    <!-- Subtle Inner Arc Highlight showing Biconcave Depth Contour -->
    <path d="M 694,342 C 700,336 720,336 726,342" fill="none" stroke="#fca5a5" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- 3. Platelet (혈소판 확대, id="platelet") -->
  <!-- Smallest: ~42px, Amber #fbbf24, Irregular Cellular Fragment (STRICTLY NO NUCLEUS) -->
  <g id="platelet">
    <!-- Primary Irregular Thrombocyte Fragment with Pseudopodia -->
    <path class="cell-platelet"
          d="M 855,330
             L 872,325
             L 886,336
             L 898,332
             L 894,350
             L 904,358
             L 892,374
             L 876,370
             L 866,382
             L 852,370
             L 842,354
             L 848,342
             Z" />
    <!-- Fine Thrombocyte Granules (혈소판 과립, 핵 아님!) -->
    <circle cx="868" cy="346" r="2.2" fill="#d97706" />
    <circle cx="878" cy="354" r="2.0" fill="#d97706" />
    <circle cx="862" cy="360" r="2.0" fill="#d97706" />
    <circle cx="886" cy="348" r="2.0" fill="#d97706" />

    <!-- Satellite Cellular Micro-Fragments (거핵세포의 세포질 파편 조각들) -->
    <path class="cell-platelet" d="M 832,322 L 842,318 L 846,328 L 837,331 Z" />
    <path class="cell-platelet" d="M 886,390 L 897,388 L 899,398 L 889,399 Z" />
    <path class="cell-platelet" d="M 838,375 L 846,373 L 848,382 L 840,383 Z" />
  </g>

</svg>