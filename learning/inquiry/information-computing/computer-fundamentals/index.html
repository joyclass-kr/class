<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="하드웨어, 소프트웨어, 운영체제, 앱, 아날로그와 디지털 변환의 구조와 동작 원리">
    <title>컴퓨터 원리와 활용</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="lessons/system-lessons.css">
    <script src="lessons/foundation-core.js" defer></script>
    <script src="lessons/concept-visuals.js" defer></script>
    <script src="lessons/foundation-compact.js" defer></script>
    <script src="lessons/foundation-b.js" defer></script>
    <script src="lessons/foundation-c.js" defer></script>
    <script src="lessons/foundation-d.js" defer></script>
    <script src="lessons/foundation-e.js" defer></script>
    <script src="lessons/foundation-fg.js" defer></script>
    <script src="lessons/foundation-h.js" defer></script>
    <script src="lessons/foundation-ij.js" defer></script>
    <script src="lessons/system-lessons.js" defer></script>
</head>
<body data-course-root="true">
    <header class="app-bar">
        <a class="back-button" href="../../../../" aria-label="포털 메인으로 돌아가기">←</a>

        <button id="openCourse" class="course-button" type="button">차시 목록</button>
    </header>

    <main class="lesson-shell">
        <div class="lesson-meta">
            <span id="lessonMeta">2차시</span>
            <span id="stepStatus" aria-live="polite">개념 1 / 3</span>
        </div>
        <h1 id="lessonTitle"></h1>

        <section id="stageConcept" class="stage is-active" aria-labelledby="conceptTitle">
            <div class="stage-heading">
                <div>
                    <span class="stage-label">개념 설명</span>
                    <h2 id="conceptTitle"></h2>
                </div>
            </div>
            <div id="conceptParts"></div>
            <div id="conceptOverview" class="concept-overview">
                <div id="conceptVisual"></div>
                <div id="conceptDetails" class="concept-grid"></div>
            </div>
            <div id="conceptDiagram" class="concept-diagram"></div>
            <div id="conceptDevices"></div>
            <div id="conceptStory"></div>
            <div id="conceptCompare"></div>
            <div id="conceptAnalogy"></div>
            <div class="stage-actions end-aligned">
                <button id="startActivity" class="primary-button" type="button">활동 시작</button>
            </div>
        </section>

        <section id="stageActivity" class="stage" aria-labelledby="activityTitle" hidden>
            <div class="stage-heading">
                <div>
                    <span class="stage-label">직접 조작</span>
                    <h2 id="activityTitle"></h2>
                </div>
                <button id="resetActivity" class="text-button" type="button">처음부터</button>
            </div>
            <p id="activityInstruction" class="task-instruction"></p>
            <div id="activityMount"></div>
            <div class="stage-actions">
                <p id="activityFeedback" class="feedback" aria-live="polite"></p>
                <button id="checkActivity" class="primary-button" type="button">확인</button>
            </div>
        </section>

        <section id="stageQuiz" class="stage" aria-labelledby="quizTitle" hidden>
            <div class="stage-heading">
                <div>
                    <span id="quizCount" class="stage-label">문제 1 / 5</span>
                    <h2 id="quizTitle">상황에 적용하기</h2>
                </div>
            </div>
            <div class="quiz-card">
                <p id="questionText" class="question-text"></p>
                <div id="questionOptions" class="question-options"></div>
                <p id="quizFeedback" class="feedback quiz-feedback" aria-live="polite"></p>
            </div>
            <div class="stage-actions end-aligned">
                <button id="submitAnswer" class="primary-button" type="button" disabled>답 확인</button>
                <button id="nextQuestion" class="primary-button" type="button" hidden>다음 문제</button>
            </div>
        </section>

        <section id="stageResult" class="stage" aria-labelledby="resultTitle" hidden>
            <div class="result-grid">
                <div class="result-score" aria-hidden="true"><strong id="scoreNumber">0</strong><span id="scoreTotal">/ 5</span></div>
                <div>
                    <span class="stage-label">차시 결과</span>
                    <h2 id="resultTitle">학습 결과</h2>
                    <p id="resultMessage"></p>
                </div>
            </div>
            <div id="reviewList" class="review-list"></div>
            <div class="stage-actions result-actions">
                <button id="retryQuiz" class="secondary-button" type="button">문제 다시 풀기</button>
                <a id="nextLesson" class="primary-button" href="#">다음 차시</a>
            </div>
        </section>
    </main>

    <dialog id="courseDialog" class="course-dialog" aria-labelledby="courseTitle">
        <div class="dialog-heading">
            <h2 id="courseTitle">차시 목록</h2>
            <button id="closeCourse" class="icon-button" type="button" aria-label="차시 목록 닫기">×</button>
        </div>
        <div id="lessonList" class="course-modules"></div>
    </dialog>
</body>
</html>
