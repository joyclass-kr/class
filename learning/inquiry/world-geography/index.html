<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123c46">
  <title>세계지리 지도 학습 | Joyclass</title>
  <link rel="stylesheet" href="../korean-museum/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=20260903-2">
</head>
<body>
  <div class="app-shell">
    <nav class="topbar" aria-label="페이지 기능">
      <a class="back-link" href="../../../" aria-label="학습 메뉴로 돌아가기">←</a>
      <div class="page-name"><span aria-hidden="true">🌍</span><strong>세계지리</strong></div>
      <button class="progress-button" id="progressButton" type="button" aria-label="학습 기록 보기">
        <span>누적 정답</span><strong id="progressScore">0 / 0</strong>
      </button>
    </nav>

    <nav class="theme-tabs" aria-label="세계지리 학습 주제">
      <button class="theme-tab is-active" type="button" data-theme="world" aria-pressed="true"><span>🌐</span> 대륙·대양</button>
      <button class="theme-tab" type="button" data-theme="coordinates" aria-pressed="false"><span>⊕</span> 위도·경도</button>
      <button class="theme-tab" type="button" data-theme="terrain" aria-pressed="false"><span>⛰️</span> 지형</button>
      <button class="theme-tab" type="button" data-theme="climate" aria-pressed="false"><span>🌦️</span> 기후</button>
      <button class="theme-tab" type="button" data-theme="population" aria-pressed="false"><span>🏙️</span> 인구·도시</button>
      <button class="theme-tab" type="button" data-theme="region" aria-pressed="false"><span>🧭</span> 지역</button>
    </nav>

    <main class="study-layout">
      <section class="map-stage" aria-label="세계지리 주제 지도">
        <div id="map" role="application" aria-label="세계지리 학습 지도"></div>
        <section class="theme-layer-dock" id="themeLayerDock" aria-labelledby="themeLayerTitle">
          <div class="theme-layer-heading">
            <div>
              <span>골라 보는 세계</span>
              <h2 id="themeLayerTitle">테마 지도</h2>
            </div>
            <button id="themeLayerToggle" type="button" aria-expanded="true" aria-controls="themeLayerControls">접기</button>
          </div>
          <p id="themeLayerHelp">관심 있는 주제를 겹쳐 켜고 아이콘을 눌러 보세요.</p>
          <div class="theme-layer-controls" id="themeLayerControls"></div>
          <div class="theme-layer-footer">
            <strong id="themeItemCount">0개 표시</strong>
            <button id="recommendedLayers" type="button">추천 조합</button>
          </div>
        </section>
        <div class="map-key" id="mapKey" aria-live="polite"></div>
        <article class="theme-item-card" id="themeItemCard" aria-live="polite" hidden>
          <button class="theme-item-close" id="closeThemeItem" type="button" aria-label="테마 설명 닫기">×</button>
          <div class="theme-item-icon" id="themeItemIcon" aria-hidden="true">🌍</div>
          <div class="theme-item-copy">
            <span id="themeItemCategory">테마</span>
            <h3 id="themeItemName">세계 탐험</h3>
            <strong id="themeItemPlace"></strong>
            <p id="themeItemDescription"></p>
            <button id="speakThemeItem" type="button">🔊 설명 듣기</button>
          </div>
        </article>
        <p class="map-help" id="mapHelp">색 표식은 지리 개념, 그림 표식은 테마 정보예요.</p>
      </section>

      <aside class="study-panel">
        <section class="concept-card" aria-labelledby="conceptTitle">
          <div class="section-kicker" id="conceptKicker"></div>
          <h1 id="conceptTitle"></h1>
          <p id="conceptSummary"></p>
          <div class="concept-points" id="conceptPoints"></div>
          <div class="feature-list" id="featureList" aria-label="지도 핵심 지점"></div>
        </section>
        <section class="practice-launch" aria-label="현재 주제 문제 풀기">
          <button class="primary-button" id="startPractice" type="button">대륙·대양 문제 5개 풀기</button>
        </section>
      </aside>
    </main>
  </div>

  <dialog class="practice-dialog" id="practiceDialog" aria-labelledby="questionTitle">
    <div class="dialog-topbar">
      <div><strong id="questionProgress">1 / 5</strong><span id="questionTopic">대륙·대양</span></div>
      <button id="closePractice" type="button" aria-label="문제 풀이 닫기">×</button>
    </div>
    <div class="progress-track" aria-hidden="true"><span id="questionProgressBar"></span></div>
    <section class="question-body">
      <div class="question-copy">
        <span class="difficulty-badge" id="questionDifficulty">기본</span>
        <h2 id="questionTitle"></h2>
        <div class="answer-options" id="answerOptions"></div>
      </div>
      <div class="question-map-wrap">
        <div id="questionMap" aria-label="문제 관련 위치 지도"></div>
        <p id="questionMapCaption">지도 단서를 누르면 관련 위치를 확인할 수 있어요.</p>
      </div>
    </section>
    <section class="answer-feedback" id="answerFeedback" aria-live="polite" hidden>
      <strong id="feedbackTitle"></strong>
      <p id="feedbackExplanation"></p>
    </section>
    <div class="dialog-actions">
      <button class="secondary-button" id="showHint" type="button">지도 단서</button>
      <button class="primary-button" id="nextQuestion" type="button" disabled>다음 문제</button>
    </div>
  </dialog>

  <dialog class="result-dialog" id="resultDialog" aria-labelledby="resultTitle">
    <div class="result-visual" id="resultVisual">0/5</div>
    <h2 id="resultTitle">연습 완료</h2>
    <p id="resultSummary"></p>
    <div class="result-actions">
      <button class="secondary-button" id="reviewWrong" type="button">틀린 문제 복습</button>
      <button class="primary-button" id="finishPractice" type="button">지도 학습으로</button>
    </div>
  </dialog>

  <script src="../korean-museum/vendor/leaflet/leaflet.js"></script>
  <script src="data.js?v=20260903-2"></script>
  <script src="theme-items.js?v=20260903-3"></script>
  <script src="app.js?v=20260903-3"></script>
</body>
</html>
