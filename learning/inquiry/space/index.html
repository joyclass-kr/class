<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="우주 관찰과 천문학 학습 - 지구와 달의 운동, 태양계의 구성원, 별과 별자리">
    <title>우주 관찰</title>
    <link rel="preload" as="image" href="assets/images/space-hub-background.jpg">
    <link rel="stylesheet" href="styles.css?v=space-hub-background-20260802">
</head>
<body>

    <!-- Header Navigation -->
    <header class="top-header" style="position: relative; z-index: 100;">
        <div class="brand-section">
            <a href="../../../" class="home-btn">
                <span>◀</span> 포털 메인
            </a>
            <h1 class="app-title">🌌 우주 관찰 <span style="font-size: 14px; color: #38bdf8; font-weight: 700; margin-left: 4px;">(Space Observation)</span><span class="badge">Astronomy</span></h1>
        </div>
    </header>

    <!-- Main Content Container -->
    <div class="space-hub-container">

        <!-- 3 Paths Grid -->
        <div class="path-grid">
            
            <!-- Path 1: 지구와 달 -->
            <a href="./earth-moon/" class="path-card">
                <div>
                    <div class="card-icon">🌕</div>
                    <div class="card-title">
                        <span class="card-title-main">지구와 달의 운동</span>
                        <span class="card-title-sub">Motions of Earth &amp; Moon</span>
                    </div>
                    <div class="card-desc">
                        지구의 자전과 공전, 계절과 태양 고도, 달의 공전과 위상
                    </div>
                </div>
                <div class="btn-enter">
                    <span>이동하기</span>
                    <span>→</span>
                </div>
            </a>

            <!-- Path 2: 태양계 -->
            <a href="./solar-system/" class="path-card">
                <div>
                    <div class="card-icon">🪐</div>
                    <div class="card-title">
                        <span class="card-title-main">태양계의 구성원</span>
                        <span class="card-title-sub">Members of the Solar System</span>
                    </div>
                    <div class="card-desc">
                        태양과 행성, 위성, 소행성, 왜행성, 혜성 등 태양계 천체 관찰
                    </div>
                </div>
                <div class="btn-enter">
                    <span>이동하기</span>
                    <span>→</span>
                </div>
            </a>

            <!-- Path 3: 별과 별자리 -->
            <a href="./constellations/" class="path-card">
                <div>
                    <div class="card-icon">⭐</div>
                    <div class="card-title">
                        <span class="card-title-main">별과 별자리</span>
                        <span class="card-title-sub">Stars &amp; Constellations</span>
                    </div>
                    <div class="card-desc">
                        별자리와 천구, 별의 일주·연주 운동, 별의 색·밝기·일생
                    </div>
                </div>
                <div class="btn-enter">
                    <span>이동하기</span>
                    <span>→</span>
                </div>
            </a>

        </div>
    </div>

</body>
</html>
