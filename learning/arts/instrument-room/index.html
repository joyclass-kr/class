<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1114">
    <title>디지털 악기실</title>
    <meta name="description" content="피아노와 물리 모델링 베이스, 기타, 드럼을 바로 연주하는 디지털 악기실">
    <link rel="preload" href="../music-studio/assets/piano/C2.ogg" as="fetch" type="audio/ogg" crossorigin>
    <link rel="preload" href="../music-studio/assets/piano/C3.ogg" as="fetch" type="audio/ogg" crossorigin>
    <link rel="preload" href="../music-studio/assets/piano/C4.ogg" as="fetch" type="audio/ogg" crossorigin>
    <link rel="preload" href="../music-studio/assets/piano/C5.ogg" as="fetch" type="audio/ogg" crossorigin>
    <link rel="preload" href="instrument-worklet-v2.js?v=20260824-fast-adsr" as="script">
    <link rel="stylesheet" href="styles.css?v=20260825-drum-rooms">
    <script src="instrument-core.js?v=20260824-physical-room" defer></script>
    <script src="app.js?v=20260825-drum-webp" defer></script>
</head>
<body>
    <div class="room-glow" aria-hidden="true"></div>
    <div class="app-shell">
        <header class="topbar">
            <a class="back-link" href="../../../" aria-label="메인 화면으로 돌아가기">← <span>메인</span></a>
            <div class="room-title">
                <b>디지털 악기실</b>
            </div>
            <button id="audioButton" class="audio-button" type="button">소리 켜기</button>
        </header>

        <main>
            <nav class="instrument-tabs" aria-label="악기 대분류 선택">
                <button class="active" type="button" data-family="keyboard" aria-selected="true"><span aria-hidden="true">♬</span><b>건반</b><small>KEYS</small></button>
                <button type="button" data-family="guitar" aria-selected="false"><span aria-hidden="true">⌁</span><b>기타</b><small>GUITAR</small></button>
                <button type="button" data-family="bass" aria-selected="false"><span aria-hidden="true">≋</span><b>베이스</b><small>BASS</small></button>
                <button type="button" data-family="drums" aria-selected="false"><span aria-hidden="true">◉</span><b>드럼</b><small>DRUMS</small></button>
                <button type="button" data-family="strings" aria-selected="false"><span aria-hidden="true">◒</span><b>현악</b><small>STRINGS</small></button>
                <button type="button" data-family="woodwind" aria-selected="false"><span aria-hidden="true">◌</span><b>목관</b><small>WOODWIND</small></button>
                <button type="button" data-family="brass" aria-selected="false"><span aria-hidden="true">◖</span><b>금관</b><small>BRASS</small></button>
                <button type="button" data-family="percussion" aria-selected="false"><span aria-hidden="true">✦</span><b>타악</b><small>PERCUSSION</small></button>
                <button type="button" data-family="korean" aria-selected="false"><span aria-hidden="true">한</span><b>국악</b><small>KOREAN</small></button>
            </nav>
            <section class="model-browser" aria-label="악기 모델 선택">
                <div class="browser-title"><span id="familyEyebrow">KEYBOARD</span><b id="familyName">건반악기</b></div>
                <div id="koreanRoomSwitch" class="korean-room-switch hidden" role="tablist" aria-label="국악방 선택">
                    <button class="active" type="button" data-korean-room="melody" role="tab" aria-selected="true">선율악기방</button>
                    <button type="button" data-korean-room="percussion" role="tab" aria-selected="false">타악기방</button>
                </div>
                <div id="modelChooser" class="model-chooser" role="list"></div>
            </section>

            <section class="instrument-console" aria-labelledby="instrumentName">
                <div class="console-head">
                    <div class="screen-reader-only">
                        <span id="modelBadge" class="model-badge">SAMPLED GRAND</span>
                        <h1 id="instrumentName">그랜드 피아노</h1>
                        <p id="instrumentDescription">화성학 연습실과 같은 피아노예요. 건반을 누르고 스페이스바로 서스테인을 사용해 보세요.</p>
                    </div>
                    <div id="guitarModeSwitch" class="mode-switch hidden" role="group" aria-label="기타 입력 방식">
                        <button class="active" type="button" data-guitar-mode="keyboard">건반</button>
                        <button type="button" data-guitar-mode="chords">코드패드</button>
                    </div>
                </div>

                <div class="console-body">
                    <div class="instrument-visual stage-piano" id="instrumentVisual">
                        <div class="visual-label"><span id="visualFamily">ACOUSTIC</span><b id="visualModel">88 GRAND</b></div>
                        <div class="studio-stage" id="studioStage">
                            <div id="scaleGuide" class="scale-guide hidden" aria-label="실제 악기 크기 안내">
                                <span>실제 외형 기준</span><div class="scale-track"><i id="scaleBar"></i></div><b id="scaleValue"></b>
                                <small id="scaleNote">모든 방에서 같은 기준 눈금으로 비교해요</small>
                            </div>
                            <img id="instrumentArtwork" class="instrument-artwork hidden" src="" alt="">
                            <div id="classicalRender" class="classical-render hidden" aria-hidden="true"><i class="render-top"></i><i class="render-neck"></i><i class="render-body upper"></i><i class="render-body lower"></i><i class="render-detail"></i></div>
                            <div id="machineDeck" class="machine-deck hidden" aria-label="전자 드럼 머신"></div>
                            <div id="malletRender" class="mallet-render hidden" aria-hidden="true"></div>
                            <canvas id="stringCanvas" width="720" height="180" aria-hidden="true"></canvas>
                            <div class="stage-shadow" aria-hidden="true"></div>
                        </div>
                        <div class="performance-rail" aria-hidden="true"><span>EXPRESSION</span><div class="dynamic-envelope"><i></i></div><div class="signal-meter"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
                    </div>

                    <aside class="control-panel" aria-label="악기 설정">
                        <div id="pianoControls" class="control-set">
                            <div id="keyboardPatchControls" class="keyboard-patch-controls hidden"></div>
                            <button id="sustainButton" class="sustain-button" type="button" aria-pressed="false"><span>서스테인</span><b>SPACE</b></button>
                            <p>길게 누르거나 고정해서 사용할 수 있어요.</p>
                        </div>
                        <div id="stringControls" class="control-set hidden">
                            <div id="articulationButtons" class="articulation-buttons" aria-label="주법 선택"></div>
                            <label><span>톤 <output id="toneOutput">64</output></span><input id="toneSlider" type="range" min="10" max="95" value="64"></label>
                            <label><span>뮤트 <output id="muteOutput">10</output></span><input id="muteSlider" type="range" min="0" max="82" value="10"></label>
                            <label><span>피킹 위치 <output id="pickOutput">28</output></span><input id="pickSlider" type="range" min="8" max="90" value="28"></label>
                            <label><span>드라이브 <output id="driveOutput">8</output></span><input id="driveSlider" type="range" min="0" max="65" value="8"></label>
                            <div id="guitarFxControls" class="fx-strip hidden"><label><span>디스토션 <output>0</output></span><input type="range" min="0" max="100" value="0"></label><label><span>딜레이 <output>18</output></span><input type="range" min="0" max="100" value="18"></label><label><span>리버브 <output>12</output></span><input type="range" min="0" max="100" value="12"></label></div>
                        </div>
                        <div id="classicalControls" class="control-set classical-controls hidden">
                            <div class="expression-tabs"><button class="active" type="button">표현</button><button type="button">주법</button><button type="button">음색</button></div><label><span>다이내믹 <output>72</output></span><input type="range" min="0" max="127" value="72"></label><label><span id="expressionLabel">보우 압력</span><input type="range" min="0" max="100" value="48"></label><div class="expression-actions"><button type="button">비브라토</button><button type="button">레가토</button></div>
                        </div>
                        <div id="drumControls" class="control-set hidden">
                            <div class="kit-readout"><span id="drumSystemLabel">MODAL KIT</span><b id="drumSystemDescription">막과 금속의 공명을 계산해 소리를 만들어요.</b></div>
                            <label><span><i id="drumResonanceLabel">공명</i> <output id="drumResonanceOutput">58</output></span><input id="drumResonanceSlider" type="range" min="20" max="90" value="58"></label>
                            <label><span><i id="drumToneLabel">밝기</i> <output id="drumToneOutput">62</output></span><input id="drumToneSlider" type="range" min="20" max="95" value="62"></label>
                        </div>
                    </aside>
                </div>
            </section>

            <section id="playSurface" class="play-surface" aria-label="악기 연주 영역">
                <div class="play-toolbar">
                    <small id="noteReadout" class="screen-reader-only" aria-live="polite">준비됨</small>
                    <div id="rangeLegend" class="range-legend hidden"><i></i><span id="rangeReadout"></span></div>
                    <div id="octaveControls" class="octave-controls" aria-label="컴퓨터 키보드 옥타브">
                        <button id="octaveDown" type="button" aria-label="한 옥타브 내리기">−</button>
                        <span>키보드 옥타브 <b id="octaveReadout">4</b></span>
                        <button id="octaveUp" type="button" aria-label="한 옥타브 올리기">＋</button>
                    </div>
                </div>
                <div id="keyboardViewport" class="keyboard-viewport">
                    <div id="keyboard" class="keyboard" role="group" aria-label="연주 건반"></div>
                </div>
                <div id="chordSurface" class="chord-surface hidden">
                    <div id="chordPads" class="chord-pads" role="group" aria-label="기타 코드 선택"></div>
                    <div class="strum-controls">
                        <button type="button" data-strum="down"><span aria-hidden="true">↓</span><b>다운 스트로크</b></button>
                        <button type="button" data-strum="up"><span aria-hidden="true">↑</span><b>업 스트로크</b></button>
                    </div>
                </div>
                <div id="drumPads" class="drum-pads hidden" role="group" aria-label="드럼 패드"></div>
            </section>
        </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
