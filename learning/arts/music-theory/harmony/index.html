<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101827">
    <title>화성학</title>
    <meta name="description" content="악보 읽기부터 음정까지 단계별 시각 자료와 소리로 배우는 화성학 과정">
    <link rel="preload" href="assets/piano/C3.ogg" as="fetch" type="audio/ogg" crossorigin>
    <link rel="preload" href="assets/piano/C4.ogg" as="fetch" type="audio/ogg" crossorigin>
    <link rel="stylesheet" href="course-v2.css?v=20260826-5">
    <script src="piano-engine.js?v=20260826-5" defer></script>
    <script src="course-guides.js?v=20260826-5" defer></script>
    <script src="course-v2.js?v=20260826-5" defer></script>
</head>
<body>
<main class="course-shell">
        <section id="dashboard" class="dashboard" aria-labelledby="dashboardTitle">
            <header class="dashboard-heading">
                <h1 id="dashboardTitle">차시 목록</h1>
                <div class="dashboard-progress"><p id="progressText">완료 0 / 16</p><button id="resetProgress" class="text-button" type="button">초기화</button></div>
            </header>
            <div id="unitList" class="unit-list"></div>
        </section>

        <section id="study" class="study" hidden>
            <nav class="study-nav" aria-label="차시 이동">
                <button id="backToCourse" class="text-button" type="button">← 전체 과정</button>
                <strong id="currentLesson"></strong>
            </nav>

            <article class="lesson-paper">
                <header class="lesson-title">
                    <span id="lessonUnit"></span>
                    <h1 id="lessonTitle"></h1>
                    <p id="lessonEnglish"></p>
                </header>
                <div id="lessonSections" class="lesson-sections"></div>
                <section class="term-summary" aria-labelledby="termSummaryTitle">
                    <h2 id="termSummaryTitle">오늘의 용어</h2>
                    <div id="termList" class="term-list"></div>
                </section>
            </article>

            <details id="practicePanel" class="practice-panel">
                <summary>학습 확인 문제 5개</summary>
                <div class="practice-body">
                    <div class="practice-status"><strong id="roundCounter">1 / 5</strong><span id="scoreText">정답 0</span></div>
                    <p id="questionPrompt" class="question-prompt"></p>
                    <button id="listenButton" class="primary-button" type="button">♪ 문제 듣기</button>
                    <div id="answerChoices" class="answer-choices" role="group" aria-label="정답 선택"></div>
                    <p id="feedback" class="feedback" aria-live="polite"></p>
                    <button id="nextButton" class="next-button" type="button" hidden>다음 문제</button>
                </div>
            </details>

            <section id="pianoPanel" class="piano-panel" aria-label="피아노 건반">
                <div id="piano" class="piano"></div>
            </section>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
