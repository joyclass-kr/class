<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#172238">
    <title>화성학</title>
    <meta name="description" content="음과 음정부터 코드 진행까지 순서대로 배우는 화성학 과정">
    <link rel="preload" href="assets/piano/C3.ogg" as="fetch" type="audio/ogg" crossorigin>
    <link rel="preload" href="assets/piano/C4.ogg" as="fetch" type="audio/ogg" crossorigin>
    <link rel="stylesheet" href="styles.css?v=20260826-book2">
    <script src="piano-engine.js?v=20260826-book2" defer></script>
    <script src="app.js?v=20260826-book2" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="back-link" href="../../../../">← 메인</a>
        <button id="resetProgress" class="quiet-button" type="button">학습 기록 초기화</button>
    </header>

    <main class="course-shell">
        <details id="courseNav" class="course-nav">
            <summary><span>목차</span><strong id="courseCurrent">1. 음과 건반</strong></summary>
            <nav id="stageList" class="stage-list" aria-label="화성학 단계"></nav>
        </details>

        <section class="lesson" aria-live="polite">
            <header class="lesson-heading">
                <div>
                    <p id="stageKicker" class="eyebrow">1단계</p>
                    <h2 id="stageTitle">음과 건반</h2>
                    <p id="stageSummary">일곱 음이름과 피아노 건반의 위치를 익혀요.</p>
                </div>
                <span id="stageStatus" class="status-chip">학습 전</span>
            </header>

            <div class="lesson-grid">
                <article class="theory-book">
                    <header class="chapter-title">
                        <h2 id="conceptTitle">음이름은 건반에서 반복돼요</h2>
                    </header>
                    <div id="conceptBody" class="theory-prose"></div>
                    <section class="notation-lesson" aria-labelledby="notationTitle">
                        <div class="notation-copy">
                            <h3 id="notationTitle">오선에서 음을 읽어 봅시다</h3>
                            <p id="notationBody"></p>
                            <button id="theoryListen" class="theory-listen" type="button">♪ 예시 듣기</button>
                        </div>
                        <div class="score-sheet" aria-label="악보 예시">
                            <div class="staff">
                                <i></i><i></i><i></i><i></i><i></i>
                                <span class="treble-clef" aria-hidden="true">𝄞</span>
                                <div id="staffNotes" class="staff-notes"></div>
                            </div>
                            <div id="staffLabels" class="staff-labels" aria-hidden="true"></div>
                        </div>
                    </section>
                    <section class="chapter-summary">
                        <h3>기억할 내용</h3>
                        <ul id="lessonPoints" class="lesson-points"></ul>
                    </section>
                </article>

                <details id="practicePanel" class="practice-card">
                    <summary>학습 확인 문제 5개</summary>
                    <div class="practice-topline">
                        <div>
                            <p class="card-label">5문제 연습</p>
                            <h3 id="questionTitle">소리를 듣고 답해 보세요</h3>
                        </div>
                        <strong id="roundCounter">1 / 5</strong>
                    </div>
                    <p id="questionPrompt" class="question-prompt"></p>
                    <button id="listenButton" class="listen-button" type="button"><span aria-hidden="true">♪</span> 소리 듣기</button>
                    <div id="answerChoices" class="answer-choices" role="group" aria-label="정답 선택"></div>
                    <p id="feedback" class="feedback" aria-live="polite"></p>
                    <button id="nextButton" class="next-button" type="button" hidden>다음 문제</button>
                </details>
            </div>

            <article class="piano-card">
                <div class="piano-heading">
                    <div><p class="card-label">직접 확인</p><h3>피아노 건반</h3></div>
                    <p id="pianoReadout">건반을 눌러 음을 들어 보세요.</p>
                </div>
                <div id="piano" class="piano" aria-label="두 옥타브 피아노 건반"></div>
            </article>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
