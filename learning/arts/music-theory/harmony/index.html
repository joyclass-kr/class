<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101827">
    <title>실용화성학</title>
    <meta name="description" content="코드를 듣고, 악보와 건반에서 만들고, 실제 진행과 리드시트에 적용하는 역량 중심 실용화성학">
    <link rel="preload" href="assets/piano/C3.ogg" as="fetch" type="audio/ogg" crossorigin>
    <link rel="preload" href="assets/piano/C4.ogg" as="fetch" type="audio/ogg" crossorigin>
    <link rel="stylesheet" href="course-v2.css?v=20260826-7">
    <link rel="stylesheet" href="practical-course.css?v=20260826-2">
    <link rel="stylesheet" href="competency-course.css?v=20260826-1">
    <script src="piano-engine.js?v=20260826-7" defer></script>
    <script src="competency-data.js?v=20260826-1" defer></script>
    <script src="competency-course.js?v=20260826-1" defer></script>
</head>
<body>
    <main class="course-shell">
        <section id="dashboard" class="dashboard" aria-labelledby="dashboardTitle">
            <header class="dashboard-heading">
                <div>
                    <p class="course-kicker">PRACTICAL HARMONY</p>
                    <h1 id="dashboardTitle">실용화성학</h1>
                    <p class="dashboard-intro">설명을 읽고 끝내지 않습니다. 악보로 보고, 소리로 비교하고, 직접 구성해 실제 진행에 씁니다.</p>
                </div>
                <div class="dashboard-progress">
                    <p id="progressText">숙달 기록을 불러오는 중입니다</p>
                    <button id="resetProgress" class="text-button" type="button">기록 초기화</button>
                </div>
            </header>

            <section id="continueCard" class="continue-card" aria-label="추천 학습"></section>

            <div class="course-map-heading">
                <h2>역량 지도</h2>
                <p>고정 차시 대신 선수 관계와 수행 증거를 기준으로 다음 학습을 추천합니다.</p>
            </div>
            <div id="unitList" class="unit-list"></div>
        </section>

        <section id="study" class="study" hidden>
            <nav class="study-nav" aria-label="학습 이동">
                <button id="backToCourse" class="course-list-button" type="button" aria-label="역량 지도 열기"><span aria-hidden="true">☰</span> 역량 지도</button>
                <strong id="currentLesson"></strong>
            </nav>

            <article class="lesson-paper">
                <header class="lesson-title">
                    <span id="lessonUnit"></span>
                    <h1 id="lessonTitle"></h1>
                    <p id="lessonEnglish"></p>
                    <div id="lessonOutcome" class="lesson-outcome"></div>
                </header>

                <div id="lessonSections" class="lesson-sections"></div>

                <section id="constructionLab" class="construction-lab" aria-labelledby="constructionTitle"></section>

                <section class="term-summary" aria-labelledby="termSummaryTitle">
                    <h2 id="termSummaryTitle">이 역량에 필요한 언어</h2>
                    <div id="termList" class="term-list"></div>
                </section>
            </article>

            <details id="practicePanel" class="practice-panel">
                <summary>판단 근거 확인 <span>직접 구성 수행과 함께 완료해야 숙달로 기록됩니다.</span></summary>
                <div class="practice-body">
                    <div class="practice-status">
                        <strong id="roundCounter"></strong>
                        <span id="scoreText"></span>
                    </div>
                    <span id="questionKind" class="question-kind"></span>
                    <p id="questionPrompt" class="question-prompt"></p>
                    <button id="listenButton" class="primary-button" type="button">♪ 문제 듣기</button>
                    <div id="questionVisual" class="question-visual"></div>
                    <div id="answerChoices" class="answer-choices" role="group" aria-label="정답 선택"></div>
                    <p id="feedback" class="feedback" aria-live="polite"></p>
                    <button id="nextButton" class="next-button" type="button" hidden>다음 근거</button>
                </div>
            </details>

            <section class="piano-panel" aria-label="자유 연주 피아노 건반">
                <div class="piano-panel-heading">
                    <strong>자유 건반</strong>
                    <span>설명·악보·문제에서 들은 음을 직접 다시 확인하세요.</span>
                </div>
                <div id="piano" class="piano"></div>
            </section>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
