<figure class="case" data-book="agijangsu-uturi" data-spread="1">
  <figcaption>agijangsu-uturi · 펼침 1/1</figcaption>
  <div class="book"><div class="book-spread">
    <div class="page page-after">
      <div class="after-col after-col-left"><h2>읽고 나서</h2><p>이 이야기는 우리나라 곳곳에 있습니다. 마을마다 용마못이나 장수바위가 하나씩 있고, 거기에 이 이야기가 붙어 있습니다. 아기 이름도 우투리, 아기장수, 둥구리로 다릅니다.</p><p>옛이야기는 대개 좋게 끝나는데 이것은 그렇지 않습니다. 장수가 될 아이가 뜻을 펴 보지도 못하고 쓰러집니다. 그래서 더 오래 남았습니다.</p><p>날개 달린 아이를 없애려 든 것은 나라였습니다. 힘센 아이가 나면 세상을 뒤엎을까 두려웠던 것이지요. 그 시절 백성이 나라를 어떻게 보았는지 이 대목에 있습니다.</p><p>책마다 어머니가 다릅니다. 어떤 책에서는 어머니가 아이를 직접 없앱니다. 이 책은 횃불 앞에서 바위를 가리키는 쪽으로 썼습니다. 어느 쪽이든 아이를 넘긴 것은 가장 가까운 사람입니다.</p></div>
      <div class="after-col after-col-right after-col-image"><div class="after-art"><div class="art-frame"><img src="../agijangsu-uturi/images/end.webp" alt=""></div></div><p>그런데 이야기는 여기서 끝내지 않습니다. 용마가 못 속에서 기다린다고 합니다. 아기장수는 죽은 것이 아니라 때를 못 만난 것이라고요. 진 이야기를 이렇게 남겨 두는 것이 옛사람들의 방식이었습니다.</p><p>때를 못 만나 접어 둔 일이 있나요? 그것을 기다리는 동안 무엇을 하고 있나요?</p><p class="after-home"><a class="home-btn" href="#">학습 허브로 돌아가기</a></p></div>
    </div>
  </div></div>
</figure>
<figure class="case" data-book="bak-hyeokgeose" data-spread="1">
  <figcaption>bak-hyeokgeose · 펼침 1/1</figcaption>
  <div class="book"><div class="book-spread">
    <div class="page page-after">
      <div class="after-col after-col-left"><h2>읽고 나서</h2><p>두 책이 전하는 이야기가 조금 다릅니다. 『삼국사기』는 촌장들이 알을 발견한 데서 담담하게 시작하는데, 『삼국유사』에는 흰말이 무릎을 꿇고 울다 하늘로 올라갔다는 대목이 더 붙어 있습니다.</p><p>알에서 나왔다는 것은 아버지가 없다는 뜻이기도 합니다. 앞선 임금의 자식이 아니라 하늘에서 곧바로 온 사람이라야, 여섯 마을 어느 쪽에도 치우치지 않는 임금이 될 수 있었습니다.</p><p>다시 보면 이상한 것이 하나 있습니다. 알에서 나온 아이를 임금으로 삼자고 정한 것은 하늘이 아니라 여섯 촌장입니다. 하늘이 내려보냈다고 적어 두었지만, 고른 것은 사람이었지요.</p><p>혁거세라는 이름은 세상을 밝힌다는 뜻입니다. 나라 이름 신라도 그물처럼 사방을 아우른다는 뜻으로 풀이합니다. 이름부터가 여럿을 하나로 묶겠다는 말이었던 셈입니다.</p></div>
      <div class="after-col after-col-right after-col-image"><div class="after-art"><div class="art-frame"><img src="../bak-hyeokgeose/images/end.webp" alt=""></div></div><p>경주에 가면 혁거세가 나왔다는 우물 나정 자리가 남아 있습니다. 우물은 옛사람들에게 땅속과 하늘이 만나는 자리였습니다.</p><p>여섯 촌장은 저마다 제 마을이 제일이라 여길 수도 있었습니다. 그러나 하나로 묶이는 쪽을 먼저 바랐습니다. 나라가 선 것은 알에서 아이가 나왔기 때문이 아니라 사람들이 함께하기로 마음먹었기 때문입니다.</p><p>여러분은 여럿이 힘을 모아 무언가를 해낸 적이 있나요?</p><p class="after-home"><a class="home-btn" href="#">학습 허브로 돌아가기</a></p></div>
    </div>
  </div></div>
</figure>
<figure class="case" data-book="bame-chajaon-dokkaebi" data-spread="1">
  <figcaption>bame-chajaon-dokkaebi · 펼침 1/1</figcaption>
  <div class="book"><div class="book-spread">
    <div class="page page-after">
      <div class="after-col after-col-left"><h2>읽고 나서</h2><p>도깨비가 되는 물건에는 한 가지 공통점이 있습니다. 하나같이 사람이 손에 쥐고 오래 쓰던 것입니다. 새로 산 물건이 도깨비가 되었다는 이야기는 없습니다.</p><p>그래서 도깨비는 무섭기만 한 것이 아닙니다. 씨름을 걸고, 메밀묵을 좋아하고, 돈을 갚으러 오기도 합니다. 사람과 아주 가까운 자리에 있는 것입니다.</p><p>다시 보면 이 이야기에서 정말 무서운 것은 도깨비가 아니라 어둠입니다. 날이 밝고 나서 그 자리에 남아 있던 것을 보십시오. 밤에 본 것과 아침에 본 것이 같은 물건이었습니다.</p><p>밤에는 눈이 잘 보이지 않으니 머리가 대신 그림을 그립니다. 그 그림은 대개 우리가 무서워하는 것을 닮습니다. 옛사람들이 도깨비를 그렇게 자주 만난 데는 그런 까닭도 있었을 것입니다.</p></div>
      <div class="after-col after-col-right after-col-image"><div class="after-art"><div class="art-frame"><img src="../bame-chajaon-dokkaebi/images/end.webp" alt=""></div></div><p>도깨비에게 씨름을 걸리면 왼쪽 다리를 걸어 넘기라는 말이 전해 옵니다. 도깨비는 오른쪽 다리가 없다는 것입니다. 이런 세세한 말이 붙어 다닌다는 것은 사람들이 그만큼 자주 이야기했다는 뜻입니다.</p><p>밤에는 낡은 빗자루도 뿔 달린 도깨비로 보입니다. 어두울 때 본 것은 날이 밝은 뒤에 다시 보면 달라 보이는 법입니다.</p><p>무섭게 느껴졌던 것이 알고 보니 아무것도 아니었던 적이 있나요?</p><p class="after-home"><a class="home-btn" href="#">학습 허브로 돌아가기</a></p></div>
    </div>
  </div></div>
</figure>
<figure class="case" data-book="banggwi-myeoneuri" data-spread="1">
  <figcaption>banggwi-myeoneuri · 펼침 1/1</figcaption>
  <div class="book"><div class="book-spread">
    <div class="page page-after">
      <div class="after-col after-col-left"><h2>읽고 나서</h2><p>이 이야기는 웃기려고 지은 이야기입니다. 우리 옛이야기에는 교훈을 주려는 것 못지않게 그저 웃자고 만든 것이 많습니다.</p><p>그런데 웃자고 만든 이야기가 오히려 그 시절을 잘 보여 줄 때가 있습니다. 이 이야기가 그렇습니다. 며느리가 시집에서 방귀조차 마음대로 뀔 수 없었다는 것부터가 그 시절 이야기입니다.</p><p>다시 보면 며느리는 아무 잘못도 하지 않았습니다. 참느라 얼굴이 노래질 때까지 참았습니다. 흠이 된 것은 방귀가 아니라 참으라고 한 쪽이었습니다.</p><p>그리고 그 방귀는 밖에 나가자마자 쓸모가 생겼습니다. 같은 재주가 안에서는 내쫓길 까닭이었다가 밖에서는 값을 받는 재주가 된 것이지요.</p></div>
      <div class="after-col after-col-right after-col-image"><div class="after-art"><div class="art-frame"><img src="../banggwi-myeoneuri/images/end.webp" alt=""></div></div><p>옛이야기에서 며느리는 대개 시달리는 쪽으로 나옵니다. 그런데 이 이야기에서는 며느리가 판을 뒤집습니다. 듣는 사람 가운데 며느리가 많았기 때문일 것입니다.</p><p>식구들이 흠이라 여겨 내보내려 한 것이, 밖에 나가 보니 누구도 못 하는 재주였습니다. 남과 다른 것을 흠으로 볼지 재주로 볼지는 보는 사람에게 달렸습니다.</p><p>남과 달라서 감추고 싶었던 것이 있나요? 그것이 쓸모 있는 자리는 어디일까요?</p><p class="after-home"><a class="home-btn" href="#">학습 허브로 돌아가기</a></p></div>
    </div>
  </div></div>
</figure>
<figure class="case" data-book="banjjogi" data-spread="1">
  <figcaption>banjjogi · 펼침 1/1</figcaption>
  <div class="book"><div class="book-spread">
    <div class="page page-after">
      <div class="after-col after-col-left"><h2>읽고 나서</h2><p>반쪽이는 우리 옛이야기 가운데서도 유난히 눈에 띄는 주인공입니다. 몸이 남과 다른 사람이 힘도 세고 꾀도 밝은 주인공으로 나오는 이야기는 흔치 않기 때문입니다.</p><p>이야기는 반쪽이를 한 번도 불쌍하게 그리지 않습니다. 형들이 놀려도, 사람들이 손가락질해도 반쪽이는 주눅 들지 않습니다. 호랑이를 잡아 오는 것도 반쪽이입니다.</p><p>다시 보면 이 이야기에서 잘못한 사람은 김 부자 하나입니다. 호랑이를 잡아 오면 딸을 주겠다고 먼저 말한 사람이 그 사람입니다. 잡아 오자 말을 바꾼 것도 그 사람이고요.</p><p>몸이 반쪽인 채로 태어난 아이가 씩씩하게 살아가는 이야기를 옛사람들이 지어 전했다는 것은 그 자체로 눈여겨볼 만한 일입니다.</p></div>
      <div class="after-col after-col-right after-col-image"><div class="after-art"><div class="art-frame"><img src="../banjjogi/images/end.webp" alt=""></div></div><p>김 부자는 왜 약속을 지키지 않았을까요? 무엇이 그렇게 부끄러웠을까요.</p><p>김 부자는 호랑이를 잡은 사람을 찾다가, 막상 잡아 오자 그 사람의 생김새를 보았습니다. 약속을 지킬지 말지를 생김새로 정하는 것은 처음부터 약속이 아니었다는 뜻입니다.</p><p>겉모습만 보고 누군가를 잘못 판단한 적이 있나요?</p><p class="after-home"><a class="home-btn" href="#">학습 허브로 돌아가기</a></p></div>
    </div>
  </div></div>
</figure>
<figure class="case" data-book="barideggi" data-spread="1">
  <figcaption>barideggi · 펼침 1/1</figcaption>
  <div class="book"><div class="book-spread">
    <div class="page page-after">
      <div class="after-col after-col-left"><h2>읽고 나서</h2><p>이 이야기는 책이 아니라 노래로 전해 왔습니다. 사람이 죽었을 때 하는 굿에서 무당이 밤새 부르는 노래입니다. 그래서 이 노래를 부르는 사람들은 바리데기를 자기들의 조상으로 여깁니다.</p><p>지역마다 다릅니다. 바리공주라고도 하고, 부모가 임금이 아니라 여염집 사람인 데도 있습니다. 약수를 지키는 이와 혼인해 아들 일곱을 낳는 대목이 있는 책도 많습니다. 이 책은 그 대목을 빼고 아홉 해 일한 것만 남겼습니다.</p><p>다시 보면 바리데기는 부모에게 받은 것이 없습니다. 그런데도 갑니다. 받은 것이 많은 여섯 언니는 가지 않습니다. 이야기가 여섯을 나란히 세운 까닭이 거기 있습니다.</p><p>마지막 대목이 이 이야기의 뜻입니다. 나라의 반을 준다는데 바리데기는 죽은 이의 길잡이를 고릅니다. 버려져 본 사람이라서 안개 속에서 우는 이들을 그냥 지나치지 못한 것입니다.</p></div>
      <div class="after-col after-col-right after-col-image"><div class="after-art"><div class="art-frame"><img src="../barideggi/images/end.webp" alt=""></div></div><p>딸이라고 버린 이야기가 어떻게 여자를 신으로 모시는 이야기가 되었는지 생각해 볼 만합니다. 그 시절 사람들은 이 노래로, 버려지는 쪽이 끝내 모두를 건지는 세상을 이야기했습니다.</p><p>아무도 하지 않으려는 일을 내가 맡아 본 적이 있나요?</p><p class="after-home"><a class="home-btn" href="#">학습 허브로 돌아가기</a></p></div>
    </div>
  </div></div>
</figure>
<figure class="case" data-book="bongi-kimseondal" data-spread="1">
  <figcaption>bongi-kimseondal · 펼침 1/1</figcaption>
  <div class="book"><div class="book-spread">
    <div class="page page-after">
      <div class="after-col after-col-left"><h2>읽고 나서</h2><p>김선달이 실제로 있었던 사람인지는 아무도 모릅니다. 다만 조선 후기에 이런 재담꾼 이야기가 아주 많이 돌았습니다. 힘없는 사람이 말재주 하나로 힘 있는 사람을 골탕 먹이는 이야기입니다.</p><p>봉이라는 별명은 닭을 봉황이라 우겨 판 이야기에서 왔습니다. 사람들이 그 뒤로 그를 봉이라 불렀지요. 이름 자체가 속임수의 기록인 셈입니다.</p><p>다시 보면 김선달은 물을 판 것이 아닙니다. 물을 팔 수 있다고 믿는 마음을 판 것입니다. 상인들은 강물을 산 것이 아니라 강물에 임자가 있다는 생각을 산 것이지요.</p><p>그래서 이 이야기는 김선달이 똑똑한 이야기가 아니라 상인들이 무엇을 믿고 있었는지를 보여 주는 이야기입니다. 아무도 안 믿는 것은 팔 수가 없습니다.</p></div>
      <div class="after-col after-col-right after-col-image"><div class="after-art"><div class="art-frame"><img src="../bongi-kimseondal/images/end.webp" alt=""></div></div><p>이야기가 하필 평양을 고른 데는 까닭이 있습니다. 그 시절 평양은 청나라를 오가는 장사꾼이 몰리던 곳이었습니다. 돈으로 못 살 것이 없다고 여기는 사람이 가장 많던 자리였지요.</p><p>김선달이 노린 것은 상인들의 돈이 아니라 그 말이었습니다. 돈으로 못 살 게 없다는 말은, 돈으로 살 수 없는 것을 한 번도 생각해 보지 않아서 나오는 말입니다.</p><p>돈으로는 살 수 없는 것에 무엇이 있을까요?</p><p class="after-home"><a class="home-btn" href="#">학습 허브로 돌아가기</a></p></div>
    </div>
  </div></div>
</figure>
<figure class="case" data-book="cheonggaeguri" data-spread="1">
  <figcaption>cheonggaeguri · 펼침 1/1</figcaption>
  <div class="book"><div class="book-spread">
    <div class="page page-after">
      <div class="after-col after-col-left"><h2>읽고 나서</h2><p>개구리가 비 오는 날 크게 우는 것은 사실 짝을 찾는 소리입니다. 옛사람들은 그 까닭을 몰랐지만 소리는 똑똑히 들었습니다. 모르는 것을 그냥 두지 않고 이야기를 지어 붙인 것이지요.</p><p>이런 이야기가 우리 옛이야기에는 아주 많습니다. 넙치 눈이 한쪽으로 몰린 까닭, 까치 머리가 성긴 까닭, 호랑이가 토끼를 피하는 까닭. 눈에 보이는 것 하나에 이야기 하나씩을 붙여 둔 셈입니다.</p><p>다시 보면 청개구리는 거짓말을 한 적이 없습니다. 어머니를 미워한 적도 없습니다. 그저 하라는 것의 반대로 했을 뿐입니다. 그런데 그 버릇 하나가 마지막에 되돌릴 수 없는 일이 되었습니다.</p><p>어머니가 개울가에 묻어 달라고 한 것도 다시 보십시오. 어머니는 아들이 반대로 할 것을 알고 그렇게 말한 것입니다. 산에 묻히고 싶어서 개울가라고 한 것이지요.</p><p>그러니 이 이야기에서 가장 슬픈 대목은 어머니의 마지막 말이 처음으로 그대로 지켜졌다는 데 있습니다.</p></div>
      <div class="after-col after-col-right after-col-image"><div class="after-art"><div class="art-frame"><img src="../cheonggaeguri/images/end.webp" alt=""></div></div><p>청개구리가 그때 산에 묻었다면 어땠을까요? 어머니 뜻을 따른 것일까요, 어긴 것일까요.</p><p>고맙다는 말도 미안하다는 말도 할 수 있을 때 해야 합니다. 청개구리는 어머니 말을 처음으로 따른 그날, 이미 어머니에게 그 말을 들려줄 수 없었습니다.</p><p>오늘 집에 가서 꼭 하고 싶은 말이 있나요?</p><p class="after-home"><a class="home-btn" href="#">학습 허브로 돌아가기</a></p></div>

      <div class="after-col after-col-left"><h2>읽고 나서</h2><p>단군 이야기가 글로 처음 적힌 것은 팔백 년쯤 전입니다. 일연 스님이 『삼국유사』에 적었고 비슷한 무렵 이승휴도 적었습니다. 그전까지는 입에서 입으로만 전해 온 것이지요.</p><p>곰과 호랑이가 먹은 것을 이 책에서는 쑥과 마늘이라 했습니다. 그런데 그 시절 이 땅에 마늘이 있었는지를 두고는 말이 갈립니다. 원래 글자를 달래나 다른 매운 풀로 읽어야 한다는 학자들도 있습니다.</p><p>다시 보면 곰은 아무 재주도 부리지 않았습니다. 그저 굴에 남아 있었을 뿐입니다. 이 이야기가 상을 준 것은 힘이나 재주가 아니라 견디는 일이었습니다.</p><p>환웅이 사람들에게 가르친 것을 세어 보십시오. 곡식과 약과 옳고 그름입니다. 힘으로 다스린 것이 아니라 살아가는 법을 일러 준 것입니다. 널리 사람을 이롭게 하라는 말이 그 뜻입니다.</p><p>고조선을 세웠다는 그날을 기려 시월 삼일을 개천절로 삼았습니다. 하늘이 열린 날이라는 뜻입니다.</p></div>
      <div class="after-col after-col-right after-col-image"><div class="after-art"><div class="art-frame"><img src="../dangun/images/end.webp" alt=""></div></div><p>호랑이는 왜 굴을 뛰쳐나갔을까요? 하루만 더 참으면 되는 날도 있었을 텐데요.</p><p>호랑이는 첫날 가장 자신 있어 했고 곰은 아무 말 없이 앉아 있었습니다. 끝까지 남는 쪽은 큰소리치던 쪽이 아니라 조용히 견디던 쪽인 경우가 많습니다.</p><p>당장은 재미없어도 오래 해 볼 만한 일이 나에게도 있을까요?</p><p class="after-home"><a class="home-btn" href="#">학습 허브로 돌아가기</a></p></div>

      <div class="after-col after-col-left"><h2>읽고 나서</h2><p>호랑이가 사람과 말을 주고받는 이야기는 우리 옛이야기에 유난히 많습니다. 산이 많은 땅에서 호랑이가 가장 가깝고도 무서운 이웃이었기 때문입니다.</p><p>그래서 호랑이는 우리 이야기에서 늘 나쁜 쪽이 아닙니다. 속기도 하고 은혜를 갚기도 하고 이렇게 형님 소리를 듣고 마음이 풀리기도 합니다.</p><p>호랑이가 넘어간 것은 꾀가 아니라 형님이라는 말이었습니다. 산에서 혼자 살던 것에게 그 말이 어떻게 들렸을지 생각해 보십시오.</p><p>그 뒤로 호랑이가 어머니 상에 짐승을 물어다 놓았다는 대목도 다시 보십시오. 거짓말로 얻은 이름을 진짜로 만든 쪽은 호랑이였습니다.</p></div>
      <div class="after-col after-col-right after-col-image"><div class="after-art"><div class="art-frame"><img src="../horangi-hyeongnim/images/end.webp" alt=""></div></div><p>나무꾼은 살아 보려고 거짓말을 했고, 호랑이는 그것이 거짓말인 줄 알면서도 형님 소리가 좋아 모른 척했습니다. 사람이 정말로 굶주리는 것은 먹을 것보다 불러 주는 이름일 때가 있습니다.</p><p>누군가 나를 불러 주어서 기뻤던 이름이 있나요?</p><p class="after-home"><a class="home-btn" href="#">학습 허브로 돌아가기</a></p></div>

      <div class="after-col after-col-right after-col-image"><div class="after-art"><div class="art-frame"><img src="../horangi-sogin-tokki/images/end.webp" alt=""></div></div><p>마지막에 호랑이가 토끼를 피해 다녔다는 대목도 웃어넘길 것이 아닙니다. 힘으로는 이길 수 있는데도 피한 것입니다.</p><p>힘이 세다고 늘 이기는 것은 아닙니다. 토끼는 한 번도 힘으로 맞서지 않았습니다. 그저 호랑이가 듣고 싶어 하는 말을 했을 뿐입니다.</p><p>누군가 달콤한 말로 다가올 때 무엇을 먼저 살펴봐야 할까요?</p><p class="after-home"><a class="home-btn" href="#">학습 허브로 돌아가기</a></p></div>

      <div class="after-col after-col-left"><h2>읽고 나서</h2><p>이런 이야기는 듣는 아이가 다음에 무엇이 나올지 미리 맞혀 보게 만듭니다. 좁쌀 다음은 쥐, 쥐 다음은 고양이. 그 재미로 오래 전해진 것이지요.</p><p>이런 이야기는 듣기에 재미있어서 세계 곳곳에 있습니다. 짚 한 오라기로 시작해 부자가 되는 일본 이야기도 있고, 물물교환이 이어지는 서양 이야기도 있습니다.</p><p>소년이 한 일이라고는 제 것을 맡기고 그것이 없어졌다고 말한 것뿐입니다. 그러면 주인들이 미안해서 더 큰 것을 내주었지요.</p><p>그러니 소년을 키운 것은 좁쌀이 아니라 그것을 끝까지 제 것으로 여긴 마음입니다.</p></div>
      <div class="after-col after-col-right after-col-image"><div class="after-art"><div class="art-frame"><img src="../jopssal-han-tol/images/end.webp" alt=""></div></div><p>작다고 함부로 여기지 않는 마음이 좁쌀 한 톨을 황소로 만들었습니다. 소년은 한 번도 억지를 부리지 않았습니다. 그저 제 것을 끝까지 소중히 여겼을 뿐입니다.</p><p>지금 내 손에 있는 작은 것 가운데 소중히 여겨야 할 것은 무엇일까요?</p><p class="after-home"><a class="home-btn" href="#">학습 허브로 돌아가기</a></p></div>

  <div class="book"><div class="book-spread">
    <div class="page page-after">
      <div class="after-col after-col-left"><h2>읽고 나서</h2><p>이 이야기는 『삼국유사』에 실려 있습니다. 조신은 세달사라는 절의 스님으로, 절 땅을 돌보러 명주에 가 있다가 태수 김흔의 딸을 보았다고 적혀 있습니다.</p><p>꿈속에서 한평생을 살고 깨어나는 이야기를 꿈 이야기라 합니다. 우리 이야기 가운데 이것이 가장 오래된 것이고, 뒷날 『구운몽』이 이 틀을 그대로 이어받았습니다.</p><p>다시 보면 부처님은 조신의 소원을 물리치지 않았습니다. 들어주었습니다. 다만 꿈으로 들어주어 그 끝까지 보게 했습니다. 안 들어준 것보다 더 매서운 대답입니다.</p><p>꿈에서 깬 조신이 한 일도 눈여겨보십시오. 꿈속에서 아이를 묻은 자리를 찾아가 팝니다. 꿈인 줄 알면서도요. 거기서 돌부처가 나옵니다.</p></div>
      <div class="after-col after-col-right after-col-image"><div class="after-art"><div class="art-frame"><img src="../josin-ui-kkum/images/end.webp" alt=""></div></div><p>이 이야기는 소원을 갖지 말라고 하지 않습니다. 소원이 이루어진 다음까지 생각해 보라고 합니다. 조신은 사십 년을 살고 온 사람처럼 남은 삶을 살았습니다. 하룻밤이었는데도요.</p><p>지금 내가 바라는 것이 이루어지면, 그다음은 어떻게 될까요?</p><p class="after-home"><a class="home-btn" href="#">학습 허브로 돌아가기</a></p></div>

      <div class="after-col after-col-left"><h2>읽고 나서</h2><p>고려 때 엮은 책에도 이와 같은 이야기가 실려 있습니다. 그러니 적어도 팔백 년은 전해 온 이야기입니다. 그동안 그 자리를 지킨 것은 비석 하나와 땅 이름 하나였습니다.</p><p>지금도 그곳에는 개를 기리는 비석이 서 있습니다. 임실 오수면이 그 고을입니다.</p><p>다시 보면 누렁이는 처음에 짖었습니다. 짖어도 주인이 깨지 않자 그때부터 다른 일을 시작했습니다.</p><p>말이 통하지 않는다는 것을 알고 나서 몸으로 하는 쪽을 고른 것입니다. 개울과 풀밭을 몇 번이나 오갔는지는 아무도 모릅니다.</p></div>
      <div class="after-col after-col-right after-col-image"><div class="after-art"><div class="art-frame"><img src="../juin-guhan-nureongi/images/end.webp" alt=""></div></div><p>불이 젖은 풀 앞에서 힘을 잃은 대목이 이 이야기의 답입니다. 물을 뿌린 것이 아니라 몸에 묻혀 온 것입니다.</p><p>누렁이는 짖어도 소용없자 스스로 할 수 있는 일을 찾아냈습니다. 말이 통하지 않을 때에도 마음을 전하는 방법은 남아 있습니다.</p><p>말로 전할 수 없을 때 마음을 보여 준 적이 있나요?</p><p class="after-home"><a class="home-btn" href="#">학습 허브로 돌아가기</a></p></div>

      <div class="after-col after-col-left"><h2>읽고 나서</h2><p>이 이야기는 왜 그런지를 풀어 주는 이야기입니다. 넙치 눈이 왜 한쪽으로 몰렸는지, 메기 입이 왜 넓적한지를 한꺼번에 설명합니다.</p><p>바닷물고기의 생김새를 하나하나 이야기로 붙여 둔 셈입니다. 우리 옛이야기에는 이런 것이 아주 많습니다.</p><p>넙치 눈이 한쪽으로 몰린 것은 실제로도 그렇습니다. 다만 처음부터 그런 것은 아닙니다. 알에서 갓 깨어난 넙치는 여느 물고기처럼 눈이 양쪽에 하나씩 있고 똑바로 서서 헤엄칩니다. 그러다 한 달이 못 되어 오른쪽 눈이 머리를 돌아 왼쪽으로 옮겨 가고, 그때부터 바닥에 납작 엎드려 삽니다. 옛사람들이 궁금해한 그 일이 정말로 일어나는 셈입니다.</p><p>메기는 바닷물고기가 아닙니다. 냇물이나 저수지에 사는 민물고기지요. 그런데도 옛이야기는 메기를 바닷속 잔칫상에 앉혀 두었습니다. 이야기를 옮기던 사람들에게는 어느 물에 사는지보다 그 입이 왜 그렇게 넓적한지가 더 궁금했던 것이지요.</p><p>다시 보면 넙치는 잘못한 것이 없습니다. 꿈을 풀어 달라 해서 본 대로 풀었을 뿐입니다.</p></div>
      <div class="after-col after-col-right after-col-image"><div class="after-art"><div class="art-frame"><img src="../myeolchi-kkum/images/end.webp" alt=""></div></div><p>넙치는 본 대로 말했을 뿐인데 뺨을 맞았습니다. 듣기 싫은 말을 해 준 사람에게 화를 내면, 다음부터는 아무도 사실을 말해 주지 않습니다.</p><p>듣기 싫은 말을 해 준 사람에게 나는 어떻게 했나요?</p><p class="after-home"><a class="home-btn" href="#">학습 허브로 돌아가기</a></p></div>

<script>
/* 세로 배치 규칙은 (max-width: 820px) 미디어쿼리 안에 있다.
   그러니 이 판은 반드시 810px 폭 창에서 열어야 한다. */
/* app.js 의 fitAfterword 와 같은 판단.
   세로에서는 끝그림이 접혀 있는 것이 기본이고, 켜 보아 자리가 남을 때만 둔다. */
window.fitAll = function () {
  document.querySelectorAll('.page-after').forEach(p => {
    p.classList.add('after-roomy');
    const spills = [...p.querySelectorAll('.after-col')]
      .some(c => c.scrollHeight > c.clientHeight);
    if (spills) p.classList.remove('after-roomy');
  });
};

window.report = function () {
  window.fitAll();
  const rows = [];
  document.querySelectorAll('.case').forEach(c => {
    const over = [...c.querySelectorAll('.after-col')].map(x => x.scrollHeight - x.clientHeight);
    if (over.some(v => v > 0)) rows.push(c.dataset.book + ' #' + c.dataset.spread + ' ' + over.join('/'));
  });
  const roomy = document.querySelectorAll('.page-after.after-roomy').length;
  const cases = document.querySelectorAll('.case').length;
  return { total: cases, 그림살림: roomy, 그림접힘: cases - roomy, bad: rows.length, rows };
};
</script>
