<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>넘침 검사</title>
<style>
    body { font: 14px monospace; margin: 16px; }
    iframe { position: fixed; left: -6000px; top: 0; border: 0; }
    pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>본문 넘침 검사</h1>
<pre id="out">…</pre>
<iframe id="frame"></iframe>
<script>
/* 책을 아이프레임에 띄우고, 아이프레임 자체를 1280×720 · 1920×1080 크기로 만든다.
 * 글씨 크기가 vw(화면 너비)를 따라가기 때문에, 책 너비만 억지로 바꿔서는
 * 실제 화면에서 보이는 크기와 달라져 헛measure가 된다. 아이프레임 크기를 바꾸면
 * 그 안에서 vw·vh가 진짜로 바뀌므로 실제 화면과 똑같아진다. */
const out = document.getElementById('out');
const frame = document.getElementById('frame');
const STAMP = Date.now();   // 브라우저가 옛 styles.css를 재쓰지 않게 한다

// 실제 기기의 '보이는 칸' 크기다. 화면 해상도가 아니라 브라우저 껍데기를 뺀 값이다.
//  크롬북 1366×768 → 1366×620 · 크롬북 1920×1080 → 1920×932
//  아이패드 10.2 가로 → 1080×730 · 아이패드 에어 가로 → 1180×744
//  아이패드 프로 12.9 가로 → 1366×944 · 아이패드 에어 세로 → 820×1104
// 가장 빡빡한 두 가지만 본다. 책이 작을수록(글씨 하한 15px 때문에) 글이 빡빡하고,
// 세로 화면은 짜임 자체가 다르다. 나머지 크기는 이 둘 사이라 저절로 들어간다.
//  전체를 다 보려면 ALL을 true로 바꾼다.
const ALL = false;
const SIZES = ALL
    ? [[1366, 620], [1920, 932], [1080, 730], [1180, 744], [1366, 944], [820, 1104]]
    // clamp 아래 끝(14px)에 걸리는 가장 작은 가로와, 책이 1300px에서 멈추는 큰 화면을
    // 함께 본다. 위 끝(24px)에는 책 높이가 975px을 못 넘어 닿지 않는다.
    : [[1366, 620], [820, 1104], [768, 1024], [1024, 768], [1920, 1080]];

async function load(slug) {
    // index.html에만 물음표를 붙이면 app.js는 옛것이 그대로 쓰인다. 먼저 새로 받아 둔다.
    await fetch(slug + '/app.js', { cache: 'reload' });
    await fetch(slug + '/styles.css', { cache: 'reload' });
    return new Promise((resolve) => {
        let done = false;
        const go = () => { if (!done) { done = true; resolve(); } };
        setTimeout(go, 8000);        // 신호가 안 와도 멈추지 않는다
        frame.onload = go;
        // 끝의 빗금이 꼭 있어야 한다. index.html을 붙이면 서버가 그걸 떼면서
        // 주소가 한 칸 위로 올라가 책의 app.js를 못 찾는다.
        frame.src = slug + '/?t=' + STAMP;
    });
}

// app.js의 PAGES·current·paint는 const/let이라 win.PAGES로는 닿지 않는다.
// 아이프레임 안에서 eval로 돌려 그 안의 이름을 그대로 쓴다.
function measureInside() {
    const doc = document;
    const bad = [];
    for (let i = 0; i < PAGES.length; i++) {
        current = i;
        paint();
        if (PAGES[i].kind === 'quiz') continue;   // 문항 쪽은 원래 스크롤이라 뺀다
        doc.querySelectorAll('.book *').forEach(el => {
            const over = el.scrollHeight - el.clientHeight;
            if (over > 1 && getComputedStyle(el).overflowY !== 'visible') {
                const ch = PAGES[i].chapter ? PAGES[i].chapter.title : PAGES[i].kind;
                const side = el.className.indexOf('right') >= 0 ? '오른쪽'
                    : el.className.indexOf('left') >= 0 ? '왼쪽' : el.className;
                bad.push('쪽' + i + ' ' + ch + ' · ' + side + ' · ' + over + 'px · ' + el.textContent.trim().slice(0, 18));
            }
        });
        doc.querySelectorAll('.spread-text-left, .spread-text-right').forEach(el => {
            if (!el.textContent.trim()) bad.push('쪽' + i + ' ' + el.className + ' 빈칸');
        });
    }
    current = 0;
    paint();
    const book = doc.querySelector('.book');
    return { book: [book.clientWidth, book.clientHeight], bad };
}

const run = (win) => win.eval('(' + measureInside.toString() + ')()');

(async () => {
    const slugs = await (await fetch('_books_fix.json')).json();
    const lines = [];
    for (const slug of slugs) {
        const res = [];
        for (const [w, h] of SIZES) {
            frame.style.width = w + 'px';
            frame.style.height = h + 'px';
            await load(slug);
            await new Promise(r => setTimeout(r, 100));
            try {
                const r = run(frame.contentWindow);
                r.bad.forEach(s => res.push(`  [${w}×${h} 책${r.book[0]}] ${s}`));
            } catch (e) {
                res.push(`  [${w}×${h}] 검사 실패: ${e.message}`);
            }
        }
        lines.push(res.length ? `✗ ${slug}\n${res.join('\n')}` : `✔ ${slug}`);
        out.textContent = lines.join('\n');
    }
    out.textContent = lines.join('\n') + '\n\n=== 끝 ===';
})();
</script>
</body>
</html>
