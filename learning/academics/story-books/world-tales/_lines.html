<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>한 줄에 몇 글자</title>
<style>
    body { font: 14px monospace; margin: 16px; }
    iframe { position: fixed; left: -6000px; top: 0; border: 0; }
    pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>문단 글자 수 → 차지하는 줄 수</h1>
<pre id="out">…</pre>
<iframe id="frame" style="width:1366px;height:768px"></iframe>
<script>
const out = document.getElementById('out');
const frame = document.getElementById('frame');

function probe() {
    const rows = [];
    let colW = 0, lh = 0;
    for (let i = 0; i < PAGES.length; i++) {
        if (PAGES[i].kind !== 'spread') continue;
        current = i;
        paint();
        for (const side of ['left', 'right']) {
            const el = document.querySelector('.spread-text-' + side);
            if (!el) continue;
            colW = el.clientWidth;
            for (const p of el.querySelectorAll('p')) {
                lh = parseFloat(getComputedStyle(p).lineHeight);
                const chars = p.textContent.replace(/\s/g, '').length;
                const lines = Math.round(p.getBoundingClientRect().height / lh);
                rows.push(chars + '자→' + lines + '줄');
            }
        }
    }
    // 글자 수별로 몇 줄이 되는지 표로 모은다
    const map = {};
    for (const r of rows) {
        const [c, l] = r.split('자→');
        (map[l] = map[l] || []).push(+c);
    }
    const summary = Object.keys(map).sort().map(l => {
        const a = map[l];
        return l.replace('줄', '') + '줄: ' + Math.min(...a) + '~' + Math.max(...a) + '자 (' + a.length + '개)';
    });
    return { colW: Math.round(colW), lh, summary };
}

(async () => {
    const slugs = await (await fetch('_books.json')).json();
    const lines = [];
    for (const slug of slugs) {
        await new Promise(r => { frame.onload = r; frame.src = slug + '/'; });
        await new Promise(r => setTimeout(r, 100));
        const s = frame.contentWindow.eval('(' + probe.toString() + ')()');
        lines.push(slug + '  칸너비 ' + s.colW + 'px · 줄높이 ' + s.lh + 'px');
        lines.push('  ' + s.summary.join('\n  '));
        out.textContent = lines.join('\n');
    }
    out.textContent = lines.join('\n') + '\n\n=== 끝 ===';
})();
</script>
</body>
</html>
