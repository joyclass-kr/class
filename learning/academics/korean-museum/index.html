<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대한민국 고속도로 한국사 보물 지도 탐험대</title>
  <meta name="description" content="고속도로 노선을 따라 한반도 주요 유물과 출토지, 박물관을 탐험하고 내신/수능 핵심 문제를 푸는 인터랙티브 한국사 보물 지도 앱">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  
  <!-- App Styles -->
  <link rel="stylesheet" href="styles.css">
  
</head>
<body>
  <!-- Global App Header & Smart Filters -->
  <header class="app-header">
    <div class="header-main">
      <div class="brand">
        <span class="brand-badge">내신/수능 핵심</span>
        <h1 class="brand-title">🗺️ 대한민국 고속도로 한국사 보물 지도 탐험대</h1>
      </div>
      
    </div>

    <!-- Smart Filter Controls -->
    <div id="filter-bar" class="filter-bar">
      <!-- Era Filters -->
      <div class="filter-group">
        <span class="filter-label">📅 시대 선택:</span>
        <button class="filter-btn active" data-filter-type="era" data-value="all">전체</button>
        <button class="filter-btn" data-filter-type="era" data-value="prehistoric">1. 선사·고조선</button>
        <button class="filter-btn" data-filter-type="era" data-value="three_kingdoms">2. 삼국 시대</button>
        <button class="filter-btn" data-filter-type="era" data-value="unified_silla">3. 통일신라·발해</button>
        <button class="filter-btn" data-filter-type="era" data-value="goryeo">4. 고려 시대</button>
        <button class="filter-btn" data-filter-type="era" data-value="joseon">5. 조선 시대</button>
        <button class="filter-btn" data-filter-type="era" data-value="modern">6. 근현대</button>
      </div>

      <!-- Route Filters -->
      <div class="filter-group">
        <span class="filter-label">🛣️ 고속도로 코스:</span>
        <button class="filter-btn active" data-filter-type="route" data-value="all">전체 노선</button>
        <button class="filter-btn route-kb" data-filter-type="route" data-value="경부선">🔴 경부선</button>
        <button class="filter-btn route-sh" data-filter-type="route" data-value="서해안선">🔵 서해안선</button>
        <button class="filter-btn route-yd" data-filter-type="route" data-value="영동선">🟢 영동선</button>
        <button class="filter-btn route-hn" data-filter-type="route" data-value="호남선">🟡 호남선</button>
        <button class="filter-btn route-ov" data-filter-type="route" data-value="해외선">✈️ 해외 유출</button>
      </div>

      <!-- Quick Relic Jump Select -->
      <div class="filter-group search-group">
        <span class="filter-label">⚡ 유물 빠른 이동:</span>
        <select id="relic-quick-select" class="relic-select">
          <option value="">✨ 찾으시는 유물/비석 선택 (63종)</option>
        </select>
      </div>
    </div>

  </header>

  <!-- Main View Container -->
  <main class="main-content">
    <!-- Map Container -->
    <div id="map-container" class="map-container"></div>

  </main>

  <!-- Relic Docent & Quiz Modal -->
  <dialog id="art-modal" class="art-modal" aria-labelledby="modal-title">
    <article class="modal-card">
      <button id="modal-close" class="modal-close-btn" type="button" aria-label="유물 설명 닫기">✕</button>
      
      <div class="modal-grid">
        <!-- Relic Real Image Section -->
        <figure class="modal-media-col">
          <div class="image-frame">
            <img id="modal-image" src="" alt="유물 원작 사진" class="relic-real-img">
            <span id="modal-designation" class="badge-designation">국보 유물</span>
          </div>
          <figcaption class="image-caption">
            <span>실물 자료</span>
            <strong id="modal-media-title">광개토대왕릉비</strong>
          </figcaption>
        </figure>

        <!-- Details & Interactive Quiz Section -->
        <section class="modal-info-col">
          <div class="modal-header">
            <p class="modal-eyebrow">한국사 보물 카드</p>
            <div class="badges">
              <span id="modal-era" class="badge-era">삼국 시대</span>
              <span id="modal-route" class="badge-route">🔴 경부선</span>
            </div>
            <h2 id="modal-title" class="modal-title-text">광개토대왕릉비</h2>
            <p id="modal-subtitle" class="modal-subtitle-text">Gwanggaeto Stele</p>
          </div>

          <dl class="meta-box">
            <div class="meta-item">
              <dt><span aria-hidden="true">📍</span> 출토·발견</dt>
              <dd id="modal-location">중국 길림성 집안시</dd>
            </div>
            <div class="meta-item">
              <dt><span aria-hidden="true">🏛️</span> 현재 위치</dt>
              <dd id="modal-museum">고구려 금석문 유적</dd>
            </div>
          </dl>

          <!-- Tab Navigation (Docent vs Quiz) -->
          <div class="modal-tabs" role="tablist" aria-label="유물 학습 메뉴">
            <button id="tab-docent-btn" class="tab-btn active" type="button" role="tab"
              aria-selected="true" aria-controls="tab-docent-content">핵심 정리</button>
            <button id="tab-quiz-btn" class="tab-btn" type="button" role="tab"
              aria-selected="false" aria-controls="tab-quiz-content">1문제 확인</button>
          </div>

          <!-- Tab Content 1: Docent -->
          <div id="tab-docent-content" class="tab-content docent-content" role="tabpanel"
            aria-labelledby="tab-docent-btn">
            <section class="learning-block" aria-labelledby="story-heading">
              <p id="story-heading" class="section-label">왜 중요한가</p>
              <p id="modal-docent" class="docent-text"></p>
            </section>
            <div class="exam-tip-card">
              <p class="section-label"><span aria-hidden="true">📌</span> 시험에 나오는 핵심</p>
              <p id="modal-exam-tip" class="exam-tip-text"></p>
            </div>
          </div>

          <!-- Tab Content 2: Quiz -->
          <div id="tab-quiz-content" class="tab-content quiz-content" role="tabpanel"
            aria-labelledby="tab-quiz-btn" hidden>
            <p class="section-label">사진을 보고 바로 확인해 보세요</p>
            <p id="quiz-question" class="quiz-question-text"></p>
            <div id="quiz-options" class="quiz-options-list"></div>
            <div id="quiz-result" class="quiz-result-card" hidden aria-live="polite"></div>
          </div>
        </section>
      </div>
    </article>
  </dialog>

  <!-- App Logic Scripts -->
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="history-data.js"></script>
  <script src="treasure-map.js"></script>
</body>
</html>
