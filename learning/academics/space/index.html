<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="songhwaplay 우주 관찰 - 태양계, 지구와 달, 별과 별자리">
    <title>우주 관찰</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Canvas for Animated Starfield Background -->
    <canvas id="bgCanvas"></canvas>

    <!-- Header Navigation -->
    <header class="top-header" style="position: relative; z-index: 100;">
        <div class="brand-section">
            <a href="../../../" class="home-btn">
                <span>◀</span> 포털 메인
            </a>
            <h1 class="app-title">🌌 우주 관찰 <span style="font-size: 14px; color: #38bdf8; font-weight: 700; margin-left: 4px;">(Space Observation)</span></h1>
        </div>
    </header>

    <!-- Main Content Container -->
    <div class="space-hub-container">
        
        <!-- Hero Section -->
        <section class="space-hero">
            <h1>우주 관찰 <span style="font-size: 1.5rem; font-weight: 600; color: #38bdf8; margin-left: 8px;">(Space Observation)</span></h1>
        </section>

        <!-- 3 Paths Grid -->
        <div class="path-grid">
            
            <!-- Path 1: 지구와 달 -->
            <a href="./earth-moon/" class="path-card">
                <div>
                    <div class="card-icon">🌕</div>
                    <div class="card-title">
                        지구와 달 <span style="font-size: 0.95rem; font-weight: 600; color: #38bdf8; margin-left: 6px;">(Earth &amp; Moon)</span>
                    </div>
                    <div class="card-desc">
                        지구의 자전과 공전, 계절 변화, 달의 위상 및 일식·월식
                    </div>
                </div>
                <div class="btn-enter">
                    <span>이동하기</span>
                    <span>→</span>
                </div>
            </a>

            <!-- Path 2: 태양계 -->
            <a href="./solar-system/" class="path-card">
                <div>
                    <div class="card-icon">🪐</div>
                    <div class="card-title">
                        태양계 <span style="font-size: 0.95rem; font-weight: 600; color: #38bdf8; margin-left: 6px;">(Solar System)</span>
                    </div>
                    <div class="card-desc">
                        태양과 8개 행성의 자전과 공전
                    </div>
                </div>
                <div class="btn-enter">
                    <span>이동하기</span>
                    <span>→</span>
                </div>
            </a>

            <!-- Path 3: 별과 별자리 -->
            <a href="./constellations/" class="path-card">
                <div>
                    <div class="card-icon">⭐</div>
                    <div class="card-title">
                        별과 별자리 <span style="font-size: 0.95rem; font-weight: 600; color: #38bdf8; margin-left: 6px;">(Stars &amp; Constellations)</span>
                    </div>
                    <div class="card-desc">
                        계절별 밤하늘 별자리 및 북극성 위치
                    </div>
                </div>
                <div class="btn-enter">
                    <span>이동하기</span>
                    <span>→</span>
                </div>
            </a>

        </div>
    </div>

    <!-- Starfield Animation Script -->
    <script src="app.js"></script>
</body>
</html>
