<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="songhwaplay 우주 관찰 - 태양계, 지구와 달, 별과 별자리">
    <title>우주 관찰</title>
    <link rel="stylesheet" href="./solar-system/styles.css">
    <style>
        .space-hub-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
            position: relative;
            z-index: 10;
        }

        .space-hero {
            text-align: center;
            margin-bottom: 45px;
        }

        .space-hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #f8fafc;
            letter-spacing: -0.5px;
        }

        .path-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .path-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px 26px;
            backdrop-filter: blur(16px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
        }

        .path-card:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 12px 30px -10px rgba(14, 165, 233, 0.3);
            background: rgba(15, 23, 42, 0.92);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            display: inline-block;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 12px;
        }

        .card-desc {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 28px;
            flex-grow: 1;
        }

        .btn-enter {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .path-card:hover .btn-enter {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
        }

        /* Canvas for Animated Starfield Background */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>

    <!-- Canvas for Animated Starfield Background -->
    <canvas id="bgCanvas"></canvas>

    <!-- Header Navigation -->
    <header class="top-header" style="position: relative; z-index: 100;">
        <div class="brand-section">
            <a href="../../../index.html" class="home-btn">
                <span>◀</span> 포털 메인
            </a>
            <h1 class="app-title">🌌 우주 관찰 <span style="font-size: 14px; color: #38bdf8; font-weight: 700; margin-left: 4px;">(Space Observation)</span></h1>
        </div>
    </header>

    <!-- Main Content Container -->
    <div class="space-hub-container">
        
        <!-- Hero Section -->
        <section class="space-hero">
            <h1>우주 관찰 <span style="font-size: 1.5rem; font-weight: 600; color: #38bdf8; margin-left: 8px;">(Space Observation)</span></h1>
        </section>

        <!-- 3 Paths Grid -->
        <div class="path-grid">
            
            <!-- Path 1: 지구와 달 -->
            <a href="./earth-moon/index.html" class="path-card">
                <div>
                    <div class="card-icon">🌕</div>
                    <div class="card-title">
                        지구와 달 <span style="font-size: 0.95rem; font-weight: 600; color: #38bdf8; margin-left: 6px;">(Earth &amp; Moon)</span>
                    </div>
                    <div class="card-desc">
                        지구의 자전과 공전, 계절 변화, 달의 위상 및 일식·월식
                    </div>
                </div>
                <div class="btn-enter">
                    <span>이동하기</span>
                    <span>→</span>
                </div>
            </a>

            <!-- Path 2: 태양계 -->
            <a href="./solar-system/index.html" class="path-card">
                <div>
                    <div class="card-icon">🪐</div>
                    <div class="card-title">
                        태양계 <span style="font-size: 0.95rem; font-weight: 600; color: #38bdf8; margin-left: 6px;">(Solar System)</span>
                    </div>
                    <div class="card-desc">
                        태양과 8개 행성의 자전과 공전
                    </div>
                </div>
                <div class="btn-enter">
                    <span>이동하기</span>
                    <span>→</span>
                </div>
            </a>

            <!-- Path 3: 별과 별자리 -->
            <a href="./constellations/index.html" class="path-card">
                <div>
                    <div class="card-icon">⭐</div>
                    <div class="card-title">
                        별과 별자리 <span style="font-size: 0.95rem; font-weight: 600; color: #38bdf8; margin-left: 6px;">(Stars &amp; Constellations)</span>
                    </div>
                    <div class="card-desc">
                        계절별 밤하늘 별자리 및 북극성 위치
                    </div>
                </div>
                <div class="btn-enter">
                    <span>이동하기</span>
                    <span>→</span>
                </div>
            </a>

        </div>
    </div>

    <!-- Starfield Animation Script -->
    <script>
        (function() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            let stars = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                initStars();
            }

            function initStars() {
                stars = [];
                const count = Math.floor((canvas.width * canvas.height) / 3500);
                for (let i = 0; i < count; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 1.4 + 0.3,
                        alpha: Math.random(),
                        speed: Math.random() * 0.01 + 0.003,
                        color: '#ffffff'
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                stars.forEach(star => {
                    star.alpha += star.speed;
                    if (star.alpha > 1 || star.alpha < 0) {
                        star.speed = -star.speed;
                    }
                    ctx.save();
                    ctx.globalAlpha = Math.max(0.1, Math.min(1, star.alpha));
                    ctx.fillStyle = star.color;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
                requestAnimationFrame(draw);
            }

            window.addEventListener('resize', resize);
            resize();
            draw();
        })();
    </script>
</body>
</html>
