<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>국내 여행 지도</title>
  <meta name="description" content="우리 학교에서 출발해 국내 관광지를 탐색하는 학습 지도">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="home-link" href="/" aria-label="학습 메뉴로 돌아가기">←</a>
    <div>
      <h1>국내 여행 지도</h1>
      <p id="schoolSummary">학교 정보를 확인하고 있어요.</p>
    </div>
    <button id="levelButton" class="level-button" type="button" aria-pressed="false">초등 설명</button>
  </header>
  <main class="workspace">
    <section class="map-panel" aria-labelledby="mapTitle">
      <div class="map-heading">
        <div><span class="eyebrow">어디로 떠나 볼까요?</span><h2 id="mapTitle">지도에서 장소를 골라보세요</h2></div>
        <span class="origin-badge" id="originBadge">출발지 확인 중</span>
      </div>
      <div class="travel-map" aria-label="국내 관광지 선택 지도">
        <div class="sea-label">서해</div>
        <div class="peninsula" aria-hidden="true"></div>
        <button class="place-pin is-selected" data-place="gyeongbokgung" style="--x:43%;--y:18%" type="button"><span>1</span><strong>경복궁</strong></button>
        <button class="place-pin" data-place="gongju" style="--x:35%;--y:43%" type="button"><span>2</span><strong>공산성</strong></button>
        <button class="place-pin" data-place="bulguksa" style="--x:67%;--y:59%" type="button"><span>3</span><strong>불국사</strong></button>
        <button class="place-pin" data-place="suncheon" style="--x:40%;--y:72%" type="button"><span>4</span><strong>순천만</strong></button>
        <button class="place-pin" data-place="seongsan" style="--x:49%;--y:91%" type="button"><span>5</span><strong>성산일출봉</strong></button>
        <div class="jeju-shape" aria-hidden="true"></div>
      </div>
    </section>
    <aside class="detail-panel" aria-live="polite">
      <div class="detail-title-row">
        <div><span id="placeRegion" class="eyebrow">서울특별시</span><h2 id="placeName">경복궁</h2></div>
        <span id="placeType" class="type-badge">문화유산</span>
      </div>
      <section class="route-card" aria-labelledby="routeTitle">
        <h3 id="routeTitle">우리 학교에서 출발</h3>
        <div class="route-line"><span class="route-dot school-dot" aria-hidden="true"></span><strong id="routeSchool">학교 확인 중</strong></div>
        <div class="route-stem" aria-hidden="true"></div>
        <div class="route-line"><span class="route-dot destination-dot" aria-hidden="true"></span><strong id="routeDestination">경복궁</strong></div>
        <p id="routeStatus" class="route-status">학교 위치가 등록되면 거리와 길찾기를 확인할 수 있어요.</p>
      </section>
      <section class="learn-card"><h3>이곳은 어떤 곳일까요?</h3><p id="placeDescription"></p></section>
      <section class="mission-card"><span class="mission-label">관찰 미션</span><p id="placeMission"></p></section>
    </aside>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
