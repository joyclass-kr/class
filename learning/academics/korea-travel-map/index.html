<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>국내 여행 지도</title>
  <meta name="description" content="우리 학교에서 출발해 국내 관광지를 탐색하는 학습 지도">
  <link rel="stylesheet" href="../korean-museum/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=20260809-2">
</head>
<body>
  <header class="app-header">
    <div class="brand-row">
      <a class="home-link" href="/" aria-label="학습 메뉴로 돌아가기">←</a>
      <div class="brand-copy">
        <h1>국내 여행 지도</h1>
        <p id="schoolSummary">학교 정보를 확인하고 있어요.</p>
      </div>
      <button id="levelButton" class="level-button" type="button" aria-pressed="false">초등 설명</button>
    </div>
    <div class="filter-bar" aria-label="관광지 종류 선택">
      <span class="filter-label">어떤 여행을 떠날까요?</span>
      <button class="filter-btn active" data-category="all" type="button">전체</button>
      <button class="filter-btn" data-category="history" type="button">역사·문화</button>
      <button class="filter-btn" data-category="nature" type="button">자연·생태</button>
    </div>
  </header>

  <main class="map-shell">
    <div id="map-container" aria-label="국내 관광지 지도"></div>
    <div class="map-guide"><strong>지도를 움직이고 확대해 보세요.</strong><span>관광지 그림을 누르면 자세한 내용이 열려요.</span></div>
  </main>

  <dialog id="placeModal" class="place-modal" aria-labelledby="placeName">
    <article class="modal-card">
      <button id="modalClose" class="modal-close" type="button" aria-label="관광지 설명 닫기">✕</button>
      <div class="modal-grid">
        <section class="place-visual" id="placeVisual">
          <span id="placeEmoji" aria-hidden="true">🏯</span>
          <div><small id="placeRegion">서울특별시</small><strong id="visualPlaceName">경복궁</strong></div>
        </section>
        <section class="place-info">
          <div class="title-row">
            <div><span id="placeCategory" class="category-badge">역사·문화</span><h2 id="placeName">경복궁</h2></div>
            <button id="modalLevelButton" class="modal-level-button" type="button">초등 설명</button>
          </div>
          <section class="route-card">
            <h3>우리 학교에서 출발</h3>
            <div class="route-point"><span class="school-dot"></span><strong id="routeSchool">등록된 학교 없음</strong></div>
            <div class="route-line"></div>
            <div class="route-point"><span class="place-dot"></span><strong id="routeDestination">경복궁</strong></div>
            <p id="routeStatus">학교의 정확한 위치와 길찾기 서비스를 연결하면 실제 경로와 예상 시간이 표시됩니다.</p>
          </section>
          <section class="description-card"><h3>이곳은 어떤 곳일까요?</h3><p id="placeDescription"></p></section>
          <section class="mission-card"><h3>🔎 관찰 미션</h3><p id="placeMission"></p></section>
        </section>
      </div>
    </article>
  </dialog>

  <script src="../korean-museum/vendor/leaflet/leaflet.js"></script>
  <script src="app.js?v=20260809-3"></script>
</body>
</html>
