<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="함수 그래프 도구">
  <title>수학 그래프 - songhwaplay</title>
  <link rel="stylesheet" href="vendor/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <a href="../../../" class="back">← 기초학력</a>
        <h1>수학 그래프</h1>
      </div>
      <div class="headerActions">
        <button type="button" id="printButton">수업 자료 인쇄</button>
        <button type="button" class="primary" id="saveButton">PNG 저장</button>
      </div>
    </header>
    <section class="workspace">
      <aside class="library">
        <div class="sectionHeading"><span>01</span><div><strong>함수 목록</strong></div></div>
        <div id="presetLibrary"></div>
      </aside>
      <section class="stage">
        <div class="formulaBar">
          <span>ƒ(x)</span>
          <div class="formulaDisplay" id="formulaDisplay"></div>
          <small id="formulaHelp">선택한 함수의 교과서식 표현</small>
        </div>
        <section class="functionComposer" aria-labelledby="composerTitle">
          <header>
            <div><strong id="composerTitle">함수 직접 입력</strong><small>여러 함수와 합성함수를 동시에 그릴 수 있습니다.</small></div>
            <button type="button" id="addFunctionButton">＋ 함수 추가</button>
          </header>
          <div class="functionRows" id="functionRows"></div>
          <div class="mathKeyboard" id="mathKeyboard">
            <div class="keyboardHeading">
              <strong>수학 키패드</strong>
              <span id="activeFunctionLabel">y1 편집 중</span>
            </div>
            <div class="keyboardKeys" aria-label="수학 수식 키패드">
              <button type="button" data-insert="x">x</button>
              <button type="button" data-insert="(">(</button>
              <button type="button" data-insert=")">)</button>
              <button type="button" data-insert="^2">x²</button>
              <button type="button" data-insert="^">xⁿ</button>
              <button type="button" data-insert="+">＋</button>
              <button type="button" data-insert="-">−</button>
              <button type="button" data-insert="×">×</button>
              <button type="button" data-insert="÷">÷</button>
              <button type="button" data-wrap-before="sin(" data-wrap-after=")">sin</button>
              <button type="button" data-wrap-before="cos(" data-wrap-after=")">cos</button>
              <button type="button" data-wrap-before="tan(" data-wrap-after=")">tan</button>
              <button type="button" data-wrap-before="ln(" data-wrap-after=")">ln</button>
              <button type="button" data-wrap-before="log10(" data-wrap-after=")">log</button>
              <button type="button" data-wrap-before="sqrt(" data-wrap-after=")">√</button>
              <button type="button" data-wrap-before="abs(" data-wrap-after=")">|x|</button>
              <button type="button" data-wrap-before="exp(" data-wrap-after=")">eˣ</button>
              <button type="button" data-insert="pi">π</button>
              <button type="button" class="keyboardUtility" data-action="backspace">⌫</button>
              <button type="button" class="keyboardUtility" data-action="clear">지우기</button>
            </div>
            <div class="formulaExamples">
              <span>합성함수 예시</span>
              <button type="button" data-example="sin(x^2)">sin(x²)</button>
              <button type="button" data-example="ln(x^2+1)">ln(x²+1)</button>
              <button type="button" data-example="exp(sin(x))">e<sup>sin x</sup></button>
              <button type="button" data-example="sqrt(abs(x))">√|x|</button>
              <button type="button" data-example="(x^2+1)/(x-1)">유리함수</button>
            </div>
          </div>
          <p class="syntaxGuide">
            <b>도움말:</b> 수식창을 먼저 선택한 뒤 키패드를 누르세요.
            곱셈 기호는 <span class="inlineMath" data-latex="2x">2x</span>,
            <span class="inlineMath" data-latex="a(x-h)">a(x-h)</span>처럼 생략해도 됩니다.
          </p>
        </section>
        <div class="canvasWrap">
          <canvas id="graphCanvas" aria-label="함수 그래프" title="마우스 휠로 확대·축소하고, 두 번 클릭하면 초기화됩니다."></canvas>
          <div class="legend" id="legend"><span><i style="background:#6558d9"></i>ƒ(x)</span></div>
          <div class="rangeControl" aria-label="그래프 확대와 축소">
            <button type="button" data-zoom="out" aria-label="축소">−</button>
            <output id="zoomLevel" aria-live="polite">100%</output>
            <button type="button" data-zoom="in" aria-label="확대">+</button>
            <button type="button" data-range="10" aria-label="확대 축소 초기화">초기화</button>
          </div>
        </div>
      </section>
      <aside class="controls">
        <div class="sectionHeading"><span>02</span><div><strong>그래프 움직이기</strong><small>값을 드래그하세요</small></div></div>
        <div id="sliders"></div>
        <button type="button" class="reset" id="resetButton">계수 초기화</button>
        <div class="sectionHeading"><span>03</span><div><strong>수업 보조선</strong><small>설명 요소를 켜세요</small></div></div>
        <label class="toggle"><span><b>좌표점 표시</b><small>x = −2, −1, 0, 1, 2</small></span><input id="showPoints" type="checkbox" checked></label>
        <label class="toggle"><span><b>도함수 표시</b><small>원함수와 변화율 비교</small></span><input id="showDerivative" type="checkbox"></label>
        <label class="toggle"><span><b>정적분 넓이</b><small>x = −2부터 2까지</small></span><input id="showIntegral" type="checkbox"></label>
        <div class="tip"><strong>수업 질문</strong><p id="lessonQuestion">a의 부호가 바뀌면 그래프의 모양은 어떻게 달라질까요?</p></div>
      </aside>
    </section>
  </main>
  <script src="vendor/katex.min.js"></script>
  <script src="math-format.js"></script>
  <script src="app.js"></script>
</body>
</html>
