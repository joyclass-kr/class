<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>場 · 道 | 韓字</title>
  <style>
    @font-face {
      font-family: "KleeHanja";
      src: url("../../../../assets/fonts/klee-one/KleeOne-SemiBold.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --paper: #f7f5ef;
      --ink: #202630;
      --muted: #65707c;
      --line: #d9d6ce;
      --blue: #2d638c;
      --blue-soft: #eaf2f7;
      --correct: #226847;
      --correct-soft: #eaf5ee;
      --wrong: #a43d36;
      --wrong-soft: #fbefed;
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: "Noto Serif KR", "KoPub Batang", "Batang", serif;
      -webkit-font-smoothing: antialiased;
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    .page {
      position: relative;
      width: min(1180px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: clamp(12px, 2vw, 22px) clamp(20px, 4vw, 54px) 18px;
    }

    .topline {
      position: absolute;
      top: 10px;
      right: calc(clamp(20px, 4vw, 54px) + 330px);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
    }

    .home-link {
      min-height: 44px;
      padding: 6px 2px 6px 14px;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }

    .hanja-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: clamp(20px, 3vw, 34px);
      padding: 6px 0 13px;
      border-bottom: 1px solid var(--line);
    }

    .hanja {
      min-width: 1.2em;
      font-family: "KleeHanja", serif;
      font-size: clamp(78px, 10vw, 112px);
      font-weight: 600;
      line-height: .9;
      text-align: center;
    }

    .hanja-pair {
      display: flex;
      gap: clamp(6px, 1.5vw, 16px);
      min-width: 2.25em;
    }

    .hanja-three {
      display: flex;
      gap: clamp(5px, 1vw, 11px);
      min-width: 3.25em;
      font-size: clamp(68px, 8vw, 94px);
    }

    .stroke-demo {
      display: grid;
      grid-template-columns: 104px 188px;
      align-items: center;
      gap: 10px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf8;
    }

    .stroke-stage { display: block; width: 104px; height: 104px; border: 1px solid #ddd8ce; background: #fff; }
    .stroke-guide { fill: none; stroke: #dedbd3; stroke-width: 1; stroke-dasharray: 4 4; }
    .stroke-set[hidden] { display: none; }
    .stroke-path { fill: none; stroke: var(--ink); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .stroke-controls { display: grid; gap: 6px; }
    .stroke-character-switch { display: grid; grid-template-columns: repeat(var(--stroke-columns), 1fr); gap: 4px; }

    .stroke-character,
    .stroke-button {
      min-height: 44px;
      border: 1px solid #9aa5ad;
      border-radius: 5px;
      background: #fff;
      color: var(--ink);
      font: 800 14px/1.15 system-ui, sans-serif;
      cursor: pointer;
    }

    .stroke-character { min-width: 44px; padding: 4px; font-family: "KleeHanja", serif; font-size: 22px; }
    .stroke-character[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
    .stroke-status { margin: 0; color: var(--blue); font: 800 13px/1.2 system-ui, sans-serif; text-align: center; }
    .stroke-button { padding: 7px 8px; }
    .stroke-character:focus-visible, .stroke-button:focus-visible { outline: 3px solid rgba(45, 99, 140, .28); outline-offset: 2px; }
    .stroke-character:disabled, .stroke-button:disabled { opacity: .55; cursor: default; }

    .reading {
      margin: 0 0 5px;
      font-size: clamp(22px, 2.7vw, 32px);
      font-weight: 800;
    }

    .core-meaning {
      margin: 0;
      color: var(--muted);
      font-size: clamp(18px, 2.1vw, 25px);
      line-height: 1.45;
      word-break: keep-all;
    }

    .view { padding-top: 8px; }
    .view[hidden] { display: none; }

    .lesson-guide {
      margin: 0;
      padding: 8px 0 11px;
      border-bottom: 1px solid var(--line);
      color: var(--blue);
      font-size: clamp(17px, 1.8vw, 21px);
      font-weight: 800;
      line-height: 1.45;
    }

    .word-list { margin: 0; }

    .word-row {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      align-items: center;
      gap: 12px 30px;
      padding: clamp(11px, 1.35vw, 15px) 0;
      border-bottom: 1px solid var(--line);
    }

    .word-row .word-family,
    .word-row .example { margin: 0; }

    .meaning-list { margin: 0; }

    .meaning-row {
      display: grid;
      grid-template-columns: minmax(150px, .62fr) minmax(0, 2fr);
      gap: 8px 28px;
      padding: clamp(8px, 1.1vw, 12px) 0;
      border-bottom: 1px solid var(--line);
    }

    .meaning-row dt {
      color: var(--blue);
      font-size: clamp(17px, 1.8vw, 21px);
      font-weight: 800;
      line-height: 1.45;
    }

    .meaning-row dd { margin: 0; }

    .word-family {
      margin: 0 0 2px;
      font-size: clamp(18px, 2vw, 23px);
      font-weight: 800;
      line-height: 1.45;
      white-space: nowrap;
      word-spacing: .18em;
    }

    .example {
      margin: 0;
      color: #505a64;
      font-size: clamp(14px, 1.5vw, 17px);
      font-weight: 600;
      line-height: 1.45;
      word-break: keep-all;
    }

    .next-button, .reset-button {
      display: block;
      width: min(360px, 100%);
      min-height: 48px;
      margin: 14px auto 0;
      border: 1px solid var(--blue);
      border-radius: 4px;
      background: var(--blue);
      color: white;
      font: 800 17px/1.2 system-ui, sans-serif;
      cursor: pointer;
    }

    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(18px, 2.5vw, 30px) clamp(28px, 4vw, 52px);
    }

    .question {
      min-width: 0;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--line);
    }

    .question h2 {
      margin: 0 0 7px;
      font-size: clamp(20px, 2vw, 25px);
      line-height: 1.5;
      word-break: keep-all;
    }

    .question-context {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: clamp(15px, 1.45vw, 17px);
      font-weight: 700;
      line-height: 1.45;
      word-break: keep-all;
    }

    .q-number {
      display: inline-grid;
      width: 32px;
      height: 32px;
      margin-right: 8px;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 50%;
      font: 700 16px/1 system-ui, sans-serif;
      vertical-align: 2px;
    }

    .choices {
      display: grid;
      gap: 8px;
    }

    .choice {
      min-height: 44px;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: clamp(16px, 1.55vw, 19px);
      line-height: 1.45;
      text-align: left;
      cursor: pointer;
    }

    .choice:hover, .choice:focus-visible {
      border-color: #a9bcc9;
      background: var(--blue-soft);
      outline: none;
    }

    .choice.correct {
      border-color: #83b49a;
      background: var(--correct-soft);
      color: var(--correct);
      font-weight: 800;
    }

    .choice.wrong {
      border-color: #d9a19c;
      background: var(--wrong-soft);
      color: var(--wrong);
    }

    .choice:disabled { cursor: default; opacity: 1; }
    u { text-decoration-thickness: 2px; text-underline-offset: 4px; }

    .feedback {
      min-height: 25px;
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.45;
    }

    .feedback:empty {
      min-height: 0;
      margin-top: 0;
    }

    .feedback.is-correct { color: var(--correct); }
    .feedback.is-wrong { color: var(--wrong); }

    .result {
      margin: 28px 0 0;
      padding: 18px;
      border-top: 2px solid var(--ink);
      border-bottom: 1px solid var(--line);
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 800;
      text-align: center;
    }

    .quiz-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .quiz-actions button { margin: 0; }

    body.quiz-active .hanja-head { padding: 0 0 8px; }
    body.quiz-active .hanja { font-size: clamp(64px, 7.5vw, 82px); }
    body.quiz-active .reading { font-size: clamp(21px, 2.2vw, 27px); }
    body.quiz-active .core-meaning { font-size: clamp(17px, 1.8vw, 21px); }
    body.quiz-active .quiz-grid { gap: 10px clamp(28px, 4vw, 52px); }
    body.quiz-active .quiz-actions { margin-top: 14px; }

    .next-lesson {
      display: block;
      width: min(360px, 100%);
      min-height: 48px;
      margin: 14px auto 0;
      padding: 13px 20px;
      border: 1px solid var(--blue);
      border-radius: 4px;
      background: var(--blue);
      color: white;
      font: 800 17px/1.2 system-ui, sans-serif;
      text-align: center;
      text-decoration: none;
    }

    .next-lesson[hidden] { display: none; }

    .back-button {
      min-height: 58px;
      padding: 0 26px;
      border: 1px solid #aeb4b8;
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font: 800 18px/1.2 system-ui, sans-serif;
      cursor: pointer;
    }

    @media (max-width: 800px) {
      .page { padding-inline: 18px; }
      .topline { position: static; min-height: 32px; }
      .hanja-head { grid-template-columns: auto 1fr; gap: 8px 20px; }
      .stroke-demo { grid-column: 2; }
      .word-row { grid-template-columns: 1fr; gap: 3px; }
      .meaning-row { grid-template-columns: 1fr; gap: 6px; }
      .quiz-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .view { animation: appear .18s ease-out; }
      @keyframes appear { from { opacity: .2; transform: translateY(4px); } }
    }
    .hanja-generated { display:flex; gap:clamp(4px, .8vw, 9px); min-width:calc(var(--hanja-size) * 2); font-size:clamp(42px, 6vw, var(--hanja-size)); }
  </style>
</head>
<body>
  <main class="page">
    <div class="topline">
      <a class="home-link" href="../">차시 목록</a>
    </div>

    <header class="hanja-head">
      <div class="hanja hanja-generated" style="--hanja-size:62px" aria-label="곳 장, 길 도"><span>場</span><span>道</span></div>
      <div>
        <p class="reading">장 · 도</p>
        <p class="core-meaning">곳 · 길</p>
      </div>
      <section class="stroke-demo" aria-label="場·道 획순">
        <svg class="stroke-stage" viewBox="0 0 160 160" role="img" aria-label="선택한 한자의 획순">
          <path class="stroke-guide" d="M80 0V160M0 80H160M0 0L160 160M160 0L0 160" />
          <g class="stroke-set" data-character="場" transform="translate(10 8) scale(1.3)">
            <path class="stroke-path" d="M14.75,41.17c1.33,0.52,2.75,0.44,4.13,0.29c5.78-0.62,11.92-2.14,17.63-3.21c1.58-0.3,3.33-0.32,4.14-0.13" />
            <path class="stroke-path" d="M27.8,19.37c1.17,1.17,1.52,2.52,1.52,4.39c0,9.54-0.07,36.54-0.07,38.25" />
            <path class="stroke-path" d="M13.5,68.6c1.75,1.4,3.14,1.36,5.67-0.05c1.49-0.84,15-7.27,21.33-11.29" />
            <path class="stroke-path" d="M51,13.5c0.88,0.88,1.37,1.62,1.59,3.24c0.72,5.29,1.08,10.35,2.23,19.5c0.13,1,0.26,2.05,0.41,3.15" />
            <path class="stroke-path" d="M53.53,14.93c6.23-0.83,18.68-2.8,24.51-3.17c2.22-0.14,4.34,1.33,4.17,3.24c-0.7,7.75-1.17,13.66-2.02,18.83c-0.13,0.83-0.54,1.9-0.54,2.47" />
            <path class="stroke-path" d="M54.82,25.72c6.06-0.84,20.06-2.22,25.38-2.46" />
            <path class="stroke-path" d="M56.17,36.55c4.1-0.55,17.42-1.97,22.53-2.45" />
            <path class="stroke-path" d="M43.6,47.75c1.8,0.39,4.56,0.59,6.35,0.39C63,46.62,74,45,89.12,44.02c3-0.19,5.26,0.12,6.76,0.32" />
            <path class="stroke-path" d="M55,50.38c0.11,1.15-0.23,2.25-0.86,3.26c-3.05,4.94-8.3,10.43-15.39,14.86" />
            <path class="stroke-path" d="M54.87,58.05c2.13,0.33,3.68,0.08,5.42-0.04c6.96-0.5,23.33-3.25,27.59-3.74c3.27-0.37,4.98,1.05,4.45,4.29C91,66.75,86.15,83.96,78.92,92.78c-2.17,2.65-3.4-0.44-5.34-2.37" />
            <path class="stroke-path" d="M61.75,61.12c0.12,1-0.08,1.67-0.51,2.56c-2.74,5.66-9.28,13.58-18.49,18.06" />
            <path class="stroke-path" d="M75.88,59.39c0.1,0.92-0.04,2.36-0.45,3.67C73.04,70.8,63.03,85.12,50,93.5" />
          </g>
          <g class="stroke-set" data-character="道" transform="translate(10 8) scale(1.3)" hidden>
            <path class="stroke-path" d="M49.38,14.88c2.61,1.78,6.73,7.3,7.38,10.06" />
            <path class="stroke-path" d="M77.25,12.5c0.06,0.84-0.03,1.66-0.37,2.42c-1.38,3.08-3.38,6.7-6.63,10.2" />
            <path class="stroke-path" d="M42.06,32.6c1.75,0.45,4.97,0.38,6.7,0.2c9.99-1.05,25.86-2.93,36.82-3.2c2.91-0.07,4.8,0.15,6.12,0.44" />
            <path class="stroke-path" d="M64.26,33.62c0.25,0.1-0.23,1.75-0.39,2.04c-1.03,1.93-2.08,4.55-4.5,7.09" />

            <path class="stroke-path" d="M52.9,55.9c6.1-0.4,20.85-2.15,26.64-2.34" />
            <path class="stroke-path" d="M53.11,67.65c6.85-0.47,19.47-1.75,26.13-1.75" />
            <path class="stroke-path" d="M53.36,79.25c5.14,0,18.66-1.07,25.31-1.07" />
            <path class="stroke-path" d="M19.75,20c3.38,1.75,8,6.12,9.5,8.75" />
            <path class="stroke-path" d="M13,51.53c2.25,0.86,3.75,0.43,4.75,0.22s9-3.47,10.5-3.9c2.96-0.85,4.22,0.21,2.44,3.03c-6.56,10.38-6.81,8.5-0.11,14.4c2.39,2.1,2.15,3.52-0.57,5.48C25.5,74,21.75,76.25,17.5,79.04" />
            <path class="stroke-path" d="M12.5,81.71c3.11-0.47,9.22-0.87,13.97-0.71c7.15,0.25,31.13,8.25,35.71,9.46C74.61,93.76,81.62,95.5,91,96.05" />
          </g>
        </svg>
        <div class="stroke-controls">
          <div class="stroke-character-switch" style="--stroke-columns:2" aria-label="획순을 볼 글자">
            <button class="stroke-character" type="button" data-character="場" aria-pressed="true">場</button>
            <button class="stroke-character" type="button" data-character="道" aria-pressed="false">道</button>
          </div>
          <p id="strokeStatus" class="stroke-status" aria-live="polite">場 · 준비</p>
          <button id="playStrokes" class="stroke-button" type="button">▶ 획순 보기</button>
          <button id="stepStroke" class="stroke-button" type="button">한 획씩</button>
        </div>
      </section>
    </header>

    <section id="lessonView" class="view" aria-label="뜻과 예시">
      <p class="lesson-guide">場·道는 곳과 길을 나타내며 운동장·시장·도로·인도 같은 말의 뜻을 짐작하게 합니다.</p>
      <div class="word-list">
        <div class="word-row">
          <p class="word-family">場(장) — 장소 · 운동장 · 시장</p>
          <p class="example">어떤 일이 이루어지는 곳은 장소, 운동하는 넓은 곳은 운동장, 물건을 사고파는 곳은 시장입니다.</p>
        </div>
        <div class="word-row">
          <p class="word-family">道(도) — 도로 · 철도 · 수도</p>
          <p class="example">차가 다니는 길은 도로, 철로 된 길은 철도, 물이 다니는 길은 수도입니다.</p>
        </div>
      </div>
      <button id="startQuiz" class="next-button" type="button">문제 풀기</button>
    </section>

    <section id="quizView" class="view" aria-label="확인 문제" hidden>
      <div class="quiz-grid">
                                        <article class="question" data-answer="3" data-note="장점(長點)에는 場이 들어가지 않습니다.">
          <h2><span class="q-number">1</span>場(장)이 들어가지 않은 말은?</h2>
          <div class="choices">
            <button class="choice" type="button">① 점심시간에 <u>운동장</u>에서 뛰어놀았습니다.</button>
            <button class="choice" type="button">② 차를 지하 <u>주차장</u>에 세웠습니다.</button>
            <button class="choice" type="button">③ 주말에 가족과 전통 <u>시장</u>에 갔습니다.</button>
            <button class="choice" type="button">④ 친구의 좋은 <u>장점</u>을 찾아 말해 주었습니다.</button>
          </div>
          <p class="feedback" aria-live="polite"></p>
        </article>


        <article class="question" data-answer="1" data-note="道는 도로(道路)에 들어갑니다.">
          <h2><span class="q-number">2</span>道(도)가 들어간 말은?</h2>
          <div class="choices">
            <button class="choice" type="button" data-hanja="都市">① 큰 <u>도시</u>의 모습을 살펴보았습니다.</button>
            <button class="choice" type="button" data-hanja="道路">② 학교 앞 <u>도로</u>를 안전하게 건넜습니다.</button>
            <button class="choice" type="button" data-hanja="圖書">③ 도서관에서 새 <u>도서</u>를 빌렸습니다.</button>
            <button class="choice" type="button" data-hanja="圖形">④ 수학 시간에 <u>도형</u>을 그렸습니다.</button>
          </div>
          <p class="feedback" aria-live="polite"></p>
        </article>
      </div>
      <p id="result" class="result" aria-live="polite" hidden></p>
      <div class="quiz-actions">
        <button id="backToLesson" class="back-button" type="button">설명 다시 보기</button>
        <button id="resetQuiz" class="reset-button" type="button">다시 풀기</button>
        <a id="nextLesson" class="next-lesson" href="../si-chon/" hidden>다음 글자 市·村</a>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const lessonView = document.getElementById('lessonView');
      const quizView = document.getElementById('quizView');
      const result = document.getElementById('result');
      const nextLesson = document.getElementById('nextLesson');
      const questions = Array.from(document.querySelectorAll('.question'));
      const strokeSets = Array.from(document.querySelectorAll('.stroke-set'));
      const characterButtons = Array.from(document.querySelectorAll('.stroke-character'));
      const strokeStatus = document.getElementById('strokeStatus');
      const playStrokes = document.getElementById('playStrokes');
      const stepStroke = document.getElementById('stepStroke');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let currentCharacter = '場';
      let currentPaths = [];
      let visibleStrokes = 0;
      let strokePlaying = false;

      strokeSets.forEach((set) => {
        set.querySelectorAll('.stroke-path').forEach((path) => {
          const length = path.getTotalLength();
          path.style.strokeDasharray = length;
          path.style.strokeDashoffset = length;
        });
      });

      function resetStrokes() {
        currentPaths.forEach((path) => {
          path.getAnimations().forEach((animation) => animation.cancel());
          path.style.strokeDashoffset = path.getTotalLength();
        });
        visibleStrokes = 0;
        strokeStatus.textContent = `${currentCharacter} · 준비`;
      }

      function selectCharacter(character) {
        currentCharacter = character;
        strokeSets.forEach((set) => {
          set.toggleAttribute('hidden', set.dataset.character !== character);
        });
        characterButtons.forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.character === character));
        });
        const currentSet = strokeSets.find((set) => set.dataset.character === character);
        currentPaths = Array.from(currentSet.querySelectorAll('.stroke-path'));
        resetStrokes();
      }

      async function revealStroke(path) {
        const length = path.getTotalLength();
        if (reducedMotion) {
          path.style.strokeDashoffset = 0;
          return;
        }
        const animation = path.animate(
          [{ strokeDashoffset: length }, { strokeDashoffset: 0 }],
          { duration: 900, easing: 'ease-in-out', fill: 'forwards' }
        );
        await animation.finished;
        path.style.strokeDashoffset = 0;
        animation.cancel();
      }

      characterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          if (!strokePlaying) selectCharacter(button.dataset.character);
        });
      });

      playStrokes.addEventListener('click', async () => {
        if (strokePlaying) return;
        strokePlaying = true;
        playStrokes.disabled = true;
        stepStroke.disabled = true;
        characterButtons.forEach((button) => { button.disabled = true; });
        resetStrokes();
        for (let index = 0; index < currentPaths.length; index += 1) {
          strokeStatus.textContent = `${currentCharacter} · ${index + 1}/${currentPaths.length}획`;
          await revealStroke(currentPaths[index]);
        }
        visibleStrokes = currentPaths.length;
        strokeStatus.textContent = `${currentCharacter} · 완성`;
        playStrokes.disabled = false;
        stepStroke.disabled = false;
        characterButtons.forEach((button) => { button.disabled = false; });
        strokePlaying = false;
      });

      stepStroke.addEventListener('click', () => {
        if (strokePlaying) return;
        if (visibleStrokes >= currentPaths.length) resetStrokes();
        currentPaths[visibleStrokes].style.strokeDashoffset = 0;
        visibleStrokes += 1;
        strokeStatus.textContent = visibleStrokes === currentPaths.length
          ? `${currentCharacter} · 완성`
          : `${currentCharacter} · ${visibleStrokes}/${currentPaths.length}획`;
      });

      selectCharacter('場');

      function show(view) {
        const quiz = view === 'quiz';
        document.body.classList.toggle('quiz-active', quiz);
        lessonView.hidden = quiz;
        quizView.hidden = !quiz;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        (quiz ? quizView : lessonView).focus({ preventScroll: true });
      }

      function updateResult() {
        const answered = questions.filter((question) => question.dataset.done === 'true');
        if (answered.length !== questions.length) return;
        const score = answered.filter((question) => question.dataset.correct === 'true').length;
        result.textContent = `${questions.length}문제 중 ${score}문제를 맞혔습니다.`;
        result.hidden = false;
        nextLesson.hidden = false;
      }

      questions.forEach((question) => {
        const choices = Array.from(question.querySelectorAll('.choice'));
        const answer = Number(question.dataset.answer);
        const feedback = question.querySelector('.feedback');

        choices.forEach((choice, index) => {
          choice.addEventListener('click', () => {
            if (question.dataset.done === 'true') return;
            const correct = index === answer;

            choices.forEach((button) => { button.classList.remove('wrong'); });

            if (!correct) {
              choice.classList.add('wrong');
              feedback.textContent = '다시 생각하고 다른 답을 골라보세요.';
              feedback.className = 'feedback is-wrong';
              return;
            }

            question.dataset.done = 'true';
            question.dataset.correct = 'true';
            choice.classList.add('correct');
            choices.forEach((button) => { button.disabled = true; });
            feedback.textContent = `맞았습니다. ${question.dataset.note}`;
            feedback.className = 'feedback is-correct';
            updateResult();
          });
        });
      });

      function reset() {
        questions.forEach((question) => {
          delete question.dataset.done;
          delete question.dataset.correct;
          question.querySelectorAll('.choice').forEach((choice) => {
            choice.disabled = false;
            choice.classList.remove('correct', 'wrong');
          });
          const feedback = question.querySelector('.feedback');
          feedback.textContent = '';
          feedback.className = 'feedback';
        });
        result.hidden = true;
        result.textContent = '';
        nextLesson.hidden = true;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      document.getElementById('startQuiz').addEventListener('click', () => show('quiz'));
      document.getElementById('backToLesson').addEventListener('click', () => show('lesson'));
      document.getElementById('resetQuiz').addEventListener('click', reset);
    })();
  </script>
</body>
</html>
