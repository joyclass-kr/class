<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>市 · 村 | 韓字</title>
  <style>
    @font-face {
      font-family: "KleeHanja";
      src: url("../../../../assets/fonts/klee-one/KleeOne-SemiBold.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --paper: #f7f5ef;
      --ink: #202630;
      --muted: #65707c;
      --line: #d9d6ce;
      --blue: #2d638c;
      --blue-soft: #eaf2f7;
      --correct: #226847;
      --correct-soft: #eaf5ee;
      --wrong: #a43d36;
      --wrong-soft: #fbefed;
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: "Noto Serif KR", "KoPub Batang", "Batang", serif;
      -webkit-font-smoothing: antialiased;
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    .page {
      position: relative;
      width: min(1180px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: clamp(12px, 2vw, 22px) clamp(20px, 4vw, 54px) 18px;
    }

    .topline {
      position: absolute;
      top: 10px;
      right: calc(clamp(20px, 4vw, 54px) + 330px);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
    }

    .home-link {
      min-height: 44px;
      padding: 6px 2px 6px 14px;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }

    .hanja-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: clamp(20px, 3vw, 34px);
      padding: 6px 0 13px;
      border-bottom: 1px solid var(--line);
    }

    .hanja {
      min-width: 1.2em;
      font-family: "KleeHanja", serif;
      font-size: clamp(78px, 10vw, 112px);
      font-weight: 600;
      line-height: .9;
      text-align: center;
    }

    .hanja-pair {
      display: flex;
      gap: clamp(6px, 1.5vw, 16px);
      min-width: 2.25em;
    }

    .hanja-three {
      display: flex;
      gap: clamp(5px, 1vw, 11px);
      min-width: 3.25em;
      font-size: clamp(68px, 8vw, 94px);
    }

    .stroke-demo {
      display: grid;
      grid-template-columns: 104px 188px;
      align-items: center;
      gap: 10px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf8;
    }

    .stroke-stage { display: block; width: 104px; height: 104px; border: 1px solid #ddd8ce; background: #fff; }
    .stroke-guide { fill: none; stroke: #dedbd3; stroke-width: 1; stroke-dasharray: 4 4; }
    .stroke-set[hidden] { display: none; }
    .stroke-path { fill: none; stroke: var(--ink); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .stroke-controls { display: grid; gap: 6px; }
    .stroke-character-switch { display: grid; grid-template-columns: repeat(var(--stroke-columns), 1fr); gap: 4px; }

    .stroke-character,
    .stroke-button {
      min-height: 44px;
      border: 1px solid #9aa5ad;
      border-radius: 5px;
      background: #fff;
      color: var(--ink);
      font: 800 14px/1.15 system-ui, sans-serif;
      cursor: pointer;
    }

    .stroke-character { min-width: 44px; padding: 4px; font-family: "KleeHanja", serif; font-size: 22px; }
    .stroke-character[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
    .stroke-status { margin: 0; color: var(--blue); font: 800 13px/1.2 system-ui, sans-serif; text-align: center; }
    .stroke-button { padding: 7px 8px; }
    .stroke-character:focus-visible, .stroke-button:focus-visible { outline: 3px solid rgba(45, 99, 140, .28); outline-offset: 2px; }
    .stroke-character:disabled, .stroke-button:disabled { opacity: .55; cursor: default; }

    .reading {
      margin: 0 0 5px;
      font-size: clamp(22px, 2.7vw, 32px);
      font-weight: 800;
    }

    .core-meaning {
      margin: 0;
      color: var(--muted);
      font-size: clamp(18px, 2.1vw, 25px);
      line-height: 1.45;
      word-break: keep-all;
    }

    .view { padding-top: 8px; }
    .view[hidden] { display: none; }

    .lesson-guide {
      margin: 0;
      padding: 8px 0 11px;
      border-bottom: 1px solid var(--line);
      color: var(--blue);
      font-size: clamp(17px, 1.8vw, 21px);
      font-weight: 800;
      line-height: 1.45;
    }

    .word-list { margin: 0; }

    .word-row {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      align-items: center;
      gap: 12px 30px;
      padding: clamp(11px, 1.35vw, 15px) 0;
      border-bottom: 1px solid var(--line);
    }

    .word-row .word-family,
    .word-row .example { margin: 0; }

    .meaning-list { margin: 0; }

    .meaning-row {
      display: grid;
      grid-template-columns: minmax(150px, .62fr) minmax(0, 2fr);
      gap: 8px 28px;
      padding: clamp(8px, 1.1vw, 12px) 0;
      border-bottom: 1px solid var(--line);
    }

    .meaning-row dt {
      color: var(--blue);
      font-size: clamp(17px, 1.8vw, 21px);
      font-weight: 800;
      line-height: 1.45;
    }

    .meaning-row dd { margin: 0; }

    .word-family {
      margin: 0 0 2px;
      font-size: clamp(18px, 2vw, 23px);
      font-weight: 800;
      line-height: 1.45;
      white-space: nowrap;
      word-spacing: .18em;
    }

    .example {
      margin: 0;
      color: #505a64;
      font-size: clamp(14px, 1.5vw, 17px);
      font-weight: 600;
      line-height: 1.45;
      word-break: keep-all;
    }

    .next-button, .reset-button {
      display: block;
      width: min(360px, 100%);
      min-height: 48px;
      margin: 14px auto 0;
      border: 1px solid var(--blue);
      border-radius: 4px;
      background: var(--blue);
      color: white;
      font: 800 17px/1.2 system-ui, sans-serif;
      cursor: pointer;
    }

    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(18px, 2.5vw, 30px) clamp(28px, 4vw, 52px);
    }

    .question {
      min-width: 0;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--line);
    }

    .question h2 {
      margin: 0 0 7px;
      font-size: clamp(20px, 2vw, 25px);
      line-height: 1.5;
      word-break: keep-all;
    }

    .question-context {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: clamp(15px, 1.45vw, 17px);
      font-weight: 700;
      line-height: 1.45;
      word-break: keep-all;
    }

    .q-number {
      display: inline-grid;
      width: 32px;
      height: 32px;
      margin-right: 8px;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 50%;
      font: 700 16px/1 system-ui, sans-serif;
      vertical-align: 2px;
    }

    .choices {
      display: grid;
      gap: 8px;
    }

    .choice {
      min-height: 44px;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: clamp(16px, 1.55vw, 19px);
      line-height: 1.45;
      text-align: left;
      cursor: pointer;
    }

    .choice:hover, .choice:focus-visible {
      border-color: #a9bcc9;
      background: var(--blue-soft);
      outline: none;
    }

    .choice.correct {
      border-color: #83b49a;
      background: var(--correct-soft);
      color: var(--correct);
      font-weight: 800;
    }

    .choice.wrong {
      border-color: #d9a19c;
      background: var(--wrong-soft);
      color: var(--wrong);
    }

    .choice:disabled { cursor: default; opacity: 1; }
    u { text-decoration-thickness: 2px; text-underline-offset: 4px; }

    .feedback {
      min-height: 25px;
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.45;
    }

    .feedback:empty {
      min-height: 0;
      margin-top: 0;
    }

    .feedback.is-correct { color: var(--correct); }
    .feedback.is-wrong { color: var(--wrong); }

    .result {
      margin: 28px 0 0;
      padding: 18px;
      border-top: 2px solid var(--ink);
      border-bottom: 1px solid var(--line);
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 800;
      text-align: center;
    }

    .quiz-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .quiz-actions button { margin: 0; }

    body.quiz-active .hanja-head { padding: 0 0 8px; }
    body.quiz-active .hanja { font-size: clamp(64px, 7.5vw, 82px); }
    body.quiz-active .reading { font-size: clamp(21px, 2.2vw, 27px); }
    body.quiz-active .core-meaning { font-size: clamp(17px, 1.8vw, 21px); }
    body.quiz-active .quiz-grid { gap: 10px clamp(28px, 4vw, 52px); }
    body.quiz-active .quiz-actions { margin-top: 14px; }

    .next-lesson {
      display: block;
      width: min(360px, 100%);
      min-height: 48px;
      margin: 14px auto 0;
      padding: 13px 20px;
      border: 1px solid var(--blue);
      border-radius: 4px;
      background: var(--blue);
      color: white;
      font: 800 17px/1.2 system-ui, sans-serif;
      text-align: center;
      text-decoration: none;
    }

    .next-lesson[hidden] { display: none; }

    .back-button {
      min-height: 58px;
      padding: 0 26px;
      border: 1px solid #aeb4b8;
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font: 800 18px/1.2 system-ui, sans-serif;
      cursor: pointer;
    }

    @media (max-width: 800px) {
      .page { padding-inline: 18px; }
      .topline { position: static; min-height: 32px; }
      .hanja-head { grid-template-columns: auto 1fr; gap: 8px 20px; }
      .stroke-demo { grid-column: 2; }
      .word-row { grid-template-columns: 1fr; gap: 3px; }
      .meaning-row { grid-template-columns: 1fr; gap: 6px; }
      .quiz-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .view { animation: appear .18s ease-out; }
      @keyframes appear { from { opacity: .2; transform: translateY(4px); } }
    }
    .hanja-generated { display:flex; gap:clamp(4px, .8vw, 9px); min-width:calc(var(--hanja-size) * 2); font-size:clamp(42px, 6vw, var(--hanja-size)); }

    html { background: #ded8ca; }
    body { background: #ded8ca; }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: url("../assets/hanja-background.webp") center center / cover no-repeat;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: rgba(247, 245, 239, .78);
    }
    .page { position: relative; z-index: 2; }
  </style>
</head>
<body>
  <main class="page">
    <div class="topline">
      <a class="home-link" href="../">차시 목록</a>
    </div>

    <header class="hanja-head">
      <div class="hanja hanja-generated" style="--hanja-size:62px" aria-label="도시 시, 마을 촌"><span>市</span><span>村</span></div>
      <div>
        <p class="reading">시 · 촌</p>
        <p class="core-meaning">도시 · 마을</p>
      </div>
      <section class="stroke-demo" aria-label="市·村 획순">
        <svg class="stroke-stage" viewBox="0 0 160 160" role="img" aria-label="선택한 한자의 획순">
          <path class="stroke-guide" d="M80 0V160M0 80H160M0 0L160 160M160 0L0 160" />
          <g class="stroke-set" data-character="市" transform="translate(10 8) scale(1.3)">
            <path class="stroke-path" d="M52.86,12c1.26,1.26,1.48,2.5,1.48,4.66c0,4.84-0.15,6.46-0.15,8.9" />
            <path class="stroke-path" d="M15.5,28.96c3.65,0.76,7.24,0.69,9.36,0.46c16.74-1.8,45.31-4.8,60.95-5.6c3.62-0.19,5.48,0.04,8.18,0.59" />
            <path class="stroke-path" d="M27.31,46c1.22,1.22,1.6,2.75,1.6,4.61c0,3.34-0.06,19.8-0.16,28.65c-0.02,2.13-0.05,3.8-0.08,4.72" />
            <path class="stroke-path" d="M30.28,48.5c12.28-1.24,45.6-4.38,48.37-4.38c3.6,0,5.35,0.87,5.35,5.09c0,9.3-0.25,21.16-1.4,29.97c-1.06,8.11-6.24,0.06-7.73-1.27" />
            <path class="stroke-path" d="M53.53,32.88c1.17,1.17,1.85,2.87,1.85,4.36c0,5.51-0.27,35.65-0.32,54.26c-0.01,2.28-0.01,4.31-0.01,6" />
          </g>
          <g class="stroke-set" data-character="村" transform="translate(10 8) scale(1.3)" hidden>
            <path class="stroke-path" d="M12.78,39.23c1.97,0.4,3.24,0.35,4.68,0.23c6.92-0.58,18.93-1.85,28.85-2.73c1.44-0.13,1.8-0.18,2.71,0" />
            <path class="stroke-path" d="M34.11,13.5c1.13,1.13,2.29,3,2.29,5.34c0,0.83-0.08,48.97-0.22,67.91c-0.03,3.54-0.05,6.55-0.08,7.5" />
            <path class="stroke-path" d="M35.44,39.32c0,0.93-0.26,1.58-0.6,2.35C30.38,51.75,23,63.5,15.11,72.76" />
            <path class="stroke-path" d="M40.72,48.97c2.53,1.53,6.78,7.28,8.66,11.26" />
            <path class="stroke-path" d="M52.62,41.52c2.29,0.48,4.16,0.6,6.01,0.4c13.35-1.44,23.8-3.3,34.15-3.71c1.83-0.07,4.26-0.22,5.84,0.14" />
            <path class="stroke-path" d="M79.89,13.25c1.49,1.49,2.26,3.12,2.26,5.52c0,14.56,0.32,65.91,0.24,70.87c-0.14,8.74-5.18,4.78-9.71,0.25" />
            <path class="stroke-path" d="M59.58,56.78c2.74,2.07,7.07,8.52,7.75,11.75" />
          </g>
        </svg>
        <div class="stroke-controls">
          <div class="stroke-character-switch" style="--stroke-columns:2" aria-label="획순을 볼 글자">
            <button class="stroke-character" type="button" data-character="市" aria-pressed="true">市</button>
            <button class="stroke-character" type="button" data-character="村" aria-pressed="false">村</button>
          </div>
          <p id="strokeStatus" class="stroke-status" aria-live="polite">市 · 준비</p>
          <button id="playStrokes" class="stroke-button" type="button">▶ 획순 보기</button>
          <button id="stepStroke" class="stroke-button" type="button">한 획씩</button>
        </div>
      </section>
    </header>

    <section id="lessonView" class="view" aria-label="뜻과 예시">
      <p class="lesson-guide">市·村은 도시와 마을을 나타내며 시내·도시·농촌·어촌 같은 말의 뜻을 짐작하게 합니다.</p>
      <div class="word-list">
        <div class="word-row">
          <p class="word-family">市(시) — 도시 · 시장 · 시민</p>
          <p class="example">사람과 건물이 많이 모인 곳은 도시, 사고파는 곳은 시장, 도시에 사는 사람은 시민입니다.</p>
        </div>
        <div class="word-row">
          <p class="word-family">村(촌) — 농촌 · 어촌 · 산촌</p>
          <p class="example">농사짓는 마을은 농촌, 물고기를 잡는 마을은 어촌, 산에 자리한 마을은 산촌입니다.</p>
        </div>
      </div>
      <button id="startQuiz" class="next-button" type="button">문제 풀기</button>
    </section>

    <section id="quizView" class="view" aria-label="확인 문제" hidden>
      <div class="quiz-grid">
      </div>
        <article class="question" data-answer="3" data-note="시간(時間)의 시는 때를 뜻하는 時(시)입니다. 도시·시내·시장에는 도시를 뜻하는 市(시)가 들어갑니다."><h2><span class="q-number">1</span>市(시)가 들어가지 않은 말은?</h2><div class="choices"><button class="choice" type="button" data-hanja="都市">① <u>도시</u></button><button class="choice" type="button" data-hanja="市內">② <u>시내</u></button><button class="choice" type="button" data-hanja="市場">③ <u>시장</u></button><button class="choice" type="button" data-hanja="時間">④ <u>시간</u></button></div><p class="feedback" aria-live="polite"></p></article>
        <article class="question" data-answer="3" data-note="촌수(寸數)의 촌은 길이 단위를 뜻하는 寸(촌)입니다. 농촌·어촌·산촌에는 마을을 뜻하는 村(촌)이 들어갑니다."><h2><span class="q-number">2</span>村(촌)이 들어가지 않은 말은?</h2><div class="choices"><button class="choice" type="button" data-hanja="農村">① <u>농촌</u></button><button class="choice" type="button" data-hanja="漁村">② <u>어촌</u></button><button class="choice" type="button" data-hanja="山村">③ <u>산촌</u></button><button class="choice" type="button" data-hanja="寸數">④ <u>촌수</u></button></div><p class="feedback" aria-live="polite"></p></article>

      <p id="result" class="result" aria-live="polite" hidden></p>
      <div class="quiz-actions">
        <button id="backToLesson" class="back-button" type="button">설명 다시 보기</button>
        <button id="resetQuiz" class="reset-button" type="button">다시 풀기</button>
        <a id="nextLesson" class="next-lesson" href="../jang-dan-go-jeo/" hidden>다음 글자 長·短</a>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const lessonView = document.getElementById('lessonView');
      const quizView = document.getElementById('quizView');
      const result = document.getElementById('result');
      const nextLesson = document.getElementById('nextLesson');
      const questions = Array.from(document.querySelectorAll('.question'));
      const strokeSets = Array.from(document.querySelectorAll('.stroke-set'));
      const characterButtons = Array.from(document.querySelectorAll('.stroke-character'));
      const strokeStatus = document.getElementById('strokeStatus');
      const playStrokes = document.getElementById('playStrokes');
      const stepStroke = document.getElementById('stepStroke');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let currentCharacter = '市';
      let currentPaths = [];
      let visibleStrokes = 0;
      let strokePlaying = false;

      strokeSets.forEach((set) => {
        set.querySelectorAll('.stroke-path').forEach((path) => {
          const length = path.getTotalLength();
          path.style.strokeDasharray = length;
          path.style.strokeDashoffset = length;
        });
      });

      function resetStrokes() {
        currentPaths.forEach((path) => {
          path.getAnimations().forEach((animation) => animation.cancel());
          path.style.strokeDashoffset = path.getTotalLength();
        });
        visibleStrokes = 0;
        strokeStatus.textContent = `${currentCharacter} · 준비`;
      }

      function selectCharacter(character) {
        currentCharacter = character;
        strokeSets.forEach((set) => {
          set.toggleAttribute('hidden', set.dataset.character !== character);
        });
        characterButtons.forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.character === character));
        });
        const currentSet = strokeSets.find((set) => set.dataset.character === character);
        currentPaths = Array.from(currentSet.querySelectorAll('.stroke-path'));
        resetStrokes();
      }

      async function revealStroke(path) {
        const length = path.getTotalLength();
        if (reducedMotion) {
          path.style.strokeDashoffset = 0;
          return;
        }
        const animation = path.animate(
          [{ strokeDashoffset: length }, { strokeDashoffset: 0 }],
          { duration: 900, easing: 'ease-in-out', fill: 'forwards' }
        );
        await animation.finished;
        path.style.strokeDashoffset = 0;
        animation.cancel();
      }

      characterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          if (!strokePlaying) selectCharacter(button.dataset.character);
        });
      });

      playStrokes.addEventListener('click', async () => {
        if (strokePlaying) return;
        strokePlaying = true;
        playStrokes.disabled = true;
        stepStroke.disabled = true;
        characterButtons.forEach((button) => { button.disabled = true; });
        resetStrokes();
        for (let index = 0; index < currentPaths.length; index += 1) {
          strokeStatus.textContent = `${currentCharacter} · ${index + 1}/${currentPaths.length}획`;
          await revealStroke(currentPaths[index]);
        }
        visibleStrokes = currentPaths.length;
        strokeStatus.textContent = `${currentCharacter} · 완성`;
        playStrokes.disabled = false;
        stepStroke.disabled = false;
        characterButtons.forEach((button) => { button.disabled = false; });
        strokePlaying = false;
      });

      stepStroke.addEventListener('click', () => {
        if (strokePlaying) return;
        if (visibleStrokes >= currentPaths.length) resetStrokes();
        currentPaths[visibleStrokes].style.strokeDashoffset = 0;
        visibleStrokes += 1;
        strokeStatus.textContent = visibleStrokes === currentPaths.length
          ? `${currentCharacter} · 완성`
          : `${currentCharacter} · ${visibleStrokes}/${currentPaths.length}획`;
      });

      selectCharacter('市');

      function show(view) {
        const quiz = view === 'quiz';
        document.body.classList.toggle('quiz-active', quiz);
        lessonView.hidden = quiz;
        quizView.hidden = !quiz;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        (quiz ? quizView : lessonView).focus({ preventScroll: true });
      }

      function updateResult() {
        const answered = questions.filter((question) => question.dataset.done === 'true');
        if (answered.length !== questions.length) return;
        const score = answered.filter((question) => question.dataset.correct === 'true').length;
        result.textContent = `${questions.length}문제 중 ${score}문제를 맞혔습니다.`;
        result.hidden = false;
        nextLesson.hidden = false;
      }

      questions.forEach((question) => {
        const choices = Array.from(question.querySelectorAll('.choice'));
        const answer = Number(question.dataset.answer);
        const feedback = question.querySelector('.feedback');

        choices.forEach((choice, index) => {
          choice.addEventListener('click', () => {
            if (question.dataset.done === 'true') return;
            const correct = index === answer;

            choices.forEach((button) => { button.classList.remove('wrong'); });

            if (!correct) {
              question.dataset.correct = 'false';
              choice.classList.add('wrong');
              choice.disabled = true;
              feedback.textContent = '다시 생각하고 다른 답을 골라보세요.';
              feedback.className = 'feedback is-wrong';
              return;
            }

            question.dataset.done = 'true';
            if (question.dataset.correct !== 'false') question.dataset.correct = 'true';
            choice.classList.add('correct');
            choices.forEach((button) => { button.disabled = true; });
            feedback.textContent = `맞았습니다. ${question.dataset.note}`;
            feedback.className = 'feedback is-correct';
            updateResult();
          });
        });
      });

      function reset() {
        questions.forEach((question) => {
          delete question.dataset.done;
          delete question.dataset.correct;
          question.querySelectorAll('.choice').forEach((choice) => {
            choice.disabled = false;
            choice.classList.remove('correct', 'wrong');
          });
          const feedback = question.querySelector('.feedback');
          feedback.textContent = '';
          feedback.className = 'feedback';
        });
        result.hidden = true;
        result.textContent = '';
        nextLesson.hidden = true;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      document.getElementById('startQuiz').addEventListener('click', () => show('quiz'));
      document.getElementById('backToLesson').addEventListener('click', () => show('lesson'));
      document.getElementById('resetQuiz').addEventListener('click', reset);
    })();
  </script>
</body>
</html>
