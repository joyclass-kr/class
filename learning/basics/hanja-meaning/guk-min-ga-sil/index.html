<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>國 · 民 | 韓字</title>
  <style>
    @font-face {
      font-family: "KleeHanja";
      src: url("../../../../assets/fonts/klee-one/KleeOne-SemiBold.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --paper: #f7f5ef;
      --ink: #202630;
      --muted: #65707c;
      --line: #d9d6ce;
      --blue: #2d638c;
      --blue-soft: #eaf2f7;
      --correct: #226847;
      --correct-soft: #eaf5ee;
      --wrong: #a43d36;
      --wrong-soft: #fbefed;
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: "Noto Serif KR", "KoPub Batang", "Batang", serif;
      -webkit-font-smoothing: antialiased;
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    .page {
      position: relative;
      width: min(1180px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: clamp(12px, 2vw, 22px) clamp(20px, 4vw, 54px) 18px;
    }

    .topline {
      position: absolute;
      top: 10px;
      right: calc(clamp(20px, 4vw, 54px) + 330px);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
    }

    .home-link {
      min-height: 44px;
      padding: 6px 2px 6px 14px;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }

    .hanja-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: clamp(20px, 3vw, 34px);
      padding: 6px 0 13px;
      border-bottom: 1px solid var(--line);
    }

    .hanja {
      min-width: 1.2em;
      font-family: "KleeHanja", serif;
      font-size: clamp(78px, 10vw, 112px);
      font-weight: 600;
      line-height: .9;
      text-align: center;
    }

    .hanja-pair {
      display: flex;
      gap: clamp(6px, 1.5vw, 16px);
      min-width: 2.25em;
    }

    .hanja-three {
      display: flex;
      gap: clamp(5px, 1vw, 11px);
      min-width: 3.25em;
      font-size: clamp(68px, 8vw, 94px);
    }

    .stroke-demo {
      display: grid;
      grid-template-columns: 104px 188px;
      align-items: center;
      gap: 10px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf8;
    }

    .stroke-stage { display: block; width: 104px; height: 104px; border: 1px solid #ddd8ce; background: #fff; }
    .stroke-guide { fill: none; stroke: #dedbd3; stroke-width: 1; stroke-dasharray: 4 4; }
    .stroke-set[hidden] { display: none; }
    .stroke-path { fill: none; stroke: var(--ink); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .stroke-controls { display: grid; gap: 6px; }
    .stroke-character-switch { display: grid; grid-template-columns: repeat(var(--stroke-columns), 1fr); gap: 4px; }

    .stroke-character,
    .stroke-button {
      min-height: 44px;
      border: 1px solid #9aa5ad;
      border-radius: 5px;
      background: #fff;
      color: var(--ink);
      font: 800 14px/1.15 system-ui, sans-serif;
      cursor: pointer;
    }

    .stroke-character { min-width: 44px; padding: 4px; font-family: "KleeHanja", serif; font-size: 22px; }
    .stroke-character[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
    .stroke-status { margin: 0; color: var(--blue); font: 800 13px/1.2 system-ui, sans-serif; text-align: center; }
    .stroke-button { padding: 7px 8px; }
    .stroke-character:focus-visible, .stroke-button:focus-visible { outline: 3px solid rgba(45, 99, 140, .28); outline-offset: 2px; }
    .stroke-character:disabled, .stroke-button:disabled { opacity: .55; cursor: default; }

    .reading {
      margin: 0 0 5px;
      font-size: clamp(22px, 2.7vw, 32px);
      font-weight: 800;
    }

    .core-meaning {
      margin: 0;
      color: var(--muted);
      font-size: clamp(18px, 2.1vw, 25px);
      line-height: 1.45;
      word-break: keep-all;
    }

    .view { padding-top: 8px; }
    .view[hidden] { display: none; }

    .lesson-guide {
      margin: 0;
      padding: 8px 0 11px;
      border-bottom: 1px solid var(--line);
      color: var(--blue);
      font-size: clamp(17px, 1.8vw, 21px);
      font-weight: 800;
      line-height: 1.45;
    }

    .word-list { margin: 0; }

    .word-row {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      align-items: center;
      gap: 12px 30px;
      padding: clamp(11px, 1.35vw, 15px) 0;
      border-bottom: 1px solid var(--line);
    }

    .word-row .word-family,
    .word-row .example { margin: 0; }

    .meaning-list { margin: 0; }

    .meaning-row {
      display: grid;
      grid-template-columns: minmax(150px, .62fr) minmax(0, 2fr);
      gap: 8px 28px;
      padding: clamp(8px, 1.1vw, 12px) 0;
      border-bottom: 1px solid var(--line);
    }

    .meaning-row dt {
      color: var(--blue);
      font-size: clamp(17px, 1.8vw, 21px);
      font-weight: 800;
      line-height: 1.45;
    }

    .meaning-row dd { margin: 0; }

    .word-family {
      margin: 0 0 2px;
      font-size: clamp(18px, 2vw, 23px);
      font-weight: 800;
      line-height: 1.45;
      white-space: nowrap;
      word-spacing: .18em;
    }

    .example {
      margin: 0;
      color: #505a64;
      font-size: clamp(14px, 1.5vw, 17px);
      font-weight: 600;
      line-height: 1.45;
      word-break: keep-all;
    }

    .next-button, .reset-button {
      display: block;
      width: min(360px, 100%);
      min-height: 48px;
      margin: 14px auto 0;
      border: 1px solid var(--blue);
      border-radius: 4px;
      background: var(--blue);
      color: white;
      font: 800 17px/1.2 system-ui, sans-serif;
      cursor: pointer;
    }

    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(18px, 2.5vw, 30px) clamp(28px, 4vw, 52px);
    }

    .question {
      min-width: 0;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--line);
    }

    .question h2 {
      margin: 0 0 7px;
      font-size: clamp(20px, 2vw, 25px);
      line-height: 1.5;
      word-break: keep-all;
    }

    .question-context {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: clamp(15px, 1.45vw, 17px);
      font-weight: 700;
      line-height: 1.45;
      word-break: keep-all;
    }

    .q-number {
      display: inline-grid;
      width: 32px;
      height: 32px;
      margin-right: 8px;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 50%;
      font: 700 16px/1 system-ui, sans-serif;
      vertical-align: 2px;
    }

    .choices {
      display: grid;
      gap: 8px;
    }

    .choice {
      min-height: 44px;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: clamp(16px, 1.55vw, 19px);
      line-height: 1.45;
      text-align: left;
      cursor: pointer;
    }

    .choice:hover, .choice:focus-visible {
      border-color: #a9bcc9;
      background: var(--blue-soft);
      outline: none;
    }

    .choice.correct {
      border-color: #83b49a;
      background: var(--correct-soft);
      color: var(--correct);
      font-weight: 800;
    }

    .choice.wrong {
      border-color: #d9a19c;
      background: var(--wrong-soft);
      color: var(--wrong);
    }

    .choice:disabled { cursor: default; opacity: 1; }
    u { text-decoration-thickness: 2px; text-underline-offset: 4px; }

    .feedback {
      min-height: 25px;
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.45;
    }

    .feedback:empty {
      min-height: 0;
      margin-top: 0;
    }

    .feedback.is-correct { color: var(--correct); }
    .feedback.is-wrong { color: var(--wrong); }

    .result {
      margin: 28px 0 0;
      padding: 18px;
      border-top: 2px solid var(--ink);
      border-bottom: 1px solid var(--line);
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 800;
      text-align: center;
    }

    .quiz-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .quiz-actions button { margin: 0; }

    body.quiz-active .hanja-head { padding: 0 0 8px; }
    body.quiz-active .hanja { font-size: clamp(64px, 7.5vw, 82px); }
    body.quiz-active .reading { font-size: clamp(21px, 2.2vw, 27px); }
    body.quiz-active .core-meaning { font-size: clamp(17px, 1.8vw, 21px); }
    body.quiz-active .quiz-grid { gap: 10px clamp(28px, 4vw, 52px); }
    body.quiz-active .quiz-actions { margin-top: 14px; }

    .next-lesson {
      display: block;
      width: min(360px, 100%);
      min-height: 48px;
      margin: 14px auto 0;
      padding: 13px 20px;
      border: 1px solid var(--blue);
      border-radius: 4px;
      background: var(--blue);
      color: white;
      font: 800 17px/1.2 system-ui, sans-serif;
      text-align: center;
      text-decoration: none;
    }

    .next-lesson[hidden] { display: none; }

    .back-button {
      min-height: 58px;
      padding: 0 26px;
      border: 1px solid #aeb4b8;
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font: 800 18px/1.2 system-ui, sans-serif;
      cursor: pointer;
    }

    @media (max-width: 800px) {
      .page { padding-inline: 18px; }
      .topline { position: static; min-height: 32px; }
      .hanja-head { grid-template-columns: auto 1fr; gap: 8px 20px; }
      .stroke-demo { grid-column: 2; }
      .word-row { grid-template-columns: 1fr; gap: 3px; }
      .meaning-row { grid-template-columns: 1fr; gap: 6px; }
      .quiz-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .view { animation: appear .18s ease-out; }
      @keyframes appear { from { opacity: .2; transform: translateY(4px); } }
    }
    .hanja-generated { display:flex; gap:clamp(4px, .8vw, 9px); min-width:calc(var(--hanja-size) * 2); font-size:clamp(42px, 6vw, var(--hanja-size)); }
  </style>
</head>
<body>
  <main class="page">
    <div class="topline">
      <a class="home-link" href="../">차시 목록</a>
    </div>

    <header class="hanja-head">
      <div class="hanja hanja-generated" style="--hanja-size:62px" aria-label="나라 국, 백성·사람 민"><span>國</span><span>民</span></div>
      <div>
        <p class="reading">국 · 민</p>
        <p class="core-meaning">나라 · 백성·사람</p>
      </div>
      <section class="stroke-demo" aria-label="國·民 획순">
        <svg class="stroke-stage" viewBox="0 0 160 160" role="img" aria-label="선택한 한자의 획순">
          <path class="stroke-guide" d="M80 0V160M0 80H160M0 0L160 160M160 0L0 160" />
          <g class="stroke-set" data-character="國" transform="translate(10 8) scale(1.3)">
            <path class="stroke-path" d="M18.25,16.32c0.75,1.43,1.84,2.51,1.86,4.41C20.25,35,20.25,68.75,19.8,96" />
            <path class="stroke-path" d="M21.73,18.65C39.75,17,74.18,15,86.25,15c2.75,0,3.55,2.49,3.5,5.5c-0.25,15.75-1,52.75-0.5,75" />
            <path class="stroke-path" d="M28.68,36.88c1.05,0.42,3,0.59,4.05,0.42c8.12-1.34,32.88-4.15,42.39-4.72c1.76-0.1,2.81,0.2,3.69,0.41" />
            <path class="stroke-path" d="M28.55,45.94c0.31,0.29,0.66,0.52,0.76,0.91c0.88,3.38,1.99,11.67,2.87,16.62" />
            <path class="stroke-path" d="M30.47,47.92c5.68-0.71,13.22-2.09,18.46-2.81c1.32-0.18,2.11,0.83,1.92,1.65c-0.78,3.41-1.47,6.99-2.86,12.67" />
            <path class="stroke-path" d="M32.82,61.7c4.24-0.43,10.68-1.18,16.5-1.85" />
            <path class="stroke-path" d="M27.64,76.47c0.59,0.66,1.77,1.02,3.53,0.14c4.9-2.43,13.73-6.77,18.63-9.2" />
            <path class="stroke-path" d="M56.71,21c0.95,1.29,1.28,1.65,1.54,4.42c2,21.83,8.03,49.08,19.02,57c3.74,2.69,4.19,0.55,3.72-5.16" />
            <path class="stroke-path" d="M74.94,42.53c0.07,0.91,0.15,2.35-0.14,3.65c-1.71,7.7-11.54,25.45-25,35.79" />
            <path class="stroke-path" d="M69.78,20.89c2.52,1.3,6.56,4.29,7.73,6.52" />
            <path class="stroke-path" d="M20.75,93.51c13.07,0,50.46-2.6,68.5-3.01" />
          </g>
          <g class="stroke-set" data-character="民" transform="translate(10 8) scale(1.3)" hidden>
            <path class="stroke-path" d="M21.89,17.96c1.98,0.92,4.61,1.29,7.49,0.96c12.78-1.48,33.28-3.93,41.51-4.66c4.36-0.39,6.23,1.61,5.37,4.65c-1.32,4.67-2.62,8.33-4.01,11.59" />
            <path class="stroke-path" d="M25.35,36.27c9.44-0.95,33.85-3.79,45.27-4.92c1.98-0.2,4.5-0.61,6.13-0.35" />
            <path class="stroke-path" d="M23,18.75c0.69,0.69,1.25,2.12,1.25,3.25c0,2.25-0.25,62.75-0.25,66.25s0.25,4.5,3.5,2S38.75,80,40.75,78.5" />
            <path class="stroke-path" d="M27.73,55.8c1.65-0.21,3.64-0.46,5.88-0.75c13.44-1.7,33.41-4.24,46.41-6.28c1.85-0.29,3.99-0.53,5.77-0.12" />
            <path class="stroke-path" d="M52.75,36.25c1.12,1.12,2.13,3.39,2.39,5.15c3.48,23.48,14.11,41.98,32.94,52.02c8.09,4.32,6.17-1.92,5.95-6.36" />
          </g>
        </svg>
        <div class="stroke-controls">
          <div class="stroke-character-switch" style="--stroke-columns:2" aria-label="획순을 볼 글자">
            <button class="stroke-character" type="button" data-character="國" aria-pressed="true">國</button>
            <button class="stroke-character" type="button" data-character="民" aria-pressed="false">民</button>
          </div>
          <p id="strokeStatus" class="stroke-status" aria-live="polite">國 · 준비</p>
          <button id="playStrokes" class="stroke-button" type="button">▶ 획순 보기</button>
          <button id="stepStroke" class="stroke-button" type="button">한 획씩</button>
        </div>
      </section>
    </header>

    <section id="lessonView" class="view" aria-label="뜻과 예시">
      <p class="lesson-guide">國·民은 나라와 그 나라의 사람을 나타내며 국가·국민·민족 같은 말의 뜻을 짐작하게 합니다.</p>
      <div class="word-list">
        <div class="word-row">
          <p class="word-family">國(국) — 국가 · 외국 · 전국</p>
          <p class="example">나라는 국가, 다른 나라는 외국, 나라 전체는 전국입니다.</p>
        </div>
        <div class="word-row">
          <p class="word-family">民(민) — 국민 · 주민 · 시민</p>
          <p class="example">나라의 사람은 국민, 한곳에 사는 사람은 주민, 도시에 사는 사람은 시민입니다.</p>
        </div>
      </div>
      <button id="startQuiz" class="next-button" type="button">문제 풀기</button>
    </section>

    <section id="quizView" class="view" aria-label="확인 문제" hidden>
      <div class="quiz-grid">
                                        <article class="question" data-answer="3" data-note="국화(菊花)에는 國이 들어가지 않습니다.">
          <h2><span class="q-number">1</span>國(국)이 들어가지 않은 말은?</h2>
          <div class="choices">
            <button class="choice" type="button">① 대한민국은 민주 <u>국가</u>입니다.</button>
            <button class="choice" type="button">② 대회에 <u>전국</u>의 학생들이 모였습니다.</button>
            <button class="choice" type="button">③ 친구가 방학에 <u>외국</u>을 여행했습니다.</button>
            <button class="choice" type="button">④ 가을 화단에 <u>국화</u>가 피었습니다.</button>
          </div>
          <p class="feedback" aria-live="polite"></p>
        </article>


                                        <article class="question" data-answer="3" data-note="민감(敏感)에는 民이 들어가지 않습니다.">
          <h2><span class="q-number">2</span>民(민)이 들어가지 않은 말은?</h2>
          <div class="choices">
            <button class="choice" type="button">① 선거는 <u>국민</u>이 대표를 뽑는 일입니다.</button>
            <button class="choice" type="button">② 많은 <u>시민</u>이 공원을 이용합니다.</button>
            <button class="choice" type="button">③ 마을 <u>주민</u>들이 함께 길을 청소했습니다.</button>
            <button class="choice" type="button">④ 동생은 큰 소리에 <u>민감</u>합니다.</button>
          </div>
          <p class="feedback" aria-live="polite"></p>
        </article>
      </div>
      <p id="result" class="result" aria-live="polite" hidden></p>
      <div class="quiz-actions">
        <button id="backToLesson" class="back-button" type="button">설명 다시 보기</button>
        <button id="resetQuiz" class="reset-button" type="button">다시 풀기</button>
        <a id="nextLesson" class="next-lesson" href="../ga-sil/" hidden>다음 글자 家·室</a>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const lessonView = document.getElementById('lessonView');
      const quizView = document.getElementById('quizView');
      const result = document.getElementById('result');
      const nextLesson = document.getElementById('nextLesson');
      const questions = Array.from(document.querySelectorAll('.question'));
      const strokeSets = Array.from(document.querySelectorAll('.stroke-set'));
      const characterButtons = Array.from(document.querySelectorAll('.stroke-character'));
      const strokeStatus = document.getElementById('strokeStatus');
      const playStrokes = document.getElementById('playStrokes');
      const stepStroke = document.getElementById('stepStroke');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let currentCharacter = '國';
      let currentPaths = [];
      let visibleStrokes = 0;
      let strokePlaying = false;

      strokeSets.forEach((set) => {
        set.querySelectorAll('.stroke-path').forEach((path) => {
          const length = path.getTotalLength();
          path.style.strokeDasharray = length;
          path.style.strokeDashoffset = length;
        });
      });

      function resetStrokes() {
        currentPaths.forEach((path) => {
          path.getAnimations().forEach((animation) => animation.cancel());
          path.style.strokeDashoffset = path.getTotalLength();
        });
        visibleStrokes = 0;
        strokeStatus.textContent = `${currentCharacter} · 준비`;
      }

      function selectCharacter(character) {
        currentCharacter = character;
        strokeSets.forEach((set) => {
          set.toggleAttribute('hidden', set.dataset.character !== character);
        });
        characterButtons.forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.character === character));
        });
        const currentSet = strokeSets.find((set) => set.dataset.character === character);
        currentPaths = Array.from(currentSet.querySelectorAll('.stroke-path'));
        resetStrokes();
      }

      async function revealStroke(path) {
        const length = path.getTotalLength();
        if (reducedMotion) {
          path.style.strokeDashoffset = 0;
          return;
        }
        const animation = path.animate(
          [{ strokeDashoffset: length }, { strokeDashoffset: 0 }],
          { duration: 900, easing: 'ease-in-out', fill: 'forwards' }
        );
        await animation.finished;
        path.style.strokeDashoffset = 0;
        animation.cancel();
      }

      characterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          if (!strokePlaying) selectCharacter(button.dataset.character);
        });
      });

      playStrokes.addEventListener('click', async () => {
        if (strokePlaying) return;
        strokePlaying = true;
        playStrokes.disabled = true;
        stepStroke.disabled = true;
        characterButtons.forEach((button) => { button.disabled = true; });
        resetStrokes();
        for (let index = 0; index < currentPaths.length; index += 1) {
          strokeStatus.textContent = `${currentCharacter} · ${index + 1}/${currentPaths.length}획`;
          await revealStroke(currentPaths[index]);
        }
        visibleStrokes = currentPaths.length;
        strokeStatus.textContent = `${currentCharacter} · 완성`;
        playStrokes.disabled = false;
        stepStroke.disabled = false;
        characterButtons.forEach((button) => { button.disabled = false; });
        strokePlaying = false;
      });

      stepStroke.addEventListener('click', () => {
        if (strokePlaying) return;
        if (visibleStrokes >= currentPaths.length) resetStrokes();
        currentPaths[visibleStrokes].style.strokeDashoffset = 0;
        visibleStrokes += 1;
        strokeStatus.textContent = visibleStrokes === currentPaths.length
          ? `${currentCharacter} · 완성`
          : `${currentCharacter} · ${visibleStrokes}/${currentPaths.length}획`;
      });

      selectCharacter('國');

      function show(view) {
        const quiz = view === 'quiz';
        document.body.classList.toggle('quiz-active', quiz);
        lessonView.hidden = quiz;
        quizView.hidden = !quiz;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        (quiz ? quizView : lessonView).focus({ preventScroll: true });
      }

      function updateResult() {
        const answered = questions.filter((question) => question.dataset.done === 'true');
        if (answered.length !== questions.length) return;
        const score = answered.filter((question) => question.dataset.correct === 'true').length;
        result.textContent = `${questions.length}문제 중 ${score}문제를 맞혔습니다.`;
        result.hidden = false;
        nextLesson.hidden = false;
      }

      questions.forEach((question) => {
        const choices = Array.from(question.querySelectorAll('.choice'));
        const answer = Number(question.dataset.answer);
        const feedback = question.querySelector('.feedback');

        choices.forEach((choice, index) => {
          choice.addEventListener('click', () => {
            if (question.dataset.done === 'true') return;
            const correct = index === answer;

            choices.forEach((button) => { button.classList.remove('wrong'); });

            if (!correct) {
              choice.classList.add('wrong');
              feedback.textContent = '다시 생각하고 다른 답을 골라보세요.';
              feedback.className = 'feedback is-wrong';
              return;
            }

            question.dataset.done = 'true';
            question.dataset.correct = 'true';
            choice.classList.add('correct');
            choices.forEach((button) => { button.disabled = true; });
            feedback.textContent = `맞았습니다. ${question.dataset.note}`;
            feedback.className = 'feedback is-correct';
            updateResult();
          });
        });
      });

      function reset() {
        questions.forEach((question) => {
          delete question.dataset.done;
          delete question.dataset.correct;
          question.querySelectorAll('.choice').forEach((choice) => {
            choice.disabled = false;
            choice.classList.remove('correct', 'wrong');
          });
          const feedback = question.querySelector('.feedback');
          feedback.textContent = '';
          feedback.className = 'feedback';
        });
        result.hidden = true;
        result.textContent = '';
        nextLesson.hidden = true;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      document.getElementById('startQuiz').addEventListener('click', () => show('quiz'));
      document.getElementById('backToLesson').addEventListener('click', () => show('lesson'));
      document.getElementById('resetQuiz').addEventListener('click', reset);
    })();
  </script>
</body>
</html>
